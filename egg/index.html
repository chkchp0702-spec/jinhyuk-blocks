<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9fdcff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="알 훔치기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>알 훔치기 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-screen 3D world; money HUD top-left, speed top-right, shop/pet buttons bottom-right, floating joystick wherever the thumb lands. Single bright toy look, no dark theme. */
:root{
  color-scheme: light;
  --ink:#21304f;
  --cream:#fff8e6;
  --coin:#ffcc33;
  --green:#38c172;
  --red:#ff5a5f;
  --blue:#3a8dff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#9fdcff;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:16px;color:#fff;line-height:1.15;
  text-shadow:0 2px 0 rgba(0,0,0,.45),1px 1px 0 rgba(0,0,0,.45),-1px -1px 0 rgba(0,0,0,.35);will-change:transform}
.lbl b{font-weight:400;display:block;font-size:13px}
.lbl.big{font-size:20px}
.lbl.alert{font-size:30px;color:#ffe14d}
.lbl.cash{font-size:22px;color:#b6ffcb}
.lbl.name{font-size:15px;color:#fff}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:8px}
.tl{top:max(10px,env(safe-area-inset-top));left:12px;flex-direction:column;align-items:flex-start}
.tr{top:max(10px,env(safe-area-inset-top));right:12px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(255,248,230,.94);border-radius:16px;padding:6px 12px 6px 8px;
  box-shadow:0 4px 0 rgba(33,48,79,.3);font-size:22px;font-variant-numeric:tabular-nums}
.pill small{font-size:13px;color:#5b6a8c}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffcc33 55%,#d99a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-size:15px;color:#a86a00}
.boot{width:26px;height:26px;display:grid;place-items:center}
.tag{background:var(--red);color:#fff;border-radius:999px;padding:3px 10px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tag.ok{background:var(--green)}
.br{right:12px;bottom:max(14px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.btn{border:0;cursor:pointer;color:#fff;font-size:18px;border-radius:18px;padding:12px 16px;min-width:76px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 rgba(33,48,79,.35)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 rgba(33,48,79,.35)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.b-shop{background:var(--blue)}
.b-pet{background:#b061ff}
.b-home{background:#ff8a3d}

#arrow{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 64px));width:64px;height:64px;margin-left:-32px;z-index:5;pointer-events:none;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
#arrowTxt{position:fixed;left:50%;top:max(136px,calc(env(safe-area-inset-top) + 130px));transform:translateX(-50%);z-index:5;pointer-events:none;
  font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}

#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.2)}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;
  font-size:clamp(24px,7vw,36px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 14px rgba(0,0,0,.25)}
#toast small{display:block;font-size:.6em;color:#fff3a6;margin-top:4px}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:rgba(20,32,60,.5)}
.card{width:100%;max-width:400px;max-height:86%;overflow:auto;background:var(--cream);border-radius:26px;padding:20px 18px;
  box-shadow:0 8px 0 rgba(20,32,60,.35);display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:26px;text-align:center}
.card p{margin:0;color:#4d5b7c;line-height:1.5;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 rgba(33,48,79,.12)}
.row .t{flex:1;min-width:0}
.row .t div{font-size:18px}
.row .t span{font-size:13px;color:#6b7896}
.buy{border:0;cursor:pointer;background:var(--green);color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.buy[disabled]{background:#b9c1d1;cursor:default}
.buy.sell{background:var(--red)}
.close{align-self:center;border:0;background:none;color:var(--ink);font-size:18px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-size:12px;margin-right:4px}

#title{background:linear-gradient(180deg,rgba(80,170,240,.7),rgba(240,160,70,.75))}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-size:min(13vw,58px);color:#fff;line-height:1.05;text-shadow:0 5px 0 #d9822b,0 0 20px rgba(0,0,0,.2)}
.logo span{display:block;font-size:.55em;color:#fff3a6}
.eggs{font-size:0;display:flex;gap:10px}
.eggs i{width:44px;height:56px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;display:block;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.15);animation:wob 1.4s ease-in-out infinite}
.eggs i:nth-child(2){animation-delay:.2s}.eggs i:nth-child(3){animation-delay:.4s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-6px)}75%{transform:rotate(8deg)}}
.namebox{display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);font-size:16px}
.namebox input{font:inherit;font-size:22px;text-align:center;width:200px;padding:8px 12px;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.9);color:var(--ink);outline:none}
.namebox input:focus-visible{border-color:#ffcc33}
.go{border:0;cursor:pointer;font-size:26px;color:#fff;background:var(--green);padding:14px 40px;border-radius:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 #23864c}
.go:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 2px 0 #23864c}
.help{color:#fff;font-size:15px;line-height:1.5;text-shadow:0 2px 0 rgba(0,0,0,.35);max-width:320px}

.hatch{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:9;pointer-events:none;text-align:center;background:var(--cream);
  border-radius:22px;padding:12px 22px;box-shadow:0 6px 0 rgba(20,32,60,.3);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.hatch div{font-size:24px}
.hatch span{font-size:15px;color:#5b6a8c}

@media (prefers-reduced-motion: reduce){ *{animation-duration:.01s!important;animation-iteration-count:1!important} }
</style>

</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>

<div class="hud tl">
  <div class="pill"><span class="coin">$</span><span id="money">0</span></div>
  <div class="pill"><small>초당</small><span id="income" style="font-size:17px">0</span></div>
</div>
<div class="hud tr">
  <div class="pill"><span class="boot"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#21304f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l-2 6h5l-7 10 2-7H6z" fill="#ffcc33"/></svg></span><span id="speed">6</span></div>
  <span class="tag" id="lockTag" hidden>잠금</span>
</div>
<div class="hud br">
  <button class="btn b-home" id="homeBtn" type="button">집으로</button>
  <button class="btn b-pet" id="petBtn" type="button">내 펫</button>
  <button class="btn b-shop" id="shopBtn" type="button">상점</button>
</div>
<div id="arrow" hidden><svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4 L54 40 H40 V60 H24 V40 H10 Z" fill="#ffcc33" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div>
<div id="arrowTxt" hidden>알을 기지로 가져가세요!</div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="toast"></div>
<div id="layers"></div>

<script src="three.min.js"></script>
<script>
"use strict";
/* ================= 데이터 ================= */
const RAR=[{n:"일반",c:"#8f9bb0"},{n:"희귀",c:"#3a8dff"},{n:"에픽",c:"#b061ff"},{n:"전설",c:"#ffa600"},{n:"신화",c:"#ff4d6d"}];
const RAR_P=[60,25,10,4,1];
const RAR_BASE=[1,2.5,6,15,40];
const BIOMES=[
 {name:"초원",ground:"#8fd46c",edge:"#71bf55",egg:"#fff1d0",spot:"#f0c674",decor:"tree",gs:5,gm:1,
  guard:{n:"엄마 닭",kind:"bird",color:"#ffffff",crest:true,s:2.6},
  pets:[{n:"병아리",kind:"bird",color:"#ffe14d"},{n:"토끼",kind:"quad",ears:"long",color:"#f6f6f6",nose:"#ff9fb0"},
        {n:"아기돼지",kind:"quad",ears:"point",color:"#ffb3c6",nose:"#ff7f9e"},{n:"양",kind:"quad",ears:"round",color:"#fbfbf2",head:"#4a4a4a"},
        {n:"황금닭",kind:"bird",color:"#ffc61a",crest:true}]},
 {name:"숲",ground:"#4caa58",edge:"#3d9149",egg:"#d8f0c0",spot:"#6aa84f",decor:"pine",gs:9,gm:8,
  guard:{n:"엄마 곰",kind:"quad",ears:"round",color:"#8a5a35",s:2.5},
  pets:[{n:"다람쥐",kind:"quad",ears:"point",color:"#c77d3a",tail:"big"},{n:"여우",kind:"quad",ears:"point",color:"#ff8a3d",tail:"big"},
        {n:"부엉이",kind:"bird",color:"#9a7650"},{n:"꽃사슴",kind:"quad",ears:"round",color:"#c38b56",horn:"antler"},
        {n:"숲의 정령",kind:"quad",ears:"round",color:"#7dffb2",glow:true}]},
 {name:"사막",ground:"#f2d37f",edge:"#e3bd62",egg:"#ffe2a8",spot:"#d9893a",decor:"cactus",gs:13,gm:60,
  guard:{n:"엄마 낙타",kind:"quad",ears:"round",color:"#d6a35a",hump:true,s:2.6},
  pets:[{n:"도마뱀",kind:"quad",ears:"none",color:"#8fbf4a"},{n:"사막여우",kind:"quad",ears:"long",color:"#f3d2a2"},
        {n:"미어캣",kind:"quad",ears:"round",color:"#c9a66b"},{n:"아기 낙타",kind:"quad",ears:"round",color:"#e0b26f",hump:true},
        {n:"황금 고양이",kind:"quad",ears:"point",color:"#ffd24a",glow:true}]},
 {name:"눈나라",ground:"#eef6ff",edge:"#d6e7fa",egg:"#dff2ff",spot:"#8cc8ff",decor:"snow",gs:17,gm:450,
  guard:{n:"엄마 북극곰",kind:"quad",ears:"round",color:"#ffffff",s:2.8},
  pets:[{n:"펭귄",kind:"bird",color:"#2b3142",belly:"#ffffff"},{n:"북극여우",kind:"quad",ears:"point",color:"#f8fbff",tail:"big"},
        {n:"아기 북극곰",kind:"quad",ears:"round",color:"#fdfdfd"},{n:"눈표범",kind:"quad",ears:"round",color:"#e3e8ef",tail:"big"},
        {n:"매머드",kind:"quad",ears:"round",color:"#8a5a3a",tusk:true}]},
 {name:"화산",ground:"#6b5050",edge:"#563f3f",egg:"#ffb38a",spot:"#ff5a1f",decor:"lava",gs:21,gm:3500,
  guard:{n:"엄마 용",kind:"quad",ears:"point",color:"#e0402f",wings:true,horn:"one",s:2.6},
  pets:[{n:"불도마뱀",kind:"quad",ears:"none",color:"#ff6a2a"},{n:"용암 개구리",kind:"quad",ears:"none",color:"#ff9a1f"},
        {n:"불새",kind:"bird",color:"#ff3b2f",crest:true},{n:"마그마 거북",kind:"quad",ears:"none",color:"#7a4a2a",shell:true},
        {n:"아기 용",kind:"quad",ears:"point",color:"#ff4d4d",wings:true,horn:"one"}]},
 {name:"구름섬",ground:"#f3e6ff",edge:"#e2cdfa",egg:"#ffffff",spot:"#ff9fe0",decor:"cloud",gs:25,gm:28000,
  guard:{n:"엄마 유니콘",kind:"quad",ears:"point",color:"#ffffff",horn:"one",s:2.7},
  pets:[{n:"구름양",kind:"quad",ears:"round",color:"#ffffff",head:"#d9d9ff"},{n:"무지개새",kind:"bird",color:"#7ad7ff",crest:true},
        {n:"별고양이",kind:"quad",ears:"point",color:"#4b5bd6",glow:true},{n:"페가수스",kind:"quad",ears:"point",color:"#fdfcff",wings:true},
        {n:"유니콘",kind:"quad",ears:"point",color:"#ffe6fa",horn:"one",glow:true}]},
];
const PAD_COST=[0,0,0,0,150,800,4000,20000,100000,500000];
const MAX_PADS=10;
const BASE={x0:-20,x1:20,z0:4,z1:38};
const RIVAL={x0:32,x1:58,z0:8,z1:34};
const BIOME_LEN=55, BIOME_W=25;
const biomeZ=i=>-30-i*BIOME_LEN;

/* ================= 유틸 ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmt(n){
  n=Math.floor(n);
  if (n<10000) return n.toLocaleString();
  if (n<1e8) return (n/1e4).toFixed(n<1e5?1:0).replace(/\.0$/,"")+"만";
  if (n<1e12) return (n/1e8).toFixed(n<1e9?1:0).replace(/\.0$/,"")+"억";
  return (n/1e12).toFixed(1).replace(/\.0$/,"")+"조";
}
let seed=7; const srnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
function load(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ================= 저장 상태 ================= */
function freshSave(){ return { money:0, speedStat:0, tread:1, pads:4, rebirth:0, slots:Array(MAX_PADS).fill(null), pending:0, name:"진혁이", t:Date.now(), best:0 }; }
let G;
try { G=Object.assign(freshSave(), JSON.parse(load("egg-save","null"))||{}); } catch(e){ G=freshSave(); }
if (!Array.isArray(G.slots)||G.slots.length!==MAX_PADS) G.slots=Array(MAX_PADS).fill(null);

/* ================= 3D 기본 ================= */
const canvas=$("view");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color("#9fdcff");
scene.fog=new THREE.Fog("#9fdcff",55,120);
const camera=new THREE.PerspectiveCamera(50,1,0.5,400);
scene.add(new THREE.HemisphereLight("#ffffff","#6f8a5f",0.62));
const sun=new THREE.DirectionalLight("#fff4dc",0.5); sun.position.set(-30,60,20); scene.add(sun);

const MATS={};
function mat(c,emissive){ const k=c+(emissive||""); if(!MATS[k]){ MATS[k]=new THREE.MeshLambertMaterial({color:c}); if(emissive){ MATS[k].emissive=new THREE.Color(emissive); } } return MATS[k]; }
const GEO={box:new THREE.BoxGeometry(1,1,1), sph:new THREE.SphereGeometry(1,14,10), cyl:new THREE.CylinderGeometry(1,1,1,16), cone:new THREE.ConeGeometry(1,1,10)};
function box(w,h,d,c,x,y,z,parent){ const m=new THREE.Mesh(GEO.box,typeof c==="string"?mat(c):c); m.scale.set(w,h,d); m.position.set(x||0,y||0,z||0); (parent||scene).add(m); return m; }
function mesh(geo,c,sx,sy,sz,x,y,z,parent){ const m=new THREE.Mesh(geo,typeof c==="string"?mat(c):c); m.scale.set(sx,sy,sz); m.position.set(x||0,y||0,z||0); (parent||scene).add(m); return m; }
function blob(parent,r){ const m=new THREE.Mesh(new THREE.CircleGeometry(r,16),new THREE.MeshBasicMaterial({color:"#000",transparent:true,opacity:.18,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.y=0.03; parent.add(m); return m; }
function textSprite(text,color,size){
  const c=document.createElement("canvas"); c.width=512; c.height=128; const x=c.getContext("2d");
  x.font="72px Jua, 'Noto Sans KR', sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.lineWidth=14; x.strokeStyle="rgba(0,0,0,.45)"; x.strokeText(text,256,66); x.fillStyle=color||"#fff"; x.fillText(text,256,66);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false})); s.scale.set(size*4,size,1); scene.add(s); return s;
}

/* ---------- 동물 만들기 ---------- */
function shade(hex,amt){ const c=new THREE.Color(hex); const h={}; c.getHSL(h); c.setHSL(h.h,h.s,clamp(h.l+amt,0,1)); return "#"+c.getHexString(); }
function makeAnimal(d,opt){
  opt=opt||{}; const g=new THREE.Group(); const body=new THREE.Group(); g.add(body);
  const main=opt.color||d.color, dark=shade(main,-.18);
  const M=c=>{ const m=mat(c); return m; };
  const mainMat=opt.unique? new THREE.MeshLambertMaterial({color:main}) : (d.glow? mat(main,shade(main,-.35)) : M(main));
  const tagMain=m=>{ m.userData.main=true; return m; };
  if (d.kind==="bird"){
    tagMain(box(1,.9,1.1,mainMat,0,.78,0,body));
    if (d.belly) box(.75,.6,.1,d.belly,0,.75,-.56,body);
    tagMain(box(.72,.7,.72,mainMat,0,1.48,-.28,body));
    box(.3,.18,.32,"#ff9f1c",0,1.42,-.74,body);
    box(.1,.12,.06,"#1d1d24",-.18,1.58,-.65,body); box(.1,.12,.06,"#1d1d24",.18,1.58,-.65,body);
    box(.16,.55,.75,dark,-.58,.82,.02,body); box(.16,.55,.75,dark,.58,.82,.02,body);
    box(.1,.35,.1,"#ff9f1c",-.22,.17,0,body); box(.1,.35,.1,"#ff9f1c",.22,.17,0,body);
    if (d.crest) box(.14,.3,.4,"#ff3b30",0,1.95,-.28,body);
  } else {
    tagMain(box(1,.8,1.5,mainMat,0,.92,0,body));
    const legs=[[-.32,-.5],[.32,-.5],[-.32,.5],[.32,.5]].map(([x,z])=>box(.28,.56,.28,dark,x,.28,z,body));
    g.userData.legs=legs;
    const hc=d.head||main;
    const head=box(.8,.74,.76,d.head?hc:mainMat,0,1.48,-.88,body); if(!d.head) tagMain(head);
    box(.12,.14,.06,"#1d1d24",-.2,1.58,-1.27,body); box(.12,.14,.06,"#1d1d24",.2,1.58,-1.27,body);
    box(.26,.17,.08,d.nose||shade(main,-.35),0,1.36,-1.28,body);

function update(dt){

  if (P.hitCool>0) P.hitCool-=dt;
  const moving=il>.05;
  if (moving){ P.face=Math.atan2(-ix,-iz); P.walk+=dt*sp*1.2; }

  let dr=P.face-player.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; player.rotation.y+=dr*Math.min(1,dt*12);

  u.legL.rotation.x=sw; u.legR.rotation.x=-sw; u.armL.rotation.x=-sw; u.armR.rotation.x=sw; u.body.position.y=moving?Math.abs(Math.sin(P.walk))*.12:0;
  if (P.carryModel) P.carryModel.rotation.y+=dt*2;

  // 러닝머신
  const onTread=Math.abs(P.x-tread.position.x)<1.6&&Math.abs(P.z-tread.position.z)<2.5;
  if (onTread){ G.speedStat+=treadRate()*dt; belt.position.z=(belt.position.z+dt*3)%.5; }
  // 수금
  if (Math.hypot(P.x-collector.position.x,P.z-collector.position.z)<2.2 && G.pending>=1){
    const got=Math.floor(G.pending); G.money+=got; G.pending-=got; toast(`+$${fmt(got)}`,"돈을 모았어요!",1.2); jingle([784,1046]); buzz(15);
  }
  cashPile.visible=G.pending>=1; cashPile.scale.y=clamp(.3+Math.log10(1+G.pending)*.25,.3,1.6);
  // 잠금 버튼
  if (Math.hypot(P.x-lockBtn.position.x,P.z-lockBtn.position.z)<1.6 && lockUntil<now+1000){
    lockUntil=now+60000; toast("기지를 잠갔어요!","60초 동안 도둑이 못 들어와요"); jingle([660,880]);
  }
  const locked=lockUntil>now; myLaser.visible=locked; lockTop.position.y=locked?.25:.4;
  $("lockTag").hidden=!locked; if (locked) $("lockTag").textContent=`잠금 ${Math.ceil((lockUntil-now)/1000)}초`;

  // 둥지
  nests.forEach(n=>{
    if (!n.has){ n.respawn-=dt; if (n.respawn<=0){ n.has=true; n.egg.visible=true; } return; }
    n.egg.rotation.z=Math.sin(now/300+n.x)*.08;
    if (!P.carry && Math.hypot(P.x-n.x,P.z-n.z)<1.7){
      n.has=false; n.egg.visible=false; n.respawn=10;
      setCarry({kind:"egg",biome:n.biome,nest:n}); toast(`${BIOMES[n.biome].name} 알을 훔쳤다!`,"얼른 기지로 도망쳐요!"); jingle([523,784]); buzz(25);
      const gd=guards[n.biome]; if (Math.hypot(gd.x-P.x,gd.z-P.z)<24) gd.state="chase";
    }
  });
  // 경비 동물
  guards.forEach(gd=>{
    const zc=gd.home, inBand=P.z<zc+BIOME_LEN/2+2&&P.z>zc-BIOME_LEN/2-2;
    const dP=Math.hypot(gd.x-P.x,gd.z-P.z);
    if (gd.state!=="chase" && inBand && dP<11 && P.carry && P.carry.kind==="egg") gd.state="chase";
    if (gd.state==="chase" && (!inBand&&dP>8 || dP>26 || !P.carry)) { gd.state="wander"; gd.wait=1.5; }
    let tx,tz,spd;
    if (gd.state==="chase"){ tx=P.x; tz=P.z; spd=gd.speed; }
    else {
      if (gd.wait>0){ gd.wait-=dt; tx=gd.x; tz=gd.z; }
      else { if (Math.hypot(gd.tx-gd.x,gd.tz-gd.z)<1){ gd.tx=rnd(-17,17); gd.tz=zc+rnd(-BIOME_LEN/2+6,BIOME_LEN/2-6); gd.wait=rnd(.5,2); } tx=gd.tx; tz=gd.tz; }
      spd=gd.speed*.35;
    }
    const dx=tx-gd.x, dz=tz-gd.z, L=Math.hypot(dx,dz);
    if (L>.05){ const st=Math.min(L,spd*dt); gd.x+=dx/L*st; gd.z+=dz/L*st; gd.g.rotation.y=Math.atan2(-dx,-dz); gd.g.userData.body.position.y=Math.abs(Math.sin(now/90))*.12; }
    gd.z=clamp(gd.z,zc-BIOME_LEN/2+1,zc+BIOME_LEN/2+3); gd.x=clamp(gd.x,-BIOME_W+1,BIOME_W-1);
    gd.g.position.set(gd.x,0,gd.z);
    if (gd.state==="chase" && dP<1.2+BIOMES[gd.biome].guard.s*.45 && P.hitCool<=0){
      if (P.carry && P.carry.kind==="egg"){
        const n=P.carry.nest; if (n){ n.has=true; n.egg.visible=true; }
        setCarry(null); toast("들켰다!",`${BIOMES[gd.biome].guard.n}이 알을 되찾아 갔어요`); tone(220,.3,"sawtooth"); buzz([40,40,40]);
      }
      P.z+=5; P.hitCool=1; gd.state="wander"; gd.wait=2;
    }
    placeLabel(gd.lbl,gd.x,BIOMES[gd.biome].guard.s*2.2+.6,gd.z,gd.state==="chase"?"!":"");
    placeLabel(gd.nm,gd.x,BIOMES[gd.biome].guard.s*2.2+.2,gd.z,gd.state==="chase"?"":`${BIOMES[gd.biome].guard.n}<b>속도 ${gd.speed}</b>`);
  });

  // 기지에 내려놓기
  if (P.carry && inRect(P.x,P.z,BASE)) placeIntoBase();

  // 부화, 펫
  G.slots.forEach((c,i)=>{
    const p=pads[i]; if (i>=G.pads){ placeLabel(p.label,p.g.position.x,2.4,p.g.position.z, i===G.pads?`자리 늘리기<b>$${fmt(PAD_COST[i])} · 상점</b>`:""); return; }
    if (p.reserved){ placeLabel(p.label,p.g.position.x,2.6,p.g.position.z,`<span style="color:#ff8a8a">도둑맞음!</span>`); return; }
    if (!c){ placeLabel(p.label,p.g.position.x,1.6,p.g.position.z,`<b>빈 자리</b>`); return; }
    if (c.kind==="egg"){
      const left=(c.hatchAt-now)/1000;
      if (p.model) p.model.rotation.z=Math.sin(now/(left<3?60:200))*(left<3?.25:.08);
      if (left<=0){
        const pet={kind:"pet",biome:c.biome,rar:c.rar,mut:rollMut()}; G.slots[i]=pet; refreshPad(p); hatchPop(pet); buzz([30,30,60]); saveGame();
      } else placeLabel(p.label,p.g.position.x,2.4,p.g.position.z,`${BIOMES[c.biome].name} 알<b>${Math.ceil(left)}초</b>`);
    } else {
      const d=petDef(c.biome,c.rar);
      if (p.model){ p.model.rotation.y=Math.sin(now/1500+i)*.6; p.model.userData.body.position.y=Math.abs(Math.sin(now/400+i))*.15;
        if (p.model.userData.rainbow) p.model.userData.mainMat.color.setHSL((now/2000+i*.1)%1,.8,.6); }
      placeLabel(p.label,p.g.position.x,2.2+c.rar*.3,p.g.position.z,`<span style="color:${RAR[c.rar].c};filter:brightness(1.4)">${MUTN[c.mut]}${d.n}</span><b>$${fmt(petIncome(c))}/초</b>`);
    }
  });
  G.pending+=totalIncome()*dt;

  // 라이벌 기지
  rivalLockT-=dt; if (rivalLockT<=0){ rivalLocked=!rivalLocked; rivalLockT=rivalLocked?16:22; }
  rivalLaser.visible=rivalLocked;
  rivalRefill-=dt;
  if (rivalRefill<=0){ rivalRefill=35; const p=rpads.find(r=>!r.content); if (p){ const maxB=Math.min(BIOMES.length-1,Math.floor(G.speedStat/40)+1); p.content={kind:"egg",biome:Math.floor(Math.random()*(maxB+1)),rar:rollRar()}; refreshRpad(p); } }
  rpads.forEach(p=>{
    if (p.content && !P.carry && !rivalLocked && Math.hypot(P.x-p.g.position.x,P.z-p.g.position.z)<1.8){
      setCarry(p.content); p.content=null; refreshRpad(p); toast("너구리 기지에서 훔쳤다!","기지로 가져가요"); jingle([523,784]);
    }
    if (p.model){ p.model.rotation.y+=dt; if (p.model.userData.body) p.model.userData.body.position.y=Math.abs(Math.sin(now/400+p.i))*.12; }
    const c=p.content;
    placeLabel(p.label,p.g.position.x,2.2,p.g.position.z, c? (c.kind==="egg"?`${BIOMES[c.biome].name} 알`:`<span style="color:${RAR[c.rar].c};filter:brightness(1.4)">${petDef(c.biome,c.rar).n}</span>`) : "");
  });
  placeLabel(rivalLbl,RIVAL.x0,3.6,(RIVAL.z0+RIVAL.z1)/2, rivalLocked?`<span style="color:#ff8a9a">잠김 ${Math.ceil(rivalLockT)}초</span>`:`<span style="color:#b6ffcb">열림 ${Math.ceil(rivalLockT)}초</span>`);

  updateThief(dt);

  // 라벨
  placeLabel(nameLbl,P.x,P.carry?4.1:3.2,P.z,esc(G.name));
  placeLabel(cashLbl,collector.position.x,2.6,collector.position.z, G.pending>=1?`$${fmt(G.pending)}<b>밟아서 모으기</b>`:`<b>돈 모으는 곳</b>`);
  placeLabel(treadLbl,tread.position.x,3.2,tread.position.z, onTread?`속도 훈련 중! +${treadRate().toFixed(1)}/초`:`러닝머신 Lv.${G.tread}<b>올라가서 속도 올리기</b>`);
  placeLabel(lockLbl,lockBtn.position.x,1.8,lockBtn.position.z, locked?`<b>잠금 중</b>`:`기지 잠금<b>밟기</b>`);

  // 화살표
  if (P.carry){
    const ax=0-P.x, az=(BASE.z0+BASE.z1)/2-P.z;
    $("arrow").style.transform=`rotate(${Math.atan2(ax,-az)}rad)`;
  }
  if (toastT>0){ toastT-=dt; if (toastT<=0) $("toast").style.opacity=0; }

  // HUD
  $("money").textContent=fmt(G.money); $("income").textContent="$"+fmt(totalIncome());
  $("speed").textContent=speedVal().toFixed(1);

  // 카메라
  const cx=P.x, cz=P.z;
  const portrait=innerHeight>innerWidth; camera.position.lerp(V.set(cx,portrait?27:22,cz+(portrait?18:16)),Math.min(1,dt*6)); camera.lookAt(cx,0,cz-(portrait?5:3));

  saveT-=dt; if (saveT<=0){ saveT=4; saveGame(); }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 도둑 ---------- */
function moveTo(o,tx,tz,spd,dt){ const dx=tx-o.x,dz=tz-o.z,L=Math.hypot(dx,dz); if (L<.3) return true; const st=Math.min(L,spd*dt); o.x+=dx/L*st; o.z+=dz/L*st; o.g.rotation.y=Math.atan2(-dx,-dz); o.g.userData.body.position.y=Math.abs(Math.sin(now/80))*.1; return false; }
function updateThief(dt){
  const t=thief;
  if (t.state==="idle"){
    t.timer-=dt;
    if (t.timer<=0){
      const cands=pads.filter(p=>p.i<G.pads&&G.slots[p.i]&&!p.reserved);
      if (!cands.length){ t.timer=20; return; }
      t.target=pick(cands); t.state="come"; t.x=RIVAL.x0+2; t.z=21; t.g.visible=true; t.leg=0;
      toast("도둑 너구리가 나타났어요!","기지를 잠그거나 잡아요!",2.2); tone(330,.2,"square"); tone(262,.3,"square",.2);
    }
    thiefLbl.style.display="none"; return;
  }
  const locked=lockUntil>now;
  if (t.state==="come"){
    if (t.leg===0){ if (moveTo(t,BASE.x1+3,BASE.z0-2,6.5,dt)) t.leg=1; }
    else if (t.leg===1){ if (moveTo(t,0,BASE.z0-1.5,6.5,dt)){ if (locked){ t.state="flee"; toast("잠금 덕분에 막았어요!"); jingle([660,880,1046]); } else t.leg=2; } }
    else if (t.leg===2){
      const p=t.target; if (!G.slots[p.i]||p.reserved){ t.state="flee"; }
      else if (moveTo(t,p.g.position.x,p.g.position.z+1.2,6.5,dt)){
        t.item=G.slots[p.i]; t.fromPad=p; p.reserved=true; refreshPad(p);
        t.itemModel=contentModel(t.item); t.itemModel.scale.multiplyScalar(.45); t.itemModel.position.y=2.6; t.g.add(t.itemModel);
        t.state="steal"; t.leg=0; toast("너구리가 훔쳐 가요!","쫓아가서 닿으면 되찾아요!"); buzz([60,40,60]);
      }
    }
  } else if (t.state==="steal"){
    const L=[[0,BASE.z0-2],[BASE.x1+3,BASE.z0-2],[RIVAL.x0+3,21]];
    if (moveTo(t,L[t.leg][0],L[t.leg][1],4.6,dt)){ t.leg++; }
    if (t.leg>=3){
      const p=t.fromPad; p.reserved=false; G.slots[p.i]=null; refreshPad(p);
      const rp=rpads.find(r=>!r.content); if (rp){ rp.content=t.item.kind==="egg"?{kind:"egg",biome:t.item.biome,rar:t.item.rar}:t.item; refreshRpad(rp); }
      toast("너구리가 가져갔어요...","너구리 기지에서 다시 훔쳐 와요!",2.4); dropThief(); saveGame(); return;
    }
    if (Math.hypot(t.x-P.x,t.z-P.z)<1.8){
      const p=t.fromPad; p.reserved=false; refreshPad(p); toast("되찾았어요!","너구리가 도망가요"); jingle([523,659,784,1046]); buzz(30);
      t.g.remove(t.itemModel); t.itemModel=null; t.item=null; t.state="flee";
    }
  } else if (t.state==="flee"){
    if (moveTo(t,RIVAL.x0+3,21,8,dt)) dropThief();
  }
  if (t.state!=="idle"){ t.g.position.set(t.x,0,t.z); placeLabel(thiefLbl,t.x,3.4,t.z,t.state==="steal"?"!":""); }
}
function dropThief(){ const t=thief; if (t.itemModel){ t.g.remove(t.itemModel); t.itemModel=null; } t.item=null; t.fromPad=null; t.state="idle"; t.g.visible=false; t.timer=rnd(80,120); }

/* ================= 저장 ================= */
function saveGame(){ G.t=Date.now(); save("egg-save",JSON.stringify(G)); }
document.addEventListener("visibilitychange",()=>{ if (document.hidden) saveGame(); });

/* ================= 화면(상점·펫·시작) ================= */
const layers=$("layers");
function closeLayer(){ layers.innerHTML=""; }
function showShop(){
  const pc=G.pads<MAX_PADS?PAD_COST[G.pads]:null, tc=treadCost(), rc=rebirthCost();
  layers.innerHTML=`<div class="layer" id="bg"><div class="card">
    <h2>상점</h2>
    <div class="row"><div class="t"><div>부화장 자리 늘리기</div><span>지금 ${G.pads}자리 / 최대 ${MAX_PADS}자리</span></div>
      <button class="buy" id="bPad" ${pc==null||G.money<pc?"disabled":""}>${pc==null?"최대":"$"+fmt(pc)}</button></div>
    <div class="row"><div class="t"><div>러닝머신 업그레이드</div><span>Lv.${G.tread} → ${G.tread+1} · 초당 속도 +${treadRate().toFixed(1)} → +${(.5*(G.tread+1)).toFixed(1)}</span></div>
      <button class="buy" id="bTread" ${G.money<tc?"disabled":""}>$${fmt(tc)}</button></div>
    <div class="row"><div class="t"><div>리버스 (새로 시작)</div><span>돈·펫·업그레이드가 처음으로 돌아가는 대신 수입이 영원히 +50%! 지금 ${G.rebirth}회</span></div>
      <button class="buy" id="bReb" ${G.money<rc?"disabled":""}>$${fmt(rc)}</button></div>
    <div class="row"><div class="t"><div>소리</div><span>효과음과 진동</span></div><button class="buy" id="bSnd">${soundOn?"켜짐":"꺼짐"}</button></div>
    <button class="close" id="cls" type="button">닫기</button></div></div>`;
  $("cls").onclick=closeLayer; $("bg").onclick=e=>{ if(e.target.id==="bg") closeLayer(); };
  $("bPad").onclick=()=>{ if (pc!=null&&G.money>=pc){ G.money-=pc; G.pads++; refreshAllPads(); jingle([523,659,784]); saveGame(); showShop(); } };
  $("bTread").onclick=()=>{ if (G.money>=tc){ G.money-=tc; G.tread++; jingle([523,659,784]); saveGame(); showShop(); } };
  $("bReb").onclick=()=>{ if (G.money>=rc) showRebirth(); };
  $("bSnd").onclick=()=>{ soundOn=!soundOn; save("egg-sound",soundOn?"1":"0"); if(soundOn) initAudio(); showShop(); };
}
function showRebirth(){
  layers.innerHTML=`<div class="layer"><div class="card"><h2>정말 리버스할까요?</h2>
    <p>돈, 펫, 부화장 자리, 러닝머신, 속도가 모두 처음으로 돌아가요.<br>대신 앞으로 모든 펫 수입이 +50% 더 늘어나요.</p>
    <button class="go" id="yes" type="button" style="align-self:center">리버스!</button><button class="close" id="no" type="button">그만둘래요</button></div></div>`;
  $("no").onclick=closeLayer;
  $("yes").onclick=()=>{ const keep={name:G.name,rebirth:G.rebirth+1}; G=Object.assign(freshSave(),keep); setCarry(null); refreshAllPads(); closeLayer(); P.x=0;P.z=28; toast(`리버스 ${G.rebirth}회!`,"수입 +50%"); jingle([392,523,659,784,1046]); saveGame(); };
}
function showPets(){
  const rows=G.slots.slice(0,G.pads).map((c,i)=>{
    if (!c) return "";
    if (c.kind==="egg") return `<div class="row"><div class="t"><div>${BIOMES[c.biome].name} 알</div><span>${Math.max(0,Math.ceil((c.hatchAt-Date.now())/1000))}초 뒤 부화</span></div></div>`;
    const d=petDef(c.biome,c.rar), price=Math.round(petIncome(c)*15);
    return `<div class="row"><div class="t"><div><span class="rar" style="background:${RAR[c.rar].c}">${RAR[c.rar].n}</span>${MUTN[c.mut]}${d.n}</div><span>${BIOMES[c.biome].name} · 초당 $${fmt(petIncome(c))}</span></div>
      <button class="buy sell" data-i="${i}" type="button">$${fmt(price)}에 팔기</button></div>`;
  }).join("");
  layers.innerHTML=`<div class="layer" id="bg"><div class="card"><h2>내 펫</h2>
    ${rows||`<p>아직 펫이 없어요.<br>지역에서 알을 훔쳐서 기지로 가져와요!</p>`}
    <p style="font-size:13px">확률: 일반 60% · 희귀 25% · 에픽 10% · 전설 4% · 신화 1%<br>가끔 황금(수입 2배)이나 무지개(5배)가 나와요</p>
    <button class="close" id="cls" type="button">닫기</button></div></div>`;
  $("cls").onclick=closeLayer; $("bg").onclick=e=>{ if(e.target.id==="bg") closeLayer(); };
  layers.querySelectorAll(".sell").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, c=G.slots[i]; if(!c||pads[i].reserved) return; G.money+=Math.round(petIncome(c)*15); G.slots[i]=null; refreshPad(pads[i]); jingle([784,1046]); saveGame(); showPets(); });
}
function showTitle(){
  const eggs=["#fff1d0","#d8f0c0","#ffb38a"].map(c=>`<i style="background:${c}"></i>`).join("");
  layers.innerHTML=`<div class="layer" id="title"><div class="titlebox">
    <div class="eggs">${eggs}</div>
    <div class="logo">알 훔치기<span>대작전</span></div>
    <label class="namebox">내 이름<input id="nm" maxlength="8" value="${esc(G.name)}" autocomplete="off"></label>
    <button class="go" id="start" type="button">시작!</button>
    <div class="help">알을 훔쳐 기지로 가져오면 펫이 태어나요.<br>펫이 돈을 벌면 러닝머신으로 더 빨라져서 먼 지역에 도전해요!</div>
  </div></div>`;
  $("start").onclick=()=>{ const v=$("nm").value.trim(); if(v) G.name=v; initAudio(); closeLayer(); started=true; jingle([392,523,659]); saveGame(); };
}
$("shopBtn").onclick=showShop; $("petBtn").onclick=showPets;
$("homeBtn").onclick=()=>{ if (P.carry){ toast("알을 들고는 순간이동이 안 돼요!","직접 달려가요"); return; } P.x=0; P.z=28; toast("집에 왔어요!"); };

/* ================= 시작 ================= */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?62:50; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();
// 오프라인 수입 (최대 2시간, 절반)
(function offline(){ const away=Math.min(7200,Math.max(0,(Date.now()-(G.t||Date.now()))/1000)); if (away>30){ const earn=totalIncome()*away*.5; G.pending+=earn; if (earn>=1) setTimeout(()=>toast(`쉬는 동안 $${fmt(earn)} 벌었어요!`,"돈 모으는 곳을 밟아요",3),400); } })();
refreshAllPads();
camera.position.set(P.x,21,P.z+16); camera.lookAt(P.x,0,P.z-3);
let started=false, last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if (started) update(dt); else { now=Date.now(); const a=t/4000; camera.position.set(Math.sin(a)*24,20,20+Math.cos(a)*10); camera.lookAt(0,0,0); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
showTitle(); requestAnimationFrame(frame);
window.__egg={G,P,pads,guards,nests,thief,update:dt=>update(dt),setCarry,start:()=>{started=true;closeLayer();}};
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body>
</html>
