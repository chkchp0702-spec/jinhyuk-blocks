<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신들의 전쟁">
<title>신들의 전쟁</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">
<style>
/* 전체 화면 3D 세계. 왼쪽 엄지: 조이스틱, 오른쪽 엄지: 공격/기술/물약. 위: 상태, 아래: 메뉴. 테마 색은 내 세계(--c1 주색, --c2 보조)로 바뀜. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --paper:#fff9ec; --gold:#ffcf4a; --red:#ff5a5f; --green:#3fd27a; --blue:#4aa3ff;
  --c1:#ffcf4a; --c2:#fff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --title:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1a1030;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 2px 0 #120a24;-webkit-font-smoothing:antialiased}
.lbl b{font-weight:400;display:block;font-size:12px;opacity:.9}
.lbl .hp{display:block;width:64px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.lbl .hp i{display:block;height:100%;background:#ff5a5f;border-radius:4px}
.lbl.ally{color:#9dffb8} .lbl.foe{color:#ff8d8d} .lbl.boss{font-size:19px;color:#ffcf4a}
.lbl.dmg{z-index:2} .lbl.dmg em{display:block;font-style:normal;font-weight:900;font-size:25px;color:#fff;letter-spacing:-.5px;text-shadow:0 0 1px #000,2px 2px 0 #1b1430,-2px 2px 0 #1b1430,2px -2px 0 #1b1430,-2px -2px 0 #1b1430,0 3px 0 #1b1430,0 4px 8px rgba(0,0,0,.6);transform-origin:50% 80%;animation:dmgPop .95s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em{font-size:33px;color:#ffe066;text-shadow:0 0 1px #000,2px 2px 0 #7a2a00,-2px 2px 0 #7a2a00,2px -2px 0 #7a2a00,-2px -2px 0 #7a2a00,0 3px 0 #7a2a00,0 0 16px rgba(255,150,40,.95);animation:dmgCrit 1.05s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em.c::before{content:"치명타!";display:block;font-size:13px;color:#fff6c8;letter-spacing:1px;margin-bottom:-2px}
.lbl.dmg.me em{color:#ff5b5b;font-size:23px;text-shadow:0 0 1px #000,2px 2px 0 #3a0010,-2px 2px 0 #3a0010,2px -2px 0 #3a0010,-2px -2px 0 #3a0010,0 3px 0 #3a0010}
.lbl.dmg.gain em{font-size:18px;color:#ffe27a;animation:dmgGain 1.1s ease-out forwards}
@keyframes dmgPop{0%{transform:translate(0,10px) scale(.3);opacity:0}12%{transform:translate(calc(var(--dx)*.15),-8px) scale(1.45);opacity:1}30%{transform:translate(calc(var(--dx)*.35),-16px) scale(1)}72%{opacity:1}100%{transform:translate(var(--dx),-66px) scale(.8);opacity:0}}
@keyframes dmgCrit{0%{transform:translate(0,10px) scale(.2) rotate(-8deg);opacity:0}12%{transform:translate(0,-10px) scale(1.7) rotate(4deg);opacity:1}22%{transform:translate(-3px,-14px) scale(1.15) rotate(-3deg)}30%{transform:translate(3px,-16px) scale(1.25) rotate(0)}75%{opacity:1}100%{transform:translate(var(--dx),-74px) scale(.9);opacity:0}}
@keyframes dmgGain{0%{transform:translate(0,6px) scale(.6);opacity:0}15%{transform:translate(0,-6px) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(0,-56px) scale(.95);opacity:0}}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px}
.tl{top:max(8px,env(safe-area-inset-top));left:10px;flex-direction:column;align-items:flex-start}
.tr{top:max(8px,env(safe-area-inset-top));right:10px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(20,14,40,.72);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.75}
#status{display:flex;flex-direction:column;gap:4px;background:rgba(20,14,40,.72);border:2px solid var(--c1);border-radius:16px;padding:8px 12px;min-width:196px;backdrop-filter:blur(6px)}
#status .nm{font-size:17px;color:var(--c1);line-height:1.1} #status .nm small{color:#fff;opacity:.85;font-size:13px;margin-left:6px}
.bar{height:11px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff3d4a,#ff8a5c)} .bar.xp i{background:linear-gradient(90deg,#4aa3ff,#9be7ff)} .bar.xp{height:7px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000}
.gold{color:var(--gold)}
#titanPill{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 262px);z-index:5;font-size:13px;cursor:pointer;pointer-events:auto;border:1px solid rgba(255,140,80,.6);color:#ffd9b0;font-family:inherit} #netPill{font-size:12px;gap:6px} #netPill .dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;box-shadow:0 0 4px #000} #netPill .dot.on{background:#3fd27a;box-shadow:0 0 6px #3fd27a}
#region{font-size:14px;color:#fff;letter-spacing:.5px}
#region b{font-weight:400;color:var(--c1)}

#minimap{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);width:164px;height:164px;z-index:5;border-radius:50%;border:0;background:#0e0a1e;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#guide{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 70px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:auto;background:rgba(20,14,40,.7);border:2px solid var(--gold);border-radius:16px;padding:4px 12px;color:#fff;font-size:13px;white-space:nowrap} #gArrow{font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 10px rgba(255,207,74,.8);transition:transform .15s}
.idlegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0} .idlegrid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px} .idlegrid b{font-size:20px;color:var(--gold)} .idlegrid span{font-size:12px;opacity:.8}
.row .st{font-style:normal;font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:4px;vertical-align:1px} .row .st.on{background:#1f9a52;color:#fff}
.lbl .away{display:block;font-size:10px;opacity:.85;color:#bfe9ff}
/* v19: 칭호 · 원정 · 미궁 */
.lbl .ttl{display:block;font-size:12px;font-weight:900;letter-spacing:.2px;margin-bottom:1px;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 0 6px rgba(0,0,0,.6)}
.row .t span.ttl{display:inline;font-size:12px;font-weight:900;margin-right:4px;color:inherit} .row .t span.rar{display:inline-block}
.row .tbar{display:block;height:6px;margin-top:4px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden} .row .tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff9a3d);border-radius:4px}
.diary{background:#fff8e6;color:#3a2a14;border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 2px #e8d4a6;background-image:repeating-linear-gradient(#fff8e6 0 25px,#ecdcb8 25px 26px)} .diary p{margin:4px 0;font-size:14px;line-height:1.35;color:#3a2a14}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .exgrid.three{grid-template-columns:1fr 1fr 1fr} .exgrid .buy{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px} .exgrid .buy small{font-size:10px;opacity:.85}
.exd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;cursor:pointer} .exd em{font-style:normal;font-size:26px} .exd b{font-weight:400;font-size:14px} .exd i{font-style:normal;font-size:11px;opacity:.7} .exd.on{border-color:var(--gold,#ffcf4a);background:rgba(255,207,74,.16)}
.gearpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px var(--rc);animation:gearPop 1.6s ease-out forwards} .gearpop small{display:block;font-size:13px;font-weight:700;opacity:.9} @keyframes gearPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#zoomBtns{position:fixed;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 218px);z-index:5;display:flex;gap:6px} #zoomBtns button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(20,14,40,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
#quest{position:fixed;left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 96px);z-index:5;pointer-events:auto;max-width:200px;display:flex;flex-direction:column;gap:4px}
.q{background:rgba(20,14,40,.66);border-left:4px solid var(--c1);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25;color:#fff}
.q.done{border-color:var(--green);color:#9dffb8} .q small{opacity:.75}

.bl{left:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:row;pointer-events:auto}
.br{right:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.mbtn{border:0;cursor:pointer;color:#fff;font-size:15px;border-radius:14px;padding:9px 12px;min-width:60px;background:rgba(20,14,40,.75);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.mbtn:active{transform:translateY(2px)}
.acts{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 60px);z-index:5;display:grid;grid-template-columns:64px 64px 84px;grid-template-rows:64px 84px;gap:8px;align-items:end;justify-items:end;pointer-events:auto}
.act{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.5);color:#fff;font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.act.atk{background:radial-gradient(circle at 35% 30%,#ff9a7a,#d82f3c 70%);grid-column:3;grid-row:2;width:84px;height:84px;font-size:17px}
.act.thr{position:absolute;left:-64px;bottom:8px;background:radial-gradient(circle at 35% 30%,#ffe2a8,#e08a1e 70%);color:#2a1606;font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.act.lock{filter:grayscale(1) brightness(.6)} .act.lock small{font-size:9px}
.act.skl{background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 70%);color:#1b1430;text-shadow:0 1px 0 rgba(255,255,255,.4);font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1}
.act.pot{background:radial-gradient(circle at 35% 30%,#9dffb8,#1f9f58 70%);grid-column:2;grid-row:2}
.act.jmp{background:radial-gradient(circle at 35% 30%,#bcd6ff,#3a5bd6 70%);grid-column:1;grid-row:2}
.act.skl{grid-row:1}
.act .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
.act small{font-size:11px;opacity:.9}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.45);z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,0,20,.45) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 50%,rgba(255,20,30,.55) 100%);opacity:0;transition:opacity .25s}
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;font-size:clamp(22px,6.5vw,34px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.4);font-family:var(--title);letter-spacing:1px}
#toast small{display:block;font-size:.55em;color:var(--c1);margin-top:4px;font-family:var(--font);letter-spacing:0}
#chat{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none;width:min(80vw,360px)}
.msg{background:rgba(20,14,40,.75);border-radius:12px;padding:4px 10px;font-size:13px;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeout 6s forwards} .msg b{font-weight:400;color:var(--gold)}
@keyframes fadeout{80%{opacity:1}to{opacity:0}}
#warbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 122px);transform:translateX(-50%);z-index:6;width:min(78vw,330px);background:linear-gradient(135deg,rgba(90,10,20,.85),rgba(20,8,30,.85));border:2px solid #ff5a5f;border-radius:14px;padding:6px 10px;text-align:center;box-shadow:0 0 18px rgba(255,60,80,.45);animation:warp 1.6s ease-in-out infinite}
@keyframes warp{50%{box-shadow:0 0 28px rgba(255,60,80,.75)}}
#warbar .wt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #warbar .wt b{font-weight:400}
#warbar .wb{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0;background:#000} #warbar .wb i{display:block;height:100%} #warbar .wb span{position:absolute;inset:0;font-size:11px;line-height:14px;text-shadow:0 1px 0 #000}
#warbar .wm{font-size:12px;color:var(--gold)} #warbar button{margin-top:4px;border:0;border-radius:10px;padding:5px 14px;background:var(--gold);color:#1b1430;font-family:var(--font);font-size:14px;cursor:pointer}
#bossbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 180px);transform:translateX(-50%);z-index:5;width:min(70vw,300px);pointer-events:none;text-align:center}
#bossbar .nm{font-size:16px;color:#ffcf4a;text-shadow:0 2px 0 #000} #bossbar .bar{height:12px;border:2px solid #ffcf4a} #bossbar .bar i{background:linear-gradient(90deg,#b01030,#ff3d4a)}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(8,4,20,.7);backdrop-filter:blur(4px)}
.card{width:100%;max-width:420px;max-height:88%;overflow:auto;background:linear-gradient(180deg,#2a1f4d,#17102f);border:2px solid var(--c1);border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.5,.5,1);color:#fff}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:24px;text-align:center;font-family:var(--title);color:var(--c1);letter-spacing:1px}
.card h3{margin:6px 0 0;font-weight:400;font-size:16px;color:var(--c1)}
.card p{margin:0;color:#d8d2ea;line-height:1.5;text-align:center;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px}
.row .t{flex:1;min-width:0} .row .t div{font-size:16px} .row .t span{font-size:12px;color:#b9b1d4;display:block;line-height:1.3}
.row .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.3)}
.buy{border:0;cursor:pointer;background:var(--green);color:#1b1430;border-radius:11px;padding:8px 12px;font-size:15px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.buy[disabled]{background:#5a5570;color:#bbb;cursor:default} .buy.sell{background:var(--red);color:#fff} .buy.alt{background:var(--blue);color:#fff}
.close{align-self:center;border:0;background:none;color:#fff;font-size:17px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap} .tab{border:2px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer} .tab.on{background:var(--c1);color:#1b1430;border-color:var(--c1)}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-size:11px;margin-right:4px;vertical-align:middle}
.go{border:0;cursor:pointer;font-size:24px;color:#1b1430;background:var(--c1);padding:13px 38px;border-radius:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 0 rgba(0,0,0,.5);font-family:var(--title);letter-spacing:1px;align-self:center}
.go:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.5)}
.go[disabled]{background:#5a5570;color:#bbb}
.inp{font:inherit;font-size:20px;text-align:center;width:220px;padding:8px 12px;border-radius:14px;border:3px solid var(--c1);background:rgba(255,255,255,.95);color:var(--ink);outline:none;align-self:center}

#title{background:radial-gradient(ellipse at 50% 20%,rgba(120,90,255,.35),rgba(8,4,20,.85) 60%);align-items:flex-start;padding-top:max(26px,env(safe-area-inset-top));overflow:auto}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:440px}
.logo{font-family:var(--title);font-size:min(16vw,70px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,207,74,.6),0 5px 0 #4a2a00;letter-spacing:2px;margin-top:8px}
.logo span{display:block;font-size:.3em;color:var(--gold);letter-spacing:6px;font-family:var(--font);text-shadow:0 2px 0 #000}
.realms{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.realm{border:3px solid rgba(255,255,255,.2);border-radius:18px;padding:12px 10px;background:linear-gradient(160deg,var(--a),var(--b));color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px;box-shadow:0 6px 0 rgba(0,0,0,.45);position:relative;overflow:hidden}
.realm:active{transform:translateY(3px)} .realm.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.45)}

    found.forEach(sm=>{ const mesh=new THREE.SkinnedMesh(sm.geometry,sm.material); mesh.name=partName; const bl=sm.skeleton.bones.map(b=>bones[b.name]||bones.hips); mesh.bind(new THREE.Skeleton(bl,sm.skeleton.boneInverses.map(x=>x.clone())),sm.bindMatrix.clone()); mesh.frustumCulled=false; mesh.castShadow=HIGH(); base.add(mesh); }); }
  if(s.btint){ const bc=new THREE.Color(s.btint); base.traverse(o=>{ if(o.isSkinnedMesh&&o.visible&&!/_Head$/.test(o.name)&&o.material){ o.material=o.material.clone(); o.material.color.multiply(bc); } }); }
  if(s.head&&s.head!==s.body) addPart(s.head,s.head.replace(/_with_Helmet$/,"")+"_Head");
  if(s.hat) s.hat.p.forEach(p=>addPart(s.hat.m,p)); if(s.cape) s.cape.p.forEach(p=>addPart(s.cape.m,p));
  if(s.tint){ base.traverse(o=>{ if(o.isMesh&&o.material){ o.material=o.material.clone(); o.material.color.multiply(new THREE.Color(s.tint)); } }); }
  const attach=(wname,slot,mirror,glow)=>{ const w=MODELS.weap[wname]; const b=bones[slot]||bones[slot.replace(/\./g,"")];   /* 로더가 이름의 '.'을 지움: handslot.r → handslotr */ if(!w||!b) return; const o=w.clone(); if(mirror) o.scale.x=-1; if(glow>0) glowUp(o,RAR_HEX[glow],[0,.18,.3,.42][glow]); b.add(o); return o; };
  const wg=s.wt>=0?s.wt:0;
  if(s.weapon){ if(s.weapon==="dagger2"){ attach("dagger","handslot.r",false,wg); attach("dagger","handslot.l",true,wg); } else attach(s.weapon,"handslot.r",false,wg); } if(s.offhand) attach(s.offhand,"handslot.l",false,s.at>=2?s.at:0);
  const handL=bones["handslot.l"]||bones["handslotl"]; if(s.chakra&&handL){ const ck=new THREE.Group(); const gm=gemMat(0xffcf4a); const ring=new THREE.Mesh(new THREE.TorusGeometry(.32,.045,8,28),gm); ck.add(ring); for(let k=0;k<8;k++){ const sp=new THREE.Mesh(new THREE.BoxGeometry(.04,.3,.03),gm); sp.rotation.z=k*Math.PI/4; ck.add(sp); } ck.position.set(0,.1,.1); handL.add(ck); base.userData.spin=(base.userData.spin||[]).concat([ck]); }
  if(s.wings&&bones.chest){ const wm=mat({color:0xffffff,roughness:.9}); [-1,1].forEach(sg=>{ const wg=new THREE.Group(); wg.position.set(sg*.12,.1,-.12); wg.userData.s=sg; for(let f=0;f<4;f++){ const fe=sph(.07,wm,sg*(.16+f*.17),.1+f*.1-(f>2?.08:0),-.04); fe.scale.multiply(new THREE.Vector3(1.1,2.6+f*.35,.5)); fe.rotation.z=sg*(.45+f*.22); wg.add(fe); } bones.chest.add(wg); (base.userData.wings=base.userData.wings||[]).push(wg); }); }
  const g=new THREE.Group(); base.scale.setScalar(opts.scale||2.1); g.add(base);
  if(s.rt>=0){ const orb=new THREE.Group(); const n=[1,1,2,3][s.rt]; for(let k=0;k<n;k++){ const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.2+.04*s.rt,0),gemMat(RAR_HEX[s.rt])); const a=k/n*Math.PI*2; gem.position.set(Math.cos(a)*1.15,0,Math.sin(a)*1.15); orb.add(gem); } orb.position.y=3.3; g.add(orb); g.userData.relic=orb; }
  if(s.at>=1){ const rg=new THREE.Mesh(new THREE.RingGeometry(.75,.95+.08*s.at,40),glowMat(RAR_HEX[s.at],.28+.08*s.at)); rg.rotation.x=-Math.PI/2; rg.position.y=.06; g.add(rg); g.userData.gearRing=rg; }
  if(s.spark){ const sp=new THREE.Mesh(new THREE.OctahedronGeometry(.22,0),glowMat(0xfff27a,.95)); g.add(sp); g.userData.zap=sp; }
  const mixer=new THREE.AnimationMixer(base); const actions={}; MODELS.anims.forEach(c=>{ actions[c.name]=mixer.clipAction(c); });
  const two=s.weapon==="sword_2handed"||s.weapon==="axe_2handed", magic=s.weapon==="staff"||s.weapon==="druid_staff"||s.weapon==="wand"||s.weapon==="spellbook_open", dual=s.weapon==="dagger2", bow=s.weapon==="bow_withString";
  g.userData.gl={mixer,actions,cur:null,onceUntil:0,attack:opts.attack||(two?"Melee_2H_Attack_Chop":magic?"Ranged_Magic_Shoot":dual?"Melee_Dualwield_Attack_Slice":bow?"Ranged_Bow_Release":s.weapon?"Melee_1H_Attack_Slice_Diagonal":"Melee_Unarmed_Attack_Punch_A"),skill:opts.skill||(two?"Melee_2H_Attack_Spin":"Ranged_Magic_Spellcasting"),alias:{Idle:"Idle_A",Walking_A:"Walking_A",Running_A:"Running_A",Hit_A:"Hit_A",Death_A:"Death_A",Jump_Full_Short:"Jump_Full_Short",Cheer:"Interact"}};
  if(base.userData.wings) g.userData.wings=base.userData.wings; if(base.userData.spin) g.userData.spin=base.userData.spin; MIXERS.push(g); playAnim(g,"Idle"); return g; }

/* ---- 애니메이션 제어 ---- */
function playAnim(g,name,once,fade){ const G=g.userData.gl; if(!G) return; if(G.alias&&G.alias[name]) name=G.alias[name]; const a=G.actions[name]; if(!a) return; const now=performance.now();
  if(once){ if(G.cur===name&&now<G.onceUntil) return; a.reset(); a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished=true; a.enabled=true; a.fadeIn(fade||.08); a.play(); if(G.curA&&G.curA!==a) G.curA.fadeOut(fade||.08); G.cur=name; G.curA=a; G.onceUntil=now+a.getClip().duration*1000-60; return; }
  if(G.cur===name) return; if(now<G.onceUntil&&G.curA&&G.curA.loop===THREE.LoopOnce) return;
  a.reset(); a.setLoop(THREE.LoopRepeat,Infinity); a.enabled=true; a.fadeIn(fade||.18); a.play(); if(G.curA&&G.curA!==a) G.curA.fadeOut(fade||.18); G.cur=name; G.curA=a; }
function animState(g,st){ if(!g||!g.userData.gl) return; const G=g.userData.gl; if(st==="dead"){ if(G.cur!=="Death_A") playAnim(g,"Death_A",true,.1); return; } if(st==="attack"){ playAnim(g,G.attack,true,.05); return; } if(st==="skill"){ playAnim(g,G.skill,true,.05); return; } if(st==="hit"){ playAnim(g,"Hit_A",true,.05); return; } if(st==="jump"){ playAnim(g,"Jump_Full_Short",true,.05); return; } if(st==="cheer"){ playAnim(g,"Cheer",true,.1); return; }
  if(performance.now()<G.onceUntil&&G.curA&&G.curA.loop===THREE.LoopOnce) return; playAnim(g,st==="run"?"Running_A":st==="walk"?"Walking_A":"Idle"); }
function tickMixers(dt){ for(let i=MIXERS.length-1;i>=0;i--){ const g=MIXERS[i]; if(!g.parent){ MIXERS.splice(i,1); continue; } g.userData.gl.mixer.update(dt); const U=g.userData; if(U.relic){ U.relic.rotation.y+=dt*1.6; U.relic.position.y=3.3+Math.sin(performance.now()/500)*.12; U.relic.children.forEach(c=>{ c.rotation.y+=dt*3; }); } if(U.gearRing){ U.gearRing.rotation.z+=dt*.8; } if(U.spin) U.spin.forEach(c=>{ c.rotation.z+=dt*9; }); if(U.zap){ const t=performance.now()/90; U.zap.visible=Math.sin(t*1.7)>-.3; U.zap.position.set(Math.sin(t)*.5+.6,2.2+Math.cos(t*1.3)*.6,.4); U.zap.scale.setScalar(.6+Math.random()*.6); } if(g.userData.wings) g.userData.wings.forEach(w=>{ w.rotation.y=w.userData.s*Math.sin(performance.now()/450)*.25; }); } }

/* ---- 해골(1.0 팩, 자체 애니메이션) ---- */
function makeCharGL(modelName,opts){ const src=MODELS.chars[modelName]; const clips=SKEL_ANIMS[modelName]; if(!src||!clips) return null; opts=opts||{}; const obj=THREE.SkeletonUtils.clone(src); const g=new THREE.Group(); obj.scale.setScalar(opts.scale||2.1); g.add(obj);
  const mixer=new THREE.AnimationMixer(obj); const actions={}; clips.forEach(c=>{ actions[c.name]=mixer.clipAction(c); }); g.userData.gl={mixer,actions,cur:null,onceUntil:0,attack:opts.attack||"1H_Melee_Attack_Slice_Diagonal",skill:"Spellcast_Shoot",alias:{}}; MIXERS.push(g); playAnim(g,"Idle"); return g; }
const SKEL_ANIMS={};
const SKEL_OF={"드라우그":"Skeleton_Warrior","길 잃은 영혼":"Skeleton_Minion","베탈라":"Skeleton_Rogue"};

/* ---- 괴물·보스 → 신화에 맞는 모델 ---- */
const MOB_GL={"서리 거인":{body:"FrostGolem",scale:1.5},"트롤":{body:"OrcBrute",scale:1.25,weapon:"axe_1handed"},"서리 늑대":{body:"Werewolf_Wolf"},"타락천사":{body:"Vampire",weapon:"sword_1handed"},"네피림":{body:"OrcRaider",scale:1.3,weapon:"axe_2handed",tint:0xe8d8c0},"락샤사":{body:"Monster",weapon:"axe_1handed"},"아수라":{body:"Tiefling",weapon:"sword_2handed"},"나가":{body:"PlantWarrior",weapon:"staff"},"키클롭스":{body:"Monstrosity",scale:1.3},"사티로스":{body:"Caveman",weapon:"druid_staff"},"하르피이":{body:"AvianSwordsman",weapon:"sword_1handed"},
  "네피림의 왕":{body:"Monstrosity",scale:1.9,tint:0xe8d8b0},"서리거인 흐림":{body:"FrostGolem",scale:2.3},"미노타우로스":{body:"OrcBrute",scale:1.9,tint:0x8a6a4a,weapon:"axe_2handed"},"루시퍼":{body:"Vampire",scale:2.4,tint:0x8060c0,weapon:"sword_2handed"},"펜리르":{body:"Werewolf_Wolf",scale:2.6,tint:0x8a8a9a},"마히샤수라":{body:"Monstrosity",scale:2.4,tint:0x806040,weapon:"axe_2handed"}};
function mobGL(name,scale){ const sk=SKEL_OF[name]; if(sk){ if(!MODELS.chars[sk]) return null; const g=makeCharGL(sk,{scale:2.0*scale}); if(g){ g.userData.h=4.2*scale; g.userData.glMob=name; } return g; }
  const d=MOB_GL[name]; if(!d) return null; const s={body:d.body,head:d.body,hat:null,cape:null,weapon:d.weapon||null,offhand:null,tint:d.tint||null,wings:false}; const need=specNeeds(s); if(!ensure(need.names,need.weapons)||!MODELS.animsReady) return null;
  const g=composeChar(s,{scale:2.1*(d.scale||1)*scale,keepExtras:true}); if(!g) return null; g.userData.h=4.3*(d.scale||1)*scale; g.userData.glMob=name; const sh=new THREE.Mesh(new THREE.CircleGeometry(1*(d.scale||1),20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.22,depthWrite:false})); sh.rotation.x=-Math.PI/2; sh.position.y=.05; g.add(sh); return g; }

/* ---- 플레이어/친구/NPC 아바타 ---- */
function avatarGL(realm,rank,look,scale,eq){ const s=lookSpec(realm,rank,look,eq); const need=specNeeds(s); if(!ensure(need.names,need.weapons)||!MODELS.animsReady) return null;

  if(rank>=4){ const aura=new THREE.Mesh(new THREE.RingGeometry(1.1,1.5,40),glowMat(R.c1,.7)); aura.rotation.x=-Math.PI/2; aura.position.y=.08; g.add(aura); g.userData.aura=aura; }
  if(rank>=6){ const crown=new THREE.Mesh(new THREE.TorusGeometry(.9,.05,8,24),glowMat(R.c1,.9)); crown.position.y=4.6; g.userData.crown=crown; g.add(crown); }
  if(realm===0){ const halo=new THREE.Mesh(new THREE.TorusGeometry(.5,.05,10,32),mat({color:0xffe27a,emissive:0xffd05a,emissiveIntensity:1.2,metalness:.5,roughness:.3})); halo.rotation.x=Math.PI/2; halo.position.y=4.35; g.add(halo); }
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.9,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.22,depthWrite:false})); sh.rotation.x=-Math.PI/2; sh.position.y=.05; g.add(sh);
  g.userData.glAvatar=true; g.userData.lookKey=JSON.stringify([realm,rank,look||{},eq||{}]); return g; }
/* 장비가 바뀌면: 필요한 모델을 받은 뒤 내 캐릭터를 다시 조립 + 친구에게 알림 */
function gearNeeds(eq){ const s=lookSpec(G.realm,G.rank,G.look||{},eq); return specNeeds(s); }
function refreshGear(slot){ const nd=gearNeeds(G.eq); const go=()=>{ buildPlayer(); try{ net.hello&&net.hello(); }catch(e){} const t=G.eq[slot]; if(t>=0&&player){ fxRing(P.x,P.z,RAR_HEX[t],5,.6); fxSpark(P.x,2.5,P.z,RAR_HEX[t],30); const el=document.createElement("div"); el.className="gearpop"; el.style.setProperty("--rc",RAR[t].c); el.innerHTML=`${{w:"⚔",a:"🛡",r:"✨"}[slot]} ${itemName(slot,t)}<small>${RAR[t].n} · 모습이 바뀌었어요</small>`; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); } }; if(ensure(nd.names,nd.weapons,go)) go(); }
const NPC_LOOK={"예수":{body:8,hat:1,cape:1,weapon:6,tint:4},"가브리엘":{body:1,face:9,cape:11,weapon:2},"라파엘":{body:9,hat:1,cape:1,weapon:8},"토르":{body:4,hat:3,cape:8,weapon:5},"프레이야":{body:6,face:12,cape:4,weapon:10},"헤임달":{body:2,hat:4,cape:2,weapon:3},"하누만":{body:14,hat:1,cape:1,weapon:1},"가네샤":{body:16,hat:12,cape:1,weapon:6},"아그니":{body:7,hat:1,cape:9,weapon:7,tint:1},"아테나":{body:2,hat:4,cape:2,weapon:2},"아폴론":{body:11,hat:1,cape:7,weapon:10,tint:4},"헤르메스":{body:10,hat:1,cape:7,weapon:1}};
function refreshGL(){ if(!MODELS.animsReady) return;
  if(typeof player!=="undefined"&&player&&!player.userData.glAvatar&&typeof buildPlayer==="function") buildPlayer();
  if(typeof PEERS!=="undefined") for(const id in PEERS){ const o=PEERS[id]; if(!o.mesh.userData.glAvatar&&net.rebuild) net.rebuild(o); }
  if(typeof NPCS!=="undefined") NPCS.forEach(o=>{ if(o.mesh.userData.glAvatar) return; const realm=REGIONS.find(r=>r===o.cap).realm; const g=avatarGL(realm,6,NPC_LOOK[o.n]||{},2.3); if(g){ scene.remove(o.mesh); o.mesh=g; scene.add(g); g.position.set(o.x,hAt(o.x,o.z),o.z); } });
  if(typeof mobs!=="undefined") mobs.forEach(m=>{ if(m.mesh.userData.gl||m.trialOf||m.war) return; const g=mobGL(m.n,m.scale); if(g){ g.position.copy(m.mesh.position); g.rotation.y=m.mesh.rotation.y; scene.remove(m.mesh); m.mesh=g; scene.add(g); if(m.aura){ g.add(m.aura); } } }); }

/* ---- 건물·나무: 준비되면 절차 소품을 진짜 모델로 교체 ---- */
function onHexReady(){ try{ PLACED.forEach(p=>{ if(p.obj) scene.remove(p.obj); const o=hexFor(p); if(o){ o.position.set(p.x,hAt(p.x,p.z)-.05,p.z); o.rotation.y=p.rot||0; scene.add(o); p.obj=o; } }); }catch(e){ console.warn(e); } }
function hexFor(p){ const c=REALM_HEXCOLOR[p.realm]||"yellow";
  if(p.kind==="tree"){ const pool=p.realm===1?["trees_B_small","trees_B_medium","trees_B_large","tree_single_B"]:p.realm===2?["tree_single_A","tree_single_B","trees_A_small"]:["trees_A_small","trees_A_medium","trees_A_large","tree_single_A"]; return hexModel(pick(pool),rnd(4.5,6.5)); }
  if(p.kind==="rock"){ return hexModel(pick(["rock_single_A","rock_single_B","rock_single_C","rock_single_D","rock_single_E"]),rnd(9,16)); }
  if(p.kind==="house"){ return hexModel(pick(["building_home_A_"+c,"building_home_B_"+c,"building_tavern_"+c,"building_blacksmith_"+c]),5.5); }
  if(p.kind==="castle"){ return hexModel("building_castle_"+c,5.5); }
  if(p.kind==="church"){ return hexModel(pick(["building_church_"+c,"building_tower_A_"+c,"building_windmill_"+c]),5.5); }
  if(p.kind==="market"){ return hexModel("building_market_"+c,5); }
  if(p.kind==="prop"){ return hexModel(pick(["barrel","crate_A_big","tent","weaponrack","wheelbarrow","sack","bucket_water","target"]),5); }
  if(p.kind==="flag"){ return hexModel("flag_"+c,5); }
  return null; }

<script>
/* ================= v18 레벨업·승급 연출: 빛기둥 · 떠오르는 고리 · 솟는 빛가루 · 화면 금빛 · 큰 글씨 ================= */
const LVFX={tex:null,geo:null};
function lvTex(){ if(LVFX.tex) return LVFX.tex; const c=document.createElement("canvas"); c.width=8; c.height=128; const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,0,128); gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(.45,"rgba(255,255,255,.35)"); gr.addColorStop(.88,"rgba(255,255,255,1)"); gr.addColorStop(1,"rgba(255,255,255,.15)");
  g.fillStyle=gr; g.fillRect(0,0,8,128); LVFX.tex=new THREE.CanvasTexture(c); LVFX.geo=new THREE.CylinderGeometry(1,1,1,20,1,true); LVFX.geo.translate(0,.5,0); return LVFX.tex; }
function lvMat(color,op){ return new THREE.MeshBasicMaterial({color,map:lvTex(),transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}); }
function lvFollow(m,y){ m.position.set(P.x,(P.gy||0)+(y||0),P.z); }
/* 빛기둥: 발밑에서 하늘로 확 솟았다가 가늘어지며 사라짐 (나를 따라다님) */
function fxPillar(color,r,h,dur,op){ op=op||.5; const m=new THREE.Mesh((lvTex(),LVFX.geo),lvMat(color,op)); m.userData.noOutline=true; m.renderOrder=5; lvFollow(m); scene.add(m);
  FX.push({m,t:0,d:dur,kind:"lv",tick:(f,k)=>{ lvFollow(f.m); const up=Math.min(1,k*5); const rr=r*(k<.12?.3+k/.12*.9:1.2-(k-.12)*1.1); f.m.scale.set(Math.max(.05,rr),h*(.15+.85*Math.pow(up,.5)),Math.max(.05,rr)); f.m.material.opacity=op*(k<.7?1:(1-k)/.3); f.m.rotation.y+=.05; }}); }
/* 몸을 감싸며 위로 떠오르는 고리 */
function fxRiseRing(color,delay,size,dur){ const m=new THREE.Mesh(GEO.ring,glowMat(color,0)); m.rotation.x=-Math.PI/2; m.userData.noOutline=true; lvFollow(m,.1); scene.add(m);
  FX.push({m,t:-delay,d:dur,kind:"lv",tick:(f,k)=>{ if(k<0){ f.m.visible=false; return; } f.m.visible=true; lvFollow(f.m,.1+k*5.5); const s=size*(1.25-k*.75); f.m.scale.set(s,s,s); f.m.material.opacity=.95*(k<.15?k/.15:1-(k-.15)/.85); }}); }
/* 나선으로 솟는 빛가루 */
function fxRiseDust(color,n,dur){ const geo=new THREE.BufferGeometry(); const p=new Float32Array(n*3); const a=[]; for(let i=0;i<n;i++) a.push({ang:Math.random()*6.28,r:rnd(.6,2.4),vy:rnd(3,9),sp:rnd(1.5,3.5)*(Math.random()<.5?-1:1),y:rnd(-.5,1)});
  geo.setAttribute("position",new THREE.BufferAttribute(p,3)); const m=new THREE.Points(geo,new THREE.PointsMaterial({color,size:.38,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending})); m.userData.noOutline=true; scene.add(m);
  FX.push({m,t:0,d:dur,kind:"lv",own:true,tick:(f,k,dt)=>{ const gy=P.gy||0; for(let i=0;i<n;i++){ const q=a[i]; q.y+=q.vy*dt; q.ang+=q.sp*dt; q.r*=1+dt*.25; p[i*3]=P.x+Math.cos(q.ang)*q.r; p[i*3+1]=gy+q.y; p[i*3+2]=P.z+Math.sin(q.ang)*q.r; } geo.attributes.position.needsUpdate=true; f.m.material.opacity=k<.6?1:(1-k)/.4; }}); }
/* 화면 쪽: 금빛 번쩍 + 큰 글씨 배너 */
function lvBanner(top,big,sub,css){ let b=$("lvup"); if(!b){ b=document.createElement("div"); b.id="lvup"; b.innerHTML='<div class="rays"></div><div class="top"></div><div class="big"></div><div class="sub"></div>'; document.body.appendChild(b); const g=document.createElement("div"); g.id="lvglow"; document.body.appendChild(g); }
  b.style.setProperty("--lc",css||"#ffd76a"); $("lvglow").style.setProperty("--lc",css||"#ffd76a");

  $("toast").classList.add("lvdn");

<script>
/* ================= 플레이어 ================= */

/* ================= 괴물 ================= */
const mobs=[]; const REG_STATE=REGIONS.map(()=>({bossT:rnd(20,60),boss:null}));
function mobStats(lv,boss){ const m=boss?7:1; return {mhp:Math.round((30+lv*17)*m),atk:(4+lv*2.2)*(boss?1.45:1),xp:Math.round((10+lv*7)*(boss?12:1)),gold:Math.round((4+lv*2)*(boss?15:1))}; }
function spawnMob(rg,boss,world){

  return m; }
function removeMob(m){ scene.remove(m.mesh); m.lbl.remove(); const i=mobs.indexOf(m); if(i>=0) mobs.splice(i,1); if(m.boss){ const s=REG_STATE[m.rg]; if(s.boss===m) s.boss=null; } }
function tickMobs(dt){
  // 지역별 스폰: 내가 근처에 있는 지역만
  REGIONS.forEach(rg=>{ const d=Math.hypot(P.x-rg.x,P.z-rg.z); const s=REG_STATE[rg.id]; if(d>rg.r+50) return; if(typeof warActive==="function"&&warActive()&&WAR.cur.rg===rg.id) return; const cnt=mobs.filter(m=>m.rg===rg.id&&!m.boss).length; const want=rg.cap?3:rg.center?7:5; if(cnt<want&&Math.random()<dt*.8) spawnMob(rg,false,false);
    if(!rg.cap&&!P.trial){ s.bossT-=dt; if(s.bossT<=0&&!s.boss&&d<rg.r+10){ spawnMob(rg,true,!!rg.center); s.bossT=rg.center?300:240; } } });
  const st=stat();
  for(let i=mobs.length-1;i>=0;i--){ const m=mobs[i]; if(m.war||m.titan||m.dg) continue; const dx=P.x-m.x, dz=P.z-m.z, d=Math.hypot(dx,dz);
    if(d>150){ removeMob(m); continue; }
    m.hit=Math.max(0,m.hit-dt); m.cd-=dt; m.t-=dt;
    const spd=(m.boss?3.4:m.shape==="wolf"?5.2:3.6)*(m.scale>1.5?1.1:1);
    const safe=inCapital(P.x,P.z); const shrineD=safe?Math.hypot(P.x-ALTARS[safe.id].shrine.x,P.z-ALTARS[safe.id].shrine.z):99;
    const aggro=!P.dead&&d<(m.boss?26:13)&&shrineD>18&&!(m.trial===false);
    if(m.trialOf&&!P.trial){ removeMob(m); continue; }
    if(aggro){ m.state="chase"; if(d>(m.boss?3.4:2.3)){ m.x+=dx/d*spd*dt; m.z+=dz/d*spd*dt; m.rot=Math.atan2(dx,dz); } else if(m.cd<=0){ m.cd=m.boss?1.6:1.3; hurtPlayer(m.atk*(1-dmgReduce(st.def)),m.n); m.mesh.userData.lunge=.25; if(m.mesh.userData.gl) animState(m.mesh,"attack"); } }
    else { if(m.t<=0){ m.t=rnd(1.5,4); m.state=Math.random()<.5?"idle":"wander"; m.wx=m.hx+rnd(-8,8); m.wz=m.hz+rnd(-8,8); } if(m.state==="wander"){ const wx=m.wx-m.x, wz=m.wz-m.z, wd=Math.hypot(wx,wz); if(wd>.5){ m.x+=wx/wd*1.6*dt; m.z+=wz/wd*1.6*dt; m.rot=Math.atan2(wx,wz); } } }
    const rg=REGIONS[m.rg]; const rd=Math.hypot(m.x-rg.x,m.z-rg.z); if(rd>rg.r+6){ m.x+= (rg.x-m.x)/rd*spd*dt; m.z+=(rg.z-m.z)/rd*spd*dt; }
    m.x=clamp(m.x,-WORLD_HALF+3,WORLD_HALF-3); m.z=clamp(m.z,-WORLD_HALF+3,WORLD_HALF-3);
    const tnow=performance.now(); m.mesh.position.set(m.x,hAt(m.x,m.z)+(m.mesh.userData.float?Math.sin(tnow/400+m.x)*.3+.2:0)+(m.mesh.userData.lunge>0?.4:0)+(m.state==="chase"?Math.abs(Math.sin(tnow/90+m.x))*.25:0),m.z); if(m.mesh.userData.lunge>0) m.mesh.userData.lunge-=dt; m.mesh.rotation.x=m.state==="chase"&&!m.mesh.userData.float?Math.sin(tnow/90+m.x)*.08:0; if(m.aura){ m.aura.rotation.z+=dt*2; m.aura.scale.setScalar(1+Math.sin(tnow/250)*.12); }
    let dr=m.rot-m.mesh.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; m.mesh.rotation.y+=dr*Math.min(1,dt*8);

    hitTint(m.mesh,m.hit/.15); const sc=m.scale*(m.hit>0?1.12:1); m.mesh.scale.set(sc*(1+Math.sin(tnow/600+m.x)*.02),sc*(1+Math.sin(tnow/600+m.x+1)*.03),sc);
    if(d<48){ const h=m.mesh.userData.h||4; placeLabel(m.lbl,m.x,h*m.scale,m.z,`${m.boss?"👑 ":""}${m.n} <b>Lv.${m.lv}${m.power?" · 파워 "+m.power:""}</b><span class="hp"><i style="width:${Math.round(m.hp/m.mhp*100)}%"></i></span>`); } else m.lbl.style.display="none";
  }
  const bb=$("bossbar"); const near=mobs.find(m=>m.boss&&Math.hypot(m.x-P.x,m.z-P.z)<40); if(near){ bb.hidden=false; $("bossNm").textContent=(near.trialOf?"승급 시험: ":"")+near.n; $("bossHp").style.width=Math.round(near.hp/near.mhp*100)+"%"; } else bb.hidden=true;
}
function damageMob(m,dmg,crit){ if(m.titan){ titanHit(m,dmg,crit); return; } if(m.hp<=0) return; dmg=Math.round(dmg); m.hp-=dmg; m.hit=.15; P.combat=4; floatDmg(m.x,3.5*m.scale,m.z,"-"+fmt(dmg),crit?"crit":""); fxSpark(m.x,1.8*m.scale,m.z,crit?0xffe08a:0xffffff,crit?16:8); tone(crit?660:440,.06,"square",0,.08);
  if(m.hp<=0){ killMob(m); } }
function killMob(m){ if(m.war&&typeof warOnKill==="function") warOnKill(m); const st=stat(); G.kills++; G.mk=G.mk||{}; G.mk[m.n]=(G.mk[m.n]||0)+1; const gap=lvGap(m.lv||G.lv); gainXp(Math.round(m.xp*gap)); G.gold+=Math.round(m.gold*(gap<1?.5+gap*.5:1)); try{ petOnKill(m); }catch(e){ console.warn(e); } fxFlash(m.x,2,m.z,0xffe08a,m.boss?6:2.2,.45); fxRing(m.x,m.z,0xffffff,m.boss?10:3);
  floatDmg(m.x,4,m.z,`+${m.gold} 금화`,"");
  // 드랍
  const rg=REGIONS[m.rg]; const roll=Math.random(); let tier=-1; if(m.boss){ tier=m.world?3:Math.min(3,Math.floor(rg.lv[1]/10)+1); if(Math.random()<.35) tier=Math.min(3,tier+1); } else if(roll<.06){ tier=Math.min(3,Math.floor(rg.lv[0]/8)); if(Math.random()<.15) tier=Math.min(3,tier+1); }
  if(tier>=0){ const s=pick(["w","a","r"]); G.bag.push({s,t:tier}); toast(`${RAR[tier].n} 아이템!`,itemName(s,tier),2.2); jingle([659,784,1046]); }
  if(Math.random()<(m.boss?1:.08)){ G.pots++; }
  if(m.boss){ G.bossKills++; toast(`${m.n} 처치!`,`경험치 +${m.xp} · 금화 +${m.gold}`,2.6); jingle([523,659,784,1046,1318]); buzz([40,30,80]); if(m.trialOf){ finishTrial(true); } }
  questEvent("kill",m); removeMob(m); saveGame(); }

/* ================= NPC 신들 ================= */
const NPC_SAY={"예수":["평화가 함께하길.","두려워 말라.","사랑으로 싸워라."],"가브리엘":["소식을 전하러 왔다.","하늘이 지켜보고 있다."],"라파엘":["상처는 내가 치유하마.","쉬어 가게."],"토르":["묠니르 맛을 보여주마!","스콜!","거인들이 또 왔군."],"프레이야":["용감한 자는 발할라로.","전쟁도 사랑도 내 것."],"헤임달":["다리를 지키는 중이다.","라그나로크는 아직 멀었다."],"하누만":["산도 들어 옮기지!","라마 만세!"],"가네샤":["장애물은 내가 치워주지.","달콤한 걸 좋아하나?"],"아그니":["불꽃이 길을 밝힌다.","제물을 바쳐라."],"아테나":["전략 없이 이길 수 없다.","지혜가 힘을 이긴다."],"아폴론":["태양이 떠오른다.","예언을 들어보겠나?"],"헤르메스":["빠른 게 최고지!","편지 배달 왔습니다~"]};
function tickNPCs(dt){ NPCS.forEach(o=>{ if(!o.lbl) o.lbl=makeLabel("boss"); const d=Math.hypot(o.x-P.x,o.z-P.z); if(d>80){ o.lbl.style.display="none"; return; } o.t-=dt; o.sayT-=dt;
    if(o.t<=0){ o.t=rnd(3,7); const a=rnd(0,6.283), r=rnd(6,24); o.tx=o.cap.x+Math.cos(a)*r; o.tz=o.cap.z+Math.sin(a)*r; }

    const dx=o.tx-o.x, dz=o.tz-o.z, L=Math.hypot(dx,dz); const moving=L>.6; if(moving){ o.x+=dx/L*2.2*dt; o.z+=dz/L*2.2*dt; o.walk+=dt*8; o.mesh.rotation.y=Math.atan2(dx,dz); } else if(d<6){ o.mesh.rotation.y=Math.atan2(P.x-o.x,P.z-o.z); }
    o.mesh.position.set(o.x,hAt(o.x,o.z),o.z); const u=o.mesh.userData, sw=moving?Math.sin(o.walk)*.6:0; if(u.gl){ animState(o.mesh,o.say>4.5?"cheer":moving?"walk":"idle"); if(u.crown) u.crown.rotation.y+=dt*2; } else { u.legL.rotation.x=sw; u.legR.rotation.x=-sw; u.armL.rotation.x=-sw; u.armR.rotation.x=sw; u.body.position.y=moving?Math.abs(Math.sin(o.walk))*.1:Math.sin(performance.now()/600)*.03; if(u.wings) u.wings.forEach(w=>{ w.rotation.y=w.userData.s*Math.sin(performance.now()/500)*.15; }); if(u.cape) u.cape.rotation.x=.15+(moving?.4:0); if(u.crown){ u.crown.rotation.y+=dt*2; } }
    placeLabel(o.lbl,o.x,5.6,o.z,`${o.say>0?`<span class="bub">${o.msg}</span>`:""}${o.n} <b>${REALMS[REGIONS.find(r=>r===o.cap).realm].n}의 신 · 파워 ${o.p}</b>`); }); }

/* ================= 전투 ================= */
function facingHit(x,z,r,ang){ const dx=x-P.x, dz=z-P.z, d=Math.hypot(dx,dz); if(d>r) return false; if(d<1.2) return true; let a=Math.atan2(dx,dz)-P.rot; while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return Math.abs(a)<ang; }
/* 붙어 있는 적을 향해 자동으로 몸을 돌림 (v12) — 공격·기술 누를 때 */
function autoFace(range){ range=range||6; let best=null,bd=1e9; mobs.forEach(m=>{ if(m.hp<=0) return; const d=Math.hypot(m.x-P.x,m.z-P.z)-(m.scale>1.5?1.5:0); if(d<range&&d<bd){ bd=d; best=m; } });
  for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; const d=Math.hypot(o.x-P.x,o.z-P.z); if(d<range&&d<bd){ bd=d; best=o; } }
  if(!best) return false; P.rot=Math.atan2(best.x-P.x,best.z-P.z); if(player) player.rotation.y=P.rot; return true; }
function attack(){ if(P.dead||P.atkCd>0||layerOpen) return; const wk=(typeof myWeaponKind==="function")?myWeaponKind():"sword"; if(wk==="bow"||wk==="magic"){ rangedAttack(wk); return; } const reach=wk==="spear"?4.8:wk==="hammer"?3.8:3.4; autoFace(wk==="spear"?7:6); P.atkCd=.28; P.atkAnim=.25; P.combat=4; if(player.userData.gl) animState(player,"attack"); const st=stat(); let any=false; fxArc(P.x,P.z,P.rot,RM().c1);
  mobs.forEach(m=>{ if(facingHit(m.x,m.z,reach+(m.titan?6.5:m.scale>1.5?1.5:0),wk==="spear"?.7:1.0)){ const crit=Math.random()<st.crit; damageMob(m,st.atk*rnd(.9,1.1)*(crit?1.8:1),crit); any=true; } });
  for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead) continue; if(inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; if(facingHit(o.x,o.z,reach,1.0)){ const crit=Math.random()<st.crit; const dmg=Math.round(st.atk*rnd(.9,1.1)*(crit?1.8:1)*.55); net.send({t:"hit",to:id,d:dmg}); floatDmg(o.x,4,o.z,"-"+fmt(dmg),crit?"crit":""); any=true; } }
  if(any){ tone(220,.05,"square",0,.1); buzz(15); P.shake=Math.max(P.shake||0,.25); } else tone(180,.04,"triangle",0,.05);

function drama(color,amt,dur){ P.tintC=new THREE.Color(color); P.tintA=amt; P.tintD=dur||1.2; }

<script>

   - 시작 20초 전에 알림 → 합류하면 공격대/수비대로 전장 순간이동. 전투 2분 30초.
   - 점수 = 기본 군세(정해진 값) + 참전한 플레이어들의 활약(병사 처치 3점, 대장 10점, 실시간 공유).
   - 공격 승리: 그 땅이 공격 세계로. 수비 승리: 공격 세계의 가장 가까운 땅 하나를 반격으로 빼앗음.
   - 합류하면 처치 보상 2배 + 끝나고 활약 보너스(이기면 2배).
   - 앱을 안 켠 동안 벌어진 전쟁은 기본 군세로만 결과를 계산해 나중에 반영(최대 6시간). */
const WARCFG={slot:360,notice:40,start:60,dur:150,chance:62};
const WAR={cur:null,units:[],contrib:{},my:0,joined:false,side:null,spawnT:0,sendT:0,announced:false,wave:0};
function hh(a,b){ let h=2166136261>>>0; const s=ROOM+":"+a+":"+b; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
function warSlotNow(){ return Math.floor(Date.now()/1000/WARCFG.slot); }
function warEvent(slot){ if(hh(slot,"on")%100>=WARCFG.chance) return null;
  const cands=REGIONS.filter(r=>!r.cap&&!r.center); const rg=cands[hh(slot,"rg")%cands.length]; const def=W.o[rg.id];
  const atts=[0,1,2,3].filter(r=>r!==def).sort((a,b)=>Math.hypot(REGIONS[a*3].x-rg.x,REGIONS[a*3].z-rg.z)-Math.hypot(REGIONS[b*3].x-rg.x,REGIONS[b*3].z-rg.z));
  const k=hh(slot,"att")%6; const att=atts[k<3?0:k<5?1:Math.min(2,atts.length-1)];
  const t0=slot*WARCFG.slot*1000; return {slot,rg:rg.id,att,def,notice:t0+WARCFG.notice*1000,start:t0+WARCFG.start*1000,end:t0+(WARCFG.start+WARCFG.dur)*1000,baseAtt:30+hh(slot,"a")%40,baseDef:30+hh(slot,"d")%40+(def>=0?6:0),resolved:false}; }
function warApply(ev,a,d,ts){ const rg=REGIONS[ev.rg]; let msg;
  if(a>d){ W.o[ev.rg]=ev.att; W.ts[ev.rg]=ts; msg=`${REALMS[ev.att].n} 침공 성공! ${rg.n}이(가) ${REALMS[ev.att].n} 땅이 됐어요`; }
  else if(ev.def>=0){ let best=null,bd=1e9; REGIONS.forEach(r=>{ if(r.cap||r.center||W.o[r.id]!==ev.att) return; const dd=Math.hypot(r.x-rg.x,r.z-rg.z); if(dd<bd){ bd=dd; best=r; } });

<script>
/* ================= MMO (v11) =================
   1) 자리 비움 성장: 앱을 끈 동안(최대 24시간) 캐릭터가 자기 세계 사냥터에서 혼자 수련 → 다시 열면 보고서.

      지금쯤 레벨(같은 계산식)으로 표시. 공격은 안 됨.
*/
const IDLE_MAX_H=24, IDLE_KPM=0.4, IDLE_EFF=0.5;          // 최대 시간 · 분당 처치 수 · 보상 비율
function idleRegion(lv,realm){ const own=[realm*3,realm*3+1,realm*3+2].map(i=>REGIONS[i]); const list=own.concat([REGIONS[12]]); let best=list[0]; list.forEach(r=>{ if(r.lv[0]<=lv) best=r; }); return best; }
function idleCap(rank){ return rank>=RANK_LV.length-1?60:Math.min(60,RANK_LV[rank+1]+6); }
// 같은 입력이면 어느 폰에서 계산해도 같은 결과(친구 화면의 "지금쯤 레벨"도 이걸로 계산)
function idleSim(lv,xp,realm,rank,ms){ const mins=Math.min(IDLE_MAX_H*60,Math.max(0,ms/60000)); const cap=idleCap(rank); let kills=0,gold=0,gxp=0,left=mins; const lv0=lv;
  while(left>0){ const step=Math.min(10,left); left-=step; const rg=idleRegion(lv,realm); const L=clamp(lv,rg.lv[0],rg.lv[1]); const k=step*IDLE_KPM; const ex=(10+L*7)*IDLE_EFF*k, gd=(4+L*2)*IDLE_EFF*k; kills+=k; gold+=gd;
    if(lv<cap){ xp+=ex; gxp+=ex; while(lv<cap&&xp>=xpNeed(lv)){ xp-=xpNeed(lv); lv++; } if(lv>=cap) xp=Math.min(xp,xpNeed(lv)-1); } }
  return {lv,xp:Math.round(xp),kills:Math.floor(kills),gold:Math.round(gold),gxp:Math.round(gxp),mins:Math.round(mins),capped:lv>=cap,rg:idleRegion(lv,realm)}; }
let lastIdle=null;
function grantIdle(){ if(G.realm<0||!G.t) return null; const ms=Date.now()-G.t; if(ms<2*60000) return null;
  const r=idleSim(G.lv,G.xp,G.realm,G.rank,ms); const lv0=G.lv; G.lv=r.lv; G.xp=r.xp; G.gold+=r.gold; G.kills+=r.kills;
  const pots=Math.min(6,Math.floor(r.kills/40)); G.pots+=pots; let items=[]; const tries=Math.min(12,Math.floor(r.kills/25)); for(let i=0;i<tries;i++){ if(Math.random()<.12){ const t=Math.min(3,Math.floor(r.rg.lv[0]/8)); const s=pick(["w","a","r"]); G.bag.push({s,t}); items.push(itemName(s,t)); } }
  let pet=null,titan=null; try{ pet=petIdle(r); }catch(e){} try{ titan=titanIdle(Object.assign({},r,{away:ms})); }catch(e){}
  G.idleTot=(G.idleTot||0)+r.mins; saveGame(); lastIdle=Object.assign({lv0,pots,items,away:ms,pet,titan},r); return lastIdle; }
function fmtDur(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h>0?`${h}시간${m?" "+m+"분":""}`:`${m}분`; }
function showIdleReport(r){ if(!r) return; const lvUp=r.lv-r.lv0;
  card(`<h2>💤 쉬는 동안 수련 보고서</h2><p>${fmtDur(r.away/60000)} 동안 쉬는 사이 <b style="color:var(--gold)">${r.rg.n}</b>에서 혼자 사냥했어요${r.away/60000>IDLE_MAX_H*60?` (최대 ${IDLE_MAX_H}시간까지만 쳐 줘요)`:""}.</p>
  <div class="idlegrid"><div><b>${fmt(r.kills)}</b><span>괴물 처치</span></div><div><b>+${fmt(r.gxp)}</b><span>경험치</span></div><div><b>+${fmt(r.gold)}</b><span>금화</span></div><div><b>${lvUp>0?`Lv.${r.lv0} → ${r.lv}`:`Lv.${r.lv}`}</b><span>${lvUp>0?`레벨 +${lvUp}!`:"레벨"}</span></div></div>
  ${r.pots?`<p>물약 +${r.pots}개</p>`:""}${r.items.length?`<p>주운 아이템: ${r.items.join(", ")} (가방에 넣어 뒀어요)</p>`:""}
  ${r.pet?`<p>🐣 ${r.pet.n}도 같이 수련했어요${r.pet.lv>r.pet.lv0?` · Lv.${r.pet.lv0} → ${r.pet.lv}`:""}</p>`:""}${r.titan?`<p>🌋 ${r.titan.n}에게 쉬는 동안 <b style="color:var(--gold)">${fmt(r.titan.d)}</b> 데미지를 보탰어요</p>`:""}
  ${r.capped?`<p style="color:#ffcf4a">Lv.${idleCap(G.rank)}에서 멈췄어요. 성전에서 <b>승급 시험</b>을 통과해야 자는 동안에도 더 자라요.</p>`:""}

/* ---------- 모험가 명부 · 쉬는 친구 캐릭터 ---------- */
const ROSTER=(function(){ try{ return JSON.parse(load("gw-roster")||"{}")||{}; }catch(e){ return {}; } })();
const GHOSTS={};
function myProfile(on){ return {i:G.id,n:G.name,r:G.realm,k:G.rank,l:G.lv,x:Math.round(G.xp),lk:(()=>{ const l=G.look||{}; return [l.face||0,l.body||0,l.hat||0,l.cape||0,l.weapon||0,l.tint||0]; })(),e:[G.eq.w,G.eq.a,G.eq.r],t:Date.now(),on:on?1:0,kills:G.kills,tt:G.title||"",pt:(typeof petArr==="function"?petArr():null)}; }
function mmoProfile(d){ if(!d||!d.i||d.i===G.id||d.r==null||d.r<0||!REALMS[d.r]) return; const old=ROSTER[d.i]; if(old&&old.t>d.t) return; ROSTER[d.i]=d; save("gw-roster",JSON.stringify(ROSTER)); }
function isAway(p){ return !PEERS[p.i]&&(p.on===0||Date.now()-p.t>3*60000); }
function projected(p){ return idleSim(p.l,p.x||0,p.r,p.k,isAway(p)?Date.now()-p.t:0); }
function ghostLook(a){ a=a||[0,0,0,0,0,0]; return {face:a[0]||0,body:a[1]||0,hat:a[2]||0,cape:a[3]||0,weapon:a[4]||0,tint:a[5]||0}; }
function ghostEq(p){ const e=p.e||[-1,-1,-1]; return {w:e[0],a:e[1],r:e[2]}; }
function makeGhost(p){ const lk=ghostLook(p.lk); const mesh=(typeof avatarGL==="function"&&avatarGL(p.r,p.k,lk,undefined,ghostEq(p)))||makeAvatar(p.r,p.k,false,lk); scene.add(mesh); return mesh; }
function dropGhost(id){ const g=GHOSTS[id]; if(!g) return; scene.remove(g.mesh); g.lbl.remove(); delete GHOSTS[id]; }
let ghostT=0;
function tickGhosts(dt){ if(!started) return; ghostT-=dt;
  if(ghostT<=0){ ghostT=2; let n=0;
    for(const id in ROSTER){ const p=ROSTER[id]; const away=isAway(p); const pr=away?projected(p):null; const rg=pr?pr.rg:null; const near=rg&&Math.hypot(rg.x-P.x,rg.z-P.z)<rg.r+110;
      if(!away||!near||n>=10||Date.now()-p.t>14*86400000){ dropGhost(id); continue; } n++;
      let g=GHOSTS[id]; if(!g){ const a=Math.random()*6.283, r=rnd(6,rg.r*.6); g=GHOSTS[id]={id,mesh:makeGhost(p),lbl:makeLabel("ally"),x:rg.x+Math.cos(a)*r,z:rg.z+Math.sin(a)*r,tx:0,tz:0,t:0,walk:0,act:0,rg:rg.id}; g.tx=g.x; g.tz=g.z; }
      if(g.rg!==rg.id){ g.rg=rg.id; g.x=rg.x; g.z=rg.z; g.tx=g.x; g.tz=g.z; }
      if(!g.mesh.userData.glAvatar&&typeof avatarGL==="function"){ const m2=avatarGL(p.r,p.k,ghostLook(p.lk),undefined,ghostEq(p)); if(m2){ scene.remove(g.mesh); g.mesh=m2; scene.add(m2); } }
      g.p=p; g.pr=pr; } }
  for(const id in GHOSTS){ const g=GHOSTS[id]; const rg=REGIONS[g.rg]; g.t-=dt; g.act=Math.max(0,g.act-dt);
    if(g.t<=0){ g.t=rnd(2,5); const m=mobs.find(m=>!m.war&&m.rg===g.rg&&Math.hypot(m.x-g.x,m.z-g.z)<16); if(m&&Math.random()<.6){ g.tx=m.x+rnd(-1.5,1.5); g.tz=m.z+rnd(-1.5,1.5); g.fight=m; } else { const a=rnd(0,6.283), r=rnd(4,rg.r*.65); g.tx=rg.x+Math.cos(a)*r; g.tz=rg.z+Math.sin(a)*r; g.fight=null; } }
    const dx=g.tx-g.x, dz=g.tz-g.z, L=Math.hypot(dx,dz); const moving=L>1;
    if(moving){ g.x+=dx/L*4*dt; g.z+=dz/L*4*dt; g.walk+=dt*10; g.mesh.rotation.y=Math.atan2(dx,dz); }
    else if(g.fight&&mobs.indexOf(g.fight)>=0){ g.mesh.rotation.y=Math.atan2(g.fight.x-g.x,g.fight.z-g.z); if(g.act<=0){ g.act=.9; if(Math.hypot(g.x-P.x,g.z-P.z)<50) fxSpark(g.fight.x,1.6,g.fight.z,0xffffff,5); } }
    g.mesh.position.set(g.x,hAt(g.x,g.z),g.z); const u=g.mesh.userData;
    if(u.gl) animState(g.mesh,g.act>.6?"attack":moving?"run":"idle"); else if(u.legL){ const sw=moving?Math.sin(g.walk)*.7:0; u.legL.rotation.x=sw; u.legR.rotation.x=-sw; u.armL.rotation.x=-sw; u.armR.rotation.x=g.act>.6?-2.2:sw; }
    if(Math.hypot(g.x-P.x,g.z-P.z)<55){ const p=g.p, pr=g.pr; placeLabel(g.lbl,g.x,4.6,g.z,`${p.tt&&typeof titleHtml==="function"?titleHtml(p.tt):""}💤 ${p.n} <b>${REALMS[p.r].n} · ${REALMS[p.r].ranks[p.k]} Lv.${pr?pr.lv:p.l}</b><span class="away">쉬는 중 · 혼자 수련 ${fmtDur((Date.now()-p.t)/60000)}째</span>`); } else g.lbl.style.display="none"; } }
function showRoster(){ const me=`<div class="row"><div class="ic" style="color:${REALMS[G.realm].c1}">${REALMS[G.realm].icon}</div><div class="t"><div>${G.name} (나) <i class="st on">접속 중</i></div><span>${REALMS[G.realm].n} · ${REALMS[G.realm].ranks[G.rank]} Lv.${G.lv} · ${(regionAt(P.x,P.z)||{n:"황야"}).n}</span></div></div>`;

<script>
/* ================= v14: 재미 3종 (IDEAS G11/2-1·2·3) =================
   1) 🐣 신수 알과 짝꿍 신수: 괴물을 잡으면 가끔 알 → 실제 시간 20분 뒤 부화(게임을 꺼 둬도 자람).
      신수는 따라다니며 같이 싸우고, 금화 보너스. 쉬는 동안 수련한 만큼 신수도 자람. 친구 화면에도 보임(pt).
   2) 🤝 합체 기술: 같은 세계 친구 둘이 8걸음 안에서 3초 안에 기술을 하나씩 쓰면 합체 기술(세계마다 6가지) + 도감.
   3) 🌋 주간 거대 보스: 매주 월요일 0시(한국 시간)에 세계의 중심에 거대 보스. 체력 하나를 모두 함께 깎음
      (각자 준 데미지를 중계 서버에 보관 → 다 더함). 쉬는 동안 수련도 데미지로 보탬. 쓰러뜨리면 모두 신화 상자, 1등은 용사. */

/* ---------- 1. 신수 ---------- */
const PETS=[
 {n:"아기 그리핀",kind:"griffin",c:0xffd95e,c2:0xfff3c4,egg:"황금빛 알"},
 {n:"아기 슬레이프니르",kind:"horse8",c:0xb8c6d8,c2:0x5a6a86,egg:"서리 무늬 알"},
 {n:"아기 가루다",kind:"bird",c:0xff9a3d,c2:0xffd24a,egg:"불꽃 무늬 알"},
 {n:"아기 페가수스",kind:"pegasus",c:0xffffff,c2:0x9fd4ff,egg:"구름 무늬 알"} ];
const EGG_MS=20*60000, PET_MAX=20;
function petNeed(lv){ return 12*lv; }
function petData(){ G.pets=G.pets||{}; if(G.pet==null) G.pet=-1; return G.pets; }
function petBonus(){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; return p?p.lv*2:0; }   // 금화 +%
function petArr(){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; return p?[G.pet,p.lv]:null; }
function petGain(n){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; if(!p||p.lv>=PET_MAX) return 0; p.xp=(p.xp||0)+n; let up=0; while(p.lv<PET_MAX&&p.xp>=petNeed(p.lv)){ p.xp-=petNeed(p.lv); p.lv++; up++; } if(p.lv>=PET_MAX) p.xp=0; if(up&&PETMESH.me){ rebuildMyPet(); } return up; }
function petOnKill(m){ petData(); const b=petBonus(); if(b>0){ const extra=Math.max(1,Math.round(m.gold*b/100)); G.gold+=extra; }
  const up=petGain(m.boss?6:1); if(up){ const p=G.pets[G.pet]; toast(`${PETS[G.pet].n} Lv.${p.lv}!`,`금화 보너스 +${p.lv*2}%`,2); jingle([784,988,1175]); }
  if(!G.egg&&!m.war&&!m.titan){ const first=!G.eggEver; const ch=first?1:m.boss?.3:.02; if(Math.random()<ch){ const rg=REGIONS[m.rg]; const r=rg&&rg.realm>=0?rg.realm:rint(0,3); G.egg={r,t0:Date.now()}; G.eggEver=1;
      toast(`🥚 ${PETS[r].egg}을(를) 주웠어요!`,"20분 뒤에 깨어나요 · 게임을 꺼 둬도 자라요",3.2); jingle([659,880,1046,1318]); fxRing(m.x,m.z,PETS[r].c,6,.8); } } }
function eggLeft(){ return G.egg?Math.max(0,G.egg.t0+EGG_MS-Date.now()):0; }
let eggCheckT=0;
function tickEgg(dt){ eggCheckT-=dt; if(eggCheckT>0) return; eggCheckT=2; if(!G.egg||eggLeft()>0||layerOpen||P.dead) return; hatchEgg(); }
function hatchEgg(){ petData(); const r=G.egg.r; G.egg=null; const had=G.pets[r]; let msg;
  if(had){ had.lv=Math.min(PET_MAX,had.lv+2); had.xp=0; msg=`이미 있는 ${PETS[r].n}의 형제 알이었어요! ${PETS[r].n} 레벨 +2 (Lv.${had.lv})`; }
  else { G.pets[r]={lv:1,xp:0,t:Date.now()}; msg=`새 친구 <b style="color:var(--gold)">${PETS[r].n}</b>! 이제 나를 따라다니며 같이 싸워요.`; }
  if(!had||G.pet<0) G.pet=r; saveGame(); rebuildMyPet(); try{ net.hello(); net.pushProfile(1); }catch(e){}
  card(`<h2>🐣 알이 깨어났어요!</h2><canvas id="petPrev" width="260" height="200" style="width:200px;height:154px;align-self:center"></canvas><p>${msg}</p><p style="font-size:13px">신수는 괴물을 같이 공격하고, 금화를 더 주워 줘요(레벨×2%). 내가 쉬는 동안 수련하면 신수도 같이 자라요.</p><button class="buy" id="petOk" style="align-self:center">좋아요!</button>`);
  $("petOk").onclick=closeLayer; drawPetPreview($("petPrev"),r); jingle([523,659,784,1046,1318,1568]); fxRing(P.x,P.z,PETS[r].c,10,1); fxSpark(P.x,2,P.z,PETS[r].c,50); buzz([40,30,40]); }
function petIdle(r){ petData(); const n=Math.floor(r.kills||0); if(!n) return null; const p=G.pet>=0&&!expPetAway(G.pet)&&G.pets[G.pet]; if(!p) return null; const lv0=p.lv; petGain(n); return {n:PETS[G.pet].n,lv0,lv:p.lv}; }

// 신수 모델(코드로 만든 귀여운 아기 동물)
function makePet(r,lv){ const D=PETS[r]; const g=new THREE.Group(); const body=new THREE.Group(); g.add(body);
  const m=mat({color:D.c,roughness:.55}), m2=mat({color:D.c2,roughness:.55}), eye=mat({color:0x111111,roughness:.25}), wh=mat({color:0xffffff,emissive:0xffffff,emissiveIntensity:.8}), gold=mat({color:0xffc83a,metalness:.4,roughness:.35});

function titanIdle(r){ titanRoll(); if(TB.claimed||titanLeft()<=0||!r||!r.kills) return null; const now=Date.now(), ws=titanWeekStart(TB.w); const away=r.away||1; const frac=clamp((now-Math.max(now-away,ws))/away,0,1); const d=Math.round(r.kills*frac*(40+r.lv*20)); if(d<=0) return null; TB.mine+=d; TB.dirty=true; titanSave(); if(titanLeft()<=0) setTimeout(()=>{ if(!layerOpen) titanDefeated(); else TB.pending=1; },4000); return {d,n:"거대 "+titanDef(TB.w).n}; }
function tickTitan(dt){ if(!started) return; titanRoll(); const dead=titanLeft()<=0; if(dead&&!TB.claimed&&!layerOpen) titanDefeated();
  const near=Math.hypot(P.x-TITAN_POS.x,P.z-TITAN_POS.z);
  if(!dead&&!TB.claimed&&near<120&&!TITAN.m) titanSpawn(); if((dead||near>140)&&TITAN.m) titanRemove();
  TITAN.sendT-=dt; if(TITAN.sendT<=0){ TITAN.sendT=5; titanPush(); }
  const m=TITAN.m; if(m){ m.hp=titanLeft(); m.hit=Math.max(0,m.hit-dt); const tn=performance.now(); const d=Math.hypot(P.x-TITAN_POS.x,P.z-TITAN_POS.z);
    // 몸이 아주 커서: 맞는 점(m.x,m.z)을 내 쪽 몸 가장자리(6.5걸음)에 둠 → 공격·기술 거리 계산이 그대로 맞음
    const k=Math.min(d,6.5)/(d||1); m.x=TITAN_POS.x+(P.x-TITAN_POS.x)*k; m.z=TITAN_POS.z+(P.z-TITAN_POS.z)*k;
    if(d<40&&!P.dead){ m.rot=Math.atan2(P.x-TITAN_POS.x,P.z-TITAN_POS.z); } let dr=m.rot-m.mesh.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; m.mesh.rotation.y+=dr*Math.min(1,dt*2);
    m.mesh.position.set(TITAN_POS.x,hAt(TITAN_POS.x,TITAN_POS.z)+(m.mesh.userData.float?Math.sin(tn/600)*.5+.5:0),m.z); if(m.aura){ m.aura.rotation.z+=dt; m.aura.scale.setScalar(1+Math.sin(tn/300)*.1); }
    if(m.mesh.userData.gl) animState(m.mesh,TITAN.warnT>0?"attack":m.hit>0?"hit":"idle");
    hitTint(m.mesh,m.hit/.15); m.mesh.scale.setScalar(m.scale*(m.hit>0?1.04:1));
    // 쿵! 발 구르기: 1초 전에 빨간 고리로 미리 알려 줌 → 멀리 피하면 안 맞음
    TITAN.stompT-=dt; if(d<26&&!P.dead){ if(TITAN.stompT<=0&&TITAN.warnT<=0){ TITAN.warnT=1.1; fxRing(TITAN_POS.x,TITAN_POS.z,0xff4040,26,1.1); tone(70,.5,"sawtooth",0,.12); }
      if(TITAN.warnT>0){ TITAN.warnT-=dt; if(TITAN.warnT<=0){ TITAN.stompT=rnd(3.5,5); fxRing(TITAN_POS.x,TITAN_POS.z,0xffb070,30,.6); fxSpark(TITAN_POS.x,1,TITAN_POS.z,0xcfc4ac,40); P.shake=Math.max(P.shake||0,.8); thud();
        if(Math.hypot(P.x-TITAN_POS.x,P.z-TITAN_POS.z)<13) hurtPlayer(mobStats(G.lv,false).atk*1.6*(1-dmgReduce(stat().def)),m.n); } } }
    if(d<70) placeLabel(m.lbl,TITAN_POS.x,(m.mesh.userData.h||4)*m.scale*.75,TITAN_POS.z,`🌋 ${m.n} <b>모두의 거대 보스 · 남은 체력 ${fmt(titanLeft())}</b><span class="hp"><i style="width:${Math.round(titanLeft()/TITAN_HP*100)}%"></i></span>`); else m.lbl.style.display="none"; }
  const pill=$("titanPill"); if(pill){ const pct=Math.round(titanLeft()/TITAN_HP*100); const txt=TB.claimed||dead?"🌋 🏆 이번 주 승리":`🌋 ${titanDef(TB.w).n} ${pct}%`; if(pill._t!==txt){ pill._t=txt; pill.textContent=txt; } } }
function titanGo(){ if(mobs.some(m=>!m.titan&&m.state==="chase"&&Math.hypot(m.x-P.x,m.z-P.z)<16)){ toast("전투 중에는 안 돼요"); return; } P.x=TITAN_POS.x+rnd(-3,3); P.z=TITAN_POS.z+30; P.invul=2; closeLayer(); toast("거대 보스 앞에 왔어요!","빨간 고리가 보이면 멀리 피해요",2.6); }
function showTitan(){ titanRoll(); const D=titanDef(TB.w); const left=titanLeft(), pct=Math.round(left/TITAN_HP*100); const end=titanWeekStart(TB.w+1); const hrs=Math.max(0,(end-Date.now())/3600000);
  const rank=titanRank().map((x,k)=>`<div class="row"><div class="ic" style="color:${REALMS[x.r]?REALMS[x.r].c1:"#fff"}">${k===0&&x.d>0?"🏅":k+1}</div><div class="t"><div>${x.n}${x.me?" (나)":""}</div><span>${fmt(Math.round(x.d))} 데미지</span></div></div>`).join("");
  const done=TB.claimed||left<=0;
  card(`<h2>🌋 이번 주 거대 보스</h2><p><b style="color:var(--gold)">거대 ${D.n}</b> · ${done?"쓰러뜨렸어요! 다음 주 월요일에 새 보스가 깨어나요":`남은 체력 ${fmt(left)} / ${fmt(TITAN_HP)} (${pct}%) · 남은 시간 ${hrs>=24?Math.floor(hrs/24)+"일 ":""}${Math.floor(hrs%24)}시간`}</p>
   <div class="bar" style="height:14px;border:2px solid #ffcf4a;border-radius:8px;overflow:hidden;background:#000"><i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#b01030,#ff3d4a)"></i></div>
   <p style="font-size:13px">세계의 중심에 사는 아주 큰 보스예요. 체력은 <b>모든 친구가 함께</b> 깎아요. 게임을 꺼 둔 동안 수련한 것도 데미지로 보태져요.<br>쓰러뜨리면 모두에게 신화 상자(금화·경험치·장비·물약), 가장 많이 때린 사람은 <b>🏅 용사</b>(보상 2배).</p>
   <h3>데미지 순위</h3>${rank}${done?"":`<button class="go" id="tGo" style="align-self:center;font-size:18px;padding:10px 22px">보스에게 가기</button>`}`);
  if($("tGo")) $("tGo").onclick=titanGo; }
</script>
<script>
/* ================= v15: 날아가는 무기(화살·창·도끼·망치·마법탄) =================
   - 공용 투사체 PROJ: 포물선/직선으로 날아가 맞으면 데미지. 화살은 땅에 잠깐 꽂혀 있음.
   - 내 무기 종류(weaponKindOf): 활 → 기본 공격이 화살(16걸음), 지팡이·마법봉 → 마법탄(14걸음), 창 → 찌르기 거리 김.
   - 「던지기」 버튼(키 O): 무기마다 다름 — 창 던지기 · 손도끼 · 돌아오는 망치(번개) · 단검 3개 부채꼴 · 화살비 · 큰 불덩이.
   - 전쟁 병사(궁수·창병)도 같은 투사체를 씀(04b-war.js). */
const PROJ=[];
const PMAT={ wood:mat({color:0x8a5a30,roughness:.8}), iron:mat({color:0xc9ced8,metalness:.8,roughness:.3}), feather:mat({color:0xf4f0e6,roughness:.9}), red:mat({color:0xd83a3a,roughness:.8}), gold:mat({color:0xffd05a,metalness:.6,roughness:.3}) };
function weaponKindOf(w){ w=String(w||""); if(/bow/i.test(w)) return "bow"; if(/Spear|trident/i.test(w)) return "spear"; if(/staff|Staff|wand|Wand/.test(w)) return "magic"; if(/hammer|Wrench/i.test(w)) return "hammer"; if(/axe/i.test(w)) return "axe"; if(/dagger/i.test(w)) return "dagger"; return w?"sword":"fist"; }
function myWeaponKind(){ try{ const s=lookSpec(G.realm,G.rank,G.look||{},G.eq); return weaponKindOf(s.weapon); }catch(e){ return "sword"; } }
const THROW={ spear:{n:"창 던지기",cd:3,mult:2.6,r:2.2,speed:34,arc:.5,kind:"javelin"}, axe:{n:"손도끼",cd:2.5,mult:2.2,r:2,speed:26,arc:.35,kind:"axe"}, hammer:{n:"돌아오는 망치",cd:4,mult:2.4,r:3.5,speed:28,arc:.15,kind:"hammer",back:1,zap:1},
  dagger:{n:"단검 부채",cd:3,mult:1.25,r:1.6,speed:32,arc:.1,kind:"dagger",fan:3}, sword:{n:"단검 부채",cd:3,mult:1.25,r:1.6,speed:32,arc:.1,kind:"dagger",fan:3}, fist:{n:"돌 던지기",cd:2.5,mult:1.4,r:1.6,speed:26,arc:.5,kind:"rock"},
  bow:{n:"화살비",cd:5,mult:1.1,r:2,speed:30,arc:1,kind:"arrow",rain:6}, magic:{n:"큰 불덩이",cd:4,mult:2.7,r:4.2,speed:20,arc:.25,kind:"orb",big:1} };
function makeProjMesh(kind,color){ const g=new THREE.Group(); const inner=new THREE.Group(); g.add(inner);
  if(kind==="arrow"||kind==="javelin"){ const L=kind==="javelin"?2.6:1.5, r=kind==="javelin"?.06:.035; const sh=cyl(r,r,L,PMAT.wood,0,0,0,6); sh.rotation.x=Math.PI/2; inner.add(sh); const hd=new THREE.Mesh(GEO.cone,PMAT.iron); hd.scale.set(r*4,kind==="javelin"?.45:.3,r*4); hd.rotation.x=Math.PI/2; hd.position.z=L/2+.12; inner.add(hd);
    if(kind==="arrow"){ [-1,1].forEach(s=>{ const f=box(.02,.16,.32,color!=null?mat({color}):PMAT.feather,s*.06,0,-L/2+.15); inner.add(f); const f2=box(.16,.02,.32,color!=null?mat({color}):PMAT.feather,0,s*.06,-L/2+.15); inner.add(f2); }); } }
  else if(kind==="axe"){ inner.add(cyl(.04,.05,.9,PMAT.wood,0,0,0,6)); const b=box(.5,.36,.06,PMAT.iron,.2,.32,0); inner.add(b); inner.userData.spin=1; }
  else if(kind==="hammer"){ inner.add(cyl(.05,.06,.9,PMAT.wood,0,0,0,6)); inner.add(box(.7,.42,.42,mat({color:0xb8c6e0,metalness:.8,roughness:.25,emissive:0x2a58ff,emissiveIntensity:.35}),0,.5,0)); inner.add(sph(.55,glowMat(0x7ab8ff,.45),0,.4,0)); inner.userData.spin=1; }
  else if(kind==="dagger"){ inner.add(box(.05,.05,.32,PMAT.gold,0,0,-.2)); const bl=box(.12,.03,.62,PMAT.iron,0,0,.25); inner.add(bl); }
  else if(kind==="rock"){ inner.add(sph(.28,mat({color:0x8a8478,roughness:1}),0,0,0)); inner.userData.spin=1; }
  else { const c=color!=null?color:0xff8a3d; inner.add(sph(.45,mat({color:0xffffff,emissive:c,emissiveIntensity:2}),0,0,0)); inner.add(sph(.85,glowMat(c,.55),0,0,0)); g.userData.glow=c; }
  g.userData.inner=inner; return g; }
/* o: {x,y,z, tx,tz, ty?, kind, speed, arc, dmg, crit, r, hits:"mobs"|"player"|"units", side, target, color, back, zap, cosmetic, owner} */
function fireProj(o){ const mesh=makeProjMesh(o.kind,o.color); const y0=(o.y!=null?o.y:2)+hAt(o.x,o.z); const ty=(o.ty!=null?o.ty:1.2)+hAt(o.tx,o.tz); const d=Math.max(.5,Math.hypot(o.tx-o.x,o.tz-o.z)); const T=Math.max(.12,d/(o.speed||28)); const g=28*(o.arc||0);
  const p=Object.assign({},o,{mesh,t:0,T,vx:(o.tx-o.x)/T,vz:(o.tz-o.z)/T,vy:(ty-y0+.5*g*T*T)/T,g,y:y0,px:o.x,pz:o.z,stuck:0}); mesh.position.set(o.x,y0,o.z); scene.add(mesh); PROJ.push(p); return p; }
function projImpact(p){ const ix=p.mesh.position.x, iz=p.mesh.position.z; const R=p.r||1.5; let hitAny=false;
  if(p.cosmetic){ fxSpark(ix,.6,iz,p.mesh.userData.glow||0xcfc4ac,6); return false; }
  if(p.hits==="mobs"){ mobs.forEach(m=>{ if(m.hp<=0) return; const big=m.titan?6.5:m.scale>1.5?1.4:0; if(Math.hypot(m.x-ix,m.z-iz)<R+big){ damageMob(m,p.dmg*(p.crit?1.8:1)*rnd(.92,1.08),p.crit); hitAny=true; } });
    for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; if(Math.hypot(o.x-ix,o.z-iz)<R){ const dmg=Math.round(p.dmg*.55); net.send({t:"hit",to:id,d:dmg}); floatDmg(o.x,4,o.z,"-"+fmt(dmg)); hitAny=true; } } }
  else if(p.hits==="player"){ if(!P.dead&&Math.hypot(P.x-ix,P.z-iz)<R+.4){ hurtPlayer(p.dmg*(1-dmgReduce(stat().def)),p.owner||"화살"); hitAny=true; } }
  else if(p.hits==="units"){ const t=p.target; if(t&&!t.dead&&Math.hypot(t.x-ix,t.z-iz)<R+.6){ t.hp-=p.dmg*rnd(.85,1.15); t.hit=.15; if(t.hp<=0&&typeof unitDie==="function") unitDie(t); hitAny=true; } }
  if(p.zap){ fxBolt(ix,iz,0x7ab8ff); fxRing(ix,iz,0x7ab8ff,p.r*1.6,.4); thud(); }
  if(p.kind==="orb"){ fxFlash(ix,1,iz,p.mesh.userData.glow||0xff8a3d,p.big?4:1.6,.35); fxSpark(ix,1,iz,p.mesh.userData.glow||0xff8a3d,p.big?40:14); if(p.big){ fxRing(ix,iz,0xff8a3d,p.r*1.8,.5); thud(); } }
  else fxSpark(ix,1,iz,hitAny?0xffffff:0xcfc4ac,hitAny?10:5);
  return hitAny; }
function tickProj(dt){ for(let i=PROJ.length-1;i>=0;i--){ const p=PROJ[i]; const m=p.mesh;
    if(p.stuck>0){ p.stuck-=dt; if(p.stuck<=0){ scene.remove(m); PROJ.splice(i,1); } continue; }
    if(p.returning){ const tx=p.ownerObj?p.ownerObj.x:P.x, tz=p.ownerObj?p.ownerObj.z:P.z; const dx=tx-m.position.x, dz=tz-m.position.z, L=Math.hypot(dx,dz); if(L<1.5){ scene.remove(m); PROJ.splice(i,1); continue; } const sp=32*dt; m.position.x+=dx/L*Math.min(L,sp); m.position.z+=dz/L*Math.min(L,sp); m.position.y+=(hAt(m.position.x,m.position.z)+2-m.position.y)*Math.min(1,dt*6); p.mesh.userData.inner.rotation.x+=dt*22; continue; }
    p.t+=dt; const t=Math.min(p.t,p.T); const nx=p.x+p.vx*t, nz=p.z+p.vz*t, ny=p.y+p.vy*t-.5*p.g*t*t;
    // 날아가는 방향으로 머리 돌리기
    const dx=nx-m.position.x, dy=ny-m.position.y, dz=nz-m.position.z; m.position.set(nx,ny,nz);
    if(p.kind==="arrow"||p.kind==="javelin"||p.kind==="dagger"){ if(Math.hypot(dx,dy,dz)>1e-4) m.lookAt(nx+dx,ny+dy,nz+dz); }
    else if(m.userData.inner.userData.spin){ m.rotation.y=Math.atan2(p.vx,p.vz); m.userData.inner.rotation.x+=dt*20; }
    if(p.kind==="orb"&&Math.random()<dt*30) fxSpark(nx,ny-hAt(nx,nz),nz,m.userData.glow||0xff8a3d,2);
    // 날아가는 중에 표적에 닿으면 바로 맞음(직선형)
    let early=false; if(!p.cosmetic&&p.hits==="mobs"&&p.t<p.T){ for(const mb of mobs){ if(mb.hp<=0) continue; const big=mb.titan?6.5:mb.scale>1.5?1.4:0; if(Math.hypot(mb.x-nx,mb.z-nz)<.9+big&&ny-hAt(nx,nz)<4+big){ early=true; break; } } }
    if(p.t>=p.T||early){ projImpact(p); if(p.back){ p.returning=true; continue; } if((p.kind==="arrow"||p.kind==="javelin")&&!early){ p.stuck=2.2; m.position.y=Math.max(hAt(nx,nz)+.2,ny); continue; } scene.remove(m); PROJ.splice(i,1); } } }

/* ---- 내 원거리 기본 공격(활·마법) ---- */
function nearestFoe(range){ let best=null,bd=1e9; mobs.forEach(m=>{ if(m.hp<=0) return; const d=Math.hypot(m.x-P.x,m.z-P.z); if(d<range&&d<bd){ bd=d; best=m; } }); for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; const d=Math.hypot(o.x-P.x,o.z-P.z); if(d<range&&d<bd){ bd=d; best=o; } } return best; }
function rangedAttack(kind){ const range=kind==="bow"?16:14; P.atkCd=kind==="bow"?.42:.5; P.atkAnim=.25; P.combat=4; if(player.userData.gl) animState(player,"attack"); const st=stat();
  const tg=nearestFoe(range); if(tg) P.rot=Math.atan2(tg.x-P.x,tg.z-P.z); if(player) player.rotation.y=P.rot;
  const tx=tg?tg.x:P.x+Math.sin(P.rot)*range, tz=tg?tg.z:P.z+Math.cos(P.rot)*range; const crit=Math.random()<st.crit;
  const sx=P.x+Math.sin(P.rot)*.8, sz=P.z+Math.cos(P.rot)*.8;
  if(kind==="bow"){ fireProj({x:sx,z:sz,y:2.1,tx,tz,ty:1.6,kind:"arrow",speed:38,arc:.18,dmg:st.atk*1.0,crit,r:1.3,hits:"mobs"}); tone(980,.04,"triangle",0,.06); tone(420,.08,"sine",.02,.05); }
  else { const c=RM().skills[0].color; fireProj({x:sx,z:sz,y:2.4,tx,tz,ty:1.6,kind:"orb",color:c,speed:24,arc:0,dmg:st.atk*1.05,crit,r:2,hits:"mobs"}); tone(660,.08,"sine",0,.07); tone(990,.06,"triangle",.03,.05); }
  net.send({t:"a",k:"atk",pj:[kind==="bow"?"arrow":"orb",+sx.toFixed(1),+sz.toFixed(1),+tx.toFixed(1),+tz.toFixed(1)]}); }
/* ---- 던지기 버튼 ---- */
let throwCd=0;
function throwWeapon(){ if(P.dead||layerOpen||throwCd>0) return; const kind=myWeaponKind(); const T=THROW[kind]||THROW.sword; throwCd=T.cd; const st=stat(); P.atkAnim=.35; P.combat=4; if(player.userData.gl) animState(player,"skill");
  const tg=nearestFoe(20); if(tg) P.rot=Math.atan2(tg.x-P.x,tg.z-P.z); if(player) player.rotation.y=P.rot; const range=18;
  const tx=tg?tg.x:P.x+Math.sin(P.rot)*range, tz=tg?tg.z:P.z+Math.cos(P.rot)*range; const sx=P.x+Math.sin(P.rot)*.8, sz=P.z+Math.cos(P.rot)*.8; const crit=Math.random()<st.crit; const sent=[];
  const shoot=(x,z,dly)=>{ const go=()=>{ fireProj({x:sx,z:sz,y:2.6,tx:x,tz:z,ty:1.4,kind:T.kind,speed:T.speed,arc:T.arc,dmg:st.atk*T.mult,crit,r:T.r,hits:"mobs",back:T.back,zap:T.zap,big:T.big,color:T.kind==="orb"?0xff7a2a:undefined}); }; if(dly) setTimeout(go,dly); else go(); sent.push([+x.toFixed(1),+z.toFixed(1)]); };
  if(T.fan){ for(let k=-1;k<=1;k++){ const a=P.rot+k*.22, d=Math.hypot(tx-P.x,tz-P.z)||12; shoot(P.x+Math.sin(a)*d,P.z+Math.cos(a)*d,0); } }
  else if(T.rain){ for(let k=0;k<T.rain;k++) shoot(tx+rnd(-3.5,3.5),tz+rnd(-3.5,3.5),k*70); fxRing(tx,tz,0xffe08a,8,.8); }
  else shoot(tx,tz,0);
  drama(RM().skills[0].color,.25,.6); tone(300,.12,"sawtooth",0,.1); tone(600,.1,"triangle",.05,.08); buzz(20);
  net.send({t:"a",k:"thr",pk:T.kind,sx:+sx.toFixed(1),sz:+sz.toFixed(1),pts:sent}); }
/* 친구가 쏜 것 — 보기만(데미지는 쏜 사람 폰이 계산) */

<script>

const MAPB=WORLD_HALF+12, MAPN=1024;

      const e=Math.max(Math.abs(x),Math.abs(z)); if(e>WORLD_HALF+5){ D[o]=MAPCOL.sea[0]; D[o+1]=MAPCOL.sea[1]; D[o+2]=MAPCOL.sea[2]; D[o+3]=255; continue; }

  TREEPOS.forEach(t=>{ const snow=t[3]===1; const r=(t[2]?11:7)*s; const g=ctx.createRadialGradient(X(t[0]),X(t[1]),0,X(t[0]),X(t[1]),r); const c=snow?"170,205,190":"150,205,135"; g.addColorStop(0,`rgba(${c},${t[2]?.55:.3})`); g.addColorStop(.6,`rgba(${c},${t[2]?.35:.18})`); g.addColorStop(1,`rgba(${c},0)`); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(X(t[0]),X(t[1]),r,0,6.2832); ctx.fill(); });

const MAPFONT='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
function mapText(ctx,t,x,y,px,col,wt,halo){ ctx.font=`${wt||600} ${px}px ${MAPFONT}`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineJoin="round"; ctx.lineWidth=Math.max(2.5,px*.32); ctx.strokeStyle=halo||"rgba(255,255,255,.95)"; ctx.strokeText(t,x,y); ctx.fillStyle=col||"#3c4043"; ctx.fillText(t,x,y); }
function mapPin(ctx,x,y,s,col,glyph){ ctx.save(); ctx.translate(x,y); ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(0,0,s*.45,s*.18,0,0,6.2832); ctx.fill();

    ctx.beginPath(); ctx.arc(X,Z,r,0,6.2832); ctx.fillStyle=o>=0?hexA(col,.13):"rgba(154,160,166,.08)"; ctx.fill(); ctx.setLineDash([4*u,3*u]); ctx.lineWidth=(big?1:1.4)*u; ctx.strokeStyle=o>=0?hexA(col,.9):"rgba(120,124,130,.7)"; ctx.stroke(); ctx.setLineDash([]);

function MiniMQTT(url,opt){
  const self={url,ok:false,ws:null,buf:new Uint8Array(0),pid:1,pingT:null,retry:null,closed:false,subs:[],opt};

  function pkt(type,body){ const len=[]; let x=body.length; do{ let d=x%128; x=Math.floor(x/128); if(x>0) d|=128; len.push(d); }while(x>0); return cat([new Uint8Array([type]),new Uint8Array(len),body]); }
  function send(u8){ try{ if(self.ws&&self.ws.readyState===1) self.ws.send(u8); }catch(e){} }
  function connect(){ if(self.closed) return; let ws; try{ ws=new WebSocket(url,"mqtt"); }catch(e){ schedule(); return; } ws.binaryType="arraybuffer"; self.ws=ws;
    const to=setTimeout(()=>{ try{ ws.close(); }catch(e){} },9000);
    ws.onopen=()=>{ const body=cat([str("MQTT"),new Uint8Array([4,2,0,opt.keepalive||25]),str(opt.clientId)]); send(pkt(0x10,body)); };
    ws.onmessage=ev=>{ const d=new Uint8Array(ev.data); self.buf=cat([self.buf,d]); parse(); };
    ws.onclose=()=>{ clearTimeout(to); if(self.ok){ self.ok=false; opt.onclose&&opt.onclose(); } clearInterval(self.pingT); schedule(); };
    ws.onerror=()=>{};

        if(type===2){ if(body[1]===0){ self.ok=true; clearTimeout(to); self.pingT=setInterval(()=>send(new Uint8Array([0xC0,0])),(opt.keepalive||25)*1000*.6); self.subs.forEach(t=>subscribe(t)); opt.onconnect&&opt.onconnect(); } else { try{ ws.close(); }catch(e){} } }
        else if(type===3){ const qos=(b[0]>>1)&3; const tl=(body[0]<<8)|body[1]; const topic=dec.decode(body.subarray(2,2+tl)); let p=2+tl; if(qos>0) p+=2; const retain=b[0]&1; opt.onmessage&&opt.onmessage(topic,dec.decode(body.subarray(p)),!!retain); } } }

  connect(); return {subscribe,publish,close,get ok(){ return self.ok; }};

  function pushRet(sub,o){ if(!N.started) return; const s=JSON.stringify(o); N.clients.forEach(c=>{ try{ c.publish(ROOT+sub,s,true); }catch(e){} }); }
  function hello(){ send({t:"hi",tt:G.title||"",n:G.name,r:G.realm,k:G.rank,l:G.lv,lk:lookArr(),e:[G.eq.w,G.eq.a,G.eq.r],pt:(typeof petArr==="function"?petArr():null)}); }
  function lookArr(){ const l=G.look||{}; return [l.face||0,l.body||0,l.hat||0,l.cape||0,l.weapon||0,l.tint||0]; }
  function eqObj(e){ const a=(e||"-1,-1,-1").split(",").map(Number); return {w:a[0],a:a[1],r:a[2]}; }

  function ensure(id,d){ let o=PEERS[id]; if(!o){ o=PEERS[id]={id,name:d.n||"?",realm:d.r||0,rank:d.k||0,lv:d.l||1,x:d.x||0,z:d.z||0,tx:d.x||0,tz:d.z||0,tf:0,m:0,walk:0,hp:1,mhp:1,dead:false,last:performance.now(),mesh:null,lbl:makeLabel(""),w:-1,anim:0};
      o.lk=(d.lk||[0,0,0,0,0,0]).join(","); o.e=(d.e||[-1,-1,-1]).join(","); o.mesh=(typeof avatarGL==="function"&&avatarGL(o.realm,o.rank,lookObj(d.lk),undefined,eqObj(o.e)))||makeAvatar(o.realm,o.rank,false,lookObj(d.lk)); scene.add(o.mesh); o.mesh.position.set(o.x,0,o.z); toast(`${o.name} 입장!`,`${REALMS[o.realm].n} · ${REALMS[o.realm].ranks[o.rank]}`,2.2); jingle([523,659,784]); dots(); }
