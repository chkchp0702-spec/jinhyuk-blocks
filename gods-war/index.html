<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신들의 전쟁">
<title>신들의 전쟁</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">
<style>
/* 전체 화면 3D 세계. 왼쪽 엄지: 조이스틱, 오른쪽 엄지: 공격/기술/물약. 위: 상태, 아래: 메뉴. 테마 색은 내 세계(--c1 주색, --c2 보조)로 바뀜. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --paper:#fff9ec; --gold:#ffcf4a; --red:#ff5a5f; --green:#3fd27a; --blue:#4aa3ff;
  --c1:#ffcf4a; --c2:#fff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --title:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1a1030;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.5);will-change:transform}
.lbl b{font-weight:400;display:block;font-size:12px;opacity:.9}
.lbl .hp{display:block;width:64px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.lbl .hp i{display:block;height:100%;background:#ff5a5f;border-radius:4px}
.lbl.ally{color:#9dffb8} .lbl.foe{color:#ff8d8d} .lbl.boss{font-size:19px;color:#ffcf4a}
.lbl.dmg{font-size:22px;color:#fff;animation:dmg .8s ease-out forwards} .lbl.dmg.crit{color:#ffcf4a;font-size:28px} .lbl.dmg.me{color:#ff6b6b}
@keyframes dmg{to{transform:translate(-50%,-70px);opacity:0}}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px}
.tl{top:max(8px,env(safe-area-inset-top));left:10px;flex-direction:column;align-items:flex-start}
.tr{top:max(8px,env(safe-area-inset-top));right:10px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(20,14,40,.72);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.75}
#status{display:flex;flex-direction:column;gap:4px;background:rgba(20,14,40,.72);border:2px solid var(--c1);border-radius:16px;padding:8px 12px;min-width:196px;backdrop-filter:blur(6px)}
#status .nm{font-size:17px;color:var(--c1);line-height:1.1} #status .nm small{color:#fff;opacity:.85;font-size:13px;margin-left:6px}
.bar{height:11px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff3d4a,#ff8a5c)} .bar.xp i{background:linear-gradient(90deg,#4aa3ff,#9be7ff)} .bar.xp{height:7px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000}
.gold{color:var(--gold)}
#netPill{font-size:12px;gap:6px} #netPill .dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;box-shadow:0 0 4px #000} #netPill .dot.on{background:#3fd27a;box-shadow:0 0 6px #3fd27a}
#region{font-size:14px;color:#fff;letter-spacing:.5px}
#region b{font-weight:400;color:var(--c1)}

#minimap{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);width:150px;height:150px;z-index:5;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(20,14,40,.6);pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#quest{position:fixed;left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 96px);z-index:5;pointer-events:auto;max-width:200px;display:flex;flex-direction:column;gap:4px}
.q{background:rgba(20,14,40,.66);border-left:4px solid var(--c1);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25;color:#fff}
.q.done{border-color:var(--green);color:#9dffb8} .q small{opacity:.75}

.bl{left:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:row;pointer-events:auto}
.br{right:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.mbtn{border:0;cursor:pointer;color:#fff;font-size:15px;border-radius:14px;padding:9px 12px;min-width:60px;background:rgba(20,14,40,.75);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.mbtn:active{transform:translateY(2px)}
.acts{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 60px);z-index:5;display:grid;grid-template-columns:64px 64px 84px;grid-template-rows:64px 84px;gap:8px;align-items:end;justify-items:end;pointer-events:auto}
.act{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.5);color:#fff;font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.act.atk{background:radial-gradient(circle at 35% 30%,#ff9a7a,#d82f3c 70%);grid-column:3;grid-row:2;width:84px;height:84px;font-size:17px}
.act.lock{filter:grayscale(1) brightness(.6)} .act.lock small{font-size:9px}
.act.skl{background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 70%);color:#1b1430;text-shadow:0 1px 0 rgba(255,255,255,.4);font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1}
.act.pot{background:radial-gradient(circle at 35% 30%,#9dffb8,#1f9f58 70%);grid-column:2;grid-row:2}
.act.jmp{background:radial-gradient(circle at 35% 30%,#bcd6ff,#3a5bd6 70%);grid-column:1;grid-row:2}
.act.skl{grid-row:1}
.act .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
.act small{font-size:11px;opacity:.9}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.45);z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,0,20,.45) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 50%,rgba(255,20,30,.55) 100%);opacity:0;transition:opacity .25s}
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;font-size:clamp(22px,6.5vw,34px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.4);font-family:var(--title);letter-spacing:1px}
#toast small{display:block;font-size:.55em;color:var(--c1);margin-top:4px;font-family:var(--font);letter-spacing:0}
#chat{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none;width:min(80vw,360px)}
.msg{background:rgba(20,14,40,.75);border-radius:12px;padding:4px 10px;font-size:13px;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeout 6s forwards} .msg b{font-weight:400;color:var(--gold)}
@keyframes fadeout{80%{opacity:1}to{opacity:0}}
#bossbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 180px);transform:translateX(-50%);z-index:5;width:min(70vw,300px);pointer-events:none;text-align:center}
#bossbar .nm{font-size:16px;color:#ffcf4a;text-shadow:0 2px 0 #000} #bossbar .bar{height:12px;border:2px solid #ffcf4a} #bossbar .bar i{background:linear-gradient(90deg,#b01030,#ff3d4a)}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(8,4,20,.7);backdrop-filter:blur(4px)}
.card{width:100%;max-width:420px;max-height:88%;overflow:auto;background:linear-gradient(180deg,#2a1f4d,#17102f);border:2px solid var(--c1);border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.5,.5,1);color:#fff}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:24px;text-align:center;font-family:var(--title);color:var(--c1);letter-spacing:1px}
.card h3{margin:6px 0 0;font-weight:400;font-size:16px;color:var(--c1)}
.card p{margin:0;color:#d8d2ea;line-height:1.5;text-align:center;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px}
.row .t{flex:1;min-width:0} .row .t div{font-size:16px} .row .t span{font-size:12px;color:#b9b1d4;display:block;line-height:1.3}
.row .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.3)}
.buy{border:0;cursor:pointer;background:var(--green);color:#1b1430;border-radius:11px;padding:8px 12px;font-size:15px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.buy[disabled]{background:#5a5570;color:#bbb;cursor:default} .buy.sell{background:var(--red);color:#fff} .buy.alt{background:var(--blue);color:#fff}
.close{align-self:center;border:0;background:none;color:#fff;font-size:17px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap} .tab{border:2px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer} .tab.on{background:var(--c1);color:#1b1430;border-color:var(--c1)}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-size:11px;margin-right:4px;vertical-align:middle}
.go{border:0;cursor:pointer;font-size:24px;color:#1b1430;background:var(--c1);padding:13px 38px;border-radius:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 0 rgba(0,0,0,.5);font-family:var(--title);letter-spacing:1px;align-self:center}
.go:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.5)}
.go[disabled]{background:#5a5570;color:#bbb}
.inp{font:inherit;font-size:20px;text-align:center;width:220px;padding:8px 12px;border-radius:14px;border:3px solid var(--c1);background:rgba(255,255,255,.95);color:var(--ink);outline:none;align-self:center}

#title{background:radial-gradient(ellipse at 50% 20%,rgba(120,90,255,.35),rgba(8,4,20,.85) 60%);align-items:flex-start;padding-top:max(26px,env(safe-area-inset-top));overflow:auto}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:440px}
.logo{font-family:var(--title);font-size:min(16vw,70px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,207,74,.6),0 5px 0 #4a2a00;letter-spacing:2px;margin-top:8px}
.logo span{display:block;font-size:.3em;color:var(--gold);letter-spacing:6px;font-family:var(--font);text-shadow:0 2px 0 #000}
.realms{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.realm{border:3px solid rgba(255,255,255,.2);border-radius:18px;padding:12px 10px;background:linear-gradient(160deg,var(--a),var(--b));color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px;box-shadow:0 6px 0 rgba(0,0,0,.45);position:relative;overflow:hidden}
.realm:active{transform:translateY(3px)} .realm.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.45)}
.realm b{font-family:var(--title);font-size:22px;font-weight:400;letter-spacing:1px} .realm i{font-style:normal;font-size:12px;opacity:.92;line-height:1.3} .realm em{position:absolute;right:8px;top:6px;font-style:normal;font-size:30px;opacity:.9}
.help{color:#d8d2ea;font-size:13.5px;line-height:1.5;max-width:360px}
.codex{display:flex;flex-direction:column;gap:5px}
.god{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 9px;font-size:13px} .god .pw{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--gold);font-size:14px} .god small{display:block;color:#b9b1d4;font-size:11px}
.god.top{border:1px solid var(--gold)}
.rank{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:14px;background:rgba(255,255,255,.05)} .rank.cur{background:rgba(255,207,74,.18);border:1px solid var(--gold)} .rank.lock{opacity:.55} .rank .n{width:22px;text-align:center;font-family:var(--title)} .rank small{color:#b9b1d4;margin-left:auto;font-size:11px}
.mapbig{width:100%;aspect-ratio:1;border-radius:16px;background:#120c26;border:2px solid rgba(255,255,255,.2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px} .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.say{display:grid;grid-template-columns:1fr 1fr;gap:6px} .say button{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:8px;font-size:14px;cursor:pointer}
.death{background:radial-gradient(ellipse at 50% 40%,rgba(120,0,20,.6),rgba(0,0,0,.92) 70%)}
.linkbox{font-size:12px;word-break:break-all;background:rgba(0,0,0,.35);border-radius:10px;padding:8px;color:#cfc7ea;text-align:center}
@media (max-height:640px){ .act{width:56px;height:56px} .act.atk{width:72px;height:72px;font-size:15px} .acts{grid-template-columns:56px 56px 72px;grid-template-rows:56px 72px} #minimap{width:120px;height:120px} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01s!important;animation-iteration-count:1!important} }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="vignette"></div><div id="hurt"></div>

<div class="hud tl">
  <div id="status">
    <div class="nm"><span id="pname">-</span><small id="prank"></small></div>
    <div class="bar hp"><i id="hpBar" style="width:100%"></i><span id="hpTxt"></span></div>
    <div class="bar xp"><i id="xpBar" style="width:0%"></i></div>
    <div style="display:flex;gap:10px;font-size:13px"><span>Lv.<b id="plv">1</b></span><span class="gold">⬤ <b id="pgold">0</b></span><span id="pwar" style="color:#9dffb8"></span></div>
  </div>
  <div id="region" class="pill">…</div>
</div>
<div class="hud tr">
  <span class="pill" id="netPill"><span class="dot" data-i="0"></span><span class="dot" data-i="1"></span><span class="dot" data-i="2"></span><span class="dot" data-i="3"></span><span id="netTxt">연결 중</span></span>
</div>
<canvas id="minimap" width="200" height="200"></canvas>
<div id="quest"></div>
<div id="bossbar" hidden><div class="nm" id="bossNm"></div><div class="bar"><i id="bossHp" style="width:100%"></i></div></div>
<div id="chat"></div>

<div class="acts">
  <button class="act skl" id="bSkill0" type="button"><span id="sklNm0">기술</span><small id="sklCd0"></small><i class="cd" id="sklCdV0"></i></button>
  <button class="act skl" id="bSkill1" type="button"><span id="sklNm1">기술</span><small id="sklCd1"></small><i class="cd" id="sklCdV1"></i></button>
  <button class="act skl" id="bSkill2" type="button"><span id="sklNm2">기술</span><small id="sklCd2"></small><i class="cd" id="sklCdV2"></i></button>
  <button class="act pot" id="bPot" type="button">물약<small id="potN">0</small></button>
  <button class="act jmp" id="bJump" type="button">점프</button>
  <button class="act atk" id="bAtk" type="button">공격</button>
</div>
<div class="hud bl">
  <button class="mbtn" id="bBag" type="button">가방</button>
  <button class="mbtn" id="bQuest" type="button">임무</button>
  <button class="mbtn" id="bMap" type="button">세계</button>
  <button class="mbtn" id="bSay" type="button">말하기</button>
  <button class="mbtn" id="bMenu" type="button">≡</button>
</div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="toast"></div>
<div id="layers"></div>
<script src="three.min.js"></script>
<script>
/* ================= 신화 데이터: 네 세계 ================= */
const VER="v1";
const REALMS=[
 { id:"eden", n:"에덴", sub:"천상의 왕국", icon:"✝", c1:"#ffd95e", c2:"#fff7d6", a:"#e9c46a", b:"#5c4a1c",
   ground:"#cfe3a8", ground2:"#b8d890", sky:"#9fd4ff", fog:"#dcefff", prop:"tree-gold",
   absolute:"하느님", absoluteDesc:"만물을 지으신 분. 닿을 수 없는 절대자.",
   respawn:{ n:"생명나무", desc:"에덴 한가운데 생명나무 아래에서 깨어남", pen:"금화 15%를 잃고, 40초 동안 날개가 꺾여 느려짐(이동 -30%)", gold:.15, slow:40 },
   skills:[ {n:"심판의 빛",desc:"주변 모든 적에게 빛의 폭발",type:"aoe",r:7,mult:2.4,cd:6,color:0xfff2a0,rank:0}, {n:"치유의 날개",desc:"체력 40% 회복 + 4초 질주",type:"heal",heal:.4,haste:4,cd:14,color:0xffffff,rank:2}, {n:"미카엘의 창",desc:"빛의 창이 앞을 꿰뚫음",type:"line",r:15,w:3,mult:4.2,cd:10,color:0xfff2a0,rank:4} ],
   potion:"생명의 열매",

function tone(f,d,type,delay,vol){ if(!soundOn||!actx) return; const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.03); }

function placeLabel(el,x,y,z,html){ _v.set(x,y,z).project(camera); if(_v.z>1||Math.abs(_v.x)>1.2||Math.abs(_v.y)>1.2){ el.style.display="none"; return; } el.style.display=""; const sx=(_v.x+1)/2*innerWidth, sy=(1-_v.y)/2*innerHeight; el.style.transform=`translate(${sx}px,${sy}px) translate(-50%,-100%)`; if(html!==undefined&&el._h!==html){ el._h=html; el.innerHTML=html; } }
function floatDmg(x,y,z,txt,cls){ const el=makeLabel("dmg "+(cls||"")); placeLabel(el,x,y,z,txt); setTimeout(()=>el.remove(),800); }

/* ================= 효과 ================= */
const FX=[];
function fxRing(x,z,color,size,dur){ const m=new THREE.Mesh(GEO.ring,glowMat(color,.9)); m.rotation.x=-Math.PI/2; m.position.set(x,.12,z); scene.add(m); FX.push({m,t:0,d:dur||.5,size:size||4,kind:"ring"}); }
function fxFlash(x,y,z,color,size,dur){ const m=new THREE.Mesh(GEO.sph,glowMat(color,.95)); m.position.set(x,y,z); scene.add(m); FX.push({m,t:0,d:dur||.3,size:size||2,kind:"flash"}); }
function fxBolt(x,z,color){ const m=cyl(.18,.6,34,glowMat(color,.95),x,17,z,8); scene.add(m); FX.push({m,t:0,d:.3,size:1,kind:"bolt"}); fxFlash(x,1,z,color,3,.3); fxSpark(x,1,z,color,24); }
function fxLine(x,z,rot,len,color){ const m=box(2.4,.5,len,glowMat(color,.8)); m.position.set(x+Math.sin(rot)*len/2,1.2,z+Math.cos(rot)*len/2); m.rotation.y=rot; scene.add(m); FX.push({m,t:0,d:.35,size:1,kind:"line"}); }
function fxSpark(x,y,z,color,n){ const N=n||14; const geo=new THREE.BufferGeometry(); const p=new Float32Array(N*3); const v=[]; for(let i=0;i<N;i++){ p[i*3]=x; p[i*3+1]=y; p[i*3+2]=z; v.push(new THREE.Vector3(rnd(-1,1),rnd(.2,1.4),rnd(-1,1)).normalize().multiplyScalar(rnd(4,11))); } geo.setAttribute("position",new THREE.BufferAttribute(p,3)); const m=new THREE.Points(geo,new THREE.PointsMaterial({color,size:.45,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending})); scene.add(m); FX.push({m,t:0,d:.55,kind:"spark",v,p}); }
function tickFX(dt){ for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; f.t+=dt; const k=f.t/f.d; if(k>=1){ scene.remove(f.m); f.m.material.dispose(); if(f.m.geometry&&f.kind==="spark") f.m.geometry.dispose(); FX.splice(i,1); continue; }
  if(f.kind==="ring"){ const s=.5+k*f.size; f.m.scale.set(s,s,s); f.m.material.opacity=.9*(1-k); } else if(f.kind==="flash"){ const s=f.size*(.6+k); f.m.scale.set(s,s,s); f.m.material.opacity=.95*(1-k); } else if(f.kind==="spark"){ for(let j=0;j<f.v.length;j++){ f.v[j].y-=18*dt; f.p[j*3]+=f.v[j].x*dt; f.p[j*3+1]+=f.v[j].y*dt; f.p[j*3+2]+=f.v[j].z*dt; } f.m.geometry.attributes.position.needsUpdate=true; f.m.material.opacity=1-k; } else f.m.material.opacity=.9*(1-k); } }
</script>
<script>
/* ================= 플레이어 ================= */
const P={x:0,z:0,y:0,vy:0,rot:0,hp:1,walk:0,moving:false,atkCd:0,sklCd:[0,0,0],rage:0,haste:0,combat:0,dashT:0,atkAnim:0,slow:0,weak:0,shadow:0,dizzy:0,heat:0,dead:false,deadT:0,orbitT:0,orbitTick:0,capProg:0,capRg:-1,bag:null,trial:null,invul:0,hitFlash:0};
let player=null, weaponMesh=null, orbitMesh=null;
function buildPlayer(){ if(player){ scene.remove(player); } player=makeAvatar(G.realm,G.rank,false); scene.add(player); applyWeapon(); }
function applyWeapon(){ if(!player) return; if(weaponMesh){ weaponMesh.parent.remove(weaponMesh); weaponMesh=null; } if(G.eq.w>=0){ weaponMesh=makeWeapon(G.realm,G.eq.w); weaponMesh.position.set(0,-1.2,.3); weaponMesh.rotation.x=-.3; player.userData.armR.add(weaponMesh); } }
function homeShrine(){ const a=ALTARS[G.realm*3]; return a?a.shrine:new THREE.Vector3(0,0,0); }
function spawnAtHome(){ const s=homeShrine(); const rg=REGIONS[G.realm*3]; const dir=rg.z>0?-1:1; P.x=s.x+rnd(-2,2); P.z=s.z+dir*20; P.y=0; P.vy=0; P.rot=rg.z>0?0:Math.PI; }
function setRealmTheme(){ const R=RM(); document.documentElement.style.setProperty("--c1",R.c1); document.documentElement.style.setProperty("--c2",R.c2); R.skills.forEach((S,i)=>{ $("sklNm"+i).textContent=S.n; }); }

/* ================= 괴물 ================= */
const mobs=[]; const REG_STATE=REGIONS.map(()=>({bossT:rnd(20,60),boss:null}));
function mobStats(lv,boss){ const m=boss?6:1; return {mhp:Math.round((22+lv*13)*m),atk:(3+lv*1.7)*(boss?1.4:1),xp:Math.round((10+lv*7)*(boss?12:1)),gold:Math.round((4+lv*2)*(boss?15:1))}; }
function spawnMob(rg,boss,world){
  const R=rg.realm>=0?REALMS[rg.realm]:REALMS[Math.floor(Date.now()/60000)%4];
  const def=boss?(world?R.worldBoss:R.boss):pick(R.mobs);
  const lv=boss?(world?rint(34,40):rg.lv[1]+2):rint(rg.lv[0],rg.lv[1]);
  const st=mobStats(lv,boss); const scale=boss?(world?2.6:1.9):rnd(.85,1.15);
  let x,z; for(let k=0;k<12;k++){ const a=rnd(0,6.3), d=rg.cap?rnd(28,rg.r-6):rnd(8,rg.r-8); x=rg.x+Math.cos(a)*d; z=rg.z+Math.sin(a)*d; if(Math.hypot(x-P.x,z-P.z)>14) break; }
  const m={n:def.n,shape:def.shape,mesh:makeMob(def.shape,def.c,scale),x,z,hx:x,hz:z,lv,boss:!!boss,world:!!world,hp:st.mhp,mhp:st.mhp,atk:st.atk,xp:st.xp,gold:st.gold,rg:rg.id,cd:0,state:"idle",t:rnd(0,3),lbl:makeLabel(boss?"boss":""),rot:rnd(0,6.3),hit:0,scale,power:boss?def.p:0};
  m.mesh.position.set(x,0,z); scene.add(m.mesh); mobs.push(m); if(boss){ REG_STATE[rg.id].boss=m; toast(world?`세계 보스 ${def.n} 출현!`:`${def.n}이(가) 나타났다!`,world?`파워 ${def.p} · 세계의 중심`:rg.n,2.6); tone(90,.4,"sawtooth",0,.2); buzz([60,40,60]); }
  return m; }
function removeMob(m){ scene.remove(m.mesh); m.lbl.remove(); const i=mobs.indexOf(m); if(i>=0) mobs.splice(i,1); if(m.boss){ const s=REG_STATE[m.rg]; if(s.boss===m) s.boss=null; } }
function tickMobs(dt){
  // 지역별 스폰: 내가 근처에 있는 지역만
  REGIONS.forEach(rg=>{ const d=Math.hypot(P.x-rg.x,P.z-rg.z); const s=REG_STATE[rg.id]; if(d>rg.r+50) return; const cnt=mobs.filter(m=>m.rg===rg.id&&!m.boss).length; const want=rg.cap?3:rg.center?7:5; if(cnt<want&&Math.random()<dt*.8) spawnMob(rg,false,false);
    if(!rg.cap&&!P.trial){ s.bossT-=dt; if(s.bossT<=0&&!s.boss&&d<rg.r+10){ spawnMob(rg,true,!!rg.center); s.bossT=rg.center?300:240; } } });
  const st=stat();
  for(let i=mobs.length-1;i>=0;i--){ const m=mobs[i]; const dx=P.x-m.x, dz=P.z-m.z, d=Math.hypot(dx,dz);
    if(d>150){ removeMob(m); continue; }
    m.hit=Math.max(0,m.hit-dt); m.cd-=dt; m.t-=dt;
    const spd=(m.boss?3.4:m.shape==="wolf"?5.2:3.6)*(m.scale>1.5?1.1:1);
    const safe=inCapital(P.x,P.z); const shrineD=safe?Math.hypot(P.x-ALTARS[safe.id].shrine.x,P.z-ALTARS[safe.id].shrine.z):99;
    const aggro=!P.dead&&d<(m.boss?24:11)&&shrineD>18&&!(m.trial===false);
    if(m.trialOf&&!P.trial){ removeMob(m); continue; }
    if(aggro){ m.state="chase"; if(d>(m.boss?3.4:2.3)){ m.x+=dx/d*spd*dt; m.z+=dz/d*spd*dt; m.rot=Math.atan2(dx,dz); } else if(m.cd<=0){ m.cd=m.boss?1.7:1.5; hurtPlayer(m.atk*(1-dmgReduce(st.def)),m.n); m.mesh.userData.lunge=.25; } }
    else { if(m.t<=0){ m.t=rnd(1.5,4); m.state=Math.random()<.5?"idle":"wander"; m.wx=m.hx+rnd(-8,8); m.wz=m.hz+rnd(-8,8); } if(m.state==="wander"){ const wx=m.wx-m.x, wz=m.wz-m.z, wd=Math.hypot(wx,wz); if(wd>.5){ m.x+=wx/wd*1.6*dt; m.z+=wz/wd*1.6*dt; m.rot=Math.atan2(wx,wz); } } }
    const rg=REGIONS[m.rg]; const rd=Math.hypot(m.x-rg.x,m.z-rg.z); if(rd>rg.r+6){ m.x+= (rg.x-m.x)/rd*spd*dt; m.z+=(rg.z-m.z)/rd*spd*dt; }
    m.x=clamp(m.x,-WORLD_HALF+3,WORLD_HALF-3); m.z=clamp(m.z,-WORLD_HALF+3,WORLD_HALF-3);
    m.mesh.position.set(m.x,(m.mesh.userData.float?Math.sin(performance.now()/400+m.x)*.3+.2:0)+(m.mesh.userData.lunge>0?.4:0),m.z); if(m.mesh.userData.lunge>0) m.mesh.userData.lunge-=dt;
    let dr=m.rot-m.mesh.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; m.mesh.rotation.y+=dr*Math.min(1,dt*8);
    const sc=m.scale*(m.hit>0?1.12:1); m.mesh.scale.set(sc,sc,sc);
    if(d<48){ const h=m.mesh.userData.float?3.6:(m.shape==="giant"?5.6:m.shape==="wolf"?2.8:m.shape==="snake"?2:4.4); placeLabel(m.lbl,m.x,h*m.scale,m.z,`${m.boss?"👑 ":""}${m.n} <b>Lv.${m.lv}${m.power?" · 파워 "+m.power:""}</b><span class="hp"><i style="width:${Math.round(m.hp/m.mhp*100)}%"></i></span>`); } else m.lbl.style.display="none";
  }
  const bb=$("bossbar"); const near=mobs.find(m=>m.boss&&Math.hypot(m.x-P.x,m.z-P.z)<40); if(near){ bb.hidden=false; $("bossNm").textContent=(near.trialOf?"승급 시험: ":"")+near.n; $("bossHp").style.width=Math.round(near.hp/near.mhp*100)+"%"; } else bb.hidden=true;
}
function damageMob(m,dmg,crit){ if(m.hp<=0) return; dmg=Math.round(dmg); m.hp-=dmg; m.hit=.15; P.combat=4; floatDmg(m.x,3.5*m.scale,m.z,"-"+fmt(dmg),crit?"crit":""); fxSpark(m.x,1.8*m.scale,m.z,crit?0xffe08a:0xffffff,crit?16:8); tone(crit?660:440,.06,"square",0,.08);
  if(m.hp<=0){ killMob(m); } }
function killMob(m){ const st=stat(); G.kills++; gainXp(m.xp); G.gold+=m.gold; fxFlash(m.x,2,m.z,0xffe08a,m.boss?6:2.2,.45); fxRing(m.x,m.z,0xffffff,m.boss?10:3);
  floatDmg(m.x,4,m.z,`+${m.gold} 금화`,"");
  // 드랍
  const rg=REGIONS[m.rg]; const roll=Math.random(); let tier=-1; if(m.boss){ tier=m.world?3:Math.min(3,Math.floor(rg.lv[1]/10)+1); if(Math.random()<.35) tier=Math.min(3,tier+1); } else if(roll<.06){ tier=Math.min(3,Math.floor(rg.lv[0]/8)); if(Math.random()<.15) tier=Math.min(3,tier+1); }
  if(tier>=0){ const s=pick(["w","a","r"]); G.bag.push({s,t:tier}); toast(`${RAR[tier].n} 아이템!`,itemName(s,tier),2.2); jingle([659,784,1046]); }
  if(Math.random()<(m.boss?1:.08)){ G.pots++; }
  if(m.boss){ G.bossKills++; toast(`${m.n} 처치!`,`경험치 +${m.xp} · 금화 +${m.gold}`,2.6); jingle([523,659,784,1046,1318]); buzz([40,30,80]); if(m.trialOf){ finishTrial(true); } }
  questEvent("kill",m); removeMob(m); saveGame(); }

/* ================= 전투 ================= */
function facingHit(x,z,r,ang){ const dx=x-P.x, dz=z-P.z, d=Math.hypot(dx,dz); if(d>r) return false; if(d<1.2) return true; let a=Math.atan2(dx,dz)-P.rot; while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return Math.abs(a)<ang; }
function attack(){ if(P.dead||P.atkCd>0) return; P.atkCd=.28; P.atkAnim=.25; P.combat=4; const st=stat(); let any=false;
  mobs.forEach(m=>{ if(facingHit(m.x,m.z,3.4+(m.scale>1.5?1.5:0),1.0)){ const crit=Math.random()<st.crit; damageMob(m,st.atk*rnd(.9,1.1)*(crit?1.8:1),crit); any=true; } });
  for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead) continue; if(inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; if(facingHit(o.x,o.z,3.4,1.0)){ const crit=Math.random()<st.crit; const dmg=Math.round(st.atk*rnd(.9,1.1)*(crit?1.8:1)*.55); net.send({t:"hit",to:id,d:dmg}); floatDmg(o.x,4,o.z,"-"+fmt(dmg),crit?"crit":""); any=true; } }
  if(any){ tone(220,.05,"square",0,.1); buzz(15); } else tone(180,.04,"triangle",0,.05);
  net.send({t:"a",k:"atk"}); }
function useSkill(i){ i=i||0; if(P.dead||layerOpen) return; const S=RM().skills[i]; if(!S) return; if(G.rank<S.rank){ toast(`${RM().ranks[S.rank]}부터 쓸 수 있어요`,S.n,1.4); return; } if(P.sklCd[i]>0) return; const st=stat(); P.sklCd[i]=S.cd; P.atkAnim=.4; P.combat=4; net.send({t:"a",k:"skl"});
  const hitMob=(m,mult)=>{ const crit=Math.random()<st.crit; damageMob(m,st.atk*mult*rnd(.9,1.1)*(crit?1.8:1),crit); };
  const hitPl=(o,id,mult)=>{ if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) return; const dmg=Math.round(st.atk*mult*.55); net.send({t:"hit",to:id,d:dmg}); floatDmg(o.x,4,o.z,"-"+fmt(dmg)); };
  const aoe=(r,mult)=>{ fxRing(P.x,P.z,S.color,r*1.6,.5); fxFlash(P.x,2,P.z,S.color,r*.8,.4); fxSpark(P.x,2,P.z,S.color,40); mobs.forEach(m=>{ if(Math.hypot(m.x-P.x,m.z-P.z)<r) hitMob(m,mult); }); for(const id in PEERS){ const o=PEERS[id]; if(Math.hypot(o.x-P.x,o.z-P.z)<r) hitPl(o,id,mult); } };
  if(S.type==="aoe"){ aoe(S.r,S.mult); if(S.heal){ P.hp=Math.min(st.mhp,P.hp+st.mhp*S.heal); } jingle([784,1046,1318]); buzz(30); }
  else if(S.type==="line"){ fxLine(P.x,P.z,P.rot,S.r,S.color); const inLine=(x,z)=>{ const dx=x-P.x,dz=z-P.z; const f=dx*Math.sin(P.rot)+dz*Math.cos(P.rot); const side=Math.abs(dx*Math.cos(P.rot)-dz*Math.sin(P.rot)); return f>0&&f<S.r&&side<(S.w||2.6); }; mobs.forEach(m=>{ if(inLine(m.x,m.z)){ hitMob(m,S.mult); fxSpark(m.x,2,m.z,S.color,12); } }); for(const id in PEERS){ const o=PEERS[id]; if(inLine(o.x,o.z)) hitPl(o,id,S.mult); } tone(120,.3,"sawtooth",0,.15); buzz(25); }
  else if(S.type==="orbit"){ P.orbitT=S.dur; if(!orbitMesh){ orbitMesh=new THREE.Mesh(new THREE.TorusGeometry(1,.16,10,32),glowMat(S.color,.95)); scene.add(orbitMesh); } tone(880,.2,"triangle"); }
  else if(S.type==="bolt"){ const list=mobs.map(m=>({m,d:Math.hypot(m.x-P.x,m.z-P.z)})).filter(o=>o.d<S.r).sort((a,b)=>a.d-b.d).slice(0,S.cnt); list.forEach(o=>{ fxBolt(o.m.x,o.m.z,S.color); fxRing(o.m.x,o.m.z,S.color,3); hitMob(o.m,S.mult); }); let n=0; for(const id in PEERS){ const o=PEERS[id]; if(n<S.cnt&&Math.hypot(o.x-P.x,o.z-P.z)<S.r){ fxBolt(o.x,o.z,S.color); hitPl(o,id,S.mult); n++; } } if(!list.length&&!n) fxBolt(P.x+Math.sin(P.rot)*4,P.z+Math.cos(P.rot)*4,S.color); tone(1200,.15,"square",0,.12); tone(200,.3,"sawtooth",.05,.12); buzz(25); }
  else if(S.type==="heal"){ if(S.heal) P.hp=Math.min(st.mhp,P.hp+Math.round(st.mhp*S.heal)); if(S.haste) P.haste=S.haste; if(S.invul) P.invul=Math.max(P.invul,S.invul); fxRing(P.x,P.z,S.color,6,.7); fxSpark(P.x,2,P.z,S.color,30); jingle([523,659,784,1046]); }
  else if(S.type==="rage"){ P.rage=S.dur; fxRing(P.x,P.z,S.color,7,.8); fxSpark(P.x,2,P.z,S.color,30); tone(90,.5,"sawtooth",0,.2); buzz([40,30,40]); }
  else if(S.type==="dash"){ P.dashT=.25; P.dashX=Math.sin(P.rot)*S.dist/.25; P.dashZ=Math.cos(P.rot)*S.dist/.25; P.vy=7; P.invul=Math.max(P.invul,.5); setTimeout(()=>{ aoe(S.r,S.mult); thud(); },300); tone(500,.2,"triangle"); }
  $("hurt").style.opacity=0; }
function usePotion(){ if(P.dead||G.pots<=0||layerOpen) return; const st=stat(); if(P.hp>=st.mhp){ toast("체력이 가득해요"); return; } G.pots--; P.hp=Math.min(st.mhp,P.hp+Math.round(st.mhp*.5)); fxRing(P.x,P.z,0x9dffb8,4); jingle([523,659]); saveGame(); }
function hurtPlayer(dmg,from){ if(P.dead||P.invul>0) return; dmg=Math.max(1,Math.round(dmg)); P.hp-=dmg; P.combat=5; P.hitFlash=.25; floatDmg(P.x,4.2,P.z,"-"+fmt(dmg),"me"); $("hurt").style.opacity=Math.min(1,.4+ (1-P.hp/stat().mhp)); setTimeout(()=>{ $("hurt").style.opacity=P.hp/stat().mhp<.3?.5:0; },250); thud(); buzz(25);
  if(P.hp<=0){ P.hp=0; die(from); } }

/* ================= 죽음과 부활 ================= */
function die(by){ const R=RM(); P.dead=true; P.deadT=6; net.send({t:"dead",by:typeof by==="string"?by:(by||"")});
  const lost=Math.round(G.gold*R.respawn.gold); G.gold-=lost; G.deaths++;
  if(R.respawn.xp){ G.xp=Math.max(0,G.xp-Math.round(xpNeed(G.lv)*R.respawn.xp)); }
  if(lost>0){ if(P.bag){ scene.remove(P.bag.mesh); } const bm=new THREE.Group(); bm.add(box(1,.9,.8,toon({color:0x8a5a2a}),0,.45,0)); bm.add(new THREE.Mesh(GEO.sph,toon({color:0xffd05a}))); bm.children[1].position.y=1.1; bm.children[1].scale.set(.6,.6,.6); bm.position.set(P.x,0,P.z); scene.add(bm); P.bag={mesh:bm,x:P.x,z:P.z,gold:Math.round(lost*.5),t:120}; }
  if(P.trial) finishTrial(false);
  mobs.forEach(m=>{ if(m.state==="chase") m.state="idle"; });
  showDeath(by,lost); saveGame(); }
function respawn(){ const R=RM(); P.dead=false; closeLayer(); spawnAtHome(); P.hp=Math.round(stat().mhp*.6); P.invul=3;
  if(R.respawn.slow) P.slow=R.respawn.slow; if(R.respawn.weak){ P.weak=R.respawn.weak; P.heat=20; } if(R.respawn.shadow) P.shadow=R.respawn.shadow; if(R.respawn.xp) P.dizzy=30;
  fxRing(P.x,P.z,R.c1,8,.8); jingle([392,523,659]); toast(`${R.respawn.n}에서 부활`,R.respawn.pen,3.2); }

/* ================= 승급 시험 ================= */
function canTrial(){ return G.rank<6&&G.lv>=RANK_LV[G.rank+1]&&G.gold>=RANK_GOLD[G.rank+1]; }
function startTrial(){ const R=RM(); if(!canTrial()||P.trial) return; const next=G.rank+1; G.gold-=RANK_GOLD[next]; closeLayer();
  const rg=REGIONS[G.realm*3]; const lv=RANK_LV[next]+5; const st=mobStats(lv,true); const god=R.trials[G.rank];

  m.mesh.scale.set(1.6,1.6,1.6); m.mesh.position.set(m.x,0,m.z); scene.add(m.mesh); mobs.push(m); P.trial={m,t:90,next};
  toast(`승급 시험: ${god}`,"90초 안에 이기면 "+R.ranks[next]+"(으)로 승급!",3); tone(80,.6,"sawtooth",0,.2); buzz([80,40,80]); }
function finishTrial(win){ const T=P.trial; if(!T) return; P.trial=null; const R=RM();
  if(win){ G.rank=T.next; buildPlayer(); P.hp=stat().mhp; toast(`승급! ${R.ranks[G.rank]}`,G.rank===6?`${R.absolute} 바로 아래, 최고 계급!`:"더 강해졌어요 · 새 장비를 낄 수 있어요",3.5); jingle([523,659,784,1046,1318,1568]); fxRing(P.x,P.z,R.c1,14,1.2); net.send({t:"say",m:`${R.ranks[G.rank]}(으)로 승급했다!`}); questEvent("rank"); }
  else { if(T.m&&mobs.indexOf(T.m)>=0) removeMob(T.m); toast("시험 실패…","비용의 절반을 돌려받았어요",2.5); G.gold+=Math.round(RANK_GOLD[T.next]*.5); }

function tickTerritory(dt){ const rg=regionAt(P.x,P.z); $("region").innerHTML=rg?`${rg.n} <b>${W.o[rg.id]>=0?REALMS[W.o[rg.id]].n+" 영토":"중립"}</b>`:"황야";
  if(!rg||rg.cap||P.dead){ P.capProg=0; P.capRg=-1; return; }

  if(d<8&&W.o[rg.id]!==G.realm){ let blocked=false; for(const id in PEERS){ const o=PEERS[id]; if(o.realm===W.o[rg.id]&&!o.dead&&Math.hypot(o.x-g.position.x,o.z-g.position.z)<16) blocked=true; }
    if(blocked){ toast("상대 세계 플레이어가 제단을 지키고 있어요",null,.6); return; }
    if(P.capRg!==rg.id){ P.capRg=rg.id; P.capProg=0; } P.capProg+=dt/12; g.userData.orb.scale.setScalar(1.3+Math.sin(performance.now()/120)*.3);

    if(P.capProg>=1){ W.o[rg.id]=G.realm; W.ts[rg.id]=Date.now(); G.capt++; saveWorld(); paintTerritory(); net.send({t:"cap",o:W.o,ts:W.ts}); net.pushWorld(); toast(`${rg.n}을(를) ${RM().n} 영토로!`,`영토 ${terrBonus()}곳 · 공격 +${terrBonus()*3}%`,3); jingle([523,659,784,1046]); fxRing(g.position.x,g.position.z,RM().c1,16,1.2); G.gold+=60; gainXp(80+G.lv*10); questEvent("cap",rg); P.capProg=0; P.capRg=-1; saveGame(); } }
  else { P.capProg=0; P.capRg=-1; g.userData.orb.scale.setScalar(1.3); } }

/* ================= 임무(롤) ================= */
function newQuest(){ const rg=REGIONS.filter(r=>!r.cap&&Math.abs(r.lv[0]-G.lv)<14); const R=RM(); const kinds=["kill","kill","visit","cap","boss"]; if(G.rank<6&&G.lv>=RANK_LV[G.rank+1]) kinds.push("rank"); const k=pick(kinds);
  if(k==="kill"){ const mob=pick(R.mobs); const n=rint(5,10); return {k,mob:mob.n,n,c:0,txt:`${mob.n} ${n}마리 처치`,gold:30+G.lv*6,xp:40+G.lv*12}; }
  if(k==="visit"){ const r=pick(REGIONS.filter(r=>r.id!==G.realm*3)); return {k,rg:r.id,txt:`${r.n} 순례하기`,gold:25+G.lv*4,xp:30+G.lv*10}; }
  if(k==="cap"){ const r=pick(rg.filter(r=>W.o[r.id]!==G.realm)||rg); if(!r) return newQuest(); return {k,rg:r.id,txt:`${r.n} 제단 점령`,gold:80+G.lv*10,xp:90+G.lv*18}; }
  if(k==="boss"){ return {k,txt:"보스 1마리 처치",gold:120+G.lv*12,xp:120+G.lv*20}; }
  return {k,txt:`승급 시험 통과 (${R.ranks[G.rank+1]})`,gold:200+G.lv*15,xp:150+G.lv*25}; }
function ensureQuests(){ let guard=0; while(G.quests.length<3&&guard++<30){ const q=newQuest(); if(!G.quests.some(x=>x.txt===q.txt)) G.quests.push(q); } renderQuests(); }
function questEvent(type,obj){ let ch=false; G.quests.forEach(q=>{ if(q.done) return;
  if(type==="kill"&&q.k==="kill"&&obj.n===q.mob){ q.c++; if(q.c>=q.n) q.done=true; ch=true; }
  if(type==="kill"&&q.k==="boss"&&obj.boss){ q.done=true; ch=true; }
  if(type==="visit"&&q.k==="visit"&&obj.id===q.rg){ q.done=true; ch=true; }
  if(type==="cap"&&q.k==="cap"&&obj.id===q.rg){ q.done=true; ch=true; }
  if(type==="rank"&&q.k==="rank"){ q.done=true; ch=true; } });
  if(ch){ renderQuests(); const d=G.quests.find(q=>q.done); if(d) toast("임무 완료!","임무 창에서 보상을 받아요",1.6); } }
function claimQuest(i){ const q=G.quests[i]; if(!q||!q.done) return; G.gold+=q.gold; gainXp(q.xp); G.qdone++; G.quests.splice(i,1); jingle([659,784,1046]); toast(`보상: 금화 ${q.gold} · 경험치 ${q.xp}`); ensureQuests(); saveGame(); }
function renderQuests(){ $("quest").innerHTML=G.quests.map((q,i)=>`<div class="q${q.done?" done":""}" data-i="${i}">${q.done?"✔ ":""}${q.txt}${q.k==="kill"?` <small>${q.c}/${q.n}</small>`:""}</div>`).join(""); $("quest").querySelectorAll(".q").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(G.quests[i].done) claimQuest(i); else showQuests(); }); }

/* ================= 미니맵 ================= */
const mm=$("minimap"), mctx=mm.getContext("2d");
function drawMinimap(ctxIn,size){ const ctx=ctxIn||mctx, S=size||mm.width; const big=!!ctxIn; ctx.clearRect(0,0,S,S);
  const half=big?WORLD_HALF:95, cx=big?0:P.x, cz=big?0:P.z; const k=S/(half*2); const tx=x=>(x-cx+half)*k, tz=z=>(z-cz+half)*k;
  ctx.save(); if(!big){ ctx.beginPath(); ctx.arc(S/2,S/2,S/2-2,0,6.3); ctx.clip(); }
  REALMS.forEach((R,i)=>{ const sx=(i===0||i===2)?1:-1, sz=(i>=2)?1:-1; ctx.fillStyle=R.ground; ctx.globalAlpha=.5; ctx.fillRect(tx(sx>0?0:-WORLD_HALF),tz(sz>0?0:-WORLD_HALF),WORLD_HALF*k,WORLD_HALF*k); }); ctx.globalAlpha=1;
  ctx.fillStyle="#2a2340"; ctx.fillRect(tx(-WORLD_HALF)-S,0,S,S); ctx.fillRect(tx(WORLD_HALF),0,S,S); ctx.fillRect(0,tz(-WORLD_HALF)-S,S,S); ctx.fillRect(0,tz(WORLD_HALF),S,S);
  REGIONS.forEach(rg=>{ const o=W.o[rg.id]; ctx.beginPath(); ctx.arc(tx(rg.x),tz(rg.z),rg.r*k,0,6.3); ctx.fillStyle=o>=0?REALMS[o].c1:"#8a8a9a"; ctx.globalAlpha=rg.cap?.85:.5; ctx.fill(); ctx.globalAlpha=1; ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.stroke();
    if(rg.cap){ ctx.fillStyle="#1b1430"; ctx.font=`${Math.round(S*(big?.06:.09))}px sans-serif`; ctx.textAlign="center"; ctx.fillText(REALMS[rg.realm].icon,tx(rg.x),tz(rg.z)+S*.025); }
    if(!big){ ctx.fillStyle="#fff"; ctx.font=`${Math.round(S*.075)}px sans-serif`; ctx.textAlign="center"; ctx.shadowColor="#000"; ctx.shadowBlur=3; ctx.fillText(rg.n,tx(rg.x),tz(rg.z)+(rg.cap?S*.12:S*.03)); ctx.shadowBlur=0; }
    // 제단 점
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(tx(TERR_RINGS[rg.id].position.x),tz(TERR_RINGS[rg.id].position.z),S*.012,0,6.3); ctx.fill(); });
  mobs.forEach(m=>{ ctx.fillStyle=m.boss?"#ffcf4a":"rgba(255,90,95,.8)"; ctx.beginPath(); ctx.arc(tx(m.x),tz(m.z),S*(m.boss?.02:.01),0,6.3); ctx.fill(); });
  for(const id in PEERS){ const o=PEERS[id]; ctx.fillStyle=o.realm===G.realm?"#3fd27a":"#ff5a5f"; ctx.beginPath(); ctx.arc(tx(o.x),tz(o.z),S*.022,0,6.3); ctx.fill(); ctx.strokeStyle="#000"; ctx.stroke(); }
  if(player){ ctx.save(); ctx.translate(tx(P.x),tz(P.z)); ctx.rotate(-P.rot); ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-S*.035); ctx.lineTo(S*.025,S*.025); ctx.lineTo(-S*.025,S*.025); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.restore(); }
let mmT=0;
</script>
<script>
/* ================= 아주 작은 MQTT 클라이언트 (웹소켓) — 외부 라이브러리 없이 ================= */
function MiniMQTT(url,opt){
  const self={url,ok:false,ws:null,buf:new Uint8Array(0),pid:1,pingT:null,retry:null,closed:false,subs:[],opt};
  const enc=new TextEncoder(), dec=new TextDecoder();
  function str(s){ const b=enc.encode(s); const o=new Uint8Array(b.length+2); o[0]=b.length>>8; o[1]=b.length&255; o.set(b,2); return o; }
  function cat(arr){ let n=0; arr.forEach(a=>n+=a.length); const o=new Uint8Array(n); let p=0; arr.forEach(a=>{ o.set(a,p); p+=a.length; }); return o; }
  function pkt(type,body){ const len=[]; let x=body.length; do{ let d=x%128; x=Math.floor(x/128); if(x>0) d|=128; len.push(d); }while(x>0); return cat([new Uint8Array([type]),new Uint8Array(len),body]); }
  function send(u8){ try{ if(self.ws&&self.ws.readyState===1) self.ws.send(u8); }catch(e){} }
  function connect(){ if(self.closed) return; let ws; try{ ws=new WebSocket(url,"mqtt"); }catch(e){ schedule(); return; } ws.binaryType="arraybuffer"; self.ws=ws;
    const to=setTimeout(()=>{ try{ ws.close(); }catch(e){} },9000);
    ws.onopen=()=>{ const body=cat([str("MQTT"),new Uint8Array([4,2,0,opt.keepalive||25]),str(opt.clientId)]); send(pkt(0x10,body)); };
    ws.onmessage=ev=>{ const d=new Uint8Array(ev.data); self.buf=cat([self.buf,d]); parse(); };
    ws.onclose=()=>{ clearTimeout(to); if(self.ok){ self.ok=false; opt.onclose&&opt.onclose(); } clearInterval(self.pingT); schedule(); };
    ws.onerror=()=>{};
    function parse(){ for(;;){ const b=self.buf; if(b.length<2) return; let mul=1,len=0,i=1; for(;;){ if(i>=b.length) return; const d=b[i++]; len+=(d&127)*mul; mul*=128; if(!(d&128)) break; } if(b.length<i+len) return; const type=b[0]>>4, body=b.subarray(i,i+len); self.buf=b.subarray(i+len);
        if(type===2){ if(body[1]===0){ self.ok=true; clearTimeout(to); self.pingT=setInterval(()=>send(new Uint8Array([0xC0,0])),(opt.keepalive||25)*1000*.6); self.subs.forEach(t=>subscribe(t)); opt.onconnect&&opt.onconnect(); } else { try{ ws.close(); }catch(e){} } }
        else if(type===3){ const qos=(b[0]>>1)&3; const tl=(body[0]<<8)|body[1]; const topic=dec.decode(body.subarray(2,2+tl)); let p=2+tl; if(qos>0) p+=2; const retain=b[0]&1; opt.onmessage&&opt.onmessage(topic,dec.decode(body.subarray(p)),!!retain); } } }
  }
  function schedule(){ if(self.closed) return; clearTimeout(self.retry); self.retry=setTimeout(connect,3000+Math.random()*2000); }
  function subscribe(t){ if(self.subs.indexOf(t)<0) self.subs.push(t); if(!self.ok) return; const id=self.pid++; send(pkt(0x82,cat([new Uint8Array([id>>8,id&255]),str(t),new Uint8Array([0])]))); }
  function publish(t,msg,retain){ if(!self.ok) return; send(pkt(0x30|(retain?1:0),cat([str(t),enc.encode(msg)]))); }
  function close(){ self.closed=true; clearInterval(self.pingT); clearTimeout(self.retry); try{ self.ws&&self.ws.close(); }catch(e){} }
  connect(); return {subscribe,publish,close,get ok(){ return self.ok; }};
}

/* ================= 함께하기: 같은 초대 링크(방)의 모든 폰이 공개 중계 서버 4곳에 동시에 연결 ================= */
const PEERS={};   // 다른 플레이어들
const net=(function(){
  const BROKERS=window.GW_BROKERS||["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://mqtt.eclipseprojects.io:443/mqtt","wss://test.mosquitto.org:8081"];
  const ROOT="chk0702/godswar/"+ROOM+"/"; const TOPIC=ROOT+"all", WTOPIC=ROOT+"world";
  const N={clients:[],up:0,seq:0,seen:{},seenN:0,sendT:0,started:false,hiT:0,worldT:0,lastWorld:""};
  function dots(){ N.clients.forEach((c,i)=>{ const d=$("netPill").querySelector(`.dot[data-i="${i}"]`); if(d) d.classList.toggle("on",c.ok); }); const n=Object.keys(PEERS).length; $("netTxt").textContent=N.up>0?(n>0?`${n}명과 함께`:"접속 중 · 친구 기다리는 중"):"연결 중…"; }
  function start(){ if(N.started||G.realm<0||!ROOM) return; N.started=true; if(!/^https?:/.test(location.protocol)){ $("netTxt").textContent="앱에서만 함께하기 가능"; return; }
    BROKERS.forEach((url,i)=>{ const c=MiniMQTT(url,{clientId:"gw_"+G.id+"_"+i+"_"+Math.random().toString(36).slice(2,6),keepalive:25,
      onconnect:()=>{ N.up++; c.subscribe(TOPIC); c.subscribe(WTOPIC); dots(); hello(); },
      onclose:()=>{ N.up=Math.max(0,N.up-1); dots(); },
      onmessage:(topic,msg,retain)=>{ let d; try{ d=JSON.parse(msg); }catch(e){ return; } if(topic===WTOPIC){ mergeWorld(d); return; } recv(d); } });
      N.clients.push(c); }); dots(); }
  function send(o){ if(!N.started) return; o.i=G.id; o.q=++N.seq; const s=JSON.stringify(o); N.clients.forEach(c=>{ try{ c.publish(TOPIC,s); }catch(e){} }); }
  function pushWorld(){ const s=JSON.stringify(W); N.clients.forEach(c=>{ try{ c.publish(WTOPIC,s,true); }catch(e){} }); }
  function hello(){ send({t:"hi",n:G.name,r:G.realm,k:G.rank,l:G.lv}); }
  function ensure(id,d){ let o=PEERS[id]; if(!o){ o=PEERS[id]={id,name:d.n||"?",realm:d.r||0,rank:d.k||0,lv:d.l||1,x:d.x||0,z:d.z||0,tx:d.x||0,tz:d.z||0,tf:0,m:0,walk:0,hp:1,mhp:1,dead:false,last:performance.now(),mesh:null,lbl:makeLabel(""),w:-1,anim:0};
      o.mesh=makeAvatar(o.realm,o.rank,false); scene.add(o.mesh); o.mesh.position.set(o.x,0,o.z); toast(`${o.name} 입장!`,`${REALMS[o.realm].n} · ${REALMS[o.realm].ranks[o.rank]}`,2.2); jingle([523,659,784]); dots(); }
    return o; }
  function rebuild(o){ scene.remove(o.mesh); o.mesh=makeAvatar(o.realm,o.rank,false); scene.add(o.mesh); o.mesh.position.set(o.x,0,o.z); if(o.w>=0){ const w=makeWeapon(o.realm,o.w); w.position.set(0,-1.2,.3); o.mesh.userData.armR.add(w); } }
  function recv(d){ if(!d||!d.t||!d.i||d.i===G.id) return; const key=d.i+":"+d.q; if(N.seen[key]) return; N.seen[key]=1; if(++N.seenN>600){ N.seen={}; N.seenN=0; }
    if(!PEERS[d.i]&&d.t!=="hi"&&d.t!=="st") return; const o=ensure(d.i,d); o.last=performance.now();
    if(d.t==="hi"){ if(o.realm!==d.r||o.rank!==d.k){ o.realm=d.r; o.rank=d.k; rebuild(o); } o.name=d.n; o.lv=d.l; }
    else if(d.t==="st"){ if(d.n) o.name=d.n; o.tx=d.x; o.tz=d.z; o.tf=d.f; o.m=d.m; o.hp=d.h; o.mhp=d.H; o.lv=d.l; o.dead=!!d.D; if(o.rank!==d.k||o.realm!==d.r||o.w!==d.w){ o.rank=d.k; o.realm=d.r; o.w=d.w; rebuild(o); } o.mesh.visible=!o.dead; }
    else if(d.t==="a"){ o.anim=.3; if(d.k==="skl") fxRing(o.x,o.z,REALMS[o.realm].skills[0].color,6,.5); }
    else if(d.t==="hit"){ if(d.to!==G.id||P.dead) return; if(inCapital(P.x,P.z)) return; const st=stat(); hurtPlayer(d.d*(1-dmgReduce(st.def))*.7,o.name); toast(`${o.name}의 공격!`,null,.8); }
    else if(d.t==="dead"){ if(d.by===G.name){ G.war++; G.gold+=40+o.lv*5; gainXp(60+o.lv*12); toast(`${o.name} 격파!`,`전쟁 점수 +1 · 금화 +${40+o.lv*5}`,2.6); jingle([659,784,1046,1318]); saveGame(); } else toast(`${o.name}이(가) 쓰러졌어요`,null,1.4); }
    else if(d.t==="cap"){ if(mergeWorld({o:d.o,ts:d.ts})) toast(`${o.name}이(가) 영토를 점령했어요!`,`${REALMS[o.realm].n} 세력 확장`,2.4); }
    else if(d.t==="say"){ chat(o.name,d.m,o.realm); } }
  function chat(who,m,realm){ const el=document.createElement("div"); el.className="msg"; el.innerHTML=`<b style="color:${realm>=0?REALMS[realm].c1:"#fff"}">${who}</b> ${m}`; $("chat").appendChild(el); setTimeout(()=>el.remove(),6000); tone(880,.05,"sine",0,.05); }
  function tick(dt){ if(!N.started) return;
    const now=performance.now();
    for(const id in PEERS){ const o=PEERS[id]; if(now-o.last>8000){ scene.remove(o.mesh); o.lbl.remove(); toast(`${o.name} 퇴장`,null,1.4); delete PEERS[id]; dots(); continue; }
      const p=o.mesh.position; const dx=o.tx-p.x, dz=o.tz-p.z; if(Math.hypot(dx,dz)>40){ p.x=o.tx; p.z=o.tz; } else { p.x+=dx*Math.min(1,dt*8); p.z+=dz*Math.min(1,dt*8); } o.x=p.x; o.z=p.z;
      let dr=o.tf-o.mesh.rotation.y; while(dr>Math.PI) dr-=Math.PI*2; while(dr<-Math.PI) dr+=Math.PI*2; o.mesh.rotation.y+=dr*Math.min(1,dt*12);
      if(o.m) o.walk+=dt*9; const u=o.mesh.userData, sw=o.m?Math.sin(o.walk)*.7:0; u.legL.rotation.x=sw; u.legR.rotation.x=-sw; u.armL.rotation.x=-sw; o.anim=Math.max(0,o.anim-dt); u.armR.rotation.x=o.anim>0?-2.2:sw; u.body.position.y=o.m?Math.abs(Math.sin(o.walk))*.12:0;
      if(Math.hypot(o.x-P.x,o.z-P.z)<60&&!o.dead){ const foe=o.realm!==G.realm; o.lbl.className="lbl "+(foe?"foe":"ally"); placeLabel(o.lbl,o.x,4.6,o.z,`${o.name} <b>${REALMS[o.realm].n} · ${REALMS[o.realm].ranks[o.rank]} Lv.${o.lv}</b><span class="hp"><i style="width:${Math.round(o.hp/o.mhp*100)}%;background:${foe?"#ff5a5f":"#3fd27a"}"></i></span>`); } else o.lbl.style.display="none"; }
    if(N.up>0){ N.sendT-=dt; if(N.sendT<=0){ N.sendT=.16; send({t:"st",n:G.name,x:+P.x.toFixed(1),z:+P.z.toFixed(1),f:+P.rot.toFixed(2),m:P.moving?1:0,h:Math.round(P.hp),H:stat().mhp,l:G.lv,k:G.rank,r:G.realm,w:G.eq.w,D:P.dead?1:0}); }
      N.hiT-=dt; if(N.hiT<=0){ N.hiT=6; hello(); } N.worldT-=dt; if(N.worldT<=0){ N.worldT=45; pushWorld(); } } }
  return {start,send,tick,pushWorld,chat,get up(){ return N.up; }};
})();
</script>
<script>
/* ================= 조작 ================= */
const joyEl=$("joy"), knob=$("knob"); let joy=null;
canvas.addEventListener("pointerdown",e=>{ initAudio(); if(joy) return; joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0}; joyEl.hidden=false; joyEl.style.left=e.clientX+"px"; joyEl.style.top=e.clientY+"px"; knob.style.transform=""; });
addEventListener("pointermove",e=>{ if(!joy||e.pointerId!==joy.id) return; let dx=e.clientX-joy.x, dy=e.clientY-joy.y; const L=Math.hypot(dx,dy), Rr=52; if(L>Rr){ dx*=Rr/L; dy*=Rr/L; } joy.dx=dx/Rr; joy.dy=dy/Rr; knob.style.transform=`translate(${dx}px,${dy}px)`; });
const endJoy=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; joyEl.hidden=true; } };
addEventListener("pointerup",endJoy); addEventListener("pointercancel",endJoy);
const keys={}; addEventListener("keydown",e=>{ keys[e.key.toLowerCase()]=1; if(e.key===" ") jump(); if(e.key.toLowerCase()==="j") attack(); if(e.key.toLowerCase()==="k") useSkill(0); if(e.key.toLowerCase()==="u") useSkill(1); if(e.key.toLowerCase()==="i") useSkill(2); if(e.key.toLowerCase()==="l") usePotion(); }); addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=0; });
function jump(){ if(P.dead||P.y>0.01) return; P.vy=9; tone(300,.08,"triangle"); }
const hold=(el,fn,rep)=>{ let t=null; el.addEventListener("pointerdown",e=>{ e.preventDefault(); initAudio(); fn(); if(rep){ clearInterval(t); t=setInterval(fn,rep); } }); const stop=()=>{ clearInterval(t); t=null; }; el.addEventListener("pointerup",stop); el.addEventListener("pointercancel",stop); el.addEventListener("pointerleave",stop); };
hold($("bAtk"),attack,120); hold($("bSkill0"),()=>useSkill(0)); hold($("bSkill1"),()=>useSkill(1)); hold($("bSkill2"),()=>useSkill(2)); hold($("bPot"),usePotion); hold($("bJump"),jump);

let started=false, last=performance.now(), skyCur=new THREE.Color(0x9fd4ff), fogCur=new THREE.Color(0xdcefff);
function update(dt){
  const st=stat(); if(P.hp>st.mhp) P.hp=st.mhp;
  P.atkCd-=dt; for(let i=0;i<3;i++) P.sklCd[i]=Math.max(0,P.sklCd[i]-dt); P.rage=Math.max(0,P.rage-dt); P.haste=Math.max(0,P.haste-dt); P.combat=Math.max(0,P.combat-dt); if(P.combat<=0&&!P.dead&&P.hp<st.mhp) P.hp=Math.min(st.mhp,P.hp+st.mhp*.025*dt); P.atkAnim=Math.max(0,P.atkAnim-dt); P.invul=Math.max(0,P.invul-dt); P.slow=Math.max(0,P.slow-dt); P.weak=Math.max(0,P.weak-dt); P.shadow=Math.max(0,P.shadow-dt); P.dizzy=Math.max(0,P.dizzy-dt); P.heat=Math.max(0,P.heat-dt);
  // 이동
  let ix=0,iz=0; if(joy&&!layerOpen){ ix+=joy.dx; iz+=joy.dy; } if(keys.a||keys.arrowleft) ix-=1; if(keys.d||keys.arrowright) ix+=1; if(keys.w||keys.arrowup) iz-=1; if(keys.s||keys.arrowdown) iz+=1;
