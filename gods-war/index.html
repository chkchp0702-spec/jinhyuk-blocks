<script>
/* ================= v15: 날아가는 무기(화살·창·도끼·망치·마법탄) =================
   - 공용 투사체 PROJ: 포물선/직선으로 날아가 맞으면 데미지. 화살은 땅에 잠깐 꽂혀 있음.
   - 내 무기 종류(weaponKindOf): 활 → 기본 공격이 화살(16걸음), 지팡이·마법봉 → 마법탄(14걸음), 창 → 찌르기 거리 김.
   - 「던지기」 버튼(키 O): 무기마다 다름 — 창 던지기 · 손도끼 · 돌아오는 망치(번개) · 단검 3개 부채꼴 · 화살비 · 큰 불덩이.
   - 전쟁 병사(궁수·창병)도 같은 투사체를 씀(04b-war.js). */
const PROJ=[];
const PMAT={ wood:mat({color:0x8a5a30,roughness:.8}), iron:mat({color:0xc9ced8,metalness:.8,roughness:.3}), feather:mat({color:0xf4f0e6,roughness:.9}), red:mat({color:0xd83a3a,roughness:.8}), gold:mat({color:0xffd05a,metalness:.6,roughness:.3}) };
function weaponKindOf(w){ w=String(w||""); if(/bow/i.test(w)) return "bow"; if(/Spear|trident/i.test(w)) return "spear"; if(/staff|Staff|wand|Wand/.test(w)) return "magic"; if(/hammer|Wrench/i.test(w)) return "hammer"; if(/axe/i.test(w)) return "axe"; if(/dagger/i.test(w)) return "dagger"; return w?"sword":"fist"; }
function myWeaponKind(){ try{ const s=lookSpec(G.realm,G.rank,G.look||{},G.eq); return weaponKindOf(s.weapon); }catch(e){ return "sword"; } }
const THROW={ spear:{n:"창 던지기",cd:3,mult:2.6,r:2.2,speed:34,arc:.5,kind:"javelin"}, axe:{n:"손도끼",cd:2.5,mult:2.2,r:2,speed:26,arc:.35,kind:"axe"}, hammer:{n:"돌아오는 망치",cd:4,mult:2.4,r:3.5,speed:28,arc:.15,kind:"hammer",back:1,zap:1},
  dagger:{n:"단검 부채",cd:3,mult:1.25,r:1.6,speed:32,arc:.1,kind:"dagger",fan:3}, sword:{n:"단검 부채",cd:3,mult:1.25,r:1.6,speed:32,arc:.1,kind:"dagger",fan:3}, fist:{n:"돌 던지기",cd:2.5,mult:1.4,r:1.6,speed:26,arc:.5,kind:"rock"},
  bow:{n:"화살비",cd:5,mult:1.1,r:2,speed:30,arc:1,kind:"arrow",rain:6}, magic:{n:"큰 불덩이",cd:4,mult:2.7,r:4.2,speed:20,arc:.25,kind:"orb",big:1} };
function makeProjMesh(kind,color){ const g=new THREE.Group(); const inner=new THREE.Group(); g.add(inner);
  if(kind==="arrow"||kind==="javelin"){ const L=kind==="javelin"?2.6:1.5, r=kind==="javelin"?.06:.035; const sh=cyl(r,r,L,PMAT.wood,0,0,0,6); sh.rotation.x=Math.PI/2; inner.add(sh); const hd=new THREE.Mesh(GEO.cone,PMAT.iron); hd.scale.set(r*4,kind==="javelin"?.45:.3,r*4); hd.rotation.x=Math.PI/2; hd.position.z=L/2+.12; inner.add(hd);
    if(kind==="arrow"){ [-1,1].forEach(s=>{ const f=box(.02,.16,.32,color!=null?mat({color}):PMAT.feather,s*.06,0,-L/2+.15); inner.add(f); const f2=box(.16,.02,.32,color!=null?mat({color}):PMAT.feather,0,s*.06,-L/2+.15); inner.add(f2); }); } }
  else if(kind==="axe"){ inner.add(cyl(.04,.05,.9,PMAT.wood,0,0,0,6)); const b=box(.5,.36,.06,PMAT.iron,.2,.32,0); inner.add(b); inner.userData.spin=1; }
  else if(kind==="hammer"){ inner.add(cyl(.05,.06,.9,PMAT.wood,0,0,0,6)); inner.add(box(.7,.42,.42,mat({color:0xb8c6e0,metalness:.8,roughness:.25,emissive:0x2a58ff,emissiveIntensity:.35}),0,.5,0)); inner.add(sph(.55,glowMat(0x7ab8ff,.45),0,.4,0)); inner.userData.spin=1; }
  else if(kind==="dagger"){ inner.add(box(.05,.05,.32,PMAT.gold,0,0,-.2)); const bl=box(.12,.03,.62,PMAT.iron,0,0,.25); inner.add(bl); }
  else if(kind==="rock"){ inner.add(sph(.28,mat({color:0x8a8478,roughness:1}),0,0,0)); inner.userData.spin=1; }
  else { const c=color!=null?color:0xff8a3d; inner.add(sph(.45,mat({color:0xffffff,emissive:c,emissiveIntensity:2}),0,0,0)); inner.add(sph(.85,glowMat(c,.55),0,0,0)); g.userData.glow=c; }
  g.userData.inner=inner; return g; }
/* o: {x,y,z, tx,tz, ty?, kind, speed, arc, dmg, crit, r, hits:"mobs"|"player"|"units", side, target, color, back, zap, cosmetic, owner} */
function fireProj(o){ const mesh=makeProjMesh(o.kind,o.color); const y0=(o.y!=null?o.y:2)+hAt(o.x,o.z); const ty=(o.ty!=null?o.ty:1.2)+hAt(o.tx,o.tz); const d=Math.max(.5,Math.hypot(o.tx-o.x,o.tz-o.z)); const T=Math.max(.12,d/(o.speed||28)); const g=28*(o.arc||0);
  const p=Object.assign({},o,{mesh,t:0,T,vx:(o.tx-o.x)/T,vz:(o.tz-o.z)/T,vy:(ty-y0+.5*g*T*T)/T,g,y:y0,px:o.x,pz:o.z,stuck:0}); mesh.position.set(o.x,y0,o.z); scene.add(mesh); PROJ.push(p); return p; }
function projImpact(p){ const ix=p.mesh.position.x, iz=p.mesh.position.z; const R=p.r||1.5; let hitAny=false;
  if(p.cosmetic){ fxSpark(ix,.6,iz,p.mesh.userData.glow||0xcfc4ac,6); return false; }
  if(p.hits==="mobs"){ mobs.forEach(m=>{ if(m.hp<=0) return; const big=m.titan?6.5:m.scale>1.5?1.4:0; if(Math.hypot(m.x-ix,m.z-iz)<R+big){ damageMob(m,p.dmg*(p.crit?1.8:1)*rnd(.92,1.08),p.crit); hitAny=true; } });
    for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; if(Math.hypot(o.x-ix,o.z-iz)<R){ const dmg=Math.round(p.dmg*.55); net.send({t:"hit",to:id,d:dmg}); floatDmg(o.x,4,o.z,"-"+fmt(dmg)); hitAny=true; } } }
  else if(p.hits==="player"){ if(!P.dead&&Math.hypot(P.x-ix,P.z-iz)<R+.4){ hurtPlayer(p.dmg*(1-dmgReduce(stat().def)),p.owner||"화살"); hitAny=true; } }
  else if(p.hits==="units"){ const t=p.target; if(t&&!t.dead&&Math.hypot(t.x-ix,t.z-iz)<R+.6){ t.hp-=p.dmg*rnd(.85,1.15); t.hit=.15; if(t.hp<=0&&typeof unitDie==="function") unitDie(t); hitAny=true; } }
  if(p.zap){ fxBolt(ix,iz,0x7ab8ff); fxRing(ix,iz,0x7ab8ff,p.r*1.6,.4); thud(); }
  if(p.kind==="orb"){ fxFlash(ix,1,iz,p.mesh.userData.glow||0xff8a3d,p.big?4:1.6,.35); fxSpark(ix,1,iz,p.mesh.userData.glow||0xff8a3d,p.big?40:14); if(p.big){ fxRing(ix,iz,0xff8a3d,p.r*1.8,.5); thud(); } }
  else fxSpark(ix,1,iz,hitAny?0xffffff:0xcfc4ac,hitAny?10:5);
  return hitAny; }
function tickProj(dt){ for(let i=PROJ.length-1;i>=0;i--){ const p=PROJ[i]; const m=p.mesh;
    if(p.stuck>0){ p.stuck-=dt; if(p.stuck<=0){ scene.remove(m); PROJ.splice(i,1); } continue; }
    if(p.returning){ const tx=p.ownerObj?p.ownerObj.x:P.x, tz=p.ownerObj?p.ownerObj.z:P.z; const dx=tx-m.position.x, dz=tz-m.position.z, L=Math.hypot(dx,dz); if(L<1.5){ scene.remove(m); PROJ.splice(i,1); continue; } const sp=32*dt; m.position.x+=dx/L*Math.min(L,sp); m.position.z+=dz/L*Math.min(L,sp); m.position.y+=(hAt(m.position.x,m.position.z)+2-m.position.y)*Math.min(1,dt*6); p.mesh.userData.inner.rotation.x+=dt*22; continue; }
    p.t+=dt; const t=Math.min(p.t,p.T); const nx=p.x+p.vx*t, nz=p.z+p.vz*t, ny=p.y+p.vy*t-.5*p.g*t*t;
    // 날아가는 방향으로 머리 돌리기
    const dx=nx-m.position.x, dy=ny-m.position.y, dz=nz-m.position.z; m.position.set(nx,ny,nz);
    if(p.kind==="arrow"||p.kind==="javelin"||p.kind==="dagger"){ if(Math.hypot(dx,dy,dz)>1e-4) m.lookAt(nx+dx,ny+dy,nz+dz); }
    else if(m.userData.inner.userData.spin){ m.rotation.y=Math.atan2(p.vx,p.vz); m.userData.inner.rotation.x+=dt*20; }
    if(p.kind==="orb"&&Math.random()<dt*30) fxSpark(nx,ny-hAt(nx,nz),nz,m.userData.glow||0xff8a3d,2);
    // 날아가는 중에 표적에 닿으면 바로 맞음(직선형)
    let early=false; if(!p.cosmetic&&p.hits==="mobs"&&p.t<p.T){ for(const mb of mobs){ if(mb.hp<=0) continue; const big=mb.titan?6.5:mb.scale>1.5?1.4:0; if(Math.hypot(mb.x-nx,mb.z-nz)<.9+big&&ny-hAt(nx,nz)<4+big){ early=true; break; } } }
    if(p.t>=p.T||early){ projImpact(p); if(p.back){ p.returning=true; continue; } if((p.kind==="arrow"||p.kind==="javelin")&&!early){ p.stuck=2.2; m.position.y=Math.max(hAt(nx,nz)+.2,ny); continue; } scene.remove(m); PROJ.splice(i,1); } } }

/* ---- 내 원거리 기본 공격(활·마법) ---- */
function nearestFoe(range){ let best=null,bd=1e9; mobs.forEach(m=>{ if(m.hp<=0) return; const d=Math.hypot(m.x-P.x,m.z-P.z); if(d<range&&d<bd){ bd=d; best=m; } }); for(const id in PEERS){ const o=PEERS[id]; if(o.realm===G.realm||o.dead||inCapital(o.x,o.z)||inCapital(P.x,P.z)) continue; const d=Math.hypot(o.x-P.x,o.z-P.z); if(d<range&&d<bd){ bd=d; best=o; } } return best; }
function rangedAttack(kind){ const range=(kind==="bow"?16:14)+((typeof DG!=="undefined"&&DG.on&&DG.plan&&DG.plan.floors[DG.f].k==="shoot")?10:0); P.atkCd=kind==="bow"?.42:.5; P.atkAnim=.25; P.combat=4; if(player.userData.gl) animState(player,"attack"); const st=stat();
  const tg=nearestFoe(range); if(tg) P.rot=Math.atan2(tg.x-P.x,tg.z-P.z); if(player) player.rotation.y=P.rot;
  const tx=tg?tg.x:P.x+Math.sin(P.rot)*range, tz=tg?tg.z:P.z+Math.cos(P.rot)*range; const crit=Math.random()<st.crit;
  const sx=P.x+Math.sin(P.rot)*.8, sz=P.z+Math.cos(P.rot)*.8;
  if(kind==="bow"){ fireProj({x:sx,z:sz,y:2.1,tx,tz,ty:1.6,kind:"arrow",speed:38,arc:.18,dmg:st.atk*1.0,crit,r:1.3,hits:"mobs"}); tone(980,.04,"triangle",0,.06); tone(420,.08,"sine",.02,.05); }
  else { const c=RM().skills[0].color; fireProj({x:sx,z:sz,y:2.4,tx,tz,ty:1.6,kind:"orb",color:c,speed:24,arc:0,dmg:st.atk*1.05,crit,r:2,hits:"mobs"}); tone(660,.08,"sine",0,.07); tone(990,.06,"triangle",.03,.05); }
  net.send({t:"a",k:"atk",pj:[kind==="bow"?"arrow":"orb",+sx.toFixed(1),+sz.toFixed(1),+tx.toFixed(1),+tz.toFixed(1)]}); }
/* ---- 던지기 버튼 ---- */
let throwCd=0;
function throwWeapon(){ if(P.dead||layerOpen||throwCd>0) return; const kind=myWeaponKind(); const T=THROW[kind]||THROW.sword; throwCd=T.cd; const st=stat(); P.atkAnim=.35; P.combat=4; if(player.userData.gl) animState(player,"skill");
  const tg=nearestFoe(20); if(tg) P.rot=Math.atan2(tg.x-P.x,tg.z-P.z); if(player) player.rotation.y=P.rot; const range=18;
  const tx=tg?tg.x:P.x+Math.sin(P.rot)*range, tz=tg?tg.z:P.z+Math.cos(P.rot)*range; const sx=P.x+Math.sin(P.rot)*.8, sz=P.z+Math.cos(P.rot)*.8; const crit=Math.random()<st.crit; const sent=[];
  const shoot=(x,z,dly)=>{ const go=()=>{ fireProj({x:sx,z:sz,y:2.6,tx:x,tz:z,ty:1.4,kind:T.kind,speed:T.speed,arc:T.arc,dmg:st.atk*T.mult,crit,r:T.r,hits:"mobs",back:T.back,zap:T.zap,big:T.big,color:T.kind==="orb"?0xff7a2a:undefined}); }; if(dly) setTimeout(go,dly); else go(); sent.push([+x.toFixed(1),+z.toFixed(1)]); };
  if(T.fan){ for(let k=-1;k<=1;k++){ const a=P.rot+k*.22, d=Math.hypot(tx-P.x,tz-P.z)||12; shoot(P.x+Math.sin(a)*d,P.z+Math.cos(a)*d,0); } }
  else if(T.rain){ for(let k=0;k<T.rain;k++) shoot(tx+rnd(-3.5,3.5),tz+rnd(-3.5,3.5),k*70); fxRing(tx,tz,0xffe08a,8,.8); }
  else shoot(tx,tz,0);
  drama(RM().skills[0].color,.25,.6); tone(300,.12,"sawtooth",0,.1); tone(600,.1,"triangle",.05,.08); buzz(20);
  net.send({t:"a",k:"thr",pk:T.kind,sx:+sx.toFixed(1),sz:+sz.toFixed(1),pts:sent}); }
/* 친구가 쏜 것 — 보기만(데미지는 쏜 사람 폰이 계산) */
function peerProj(o,d){ try{ if(Math.hypot(o.x-P.x,o.z-P.z)>70) return; if(d.k==="atk"&&d.pj){ const a=d.pj; fireProj({x:a[1],z:a[2],y:2.1,tx:a[3],tz:a[4],ty:1.6,kind:a[0],speed:a[0]==="arrow"?38:24,arc:a[0]==="arrow"?.18:0,cosmetic:1,color:REALMS[o.realm].skills[0].color}); }
  if(d.k==="thr"&&d.pts){ const T=Object.values(THROW).find(t=>t.kind===d.pk)||THROW.sword; d.pts.forEach((p,k)=>setTimeout(()=>fireProj({x:d.sx,z:d.sz,y:2.6,tx:p[0],tz:p[1],ty:1.4,kind:d.pk,speed:T.speed,arc:T.arc,cosmetic:1,back:T.back,ownerObj:o,color:d.pk==="orb"?0xff7a2a:undefined}),T.rain?k*70:0)); } }catch(e){} }
function throwHud(){ const b=$("bThrow"); if(!b) return; const kind=myWeaponKind(); const T=THROW[kind]||THROW.sword; if(b._k!==kind){ b._k=kind; $("thrNm").textContent=T.n; } const tc=throwCd>0?Math.ceil(throwCd)+"초":""; if(b._tc!==tc){ b._tc=tc; $("thrCd").textContent=tc; } const pv=throwCd>0?Math.round(throwCd/T.cd*100)+"%":"0%"; if(b._pv!==pv){ b._pv=pv; $("thrCdV").style.setProperty("--p",pv); } }
</script>
<script>
/* ================= v15: 지도 — 구글 지도 느낌 =================
   - 바탕(한 번만 그림, 1024px): 진짜 지형 높이로 음영(언덕 그림자), 세계별 땅색, 바다, 숲(나무 자리), 물, 광장, 건물 지붕, 큰길(노란 도로)·수도 순환로(흰 길).
   - 매번 그리는 것: 영토(옅은 색 + 점선 경계), 제단, 지명(흰 테두리 글씨), 수도 빨간 핀, 전쟁·거대 보스 핀, 친구, 길 안내 파란 경로, 내 위치(파란 점 + 바라보는 방향 빛), 나침반·축척. */
const MAPB=WORLD_HALF+12, MAPN=1024;
let MAPBASE=null;
const MAPCOL={ land:[[0xe8,0xf1,0xdc],[0xee,0xf2,0xf6],[0xf4,0xea,0xd6],[0xe4,0xef,0xdc]], center:[0xec,0xe8,0xf2], rock:[0xd9,0xd5,0xca], snow:[0xfb,0xfc,0xfd], sea:[0xaa,0xda,0xff] };
function buildMapBase(){ const N=MAPN, c=document.createElement("canvas"); c.width=c.height=N; const ctx=c.getContext("2d"); const img=ctx.createImageData(N,N), D=img.data;
  const GN=257, hg=new Float32Array(GN*GN); const w2g=v=>(v+MAPB)/(2*MAPB)*(GN-1);
  for(let j=0;j<GN;j++) for(let i=0;i<GN;i++){ const x=-MAPB+i/(GN-1)*2*MAPB, z=-MAPB+j/(GN-1)*2*MAPB; hg[j*GN+i]=hAt(x,z); }
  const H=(gx,gz)=>{ gx=Math.max(0,Math.min(GN-1.001,gx)); gz=Math.max(0,Math.min(GN-1.001,gz)); const i=gx|0, j=gz|0, fx=gx-i, fz=gz-j; const a=hg[j*GN+i], b=hg[j*GN+i+1], c2=hg[(j+1)*GN+i], d=hg[(j+1)*GN+i+1]; return (a*(1-fx)+b*fx)*(1-fz)+(c2*(1-fx)+d*fx)*fz; };
  const sm=(a,b,t)=>{ t=Math.max(0,Math.min(1,(t-a)/(b-a))); return t*t*(3-2*t); }; const L=MAPCOL.land;
  for(let py=0;py<N;py++){ const z=-MAPB+(py+.5)/N*2*MAPB, gz=w2g(z); for(let px=0;px<N;px++){ const x=-MAPB+(px+.5)/N*2*MAPB, gx=w2g(x); const o=(py*N+px)*4;

<script>

// 탄막의 방에서는 기본 공격이 마법탄 (멀리 쏘기)

<script>
/* ================= v22-1: 🎣 신화 낚시와 쉬는 동안 통발 (IDEAS G11/3-4) =================
   물가(수도 분수·연꽃 연못·호수)에서 「🎣 낚시」 → 찌가 쏙 들어가면 움직이는 막대가 초록 칸에 올 때 「당기기」.
   세계마다 물고기 6종 도감(별 1~5개·크기 기록). 통발을 던져 두면 게임을 꺼 둔 동안에도 물고기가 들어옴.
   "오늘 가장 큰 물고기"는 내 캐릭터 정보(fb)에 실려 친구 화면 낚시 창·모험가 명부에 보임. */
function kday(t){ return Math.floor(((t||Date.now())+9*3600000)/86400000); }   // 한국 날짜 번호
const FISH=[
 [["생명수 송사리",1,8,"🐟"],["꽃잎 붕어",1,16,"🐟"],["무지개 송어",2,32,"🐠"],["황금 잉어",3,48,"🐠"],["날개 달린 가오리",4,75,"🪽"],["빛나는 생명나무 물고기",5,95,"✨"]],
 [["얼음 빙어",1,10,"🐟"],["서리 대구",1,32,"🐟"],["얼음 연어",2,60,"🐠"],["룬 무늬 송어",3,52,"🐠"],["무지개다리 청어",4,42,"🌈"],["아기 요르문간드 장어",5,120,"🐍"]],
 [["연꽃 구피",1,6,"🐟"],["갠지스 메기",1,42,"🐟"],["망고빛 잉어",2,36,"🐠"],["마츠야 물고기",3,64,"🐠"],["코끼리 코 물고기",4,50,"🐘"],["황금 마카라",5,110,"🐊"]],
 [["올리브 정어리",1,12,"🐟"],["파도 고등어",1,36,"🐟"],["은빛 해마",2,20,"🦄"],["삼지창 황새치",3,92,"🐠"],["세이렌 비늘 돔",4,44,"🧜"],["아기 히포캄포스",5,100,"🐴"]] ];
const FISH_W={1:30,2:20,3:10,4:4,5:1.6};
const STARC=["","#9fb0c8","#5fd0ff","#3a8dff","#b061ff","#ffcf4a"];
const FS={spots:null,near:null,game:null};
function fishSpots(){ if(FS.spots) return FS.spots; const L=[]; try{ scene.updateMatrixWorld(true); const v=new THREE.Vector3(), sc=new THREE.Vector3();
  scene.traverse(o=>{ if(!o.isMesh||(o.material!==WATER&&o.material!==M.water)) return; if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); o.getWorldPosition(v); o.getWorldScale(sc); if(Math.abs(v.x)>WORLD_HALF||Math.abs(v.z)>WORLD_HALF) return; const r=o.geometry.boundingSphere.radius*Math.max(sc.x,sc.z); if(r<1.5||r>60) return; L.push({x:v.x,z:v.z,r}); }); }catch(e){ console.warn(e); }
  FS.spots=L; return L; }
function fishRealmAt(x,z){ return x>=0?(z<0?0:2):(z<0?1:3); }
function nearWater(){ if(Math.abs(P.x)>WORLD_HALF||Math.abs(P.z)>WORLD_HALF) return null; let best=null,bd=1e9; fishSpots().forEach(s=>{ const d=Math.hypot(P.x-s.x,P.z-s.z)-s.r; if(d<3.2&&d<bd){ bd=d; best=s; } }); return best; }
function fishRoll(r,maxStar){ const L=FISH[r].map((f,i)=>({i,w:f[1]<=(maxStar||5)?FISH_W[f[1]]:0})); let s=L.reduce((a,b)=>a+b.w,0)*Math.random(); for(const x of L){ s-=x.w; if(s<=0) return x.i; } return 0; }
function fishSize(f){ return Math.round(f[2]*(.7+Math.random()*.8)*(Math.random()<.06?1.35:1)); }
function fishRecord(r,i,cm){ G.fish=G.fish||{}; const k=r+":"+i; const o=G.fish[k]||{n:0,b:0}; const isNew=!o.n, rec=cm>o.b&&o.n>0; o.n++; o.b=Math.max(o.b,cm); G.fish[k]=o; G.fishN=(G.fishN||0)+1;
  const f=FISH[r][i]; if(f[1]>=5) G.fish5=(G.fish5||0)+1; const d=kday(); if(!G.fishBest||G.fishBest.d!==d||cm>G.fishBest.cm) G.fishBest={d,n:f[0],cm,s:f[1],r}; return {isNew,rec}; }
function fishDex(){ return Object.keys(G.fish||{}).length; }
/* ---------- 낚시 놀이 ---------- */
function startFish(){ const w=nearWater(); if(!w){ toast("물가로 가 보세요","수도 분수·연꽃 연못·호숫가에서 낚시할 수 있어요",2.2); return; } if(P.dead) return;
  if(mobs.some(m=>m.state==="chase"&&Math.hypot(m.x-P.x,m.z-P.z)<14)){ toast("괴물이 가까이 있어요!","싸움이 끝나면 낚시해요",1.8); return; }
  P.rot=Math.atan2(w.x-P.x,w.z-P.z); const r=fishRealmAt(w.x,w.z); const i=fishRoll(r); const f=FISH[r][i];
  const G0={r,i,f,phase:"wait",t:1.4+Math.random()*3,hits:0,need:[0,2,2,3,4,5][f[1]],maxMiss:f[1]>=3?1:2,miss:0,pos:0,dir:1,spd:.85+f[1]*.2,zw:Math.max(.09,.26-f[1]*.035),zc:.5,zv:f[1]>=3?(.12+f[1]*.05):0,biteT:Math.max(1.2,2.6-f[1]*.25),last:performance.now()};
  FS.game=G0; fxRing(w.x+(P.x-w.x)*.3,w.z+(P.z-w.z)*.3,0xbfe8ff,2,.6); tone(520,.08,"sine");
  card(`<h2>🎣 낚시</h2><p id="fsMsg">찌를 던졌어요… 찌를 잘 보다가 <b>쏙!</b> 들어가면 당겨요</p>
    <div class="fsbob" id="fsBob">🎈</div>
    <div class="fstrack" id="fsTrack"><i class="zone" id="fsZone"></i><i class="mark" id="fsMark"></i></div>
    <div class="fshits" id="fsHits"></div>
    <button class="go" id="fsPull" style="align-self:center;font-size:20px;padding:12px 30px">당기기!</button>`);
  const cls=$("cls"); cls.onclick=()=>{ FS.game=null; closeLayer(); };
  $("fsPull").addEventListener("pointerdown",e=>{ e.preventDefault(); fishPull(); });
  fishDraw(); requestAnimationFrame(fishLoop); }
function fishDraw(){ const g=FS.game; if(!g||!$("fsTrack")) return; const z=$("fsZone"), m=$("fsMark"); z.style.left=((g.zc-g.zw/2)*100)+"%"; z.style.width=(g.zw*100)+"%"; m.style.left=(g.pos*100)+"%";
  $("fsTrack").style.opacity=g.phase==="bite"?1:.35; $("fsHits").innerHTML=g.phase==="bite"?Array.from({length:g.need},(_,k)=>k<g.hits?"🟢":"⚪").join(" ")+(g.miss?` · 놓침 ${g.miss}/${g.maxMiss}`:"")+` · ⏱ ${Math.max(0,g.biteT).toFixed(1)}초`:""; }
function fishLoop(){ const g=FS.game; if(!g||!$("fsTrack")){ FS.game=null; return; } const now=performance.now(), dt=Math.min(.05,(now-g.last)/1000); g.last=now;
  if(g.phase==="wait"){ g.t-=dt; const b=$("fsBob"); if(b) b.style.transform=`translateY(${Math.sin(now/260)*4}px)`; if(g.t<=0){ g.phase="bite"; $("fsMsg").innerHTML=`<b style="color:#9dffb8;font-size:20px">쏙! 걸렸다!</b><br>움직이는 막대가 <b style="color:#3fd27a">초록 칸</b>에 올 때 당기기!`; if($("fsBob")) $("fsBob").textContent="💦"; tone(880,.08,"square"); buzz(40); } }
  else if(g.phase==="bite"){ g.pos+=g.dir*g.spd*dt; if(g.pos>1){ g.pos=1; g.dir=-1; } if(g.pos<0){ g.pos=0; g.dir=1; }
    if(g.zv){ g.zc+=g.zv*dt; if(g.zc>1-g.zw/2){ g.zc=1-g.zw/2; g.zv=-Math.abs(g.zv); } if(g.zc<g.zw/2){ g.zc=g.zw/2; g.zv=Math.abs(g.zv); } }   // 큰 물고기는 초록 칸도 도망다님
    g.biteT-=dt; if(g.biteT<=0){ fishEscape(g,"너무 늦었어요! "); return; } }
  fishDraw(); if(g.phase!=="done") requestAnimationFrame(fishLoop); }
function fishPull(){ const g=FS.game; if(!g) return;
  if(g.phase==="wait"){ g.early=(g.early||0)+1; if(g.early>=2){ fishEscape(g,"너무 서둘렀어요! "); return; } g.t+=1.2; $("fsMsg").innerHTML="아직이에요! 한 번 더 일찍 당기면 물고기가 놀라 도망가요"; tone(300,.06); return; }
  if(g.phase!=="bite") return; const ok=Math.abs(g.pos-g.zc)<=g.zw/2;
  if(ok){ g.hits++; tone(660+g.hits*120,.08,"triangle"); buzz(25); if(g.hits>=g.need){ g.phase="done"; fishCaught(g); return; } g.zc=.2+Math.random()*.6; g.spd*=1.2; g.zw=Math.max(.08,g.zw*.9); g.biteT=Math.max(1.1,2.4-g.f[1]*.22); if(g.zv) g.zv*=1.15; $("fsMsg").innerHTML=`좋아요! <b>${g.need-g.hits}번</b> 더!`; }
  else { g.miss++; tone(220,.12,"sawtooth"); buzz(60); if(g.miss>=g.maxMiss){ fishEscape(g,""); return; } $("fsMsg").innerHTML="빗나갔어요! 한 번만 더 놓치면 도망가요"; } fishDraw(); }
function fishEscape(g,why){ g.phase="done"; tone(220,.15,"sawtooth"); $("fsMsg").innerHTML=`${why}앗, <b>${g.f[1]>=3?"큰 ":""}물고기</b>가 도망갔어요…`; const b=$("fsPull"); if(b){ const nb=b.cloneNode(true); nb.textContent="다시 던지기"; b.replaceWith(nb); nb.addEventListener("pointerdown",e=>{ e.preventDefault(); startFish(); },{once:true}); } fishDraw(); }
function fishCaught(g){ const f=g.f, cm=fishSize(f); const rec=fishRecord(g.r,g.i,cm); const gold=Math.round(5+f[1]*f[1]*5+G.lv*1.5), xp=Math.round(8*f[1]+G.lv*2.5); G.gold+=gold; gainXp(xp);
  let deco=null; if(f[1]>=4&&typeof hmGift==="function") deco=hmGift(f[1]>=5?2:1,"물고기 배 속에서");
  saveGame(); try{ net.pushProfile(1); }catch(e){} jingle(f[1]>=4?[523,659,784,1046,1318,1568]:[659,784,1046]); fxSpark(P.x,1.5,P.z,parseInt(STARC[f[1]].slice(1),16),20+f[1]*8); if(f[1]>=4){ fxRing(P.x,P.z,0xffd76a,8,.8); }
  card(`<h2>🎣 잡았다!</h2><div class="fishbig" style="--c:${STARC[f[1]]}"><em>${f[3]}</em><b>${f[0]}</b><span>${"★".repeat(f[1])}${"☆".repeat(5-f[1])} · ${cm}cm</span></div>
   ${rec.isNew?'<p style="color:#9dffb8"><b>새 물고기!</b> 도감에 적었어요</p>':rec.rec?'<p style="color:#ffcf4a"><b>기록 경신!</b> 가장 큰 크기</p>':""}
   <p>금화 +${gold} · 경험치 +${xp}${deco?` · 🏡 장식 <b>${deco}</b>!`:""}</p>
   <div class="exgrid"><button class="buy" id="fsAgain">또 낚기</button><button class="buy alt" id="fsDex">도감 보기</button></div>`);
  $("fsAgain").onclick=startFish; $("fsDex").onclick=showFish; FS.game=null; }
/* ---------- 통발 ---------- */
const TRAP_MAX_H=12;
function trapHours(){ return G.trap?Math.min(TRAP_MAX_H,(Date.now()-G.trap.t0)/3600000):0; }
function trapSet(){ const w=nearWater(); if(!w){ toast("통발은 물가에서 던져요"); return; } if(G.trap){ toast("통발은 하나만 둘 수 있어요"); return; } G.trap={t0:Date.now(),r:fishRealmAt(w.x,w.z)}; saveGame(); tone(440,.1); fxRing(w.x,w.z,0xbfe8ff,4,.8); toast("🪤 통발을 던졌어요!","게임을 꺼 둬도 물고기가 들어와요 (최대 12시간)",2.6); showFish(); }
function trapClaim(){ const h=trapHours(); if(!G.trap) return; if(h<1/6){ toast("아직 비어 있어요","10분은 지나야 물고기가 들어와요",2); return; } const r=G.trap.r; const n=Math.min(30,Math.max(1,Math.floor(h*2.5)));
  const got={}; let gold=0, best=null; for(let k=0;k<n;k++){ const i=fishRoll(r,h>=6&&Math.random()<.05?4:3); const f=FISH[r][i]; const cm=fishSize(f); fishRecord(r,i,cm); got[i]=(got[i]||0)+1; gold+=3+f[1]*f[1]*3; if(!best||f[1]>best.f[1]) best={f,cm}; }
  gold=Math.round(gold+G.lv*n*.4); G.gold+=gold; const snack=Math.floor(h/2); let pet=null; if(snack>0&&typeof petGain==="function"&&G.pet>=0&&G.pets&&G.pets[G.pet]){ const lv0=G.pets[G.pet].lv; petGain(snack*6); pet={n:PETS[G.pet].n,lv0,lv:G.pets[G.pet].lv}; }
  G.trap=null; G.trapN=(G.trapN||0)+1; saveGame(); try{ net.pushProfile(1); }catch(e){} jingle([523,659,784,1046]);
  card(`<h2>🪤 통발을 걷었어요!</h2><p>${fmtDur(h*60)} 동안 ${REALMS[r].n} 물가에서 <b style="color:var(--gold)">${n}마리</b>가 들어왔어요.</p>
   <div class="diary">${Object.keys(got).map(i=>`<p>${FISH[r][i][3]} ${FISH[r][i][0]} <b style="color:${STARC[FISH[r][i][1]]}">${"★".repeat(FISH[r][i][1])}</b> × ${got[i]}</p>`).join("")}</div>
   <div class="idlegrid"><div><b>+${fmt(gold)}</b><span>금화</span></div><div><b>${snack}</b><span>신수 간식</span></div></div>
   ${pet?`<p>🐣 ${pet.n}에게 간식을 줬어요${pet.lv>pet.lv0?` · Lv.${pet.lv0} → ${pet.lv}`:""}</p>`:snack?'<p style="font-size:12px">짝꿍 신수가 있으면 간식으로 자라요</p>':""}
   <button class="buy" id="trOk" style="align-self:center">좋아요!</button>`); $("trOk").onclick=closeLayer; }
/* ---------- 도감·오늘의 가장 큰 물고기 ---------- */
function fishBoard(){ const d=kday(); const list=[]; if(G.fishBest&&G.fishBest.d===d) list.push({n:G.name,r:G.realm,f:G.fishBest,me:1});
  for(const id in ROSTER){ const p=ROSTER[id]; if(p.fb&&p.fb[3]===d) list.push({n:p.n,r:p.r,f:{n:p.fb[0],cm:p.fb[1],s:p.fb[2]}}); }
  return list.sort((a,b)=>b.f.cm-a.f.cm).slice(0,6); }
function showFish(){ G.fish=G.fish||{}; const w=nearWater(); const h=trapHours();

  const bd=fishBoard().map((x,k)=>`<div class="row"><div class="ic">${k===0?"🥇":k===1?"🥈":k===2?"🥉":k+1}</div><div class="t"><div>${x.n}${x.me?" (나)":""}</div><span>${x.f.n} · <b style="color:${STARC[x.f.s]}">${"★".repeat(x.f.s)}</b> · ${x.f.cm}cm</span></div></div>`).join("");
  card(`<h2>🎣 낚시 · 물고기 도감</h2><p>모은 물고기 <b style="color:var(--gold)">${fishDex()}/24</b> · 잡은 수 ${fmt(G.fishN||0)}마리<br>수도 분수·연꽃 연못·호숫가에 가면 「🎣 낚시」 버튼이 나와요.</p>
   ${w?'<button class="go" id="fsGo" style="align-self:center">🎣 여기서 낚시하기</button>':""}
   <div class="row"><div class="ic">🪤</div><div class="t"><div>통발 ${G.trap?`(${REALMS[G.trap.r].n} 물가)`:""}</div><span>${G.trap?`${fmtDur(h*60)}째 · 약 ${Math.min(30,Math.floor(h*2.5))}마리 들어 있어요${h>=TRAP_MAX_H?" · 가득 찼어요!":""}`:"물가에서 던져 두면 게임을 꺼 둔 동안에도 물고기가 들어와요(최대 12시간). 신수 간식도!"}</span>${G.trap?`<span class="tbar"><i style="width:${Math.round(h/TRAP_MAX_H*100)}%"></i></span>`:""}</div>${G.trap?'<button class="buy" id="trGet">걷기</button>':w?'<button class="buy" id="trSet">던지기</button>':""}</div>
   <h3>🏆 오늘 가장 큰 물고기</h3>${bd||'<p style="font-size:13px">오늘은 아직 아무도 못 잡았어요. 1등을 노려 보세요!</p>'}${dex}`);
  if($("fsGo")) $("fsGo").onclick=startFish; if($("trSet")) $("trSet").onclick=trapSet; if($("trGet")) $("trGet").onclick=trapClaim; }
/* ---------- 칭호 ---------- */
TITLES.push({id:"fish30",n:"강태공",t:1,h:"물고기 30마리 잡기",g:()=>[G.fishN||0,30]},{id:"fishdex",n:"물고기 박사",t:2,h:"물고기 도감 16칸 모으기",g:()=>[fishDex(),16]},{id:"fish5",n:"전설의 낚시꾼",t:3,h:"별 5개 물고기 잡기",g:()=>[G.fish5||0,1]});

<script>
/* ================= v24-2: 🐎 신수 타기 + 🏁 하늘 고리 경주 (IDEAS G11/4-2) =================
   짝꿍 신수 Lv5 부터 「타기」 버튼 → 신수가 커지고 등에 올라탐(이동 1.6배, 공중에서 천천히 활공). 친구 화면에도 탄 모습(st.rd).

   남의 기록을 깨면 그 사람에게 「○○이 기록을 깼어요!」가 남음(retained rcb/<그 사람>/<나>). 경주 중엔 괴물 공격을 안 받음. */

  if(me){ const m=me.mesh; if(m.userData._bs==null) m.userData._bs=m.scale.x; m.scale.setScalar(m.userData._bs*(on?2.1:1)); }

  const can=rdCan(); RD.btn.hidden=!can&&!P.ride; RD.btn.classList.toggle("on",!!P.ride); const ic=G.pet>=0?["🦅","🐎","🐦","🦄"][G.pet]:"🐎"; const html=`${ic}<small>${P.ride?"내리기":"타기"}</small>`; if(RD.btn.innerHTML!==html) RD.btn.innerHTML=html; }

  if(P.ride&&(!rdCan()||P.dead||(typeof DG!=="undefined"&&DG.on)||(typeof HM!=="undefined"&&HM.on))){ P.ride=false; const me=PETMESH.me; if(me&&me.mesh.userData._bs!=null) me.mesh.scale.setScalar(me.mesh.userData._bs); rdBtn(); }

function rcBuild(c){ const cap=REGIONS[c*3], A=REGIONS[c*3+1], B=REGIONS[c*3+2]; const inward=Math.atan2(-cap.z,-cap.x); const S={x:cap.x+Math.cos(inward)*34,z:cap.z+Math.sin(inward)*34};
  const off=(R,k)=>{ const dx=R.x-cap.x, dz=R.z-cap.z, L=Math.hypot(dx,dz); return new THREE.Vector3(R.x+dx/L*12+(-dz/L)*k,0,R.z+dz/L*12+(dx/L)*k); };

  return {c,S,rings,len:curve.getLength()}; }

  const ban=new THREE.Mesh(new THREE.PlaneGeometry(8.6,1.1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ck),side:THREE.DoubleSide})); ban.position.set(0,5,0); g.add(ban);

  g.position.set(co.S.x,hAt(co.S.x,co.S.z),co.S.z); g.rotation.y=ang; scene.add(shadowify(g)); co.gate=g; }); })();

<script>

const BUFFS={atk:{n:"용사의 두루마리",ic:"⚔️",d:"3분 동안 공격 +25%",min:3,price:150,c:"#ff8d6a"},def:{n:"수호의 두루마리",ic:"🛡️",d:"3분 동안 방어 +30%",min:3,price:150,c:"#8fd0ff"},gold:{n:"행운의 두루마리",ic:"🪙",d:"10분 동안 금화 +50%",min:10,price:250,c:"#ffd24a"},xp:{n:"경험의 두루마리",ic:"📘",d:"10분 동안 경험치 +30%",min:10,price:300,c:"#b8a0ff"},spd:{n:"바람의 두루마리",ic:"💨",d:"5분 동안 달리기 +15%",min:5,price:120,c:"#bfffe0"}};
const SHOP_MAT=[{k:"ore",n:"⛓ 쇳조각 10개",d:"대장간 강화 재료",q:10,price:150},{k:"rune",n:"✨ 룬 가루 1개",d:"대장간 +4부터 필요한 재료",q:1,price:400},{k:"stone",n:"🧱 건축 돌 20개",d:"세계 불가사의에 바치는 돌",q:20,price:200},{k:"snack",n:"🍖 신수 간식",d:"짝꿍 신수 경험치 +5",q:5,price:180},{k:"pots",n:"🧪 물약 3개",d:"체력 50% 회복 (하나 40 금화보다 싸요)",q:3,price:100}];

   ${wisOn()?`<p style="color:#9fd8ff">🧠 지혜의 축복 ${Math.ceil(((G.wisB||0)-Date.now())/60000)}분 남음 (경험치 +15%)</p>`:""}
   <h3>🧠 오늘의 지혜왕 (3문제 모두 정답)</h3>${kings.length?`<p>${kings.join(" · ")}</p>`:'<p style="font-size:13px">아직 아무도 없어요. 첫 번째 지혜왕이 되어 보세요!</p>'}
   <p style="font-size:12px">문제는 한국 시간 밤 12시에 바뀌어요. 지금까지 맞힌 문제 ${fmt(G.orcTot||0)}개.</p>`);
  layers.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>orAnswer(+b.dataset.q,+b.dataset.c));
  if($("orWay")) $("orWay").onclick=()=>{ const t=OR.spots[Math.max(0,G.realm)]; setGuide({x:t.x,z:t.z+4,label:"🗿 지혜의 석상"}); closeLayer(); }; }
/* ---------- 경험치 · 캐릭터 정보 · 상황 버튼 · 칭호 ---------- */

  const _mp=myProfile; myProfile=function(on){ const p=_mp(on); try{ const o=G.orc; if(o&&o.d===kday()) p.oq=[o.d,orOk()]; }catch(e){} return p; }; })();

<script>
/* ================= v42-2: 🌱 새싹과 길잡이 — 처음 온 사람 도와주기 (IDEAS G11/4-8) =================
   새싹 = 아직 첫 승급 전(계급 1단계). 이름표에 🌱. 길잡이 = 세 번째 계급 이상.
   새싹과 길잡이가 12걸음 안에 있으면 「함께」 → 둘 다 경험치 +20%. 함께한 시간은 새싹 폰이 길잡이마다 셈(G.mtPal).
   함께일 때 화면 아래에 정해진 말 버튼(따라와!·여기 보물!·물약 먹어!·잘했어!…) → 글자를 치지 않아도 모르는 사람과 안전하게 도움을 주고받음.
   새싹이 첫 승급 시험을 통과하면 졸업! 1분 넘게 함께한 길잡이마다 보관(retained) mt/<길잡이id>/<새싹id> 를 남김
   → 길잡이가 켜져 있으면 바로, 꺼져 있으면 다음 접속 때 「길잡이 별」 + 상자. 새싹도 졸업 상자.
   길잡이 별 수는 인사(hello ms)에 실려 이름표에 🧭숫자로 보임. 칭호: 새싹 졸업생 · 친절한 길잡이 · 빛의 길잡이. */
const MT_NEAR=12, MT_NEED=60;
const MT_SAY=["따라와!","여기 보물!","물약 먹어!","조심해!","잘했어!","고마워!"];
const MT={t:0,pals:[],seen:{},hintT:0,bar:null,barOn:false,fxT:0,saveT:0,queue:[]};
function mtSprout(rank){ return rank===0; }
function mtGuide(rank){ return rank>=2; }
function mtRole(){ if(G.realm<0) return ""; return mtSprout(G.rank)?"sprout":mtGuide(G.rank)?"guide":""; }
function mtStars(){ return G.mtStar||0; }
function mtStarTag(n){ return n>0?`<span class="mtb${n>=5?" gold":""}">${n>=5?"✨":""}🧭${n}</span>`:""; }
function mtPeerTag(o){ return (mtSprout(o.rank)?'<span class="mtb sp">🌱</span>':"")+mtStarTag(o.ms||0); }
function mtMyTag(){ if(G.realm<0) return ""; return (mtSprout(G.rank)?'<span class="mtb sp">🌱 새싹</span>':"")+mtStarTag(mtStars()); }
function mtPair(o){ const me=mtRole(); if(!me||!o||o.dead) return false; return me==="sprout"?mtGuide(o.rank):mtSprout(o.rank); }
/* ---------- 매 프레임 ---------- */
function mtTick(dt){ if(!started||G.realm<0) return; MT.t-=dt; MT.hintT-=dt; MT.saveT-=dt;
  if(MT.t<=0){ MT.t=.5; const role=mtRole(); const pals=[]; const far=[];
    if(role&&!P.dead){ for(const id in PEERS){ const o=PEERS[id]; if(!mtPair(o)) continue; const d=Math.hypot(o.x-P.x,o.z-P.z); if(d<MT_NEAR) pals.push(o); else if(d<90) far.push(o); } }
    const was=MT.pals.length; MT.pals=pals;
    if(pals.length){ if(role==="sprout"){ G.mtPal=G.mtPal||{}; pals.forEach(o=>{ const p=G.mtPal[o.id]||(G.mtPal[o.id]={n:o.name,r:o.realm,s:0}); const s0=p.s; p.n=o.name; p.s+=.5; if(s0<MT_NEED&&p.s>=MT_NEED) toast(`🧭 ${o.name}님이 내 길잡이가 되었어요!`,"첫 승급을 하면 둘 다 졸업 상자를 받아요",3); }); }
      else { G.mtSec=(G.mtSec||0)+.5; }
      if(!was){ toast(role==="sprout"?`🌱 길잡이 ${pals.map(o=>o.name).join(", ")}님과 함께!`:`🧭 새싹 ${pals.map(o=>o.name).join(", ")}님과 함께!`,"함께 있는 동안 둘 다 경험치 +20%",2.4); jingle([659,880,1046]); }
      if(MT.saveT<=0){ MT.saveT=10; saveGame(); } }
    if(!pals.length&&far.length&&MT.hintT<=0){ const nw=far.filter(o=>!MT.seen[o.id]); if(nw.length){ nw.forEach(o=>MT.seen[o.id]=1); MT.hintT=60;
      if(role==="sprout") toast(`🧭 근처에 길잡이 ${far.length}명이 있어요!`,`${far.map(o=>o.name).slice(0,3).join(", ")} — 가까이 가서 「따라와!」 말을 걸어 봐요`,3.4);
      else toast(`🌱 근처에 새싹 ${far.length}명이 있어요!`,`${far.map(o=>o.name).slice(0,3).join(", ")} — 함께 싸우면 둘 다 경험치 +20% · 졸업하면 길잡이 별`,3.4); } }
    if(MT.queue.length&&!layerOpen&&!P.dead) mtShowStar(MT.queue.shift()); }
  // 함께일 때: 발밑에 작은 초록 빛 · 말 버튼
  if(MT.pals.length){ MT.fxT-=dt; if(MT.fxT<=0){ MT.fxT=2.6; fxRing(P.x,P.z,0x7affb0,3.2,.5); MT.pals.forEach(o=>fxSpark((P.x+o.x)/2,1.6,(P.z+o.z)/2,0x9dffb8,4)); } }
  mtBar(MT.pals.length>0&&!layerOpen&&!P.dead); }
XTICK.push(mtTick);
function mtBar(on){ if(!MT.bar){ const b=document.createElement("div"); b.id="mtBar"; b.hidden=true; b.innerHTML=`<span class="mth">🌱🧭</span>`+MT_SAY.map((m,i)=>`<button type="button" data-m="${i}">${m}</button>`).join(""); document.body.appendChild(b); MT.bar=b;
    b.querySelectorAll("button").forEach(x=>x.addEventListener("pointerdown",e=>{ e.stopPropagation(); e.preventDefault(); const m=MT_SAY[+x.dataset.m]; try{ net.send({t:"say",m}); net.chat(G.name,m,G.realm); }catch(er){} G.mtSay=(G.mtSay||0)+1; x.classList.remove("hit"); void x.offsetWidth; x.classList.add("hit"); })); b.addEventListener("pointerdown",e=>e.stopPropagation()); }
  if(MT.barOn!==on){ MT.barOn=on; MT.bar.hidden=!on; } }
/* ---------- 경험치 +20% · 졸업 ---------- */
(function(){ const _gx=gainXp; gainXp=function(n){ try{ if(n>0&&MT.pals.length) n=Math.round(n*1.2); }catch(e){} return _gx(n); };
  const _ft=finishTrial; finishTrial=function(win){ const r0=G.rank; _ft(win); try{ if(win&&r0===0&&G.rank>=1) setTimeout(mtGraduate,2600); }catch(e){ console.warn(e); } }; })();
function mtGraduate(){ if(G.mtGrad) return; const pal=G.mtPal||{}; const list=Object.keys(pal).filter(id=>pal[id].s>=MT_NEED).map(id=>Object.assign({id},pal[id])); G.mtGrad=list.length?2:1;
  if(!list.length){ saveGame(); toast("🌱 새싹을 졸업했어요!","이제 다음 계급까지 오르면 새싹들의 길잡이가 될 수 있어요",3.2); return; }
  const lv=G.lv, gold=200+lv*20; G.gold+=gold; G.pots+=3; const tier=1; const s=pick(["w","a","r"]); G.bag.push({s,t:tier}); gainXp(150+lv*25); saveGame();
  list.forEach(p=>{ try{ net.pushRet("mt/"+p.id+"/"+G.id,{i:G.id,n:G.name,r:G.realm,s:Math.round(p.s),t:Date.now()}); }catch(e){} });
  card(`<h2>🎓 새싹 졸업!</h2><p>첫 승급을 해냈어요! 함께해 준 길잡이에게 <b style="color:var(--gold)">길잡이 별</b>이 전해져요(꺼져 있어도 다음에 켜면 받아요).</p>
   ${list.map(p=>`<div class="row"><div class="ic" style="color:${REALMS[p.r]?REALMS[p.r].c1:"#fff"}">🧭</div><div class="t"><div>${p.n}</div><span>함께한 시간 ${fmtDur(p.s/60)}</span></div></div>`).join("")}
   <h3>🎁 졸업 상자</h3><div class="idlegrid"><div><b>+${fmt(gold)}</b><span>금화</span></div><div><b>${rarTag(tier)}</b><span>${itemName(s,tier)}</span></div><div><b>+3</b><span>${RM().potion}</span></div><div><b>🎓</b><span>칭호 «새싹 졸업생»</span></div></div>
   <p style="font-size:12px">나중에 세 번째 계급이 되면 나도 길잡이가 되어 새싹을 도울 수 있어요.</p><button class="buy" id="mtOk" style="align-self:center">고마워요!</button>`);
  $("mtOk").onclick=closeLayer; jingle([523,659,784,1046,1318,1568]); buzz([40,30,80]); try{ fxPillar(0x7affb0,1,HIGH()?36:20,1.8,.4); }catch(e){} }
NETX.push({sub:()=>"mt/"+G.id+"/+",pre:"mt/",f:(d,topic)=>{ if(!d||!d.i||!d.n||topic.indexOf("mt/"+G.id+"/")!==0||d.i===G.id) return; G.mtGot=G.mtGot||{}; if(G.mtGot[d.i]) return;
  G.mtGot[d.i]={n:d.n,r:d.r,t:d.t||Date.now()}; G.mtStar=(G.mtStar||0)+1; const lv=G.lv, gold=300+lv*15; G.gold+=gold; if(typeof fgGive==="function") fgGive(3,2,"",true); else { G.ore=(G.ore||0)+3; G.rune=(G.rune||0)+2; } gainXp(200+lv*20); saveGame();
  try{ net.hello(); }catch(e){} MT.queue.push({n:d.n,r:d.r,gold}); }});
function mtShowStar(q){ const n=mtStars(); card(`<h2>🌟 길잡이 별!</h2><p>새싹 <b style="color:${REALMS[q.r]?REALMS[q.r].c1:"#fff"}">${q.n}</b>님이 첫 승급을 해냈어요! 함께 도와준 덕분이에요.</p>
   <div class="idlegrid"><div><b>🧭 ${n}</b><span>내 길잡이 별</span></div><div><b>+${fmt(q.gold)}</b><span>금화 · 쇳조각 3 · 룬 가루 2</span></div></div>
   <p style="font-size:13px">길잡이 별은 내 이름표에 🧭${n}로 보여요. 5개면 금빛 ✨ · 칭호 «빛의 길잡이».</p><button class="buy" id="mtOk" style="align-self:center">좋아요!</button>`);
  $("mtOk").onclick=closeLayer; jingle([784,988,1175,1568,2093]); buzz([30,30,60]); try{ fxRing(P.x,P.z,0xffe27a,10,1); fxRiseDust(0xfff2b0,HIGH()?40:18,1.6); }catch(e){} }
/* ---------- 창 ---------- */
function showMentor(){ const role=mtRole(); const pal=G.mtPal||{}; const got=G.mtGot||{};
  const palRows=Object.keys(pal).sort((a,b)=>pal[b].s-pal[a].s).slice(0,8).map(id=>{ const p=pal[id]; const ok=p.s>=MT_NEED; return `<div class="row"><div class="ic" style="color:${REALMS[p.r]?REALMS[p.r].c1:"#fff"}">🧭</div><div class="t"><div>${p.n}${PEERS[id]?' <i class="st on">접속 중</i>':""}</div><span>함께한 시간 ${fmtDur(p.s/60)} ${ok?'· <b style="color:#9dffb8">내 길잡이 ✓</b>':`· 1분 넘게 함께하면 내 길잡이`}</span>${ok?"":`<span class="tbar"><i style="width:${Math.round(Math.min(1,p.s/MT_NEED)*100)}%"></i></span>`}</div></div>`; }).join("");
  const gotRows=Object.keys(got).sort((a,b)=>got[b].t-got[a].t).slice(0,10).map(id=>{ const p=got[id]; return `<div class="row"><div class="ic">🎓</div><div class="t"><div>${p.n}</div><span>${REALMS[p.r]?REALMS[p.r].n:""} · 졸업을 도왔어요</span></div></div>`; }).join("");
  const now=Object.values(PEERS).filter(o=>mtPair(o)).map(o=>`${o.name}(${Math.round(Math.hypot(o.x-P.x,o.z-P.z))}m)`);
  card(`<h2>🌱 새싹과 길잡이</h2><p>처음 온 사람(첫 승급 전)은 <b>🌱 새싹</b>, 세 번째 계급부터는 <b>🧭 길잡이</b>가 될 수 있어요. 새싹과 길잡이가 <b>12걸음 안</b>에서 함께 다니면 <b style="color:#9dffb8">둘 다 경험치 +20%</b>! 함께일 때는 화면 아래에 정해진 말 버튼이 떠서 글자를 치지 않아도 도와줄 수 있어요.</p>
   <div class="idlegrid"><div><b>${role==="sprout"?"🌱 새싹":role==="guide"?"🧭 길잡이":"🌿 수련생"}</b><span>${role==="sprout"?"첫 승급을 하면 졸업!":role==="guide"?"새싹을 도와 졸업시키면 별":`${RM().ranks[2]}부터 길잡이`}</span></div><div><b>🧭 ${mtStars()}</b><span>내 길잡이 별 · 5개면 «빛의 길잡이»</span></div></div>
   ${now.length?`<p>지금 근처: ${now.join(" · ")}${MT.pals.length?' · <b style="color:#9dffb8">함께하는 중!</b>':""}</p>`:`<p style="font-size:13px">지금 근처에 ${role==="sprout"?"길잡이":"새싹"}가 없어요. 모험가 명부에서 누가 접속했는지 볼 수 있어요.</p>`}
   ${role==="sprout"?`<h3>🧭 나를 도와준 길잡이</h3>${palRows||'<p style="font-size:13px">아직 없어요. 이름 옆에 🧭가 있는 높은 계급 모험가 곁에서 함께 싸워 봐요!</p>'}`:""}
   ${role!=="sprout"?`<h3>🎓 내가 졸업시킨 새싹</h3>${gotRows||'<p style="font-size:13px">아직 없어요. 이름 옆에 🌱가 있는 새싹을 찾아 함께 싸워 주세요!</p>'}`:""}
   <h3>💬 정해진 말</h3><p style="font-size:13px">${MT_SAY.join(" · ")}</p>`); }
TITLES.push({id:"mtg",n:"새싹 졸업생",t:1,h:"길잡이와 함께 다니다가 첫 승급하기",g:()=>[G.mtGrad===2?1:0,1]},{id:"mt1",n:"친절한 길잡이",t:1,h:"새싹 1명의 졸업 돕기 (길잡이 별 1개)",g:()=>[mtStars(),1]},{id:"mt5",n:"빛의 길잡이",t:3,h:"길잡이 별 5개 모으기",g:()=>[mtStars(),5]});
</script>
<script>
/* ================= v42-3: 🔓 다섯 번째 세계의 문 — 모두 함께 여는 「태양의 사막」 (IDEAS G11/4-9) =================
   세계의 중심(옴팔로스) 남쪽 모래 속에 거대한 문이 묻혀 있음. 네 세계 모든 사람이 ☀ 태양 열쇠 조각을 바치면
   모두의 몫이 더해져(보관 retained gt/<id> → 다 더하기, 04o 불가사의와 같은 방식) 문이 5단계로 솟아오름.
   조각: 괴물 30%(보스 5개) · 별 4개 이상 물고기 2개 · 미궁 정복 10개 · 쉬는 동안 10분에 1개(최대 40개, 바로 바침).

function MiniMQTT(url,opt){

function bagBest(){ const best={}; ["w","a","r"].forEach(s=>{ let t=G.eq[s], from=-1; G.bag.forEach((it,i)=>{ if(it.s===s&&it.t<=G.rank&&it.t>t){ t=it.t; from=i; } }); best[s]={t,from}; }); return best; }

function bagOptimize(){ const b=bagBest(); const idx=["w","a","r"].map(s=>b[s].from).filter(i=>i>=0).sort((x,y)=>y-x); const changed=[];
  idx.forEach(i=>{ const it=G.bag[i]; if(G.eq[it.s]>=0) G.bag.push({s:it.s,t:G.eq[it.s]}); G.eq[it.s]=it.t; G.bag.splice(i,1); changed.push(it.s); });

   <div class="idlegrid"><div><b>${fmt(nst.atk)}${d(nst.atk,st.atk,fmt)}</b><span>⚔ 공격</span></div><div><b>${fmt(nst.mhp)}${d(nst.mhp,st.mhp,fmt)}</b><span>❤ 체력</span></div><div><b>${Math.round(dmgReduce(nst.def)*100)}%${d(dmgReduce(nst.def)*100,dmgReduce(st.def)*100,v=>Math.round(v)+"%")}</b><span>🛡 방어</span></div><div><b>${Math.round(nst.crit*100)}%${d(nst.crit*100,st.crit*100,v=>Math.round(v)+"%")}</b><span>✨ 치명타</span></div></div>
