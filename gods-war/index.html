<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신들의 전쟁">
<title>신들의 전쟁</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">
<style>
/* 전체 화면 3D 세계. 왼쪽 엄지: 조이스틱, 오른쪽 엄지: 공격/기술/물약. 위: 상태, 아래: 메뉴. 테마 색은 내 세계(--c1 주색, --c2 보조)로 바뀜. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --paper:#fff9ec; --gold:#ffcf4a; --red:#ff5a5f; --green:#3fd27a; --blue:#4aa3ff;
  --c1:#ffcf4a; --c2:#fff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --title:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1a1030;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1} .lbl{will-change:transform}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 2px 0 #120a24;-webkit-font-smoothing:antialiased}
.lbl b{font-weight:400;display:block;font-size:12px;opacity:.9}
.lbl .hp{display:block;width:64px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.lbl .hp i{display:block;height:100%;background:#ff5a5f;border-radius:4px}
.lbl.ally{color:#9dffb8} .lbl.foe{color:#ff8d8d} .lbl.boss{font-size:19px;color:#ffcf4a}
.lbl.dmg{z-index:2} .lbl.dmg em{display:block;font-style:normal;font-weight:900;font-size:25px;color:#fff;letter-spacing:-.5px;text-shadow:0 0 1px #000,2px 2px 0 #1b1430,-2px 2px 0 #1b1430,2px -2px 0 #1b1430,-2px -2px 0 #1b1430,0 3px 0 #1b1430,0 4px 8px rgba(0,0,0,.6);transform-origin:50% 80%;animation:dmgPop .95s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em{font-size:33px;color:#ffe066;text-shadow:0 0 1px #000,2px 2px 0 #7a2a00,-2px 2px 0 #7a2a00,2px -2px 0 #7a2a00,-2px -2px 0 #7a2a00,0 3px 0 #7a2a00,0 0 16px rgba(255,150,40,.95);animation:dmgCrit 1.05s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em.c::before{content:"치명타!";display:block;font-size:13px;color:#fff6c8;letter-spacing:1px;margin-bottom:-2px}
.lbl.dmg.me em{color:#ff5b5b;font-size:23px;text-shadow:0 0 1px #000,2px 2px 0 #3a0010,-2px 2px 0 #3a0010,2px -2px 0 #3a0010,-2px -2px 0 #3a0010,0 3px 0 #3a0010}
.lbl.dmg.gain em{font-size:18px;color:#ffe27a;animation:dmgGain 1.1s ease-out forwards}
@keyframes dmgPop{0%{transform:translate(0,10px) scale(.3);opacity:0}12%{transform:translate(calc(var(--dx)*.15),-8px) scale(1.45);opacity:1}30%{transform:translate(calc(var(--dx)*.35),-16px) scale(1)}72%{opacity:1}100%{transform:translate(var(--dx),-66px) scale(.8);opacity:0}}
@keyframes dmgCrit{0%{transform:translate(0,10px) scale(.2) rotate(-8deg);opacity:0}12%{transform:translate(0,-10px) scale(1.7) rotate(4deg);opacity:1}22%{transform:translate(-3px,-14px) scale(1.15) rotate(-3deg)}30%{transform:translate(3px,-16px) scale(1.25) rotate(0)}75%{opacity:1}100%{transform:translate(var(--dx),-74px) scale(.9);opacity:0}}
@keyframes dmgGain{0%{transform:translate(0,6px) scale(.6);opacity:0}15%{transform:translate(0,-6px) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(0,-56px) scale(.95);opacity:0}}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px}
.tl{top:max(8px,env(safe-area-inset-top));left:10px;flex-direction:column;align-items:flex-start}
.tr{top:max(8px,env(safe-area-inset-top));right:10px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(20,14,40,.72);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.75}
#status{display:flex;flex-direction:column;gap:4px;background:rgba(20,14,40,.72);border:2px solid var(--c1);border-radius:16px;padding:8px 12px;min-width:196px;backdrop-filter:blur(6px)}
#status .nm{font-size:17px;color:var(--c1);line-height:1.1} #status .nm small{color:#fff;opacity:.85;font-size:13px;margin-left:6px}
.bar{height:11px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff3d4a,#ff8a5c)} .bar.xp i{background:linear-gradient(90deg,#4aa3ff,#9be7ff)} .bar.xp{height:7px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000}
.gold{color:var(--gold)}
#titanPill{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 262px);z-index:5;font-size:13px;cursor:pointer;pointer-events:auto;border:1px solid rgba(255,140,80,.6);color:#ffd9b0;font-family:inherit} #netPill{font-size:12px;gap:6px} #netPill .dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;box-shadow:0 0 4px #000} #netPill .dot.on{background:#3fd27a;box-shadow:0 0 6px #3fd27a}
#region{font-size:14px;color:#fff;letter-spacing:.5px}
#region b{font-weight:400;color:var(--c1)}

#minimap{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);width:164px;height:164px;z-index:5;border-radius:50%;border:0;background:#0e0a1e;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#guide{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 70px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:auto;background:rgba(20,14,40,.7);border:2px solid var(--gold);border-radius:16px;padding:4px 12px;color:#fff;font-size:13px;white-space:nowrap} #gArrow{font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 10px rgba(255,207,74,.8);transition:transform .15s}
.idlegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0} .idlegrid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px} .idlegrid b{font-size:20px;color:var(--gold)} .idlegrid span{font-size:12px;opacity:.8}
.row .st{font-style:normal;font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:4px;vertical-align:1px} .row .st.on{background:#1f9a52;color:#fff}
.lbl .away{display:block;font-size:10px;opacity:.85;color:#bfe9ff}
/* v19: 칭호 · 원정 · 미궁 */
.lbl .ttl{display:block;font-size:12px;font-weight:900;letter-spacing:.2px;margin-bottom:1px;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 0 6px rgba(0,0,0,.6)}
.row .t span.ttl{display:inline;font-size:12px;font-weight:900;margin-right:4px;color:inherit} .row .t span.rar{display:inline-block}
.row .tbar{display:block;height:6px;margin-top:4px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden} .row .tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff9a3d);border-radius:4px}
.diary{background:#fff8e6;color:#3a2a14;border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 2px #e8d4a6;background-image:repeating-linear-gradient(#fff8e6 0 25px,#ecdcb8 25px 26px)} .diary p{margin:4px 0;font-size:14px;line-height:1.35;color:#3a2a14}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .exgrid.three{grid-template-columns:1fr 1fr 1fr} .exgrid .buy{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px} .exgrid .buy small{font-size:10px;opacity:.85}
.exd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;cursor:pointer} .exd em{font-style:normal;font-size:26px} .exd b{font-weight:400;font-size:14px} .exd i{font-style:normal;font-size:11px;opacity:.7} .exd.on{border-color:var(--gold,#ffcf4a);background:rgba(255,207,74,.16)}
.gearpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px var(--rc);animation:gearPop 1.6s ease-out forwards} .gearpop small{display:block;font-size:13px;font-weight:700;opacity:.9} @keyframes gearPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#zoomBtns{position:fixed;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 218px);z-index:5;display:flex;gap:6px} #zoomBtns button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(20,14,40,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
#quest{position:fixed;left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 96px);z-index:5;pointer-events:auto;max-width:200px;display:flex;flex-direction:column;gap:4px}
.q{background:rgba(20,14,40,.66);border-left:4px solid var(--c1);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25;color:#fff}
.q.done{border-color:var(--green);color:#9dffb8} .q small{opacity:.75}

.bl{left:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:row;pointer-events:auto}
.br{right:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.mbtn{border:0;cursor:pointer;color:#fff;font-size:15px;border-radius:14px;padding:9px 12px;min-width:60px;background:rgba(20,14,40,.75);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.mbtn:active{transform:translateY(2px)}
.acts{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 60px);z-index:5;display:grid;grid-template-columns:64px 64px 84px;grid-template-rows:64px 84px;gap:8px;align-items:end;justify-items:end;pointer-events:auto}
.act{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.5);color:#fff;font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.act.atk{background:radial-gradient(circle at 35% 30%,#ff9a7a,#d82f3c 70%);grid-column:3;grid-row:2;width:84px;height:84px;font-size:17px}
.act.thr{position:absolute;left:-64px;bottom:8px;background:radial-gradient(circle at 35% 30%,#ffe2a8,#e08a1e 70%);color:#2a1606;font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.act.lock{filter:grayscale(1) brightness(.6)} .act.lock small{font-size:9px}
.act.skl{background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 70%);color:#1b1430;text-shadow:0 1px 0 rgba(255,255,255,.4);font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1}
.act.pot{background:radial-gradient(circle at 35% 30%,#9dffb8,#1f9f58 70%);grid-column:2;grid-row:2}
.act.jmp{background:radial-gradient(circle at 35% 30%,#bcd6ff,#3a5bd6 70%);grid-column:1;grid-row:2}
.act.skl{grid-row:1}
.act .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
.act small{font-size:11px;opacity:.9}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(20,14,40,.28);border:3px solid rgba(255,255,255,.55);z-index:4;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.25),inset 0 0 18px rgba(255,255,255,.08);transition:opacity .2s}
#joy.rest{left:calc(max(10px,env(safe-area-inset-left)) + 78px)!important;top:auto!important;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 52px);margin:0 0 0 -62px;opacity:.8}
#joy .ar{position:absolute;color:rgba(255,255,255,.85);font-size:15px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none} #joy .ar.u{left:50%;top:6px;transform:translateX(-50%)} #joy .ar.d{left:50%;bottom:6px;transform:translateX(-50%)} #joy .ar.l{left:7px;top:50%;transform:translateY(-50%)} #joy .ar.r{right:7px;top:50%;transform:translateY(-50%)}
body:has(#title) #joy{display:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.95),rgba(205,195,235,.8));box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,0,20,.45) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 50%,rgba(255,20,30,.55) 100%);opacity:0;transition:opacity .25s}
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;font-size:clamp(22px,6.5vw,34px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.4);font-family:var(--title);letter-spacing:1px}
#toast small{display:block;font-size:.55em;color:var(--c1);margin-top:4px;font-family:var(--font);letter-spacing:0}
#chat{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none;width:min(80vw,360px)}
.msg{background:rgba(20,14,40,.75);border-radius:12px;padding:4px 10px;font-size:13px;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeout 6s forwards} .msg b{font-weight:400;color:var(--gold)}
@keyframes fadeout{80%{opacity:1}to{opacity:0}}
#warbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 122px);transform:translateX(-50%);z-index:6;width:min(78vw,330px);background:linear-gradient(135deg,rgba(90,10,20,.85),rgba(20,8,30,.85));border:2px solid #ff5a5f;border-radius:14px;padding:6px 10px;text-align:center;box-shadow:0 0 18px rgba(255,60,80,.45);animation:warp 1.6s ease-in-out infinite}
@keyframes warp{50%{box-shadow:0 0 28px rgba(255,60,80,.75)}}
#warbar .wt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #warbar .wt b{font-weight:400}
#warbar .wb{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0;background:#000} #warbar .wb i{display:block;height:100%} #warbar .wb span{position:absolute;inset:0;font-size:11px;line-height:14px;text-shadow:0 1px 0 #000}
#warbar .wm{font-size:12px;color:var(--gold)} #warbar button{margin-top:4px;border:0;border-radius:10px;padding:5px 14px;background:var(--gold);color:#1b1430;font-family:var(--font);font-size:14px;cursor:pointer}
#bossbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 180px);transform:translateX(-50%);z-index:5;width:min(70vw,300px);pointer-events:none;text-align:center}
#bossbar .nm{font-size:16px;color:#ffcf4a;text-shadow:0 2px 0 #000} #bossbar .bar{height:12px;border:2px solid #ffcf4a} #bossbar .bar i{background:linear-gradient(90deg,#b01030,#ff3d4a)}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(8,4,20,.7);backdrop-filter:blur(4px)}
.card{width:100%;max-width:420px;max-height:88%;overflow:auto;background:linear-gradient(180deg,#2a1f4d,#17102f);border:2px solid var(--c1);border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.5,.5,1);color:#fff}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:24px;text-align:center;font-family:var(--title);color:var(--c1);letter-spacing:1px}
.card h3{margin:6px 0 0;font-weight:400;font-size:16px;color:var(--c1)}
.card p{margin:0;color:#d8d2ea;line-height:1.5;text-align:center;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px}
.row .t{flex:1;min-width:0} .row .t div{font-size:16px} .row .t span{font-size:12px;color:#b9b1d4;display:block;line-height:1.3}
.row .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.3)}
.buy{border:0;cursor:pointer;background:var(--green);color:#1b1430;border-radius:11px;padding:8px 12px;font-size:15px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.buy[disabled]{background:#5a5570;color:#bbb;cursor:default} .buy.sell{background:var(--red);color:#fff} .buy.alt{background:var(--blue);color:#fff}
.close{align-self:center;border:0;background:none;color:#fff;font-size:17px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap} .tab{border:2px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer} .tab.on{background:var(--c1);color:#1b1430;border-color:var(--c1)}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-size:11px;margin-right:4px;vertical-align:middle}
.go:disabled,.buy:disabled{filter:grayscale(.8) brightness(.7);cursor:default} .go{border:0;cursor:pointer;font-size:24px;color:#1b1430;background:var(--c1);padding:13px 38px;border-radius:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 0 rgba(0,0,0,.5);font-family:var(--title);letter-spacing:1px;align-self:center}
.go:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.5)}
.go[disabled]{background:#5a5570;color:#bbb}
.inp{font:inherit;font-size:20px;text-align:center;width:220px;padding:8px 12px;border-radius:14px;border:3px solid var(--c1);background:rgba(255,255,255,.95);color:var(--ink);outline:none;align-self:center}

#title{background:radial-gradient(ellipse at 50% 20%,rgba(120,90,255,.35),rgba(8,4,20,.85) 60%);align-items:flex-start;padding-top:max(26px,env(safe-area-inset-top));overflow:auto}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:440px}
.logo{font-family:var(--title);font-size:min(16vw,70px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,207,74,.6),0 5px 0 #4a2a00;letter-spacing:2px;margin-top:8px}

/* v26 첫 화면: 뒤 세계가 비치는 어둠 테두리, 빛살·빛가루, 금빛 로고(반짝 훑기), 이어하기 영웅 카드, 오늘의 팁 */
body:has(#title) .hud,body:has(#title) .acts,body:has(#title) #minimap,body:has(#title) #zoomBtns,body:has(#title) #quest,body:has(#title) #chat,body:has(#title) #labels,body:has(#title) #guide,body:has(#title) #warbar,body:has(#title) #bossbar{visibility:hidden}

.tFx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.tRays{position:absolute;left:50%;top:15%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.17) 0deg 5deg,rgba(255,214,120,0) 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,rgba(0,0,0,0) 46%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,rgba(0,0,0,0) 46%);animation:tSpin 80s linear infinite}
.tGlow{position:absolute;left:50%;top:15%;width:520px;height:220px;margin:-110px 0 0 -260px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,190,80,.32),rgba(255,140,40,0) 70%)}
.tFx s{position:absolute;bottom:-12px;left:var(--x);width:var(--z);height:var(--z);border-radius:50%;background:#fff1c2;box-shadow:0 0 6px 1px rgba(255,200,90,.9);opacity:0;animation:tUp var(--d) linear var(--dl) infinite}
@keyframes tSpin{to{transform:rotate(360deg)}}
@keyframes tUp{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}80%{opacity:.6}100%{transform:translate(var(--dx),-105vh);opacity:0}}
#title .titlebox{position:relative;z-index:1}
#title .logo{background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%) no-repeat,linear-gradient(180deg,#fffbea 0%,#ffe27a 36%,#f29a1c 58%,#ffd257 80%,#fff0a8 100%);background-size:300% 100%,100% 100%;background-position:150% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #7a3c00) drop-shadow(0 4px 0 #3a1a00) drop-shadow(0 0 16px rgba(255,180,60,.55));animation:tShine 4.5s ease-in-out 1s infinite}
@keyframes tShine{0%{background-position:150% 0,0 0}35%,100%{background-position:-50% 0,0 0}}
#title .logo span{-webkit-text-fill-color:#ffe9b0;color:#ffe9b0;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}

.tHero{display:flex;align-items:center;gap:12px;padding:9px 20px 9px 9px;border-radius:22px;background:linear-gradient(135deg,var(--a),var(--b));border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 3px rgba(255,207,74,.6),0 7px 0 rgba(0,0,0,.45),0 0 34px rgba(255,200,90,.35);min-width:300px;text-align:left;margin-top:6px;animation:tIn .6s cubic-bezier(.2,.9,.3,1.2) both}
.tHero em{font-style:normal;font-size:30px;width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.35),rgba(0,0,0,.3));border:2px solid rgba(255,255,255,.7);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tHero b{display:block;font-family:var(--title);font-weight:400;font-size:25px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.45)} .tHero span{font-size:13px;opacity:.95}
.tHero i{margin-left:auto;font-style:normal;font-family:var(--title);font-size:24px;color:#ffe27a;text-shadow:0 2px 0 #000;padding-left:14px}
.tGo{animation:tPulse 1.8s ease-in-out infinite;margin-top:4px}
@keyframes tPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.12) drop-shadow(0 0 12px rgba(255,207,74,.8))}}
@keyframes tIn{0%{opacity:0;transform:translateY(14px) scale(.92)}100%{opacity:1;transform:none}}
#title .realm{animation:tIn .5s cubic-bezier(.2,.9,.3,1.2) both} #title .realm:nth-child(2){animation-delay:.07s} #title .realm:nth-child(3){animation-delay:.14s} #title .realm:nth-child(4){animation-delay:.21s}
.tTip{font-size:12.5px;color:#fff3cf;background:rgba(10,6,28,.62);border:1px solid rgba(255,207,74,.35);border-radius:999px;padding:4px 14px;margin:2px 0 0;text-shadow:0 1px 2px #000}

/* v39 HUD 게임다운 테두리: 금속 금테(그라데이션 테두리)·위쪽 광택·눌림 반짝(빛 고리 퍼짐) — CSS만, 계속 도는 애니 없음 */
:root{--gm1:#fff0b8;--gm2:#d9a33a;--gm3:#7a4e12;--gm4:#ffe2a0}
.mbtn{border:2px solid transparent!important;background:linear-gradient(180deg,rgba(78,58,140,.95),rgba(30,20,62,.95) 55%,rgba(18,12,40,.97)) padding-box,linear-gradient(180deg,var(--gm1),var(--gm2) 40%,var(--gm3) 70%,var(--gm4)) border-box!important;box-shadow:0 3px 0 #1a0f06,0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.35)!important;position:relative;overflow:hidden;white-space:nowrap;transition:transform .08s,filter .08s}
@media (orientation:landscape){.mbtn{font-weight:700}}
@media (orientation:portrait) and (max-width:440px){.mbtn{min-width:0!important;padding:8px 11px!important}}
.mbtn::after{content:"";position:absolute;left:6%;right:6%;top:2px;height:42%;border-radius:10px 10px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.mbtn:active{transform:translateY(2px) scale(.96);filter:brightness(1.25);box-shadow:0 1px 0 #1a0f06,0 2px 6px rgba(0,0,0,.45),inset 0 0 12px rgba(255,214,120,.45)!important}
#status{border:2px solid transparent!important;background:linear-gradient(135deg,rgba(46,32,92,.92),rgba(16,10,34,.92)) padding-box,linear-gradient(135deg,var(--gm1),var(--c1) 30%,var(--gm3) 62%,var(--gm4)) border-box!important;box-shadow:0 4px 0 rgba(10,5,2,.55),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)!important;position:relative}
#status::before{content:"";position:absolute;inset:3px;border:1px solid rgba(255,214,120,.22);border-radius:12px;pointer-events:none}
#status::after{content:"";position:absolute;left:-5px;top:-5px;width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,var(--gm1),var(--gm2) 50%,var(--gm3));border:1px solid #2a1806;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.pill{border:1.5px solid transparent!important;background:linear-gradient(135deg,rgba(46,32,92,.88),rgba(14,9,30,.88)) padding-box,linear-gradient(180deg,rgba(255,236,170,.9),rgba(160,110,30,.75) 55%,rgba(255,220,150,.85)) border-box!important}
.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 0 0 1px rgba(255,214,120,.28)}
.bar i{position:relative;overflow:hidden} .bar i::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));border-radius:6px 6px 0 0}
.act{box-shadow:0 0 0 2px rgba(22,12,4,.85),0 0 0 4px var(--gm2),0 0 0 5px rgba(60,36,8,.9),0 6px 0 rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -7px 10px rgba(0,0,0,.28)!important;border-color:rgba(255,246,220,.75)!important;transition:transform .07s,filter .07s}
.act:active{transform:translateY(3px) scale(.94);filter:brightness(1.3) saturate(1.1);box-shadow:0 0 0 2px rgba(22,12,4,.85),0 0 0 4px var(--gm1),0 0 0 5px rgba(60,36,8,.9),0 2px 0 rgba(0,0,0,.45),0 0 18px rgba(255,214,120,.7),inset 0 2px 0 rgba(255,255,255,.55)!important}
.act.lock{box-shadow:0 0 0 2px rgba(22,12,4,.85),0 0 0 4px #6b6b74,0 6px 0 rgba(0,0,0,.45)!important}
.act b,.act{font-weight:800}
.act.atk{text-shadow:0 2px 0 rgba(90,0,10,.7),0 0 6px rgba(0,0,0,.4)}
#zoomBtns button{border:2px solid transparent!important;background:linear-gradient(180deg,rgba(78,58,140,.95),rgba(20,14,44,.95)) padding-box,linear-gradient(180deg,var(--gm1),var(--gm2) 45%,var(--gm3)) border-box!important;box-shadow:0 3px 0 #1a0f06,0 5px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .08s,filter .08s}
#zoomBtns button:active{transform:translateY(2px) scale(.94);filter:brightness(1.3)}
#minimap{box-shadow:0 0 0 2px #1c1006,0 0 0 4px var(--gm2),0 0 0 5px #3a2208,0 6px 16px rgba(0,0,0,.5)!important}
.q{background:linear-gradient(90deg,rgba(36,24,74,.86),rgba(20,14,40,.55))!important;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
/* 눌림 반짝: 누른 자리에서 금빛 고리가 퍼짐 (06-ui.js 가 .pr 붙임) */
.prfx{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;z-index:60;border:3px solid rgba(255,232,160,.95);box-shadow:0 0 10px rgba(255,207,74,.9),inset 0 0 8px rgba(255,255,255,.6);animation:prfx .32s ease-out forwards}
@keyframes prfx{0%{transform:scale(.4);opacity:1}100%{transform:scale(4.2);opacity:0}}
body.eco .prfx{box-shadow:none}
/* v41 기술 준비 알림: 쿨타임 동안 흐리게 + 큰 숫자, 끝나면 반짝 고리·빛 훑기·톡 튀기 */
.act.skl.cool{filter:saturate(.45) brightness(.82)}
.act.skl.cool span{opacity:.55}
.act.skl.cool small{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#fff;opacity:1;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);z-index:2;pointer-events:none}
.act .cd{z-index:1}
.act.skl::before{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;opacity:0;z-index:3}
.act.skl.ready{animation:sklPop .5s cubic-bezier(.3,1.6,.5,1)}
.act.skl.ready::before{border:4px solid #ffd54a;box-shadow:0 0 0 2px rgba(120,60,0,.55),0 0 16px #ffb81f,0 0 30px rgba(255,214,110,.9),inset 0 0 14px rgba(255,240,180,.9);animation:sklRing .7s ease-out forwards}
.act.skl.ready .cd{background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.95),rgba(255,248,210,.7) 45%,rgba(255,220,120,0) 72%)!important;animation:sklFlash .45s ease-out forwards}
@keyframes sklPop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sklRing{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.75);opacity:0}}
@keyframes sklFlash{0%{opacity:1}100%{opacity:0}}
body.eco .act.skl.ready::before{box-shadow:0 0 10px var(--c2,#ffe27a)}
/* v42: 🗿 수수께끼 · 🌱 길잡이 */
.orq{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;margin:6px 0} .orq.ok{border-color:rgba(80,220,130,.6)} .orq.no{border-color:rgba(255,110,110,.5)}
.orq .qh{font-size:15px;line-height:1.4;margin-bottom:8px} .orq .qh b{display:inline-block;min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1b1430;text-align:center;line-height:22px;margin-right:6px;font-size:13px} .orq .qi{margin-right:4px}
.oropt{display:grid;grid-template-columns:1fr 1fr;gap:6px} .oropt .buy{white-space:normal;font-size:14px;padding:9px 8px;line-height:1.2} .oropt .buy.ok{background:#2fae62!important;color:#fff!important;filter:none!important} .oropt .buy.no{background:#d9534f!important;color:#fff!important;filter:none!important}
.orex{font-size:12.5px;margin:7px 0 0;opacity:.92;line-height:1.35}
.lbl .mtb{display:inline-block;font-size:11px;font-weight:900;border-radius:7px;padding:0 5px;margin-right:4px;line-height:15px;vertical-align:1px;background:rgba(20,40,70,.75);color:#cfe8ff;text-shadow:none} .lbl .mtb.sp{background:rgba(40,120,60,.85);color:#e8ffe8} .lbl .mtb.gold{background:linear-gradient(180deg,#fff0b0,#ffc83a);color:#4a2a00}
#mtBar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);z-index:6;display:flex;flex-wrap:nowrap;justify-content:center;gap:4px;max-width:min(470px,60vw);overflow-x:auto;scrollbar-width:none;padding:5px 8px;border-radius:14px;background:rgba(20,40,30,.55);border:1px solid rgba(157,255,184,.45)}
#mtBar[hidden]{display:none} #mtBar .mth{font-size:14px;align-self:center} #mtBar button{flex:none;border:0;border-radius:999px;padding:4px 8px;font-size:12px;font-family:inherit;background:#e8ffe8;color:#1b3a24;box-shadow:0 2px 0 #3a7a4a;cursor:pointer} #mtBar button.hit{animation:mtHit .35s ease-out}
@keyframes mtHit{0%{transform:scale(1.18);background:#9dffb8}100%{transform:scale(1)}}
/* v43: 🎒 메뉴 창 게임다운 디자인 — 등급 테두리·아이콘 칸·금속 탭·광택 버튼 */
.card h3{display:flex;align-items:center;gap:8px;color:#ffe08a;text-shadow:0 1px 0 #000;letter-spacing:.5px}
.card h3::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,207,74,.75),rgba(255,207,74,0))}
.row{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 rgba(0,0,0,.35)}
.row .ic{position:relative;background:radial-gradient(circle at 50% 35%,rgba(120,100,180,.55),rgba(14,9,30,.9) 75%);border:2px solid rgba(255,207,74,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.08);text-shadow:0 2px 2px rgba(0,0,0,.6)}
.row.rr{border-color:color-mix(in srgb,var(--rc) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 26%,transparent),rgba(255,255,255,.04) 55%,rgba(255,255,255,.03));box-shadow:inset 4px 0 0 var(--rc),inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.35)}
.row.rr .ic{border-color:var(--rc);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 85%,#fff),color-mix(in srgb,var(--rc) 55%,#100820) 55%,#120a26 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.5)}
.row.rr .ic::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:40%;border-radius:7px 7px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.row.rr2{box-shadow:inset 4px 0 0 var(--rc),inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.35),0 0 10px color-mix(in srgb,var(--rc) 45%,transparent)}
.row.rr2 .ic{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.45),0 0 8px var(--rc)}
.row.rr3{box-shadow:inset 4px 0 0 var(--rc),inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 rgba(0,0,0,.35),0 0 14px rgba(255,200,60,.55)}
.row.rr3 .ic{box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 6px rgba(0,0,0,.4),0 0 10px #ffcf4a,0 0 18px rgba(255,180,40,.6)}
.row.rr3::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,rgba(255,240,180,0),rgba(255,240,180,.28),rgba(255,240,180,0));transform:skewX(-18deg);animation:rrShine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes rrShine{0%,55%{left:-40%}100%{left:130%}}
.rar{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%,rgba(0,0,0,.2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.5);text-shadow:0 1px 0 rgba(0,0,0,.45);font-weight:700}
.tabs{gap:5px} .tab{position:relative;border:2px solid rgba(255,207,74,.35);background:linear-gradient(180deg,rgba(70,54,120,.95),rgba(26,18,52,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.45);border-radius:12px;text-shadow:0 1px 0 #000;transition:transform .08s}

.tab.on{background:linear-gradient(180deg,#fff2bf,#ffcf4a 50%,#e0a520);border-color:#fff1b0;color:#3a2000;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:inset 0 1px 0 #fff,0 3px 0 #7a4a00,0 0 12px rgba(255,207,74,.55)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#e0a520;border-bottom:0}
.buy{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 52%,rgba(0,0,0,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,255,255,.3);font-weight:700;transition:transform .08s}

function mobGL(name,scale){ const sk=SKEL_OF[name]; if(sk){ if(!MODELS.chars[sk]) return null; const g=makeCharGL(sk,{scale:2.0*scale}); if(g){ g.userData.h=4.2*scale; g.userData.glMob=name; } return g; }

function avatarGL(realm,rank,look,scale,eq){ const s=lookSpec(realm,rank,look,eq); const need=specNeeds(s); if(!ensure(need.names,need.weapons)||!MODELS.animsReady) return null;

  if(realm===0){ const halo=new THREE.Mesh(new THREE.TorusGeometry(.5,.05,10,32),mat({color:0xffe27a,emissive:0xffd05a,emissiveIntensity:1.2,metalness:.5,roughness:.3})); halo.rotation.x=Math.PI/2; halo.position.y=4.35; g.add(halo); }
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.9,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.22,depthWrite:false})); sh.rotation.x=-Math.PI/2; sh.position.y=.05; g.add(sh);

/* 장비가 바뀌면: 필요한 모델을 받은 뒤 내 캐릭터를 다시 조립 + 친구에게 알림 */
function gearNeeds(eq){ const s=lookSpec(G.realm,G.rank,G.look||{},eq); return specNeeds(s); }
function refreshGear(slot){ const nd=gearNeeds(G.eq); const go=()=>{ buildPlayer(); try{ net.hello&&net.hello(); }catch(e){} const t=G.eq[slot]; if(t>=0&&player){ fxRing(P.x,P.z,RAR_HEX[t],5,.6); fxSpark(P.x,2.5,P.z,RAR_HEX[t],30); const el=document.createElement("div"); el.className="gearpop"; el.style.setProperty("--rc",RAR[t].c); el.innerHTML=`${{w:"⚔",a:"🛡",r:"✨"}[slot]} ${itemName(slot,t)}<small>${RAR[t].n} · 모습이 바뀌었어요</small>`; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); } }; if(ensure(nd.names,nd.weapons,go)) go(); }
const NPC_LOOK={"예수":{body:8,hat:1,cape:1,weapon:6,tint:4},"가브리엘":{body:1,face:9,cape:11,weapon:2},"라파엘":{body:9,hat:1,cape:1,weapon:8},"토르":{body:4,hat:3,cape:8,weapon:5},"프레이야":{body:6,face:12,cape:4,weapon:10},"헤임달":{body:2,hat:4,cape:2,weapon:3},"하누만":{body:14,hat:1,cape:1,weapon:1},"가네샤":{body:16,hat:12,cape:1,weapon:6},"아그니":{body:7,hat:1,cape:9,weapon:7,tint:1},"아테나":{body:2,hat:4,cape:2,weapon:2},"아폴론":{body:11,hat:1,cape:7,weapon:10,tint:4},"헤르메스":{body:10,hat:1,cape:7,weapon:1}};

  if(typeof player!=="undefined"&&player&&!player.userData.glAvatar&&typeof buildPlayer==="function") buildPlayer();
  if(typeof PEERS!=="undefined") for(const id in PEERS){ const o=PEERS[id]; if(!o.mesh.userData.glAvatar&&net.rebuild) net.rebuild(o); }
  if(typeof NPCS!=="undefined") NPCS.forEach(o=>{ if(o.mesh.userData.glAvatar) return; const realm=REGIONS.find(r=>r===o.cap).realm; const g=avatarGL(realm,6,NPC_LOOK[o.n]||{},2.3); if(g){ scene.remove(o.mesh); o.mesh=g; scene.add(g); g.position.set(o.x,hAt(o.x,o.z),o.z); } });
  if(typeof mobs!=="undefined") mobs.forEach(m=>{ if(m.mesh.userData.gl||m.trialOf||m.war) return; const g=mobGL(m.n,m.scale); if(g){ g.position.copy(m.mesh.position); g.rotation.y=m.mesh.rotation.y; scene.remove(m.mesh); m.mesh=g; scene.add(g); if(m.aura){ g.add(m.aura); } } }); }

/* ---- 건물·나무: 준비되면 절차 소품을 진짜 모델로 교체 ---- */
/* v34 배터리: 나무·바위·집·성 (KayKit hex 모델 약 350개)을 하나하나 그리던 것(한 화면 300~600번 그리기 호출) →
   같은 모델끼리 100×100 칸마다 InstancedMesh 하나로 묶어 그림(호출 10~40번). 칸은 내 위치·시야에서 먼 것은 숨김(hexTick). */
const HEXI={list:[],t:0,x:1e9,z:1e9};
function onHexReady(){ try{ PLACED.forEach(p=>{ if(p.obj){ scene.remove(p.obj); p.obj=null; } }); HEXI.list.forEach(im=>scene.remove(im)); HEXI.list=[];
  const groups={}; const CH=100; const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _s=new THREE.Vector3(), _p=new THREE.Vector3(), _e=new THREE.Euler();
  PLACED.forEach(p=>{ const h=hexPick(p); if(!h) return; const src=MODELS.hex[h.name]; if(!src) return; src.updateMatrixWorld(true); const cx=Math.floor(p.x/CH), cz=Math.floor(p.z/CH); let mi=0;
    _p.set(p.x,hAt(p.x,p.z)-.05,p.z); _q.setFromEuler(_e.set(0,p.rot||0,0)); _s.setScalar(h.scale); const root=new THREE.Matrix4().compose(_p,_q,_s);
    src.traverse(o=>{ if(!o.isMesh) return; const key=h.name+"|"+(mi++)+"|"+cx+"|"+cz; let g=groups[key]; if(!g){ g=groups[key]={geo:o.geometry,mat:o.material,mats:[],cx,cz,minx:1e9,maxx:-1e9,minz:1e9,maxz:-1e9,r:0}; } g.mats.push(_m.multiplyMatrices(root,o.matrixWorld).clone());
      const rr=(o.geometry.boundingSphere?o.geometry.boundingSphere.radius:3)*h.scale; g.r=Math.max(g.r,rr); g.minx=Math.min(g.minx,p.x); g.maxx=Math.max(g.maxx,p.x); g.minz=Math.min(g.minz,p.z); g.maxz=Math.max(g.maxz,p.z); }); });
  for(const k in groups){ const g=groups[k]; const im=new THREE.InstancedMesh(g.geo,g.mat,g.mats.length); g.mats.forEach((m,i)=>im.setMatrixAt(i,m)); im.instanceMatrix.needsUpdate=true; im.castShadow=HIGH(); im.receiveShadow=HIGH()&&!ECO(); im.frustumCulled=false; im.userData.noOutline=true; im.userData.cullR=-1;
    im.userData.hx={minx:g.minx-g.r,maxx:g.maxx+g.r,minz:g.minz-g.r,maxz:g.maxz+g.r}; scene.add(im); HEXI.list.push(im); } HEXI.x=1e9; hexTick(1); }catch(e){ console.warn(e); } }
function hexTick(dt){ HEXI.t-=dt; if(HEXI.t>0||!HEXI.list.length) return; HEXI.t=.3; if(Math.hypot(P.x-HEXI.x,P.z-HEXI.z)<4&&HEXI.zoom===ZOOM) return; HEXI.x=P.x; HEXI.z=P.z; HEXI.zoom=ZOOM;
  const far=170*Math.max(1,ZOOM*.85)+20, back=P.z+16+14*ZOOM;
  for(const im of HEXI.list){ const b=im.userData.hx; const dx=Math.max(b.minx-P.x,0,P.x-b.maxx), dz=Math.max(b.minz-P.z,0,P.z-b.maxz); im.visible=b.minz<=back&&dx*dx+dz*dz<=far*far; } }
function hexPick(p){ const c=REALM_HEXCOLOR[p.realm]||"yellow"; if(p.hx) return p.hx; let h=null;
  if(p.kind==="tree"){ const pool=p.realm===1?["trees_B_small","trees_B_medium","trees_B_large","tree_single_B"]:p.realm===2?["tree_single_A","tree_single_B","trees_A_small"]:["trees_A_small","trees_A_medium","trees_A_large","tree_single_A"]; h={name:pick(pool),scale:rnd(4.5,6.5)}; }
  else if(p.kind==="rock") h={name:pick(["rock_single_A","rock_single_B","rock_single_C","rock_single_D","rock_single_E"]),scale:rnd(9,16)};
  else if(p.kind==="house") h={name:pick(["building_home_A_"+c,"building_home_B_"+c,"building_tavern_"+c,"building_blacksmith_"+c]),scale:5.5};
  else if(p.kind==="castle") h={name:"building_castle_"+c,scale:5.5};
  else if(p.kind==="church") h={name:pick(["building_church_"+c,"building_tower_A_"+c,"building_windmill_"+c]),scale:5.5};
  else if(p.kind==="market") h={name:"building_market_"+c,scale:5};
  else if(p.kind==="prop") h={name:pick(["barrel","crate_A_big","tent","weaponrack","wheelbarrow","sack","bucket_water","target"]),scale:5};
  else if(p.kind==="flag") h={name:"flag_"+c,scale:5};
  p.hx=h; return h; }
function hexFor(p){ const c=REALM_HEXCOLOR[p.realm]||"yellow";
  if(p.kind==="tree"){ const pool=p.realm===1?["trees_B_small","trees_B_medium","trees_B_large","tree_single_B"]:p.realm===2?["tree_single_A","tree_single_B","trees_A_small"]:["trees_A_small","trees_A_medium","trees_A_large","tree_single_A"]; return hexModel(pick(pool),rnd(4.5,6.5)); }
  if(p.kind==="rock"){ return hexModel(pick(["rock_single_A","rock_single_B","rock_single_C","rock_single_D","rock_single_E"]),rnd(9,16)); }
  if(p.kind==="house"){ return hexModel(pick(["building_home_A_"+c,"building_home_B_"+c,"building_tavern_"+c,"building_blacksmith_"+c]),5.5); }
  if(p.kind==="castle"){ return hexModel("building_castle_"+c,5.5); }
  if(p.kind==="church"){ return hexModel(pick(["building_church_"+c,"building_tower_A_"+c,"building_windmill_"+c]),5.5); }
  if(p.kind==="market"){ return hexModel("building_market_"+c,5); }
  if(p.kind==="prop"){ return hexModel(pick(["barrel","crate_A_big","tent","weaponrack","wheelbarrow","sack","bucket_water","target"]),5); }
  if(p.kind==="flag"){ return hexModel("flag_"+c,5); }
  return null; }

<script>
/* ================= v18 레벨업·승급 연출: 빛기둥 · 떠오르는 고리 · 솟는 빛가루 · 화면 금빛 · 큰 글씨 ================= */
const LVFX={tex:null,geo:null};
function lvTex(){ if(LVFX.tex) return LVFX.tex; const c=document.createElement("canvas"); c.width=8; c.height=128; const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,0,128); gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(.45,"rgba(255,255,255,.35)"); gr.addColorStop(.88,"rgba(255,255,255,1)"); gr.addColorStop(1,"rgba(255,255,255,.15)");
  g.fillStyle=gr; g.fillRect(0,0,8,128); LVFX.tex=new THREE.CanvasTexture(c); LVFX.geo=new THREE.CylinderGeometry(1,1,1,20,1,true); LVFX.geo.translate(0,.5,0); return LVFX.tex; }
function lvMat(color,op){ return new THREE.MeshBasicMaterial({color,map:lvTex(),transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}); }
function lvFollow(m,y){ m.position.set(P.x,(P.gy||0)+(y||0),P.z); }
/* 빛기둥: 발밑에서 하늘로 확 솟았다가 가늘어지며 사라짐 (나를 따라다님) */
function fxPillar(color,r,h,dur,op){ op=op||.5; const m=new THREE.Mesh((lvTex(),LVFX.geo),lvMat(color,op)); m.userData.noOutline=true; m.renderOrder=5; lvFollow(m); scene.add(m);
  FX.push({m,t:0,d:dur,kind:"lv",tick:(f,k)=>{ lvFollow(f.m); const up=Math.min(1,k*5); const rr=r*(k<.12?.3+k/.12*.9:1.2-(k-.12)*1.1); f.m.scale.set(Math.max(.05,rr),h*(.15+.85*Math.pow(up,.5)),Math.max(.05,rr)); f.m.material.opacity=op*(k<.7?1:(1-k)/.3); f.m.rotation.y+=.05; }}); }
/* 몸을 감싸며 위로 떠오르는 고리 */
function fxRiseRing(color,delay,size,dur){ const m=new THREE.Mesh(GEO.ring,glowMat(color,0)); m.rotation.x=-Math.PI/2; m.userData.noOutline=true; lvFollow(m,.1); scene.add(m);
  FX.push({m,t:-delay,d:dur,kind:"lv",tick:(f,k)=>{ if(k<0){ f.m.visible=false; return; } f.m.visible=true; lvFollow(f.m,.1+k*5.5); const s=size*(1.25-k*.75); f.m.scale.set(s,s,s); f.m.material.opacity=.95*(k<.15?k/.15:1-(k-.15)/.85); }}); }
/* 나선으로 솟는 빛가루 */
function fxRiseDust(color,n,dur){ const geo=new THREE.BufferGeometry(); const p=new Float32Array(n*3); const a=[]; for(let i=0;i<n;i++) a.push({ang:Math.random()*6.28,r:rnd(.6,2.4),vy:rnd(3,9),sp:rnd(1.5,3.5)*(Math.random()<.5?-1:1),y:rnd(-.5,1)});
  geo.setAttribute("position",new THREE.BufferAttribute(p,3)); const m=new THREE.Points(geo,new THREE.PointsMaterial({color,size:.38,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending})); m.userData.noOutline=true; scene.add(m);
  FX.push({m,t:0,d:dur,kind:"lv",own:true,tick:(f,k,dt)=>{ const gy=P.gy||0; for(let i=0;i<n;i++){ const q=a[i]; q.y+=q.vy*dt; q.ang+=q.sp*dt; q.r*=1+dt*.25; p[i*3]=P.x+Math.cos(q.ang)*q.r; p[i*3+1]=gy+q.y; p[i*3+2]=P.z+Math.sin(q.ang)*q.r; } geo.attributes.position.needsUpdate=true; f.m.material.opacity=k<.6?1:(1-k)/.4; }}); }
/* 화면 쪽: 금빛 번쩍 + 큰 글씨 배너 */
function lvBanner(top,big,sub,css){ let b=$("lvup"); if(!b){ b=document.createElement("div"); b.id="lvup"; b.innerHTML='<div class="rays"></div><div class="top"></div><div class="big"></div><div class="sub"></div>'; document.body.appendChild(b); const g=document.createElement("div"); g.id="lvglow"; document.body.appendChild(g); }
  b.style.setProperty("--lc",css||"#ffd76a"); $("lvglow").style.setProperty("--lc",css||"#ffd76a");
  b.querySelector(".top").textContent=top; b.querySelector(".big").textContent=big; b.querySelector(".sub").innerHTML=sub||"";
  $("toast").classList.add("lvdn");
  LVFX.bt=0; LVFX.b=b; LVFX.g=$("lvglow"); LVFX.r=b.querySelector(".rays"); LVFX.bg=b.querySelector(".big"); b.style.display=LVFX.g.style.display="block"; tickLvBanner(0); }
/* 게임 시간으로 움직임(메인 루프에서 부름) — 화면이 버벅여도 순서대로 보임 */
const easeOutBack=x=>{ const c=1.9; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
function tickLvBanner(dt){ if(!LVFX.b||LVFX.bt==null) return; const t=(LVFX.bt+=dt), D=3.4; const b=LVFX.b, g=LVFX.g;
  if(t>=D){ b.style.display=g.style.display="none"; LVFX.bt=null; $("toast").classList.remove("lvdn"); return; }
  const op=t<.25?t/.25:t>D-.6?(D-t)/.6:1; const sc=t<.3?.6+.5*easeOutBack(t/.3):1; const dy=t>D-.6?-12*(1-(D-t)/.6):0;
  b.style.opacity=op.toFixed(3); b.style.transform=`translate(-50%,calc(-50% + ${dy.toFixed(1)}%)) scale(${sc.toFixed(3)})`;
  const pk=Math.min(1,t/.45); LVFX.bg.style.transform=`scale(${(t<.45?2.2-1.2*easeOutBack(pk):1).toFixed(3)})`;
  LVFX.r.style.transform=`rotate(${(t*40).toFixed(1)}deg) scale(${(t<.4?.3+.8*t/.4:1.1-.1*Math.min(1,(t-.4)/2)).toFixed(3)})`; LVFX.r.style.opacity=(t<.4?t/.4*.9:.9-.35*Math.min(1,(t-.4)/2.4)).toFixed(3);
  g.style.opacity=(t<.15?t/.15:Math.max(0,1-(t-.15)/1.3)).toFixed(3); }
const hexCss=c=>"#"+(c>>>0).toString(16).padStart(6,"0");
function celebrateLevel(lv,s0){ const s1=stat(); const hi=HIGH();
  fxPillar(0xffc94a,.95,hi?42:26,1.8,.45); if(hi) fxPillar(0xfff2c0,.3,46,1.4,.35);
  for(let i=0;i<3;i++) fxRiseRing(0xffd76a,i*.18,2.4,1.1); fxRing(P.x,P.z,0xffffff,7,.6); fxRiseDust(0xffe9a8,hi?60:28,1.9);
  drama(0xffd76a,.35,1.2); P.shake=Math.max(P.shake||0,.35); buzz([30,40,60]);
  const d=(s0&&s1)?`체력 <b>+${fmt(s1.mhp-s0.mhp)}</b> · 공격 <b>+${fmt(s1.atk-s0.atk)}</b>`:"체력과 공격력이 올랐어요";
  lvBanner("LEVEL UP","Lv "+lv,d); }
function celebrateRank(R,rank){ const c=R.c1, css=hexCss(c), hi=HIGH();
  fxPillar(c,1.3,hi?60:34,2.6,.4); fxPillar(0xffc94a,.6,64,2.2,.3); if(hi) fxPillar(0xfff2c0,.25,66,1.8,.3);
  for(let i=0;i<5;i++) fxRiseRing(i%2?0xffe08a:c,i*.16,3.2,1.3); fxRing(P.x,P.z,c,18,1.3); fxRing(P.x,P.z,0xffffff,9,.7); fxFlash(P.x,2,P.z,0xfff2c0,4,.4); fxRiseDust(c,hi?90:36,2.6); fxRiseDust(0xffe9a8,hi?50:20,2.2);
  drama(c,.3,1.6); P.shake=Math.max(P.shake||0,1.1); buzz([60,40,60,40,140]);
  lvBanner("승급!",R.ranks[rank],rank===6?`${R.absolute} 바로 아래, 최고 계급!`:"더 강해졌어요 · 새 장비를 낄 수 있어요",css); }
</script>
<script>
/* ================= 세계별 하늘 분위기 =================
   에덴: 하늘에서 내려오는 황금 빛줄기 · 아스가르드: 밤하늘 오로라(낮에도 희미하게)
   인도: 빙글빙글 떨어지는 꽃잎 · 올림푸스: 먹구름 왕관 + 멀리 치는 제우스 번개
   보이는 세계 하나만 켜짐. 그리기 호출: 세계당 1~3개. PointLight 없음. */
const ATMO=(function(){
  const root=new THREE.Group(); root.userData.noOutline=true; scene.add(root);
  const add=(o)=>{ o.frustumCulled=false; o.renderOrder=2; root.add(o); return o; };
  const uT={value:0}, uA={value:0}, uR={value:0}, uO={value:0};

  /* ---- 아스가르드 오로라: 휘어진 커튼 3장, 셰이더로 일렁임 ---- */
  const aur=new THREE.Group(); root.add(aur);
  const aurMat=new THREE.ShaderMaterial({uniforms:{t:uT,a:uA},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,fog:false,toneMapped:false,

<script>
/* ================= 기술 이펙트 다듬기 (v21) =================

    g.lineWidth=2; g.beginPath(); for(let i=0;i<=6;i++){ const a=i*Math.PI*4/6*1.5-Math.PI/2; const r=c-14; const x=c+Math.cos(i*Math.PI*2/6*2-Math.PI/2)*r, y=c+Math.sin(i*Math.PI*2/6*2-Math.PI/2)*r; i?g.lineTo(x,y):g.moveTo(x,y); } g.stroke(); g.beginPath(); for(let i=0;i<=6;i++){ const x=c+Math.cos(i*Math.PI*2/6*2-Math.PI/2+Math.PI/6*2)*(c-14), y=c+Math.sin(i*Math.PI*2/6*2-Math.PI/2+Math.PI/6*2)*(c-14); i?g.lineTo(x,y):g.moveTo(x,y); } g.stroke();

  function mat(tex,color,op,add){ return new THREE.MeshBasicMaterial({map:tex,color,transparent:true,opacity:op,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,side:THREE.DoubleSide}); }

    FX.push({m,t:0,d:dur,tick:(f,k,dt)=>{ const s=size*(k<.2?ease(k/.2):1+(k-.2)*.15); m.scale.set(s,s,1); m.rotation.z+=dt*2.4; m.material.opacity=(k<.2?k/.2:1-(k-.2)/.8)*.95; }});
    FX.push({m:m2,t:0,d:dur,tick:(f,k)=>{ const s=size*1.3; m2.scale.set(s,s,1); m2.material.opacity=(k<.2?k/.2:1-(k-.2)/.8)*.45; }}); }
  // 일직선 빛줄기 + 잔상 + 땅 자국

      FX.push({m,t:-(delay||0),d,tick:(f,k)=>{ if(k<0){ m.visible=false; return; } m.visible=true; const g=Math.min(1,k/.22); const L=len*ease(g); m.scale.set(width*(1-k*.5),L,1); m.position.set(x+sx*L/2,yy,z+sz*L/2); m.material.opacity=op*(k<.22?1:1-(k-.22)/.78); }}); };

<script>
/* ================= 💤 쉬는 친구 꿈결 연출 (v23) =================
   - 쉬는 친구 몸은 살짝 비치는 푸른 꿈빛(반투명 + 은은한 빛, 그림자 없음, 검은 외곽선 숨김)
   - 발밑에 천천히 숨 쉬는 꿈빛 고리

   - 그래픽 높음이면 몸 둘레에 작은 별빛 가루가 천천히 떠오름

const DREAM=(()=>{ const T={}; const PL=new THREE.PlaneGeometry(1,1); const TINT=new THREE.Color(0x7d8cff), TINT2=new THREE.Color(0x3a4cc0);

  const zTex=()=>can("z",(g,s)=>{ g.font="900 96px Arial Black, Arial, sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.lineJoin="round";
    g.lineWidth=14; g.strokeStyle="rgba(30,40,110,.9)"; g.strokeText("Z",s/2,s/2+4); const gr=g.createLinearGradient(0,20,0,108); gr.addColorStop(0,"#ffffff"); gr.addColorStop(1,"#a9c6ff"); g.fillStyle=gr; g.fillText("Z",s/2,s/2+4); });
  const ringTex=()=>can("ring",(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); r.addColorStop(0,"rgba(255,255,255,.35)"); r.addColorStop(.45,"rgba(255,255,255,.12)"); r.addColorStop(.78,"rgba(255,255,255,.85)"); r.addColorStop(.86,"rgba(255,255,255,.5)"); r.addColorStop(1,"rgba(255,255,255,0)"); g.fillStyle=r; g.fillRect(0,0,s,s);
    g.fillStyle="#fff"; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2, x=s/2+Math.cos(a)*s*.39, y=s/2+Math.sin(a)*s*.39; g.beginPath(); g.moveTo(x,y-5); g.lineTo(x+2,y); g.lineTo(x,y+5); g.lineTo(x-2,y); g.closePath(); g.fill(); } });
  const dotTex=()=>can("dot",(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.3,"rgba(255,255,255,.6)"); r.addColorStop(1,"rgba(255,255,255,0)"); g.fillStyle=r; g.fillRect(0,0,s,s); });

    const zs=[0,1,2].map(i=>{ const z=spr(zTex(),0xffffff,false); grp.add(z); return {s:z,ph:i/3}; });
    const dots=HIGH()?[0,1,2,3,4].map(i=>{ const d=spr(dotTex(),0xbcd4ff,true); grp.add(d); return {s:d,ph:i/5,a:i*1.257}; }):[];

  function tick(d,dt,x,y,z,show){ if(!d) return; d.grp.visible=show; if(!show) return; d.t+=dt; const t=d.t; d.grp.position.set(x,y,z);
    const br=.5+.5*Math.sin(t*1.6); d.ring.material.opacity=.32+.28*br; d.ring.scale.setScalar(2.4+.35*br); d.ring.rotation.z=t*.25;

    const m=new THREE.Mesh(LVFX.geo,mat); m.userData.noOutline=true; m.renderOrder=5; m.position.set(x,y,z); scene.add(m);
    FX.push({m,t:0,d:dur,tick:(f,k)=>{ const up=Math.min(1,k*6); const rr=r*(k<.1?.4+k*6:1-(k-.1)*.5); f.m.scale.set(rr,h*(.2+.8*Math.pow(up,.6)),rr); f.m.material.opacity=(outer?.7:.8)*(k<.08?k/.08:k>.7?(1-k)/.3:1); f.m.rotation.y+=.04; }}); }

  function drop(x,z,tier){ try{ const R=(typeof RAR!=="undefined"&&RAR[tier])||{c:"#ffffff"}; const col=hexOf(R.c); const hi=HIGH(); const y0=hAt(x,z);

<script>
/* ================= 타격 손맛 (v34) =================
   - 맞은 괴물: 맞은 반대쪽으로 휙 밀렸다 돌아옴 + 뒤로 젖혀짐 + 살짝 들썩 (모습만 — 실제 자리·규칙은 그대로)
   - 짧은 멈춤(히트스톱): 맞는 순간 0.05초(치명타 0.09초) 동작이 딱 멈춤 → "콱" 박히는 느낌
   - 쓰러짐: 죽으면 바로 사라지지 않고 뒤로 털썩 넘어짐(3D 모델은 쓰러지는 동작) → 잠깐 누워 있다 땅속으로 스르르 + 흙먼지
   PointLight 없음, 새 그리기 없음(괴물 몸 그대로 씀). 쓰러진 몸은 최대 8개(배터리 절약 4개). */
const HITF=(()=>{ const C=[]; const ease=k=>1-Math.pow(1-k,3);
  function knock(m,dmg,crit){ if(!m||!m.mesh||m.titan) return; const dx=m.x-P.x, dz=m.z-P.z, d=Math.hypot(dx,dz)||1;
    let s=clamp(.45+(dmg/(m.mhp||1))*2.2,.45,1.25)*(crit?1.3:1); if(m.boss) s*=.35; s/=Math.max(1,(m.scale||1)*.75);
    m.kb={x:dx/d,z:dz/d,s,t:0}; m.hs=crit?.09:.05; m.mesh.rotation.order="YXZ"; m.mesh.userData.hsU=performance.now()+m.hs*1000; }
  // tickMobs 에서 위치를 정한 다음 부름
  function apply(m,dt){ const k=m.kb; if(!k) return; if(m.hs>0) m.hs-=dt; else k.t+=dt; const D=.34; if(k.t>=D){ m.kb=null; return; }
    const u=k.t/D; const off=k.s*(u<.18?ease(u/.18):Math.pow(1-(u-.18)/.82,2)); const p=m.mesh.position;
    p.x+=k.x*off; p.z+=k.z*off; p.y+=off*.22; if(!m.mesh.userData.float) m.mesh.rotation.x+=-off*.38; }
  function die(m){ if(!m||!m.mesh||m.titan||m.corpse) return false; const lim=ECO()?4:8; while(C.length>=lim) end(C[0]);
    const g=m.mesh; const dx=m.x-P.x, dz=m.z-P.z, d=Math.hypot(dx,dz)||1; g.rotation.order="YXZ"; g.userData.hsU=0;
    const c={g,t:0,x:g.position.x,y:g.position.y,z:g.position.z,dx:dx/d,dz:dz/d,sc:g.scale.x,gl:!!g.userData.gl,fl:!!g.userData.float,dust:false,rx:g.rotation.x};
    try{ hitTint(g,0); }catch(e){} if(c.gl) animState(g,"dead"); m.corpse=true; C.push(c); return true; }
  function end(c){ scene.remove(c.g); const i=C.indexOf(c); if(i>=0) C.splice(i,1); }
  function tick(dt){ for(let i=C.length-1;i>=0;i--){ const c=C[i], g=c.g; c.t+=dt; const t=c.t;
      if(c.gl){ // 3D 모델: 쓰러지는 동작 + 맞은 쪽으로 조금 밀림
        const s=ease(Math.min(1,t/.4)); g.position.set(c.x+c.dx*s*.7,c.y,c.z+c.dz*s*.7); }
      else if(c.fl){ // 떠다니는 괴물: 빙글 돌며 떨어짐
        const s=Math.min(1,t/.5); g.rotation.y+=dt*9*(1-s); g.rotation.x=c.rx-ease(s)*1.2; g.position.set(c.x+c.dx*s*.8,Math.max(hAt(c.x,c.z),c.y-ease(s)*1.4)+Math.sin(s*Math.PI)*.5,c.z+c.dz*s*.8); }
      else { // 뒤로 털썩 + 한 번 통 튐
        const s=Math.min(1,t/.38); const fall=ease(s); const bounce=t>.38&&t<.58?Math.sin((t-.38)/.2*Math.PI)*.09:0;
        g.rotation.x=c.rx-(fall+bounce)*Math.PI*.5; g.position.set(c.x+c.dx*fall*.8,c.y+Math.sin(s*Math.PI)*.35*c.sc,c.z+c.dz*fall*.8); }
      const S0=c.gl?1.25:.95, S1=S0+.65;
      if(t>S0){ if(!c.dust){ c.dust=true; try{ SFX.dust(g.position.x,g.position.z,HIGH()&&!ECO()?6:3,1.6*c.sc); }catch(e){} }
        const k=Math.min(1,(t-S0)/(S1-S0)); g.position.y=c.y-k*k*1.6*c.sc; g.scale.setScalar(c.sc*(1-k*.55)); }
      if(t>=S1) end(c); } }
  function clear(){ while(C.length) end(C[0]); }
  return {knock,apply,die,tick,clear,C};
})();

<script>

<script>
/* ================= 괴물 공격 예고 (v38) =================
   - 괴물이 때리기 직전(보통 0.5초·보스 0.7초): 발밑에 빨간 경고 원이 생기고 안쪽이 가운데서부터 차오름 → 다 차면 "쾅"
   - 몸이 움츠러들고(납작·뒤로 젖힘) 몸이 빨갛게 달아오름 → 덮치기 직전 느낌
   - 모습만 — 공격 시간·피해·규칙은 그대로(cd 값을 읽기만 함)
   그리기: 경고 중인 괴물만 원 1장(최대 8장, 배터리 절약 4장), 셰이더 하나, PointLight 없음. */
const WARN=(()=>{ const POOL=[]; let used=0; const GEO=new THREE.PlaneGeometry(2,2);
  const VS="varying vec2 vU; void main(){ vU=uv*2.-1.; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }";
  const FS="uniform float k; uniform float t; uniform float hit; varying vec2 vU; void main(){ float r=length(vU); if(r>1.) discard;"+
    " float edge=smoothstep(.84,.92,r)*(1.-smoothstep(.97,1.,r));"+   // 바깥 테두리
    " float fill=1.-smoothstep(k-.04,k,r);"+                            // 차오르는 안쪽
    " float front=smoothstep(k-.1,k-.02,r)*(1.-smoothstep(k-.02,k+.02,r));"+ // 차오르는 끝 밝은 줄
    " float tick=step(.5,fract(atan(vU.y,vU.x)*3.8197))*smoothstep(.78,.8,r)*(1.-smoothstep(.84,.86,r));"+ // 안쪽 눈금
    " float pulse=.75+.25*sin(t*22.);"+

    " float a=edge*pulse+fill*.48+front*.9+tick*.55+(1.-r)*.08; a=max(a,hit*(1.-r*.6)*.9);"+
    " vec3 c=mix(dark,red,clamp(fill*.6+edge*.5,0.,1.)); c=mix(c,hot,front*.8+hit*.7);"+
    " gl_FragColor=vec4(c,clamp(a,0.,1.)); }";

  // tickMobs 에서 괴물 모습을 다 정한 다음 부름. inRange: 때릴 수 있는 거리 안·쫓는 중
  function tick(m,inRange,dt){ const W=m.boss?.7:.5; const ud=m.mesh.userData;

    if(ud.lunge>.1&&ud.wk>.5){ ud.wf=.15; }
    ud.wk=0;
    let k=0; if(inRange&&m.cd>0&&m.cd<W&&!P.dead&&m.hp>0) k=1-m.cd/W;
    if(ud.wf>0) ud.wf-=dt;
    const flash=ud.wf>0?ud.wf/.15:0;
    if(k<=0&&flash<=0) return;
    ud.wk=k;
    const lim=ECO()?4:8; if(used>=lim) return;
    const d=POOL[used]||(POOL[used]=make()); used++;
    const R=((m.boss?3.4:2.3)+1.5)*(m.boss?1.2:1)*Math.max(1,Math.sqrt(m.scale||1)*.8);
    d.visible=true; d.scale.setScalar(R); d.position.set(m.x,hAt(m.x,m.z)+.16,m.z);
    d.material.uniforms.k.value=flash>0?1:k; d.material.uniforms.t.value=performance.now()/1000; d.material.uniforms.hit.value=flash;
    if(k>0){ // 움츠림: 납작해지고 뒤로 젖힘 + 빨갛게 달아오름
      const e=k*k; const s=m.mesh.scale; s.y*=1-.16*e; s.x*=1+.08*e; s.z*=1+.08*e;

  return {begin,tick,end};

<script>

  else if(ev.def>=0){ let best=null,bd=1e9; REGIONS.forEach(r=>{ if(r.cap||r.center||W.o[r.id]!==ev.att) return; const dd=Math.hypot(r.x-rg.x,r.z-rg.z); if(dd<bd){ bd=dd; best=r; } });
    if(best){ W.o[best.id]=ev.def; W.ts[best.id]=ts; msg=`${REALMS[ev.def].n} 방어 성공 + 반격! ${REALMS[ev.att].n}의 ${best.n}을(를) 빼앗았어요`; } else msg=`${REALMS[ev.def].n} 방어 성공! ${rg.n}을(를) 지켜냈어요`; }

const ROLE={melee:{hp:1.6,atk:.85,sp:5.2,reach:2.4,ic:"⚔"},archer:{hp:1.0,atk:.75,sp:4.6,reach:2.2,range:15,ic:"🏹"},spear:{hp:1.3,atk:.8,sp:5.5,reach:2.8,throwR:11,ic:"🔱"},captain:{hp:3.5,atk:1.3,sp:4.8,reach:3.2,ic:"👑"}};

function ghostEq(p){ const e=p.e||[-1,-1,-1]; return {w:e[0],a:e[1],r:e[2]}; }
function makeGhost(p){ const lk=ghostLook(p.lk); const mesh=(typeof avatarGL==="function"&&avatarGL(p.r,p.k,lk,undefined,ghostEq(p)))||makeAvatar(p.r,p.k,false,lk); if(typeof DREAM!=="undefined") DREAM.dreamify(mesh); scene.add(mesh); return mesh; }
function dropGhost(id){ const g=GHOSTS[id]; if(!g) return; scene.remove(g.mesh); g.lbl.remove(); if(g.dz&&typeof DREAM!=="undefined") DREAM.drop(g.dz); delete GHOSTS[id]; }
let ghostT=0;
function tickGhosts(dt){ if(!started) return; ghostT-=dt;
  if(ghostT<=0){ ghostT=2; let n=0;
    for(const id in ROSTER){ const p=ROSTER[id]; const away=isAway(p); const pr=away?projected(p):null; const rg=pr?pr.rg:null; const near=rg&&Math.hypot(rg.x-P.x,rg.z-P.z)<rg.r+110;
      if(!away||!near||n>=10||Date.now()-p.t>14*86400000){ dropGhost(id); continue; } n++;
      let g=GHOSTS[id]; if(!g){ const a=Math.random()*6.283, r=rnd(6,rg.r*.6); g=GHOSTS[id]={id,mesh:makeGhost(p),lbl:makeLabel("ally"),x:rg.x+Math.cos(a)*r,z:rg.z+Math.sin(a)*r,tx:0,tz:0,t:0,walk:0,act:0,rg:rg.id}; g.tx=g.x; g.tz=g.z; if(typeof DREAM!=="undefined") g.dz=DREAM.make(); }
      if(g.rg!==rg.id){ g.rg=rg.id; g.x=rg.x; g.z=rg.z; g.tx=g.x; g.tz=g.z; }
      if(!g.mesh.userData.glAvatar&&typeof avatarGL==="function"){ const m2=avatarGL(p.r,p.k,ghostLook(p.lk),undefined,ghostEq(p)); if(m2){ scene.remove(g.mesh); if(typeof DREAM!=="undefined") DREAM.dreamify(m2); g.mesh=m2; scene.add(m2); } }
      g.p=p; g.pr=pr; } }
  for(const id in GHOSTS){ const g=GHOSTS[id]; const rg=REGIONS[g.rg]; g.t-=dt; g.act=Math.max(0,g.act-dt);
    if(g.t<=0){ g.t=rnd(2,5); const m=mobs.find(m=>!m.war&&m.rg===g.rg&&Math.hypot(m.x-g.x,m.z-g.z)<16); if(m&&Math.random()<.6){ g.tx=m.x+rnd(-1.5,1.5); g.tz=m.z+rnd(-1.5,1.5); g.fight=m; } else { const a=rnd(0,6.283), r=rnd(4,rg.r*.65); g.tx=rg.x+Math.cos(a)*r; g.tz=rg.z+Math.sin(a)*r; g.fight=null; } }
    const dx=g.tx-g.x, dz=g.tz-g.z, L=Math.hypot(dx,dz); const moving=L>1;
    if(moving){ g.x+=dx/L*4*dt; g.z+=dz/L*4*dt; g.walk+=dt*10; g.mesh.rotation.y=Math.atan2(dx,dz); }
    else if(g.fight&&mobs.indexOf(g.fight)>=0){ g.mesh.rotation.y=Math.atan2(g.fight.x-g.x,g.fight.z-g.z); if(g.act<=0){ g.act=.9; if(Math.hypot(g.x-P.x,g.z-P.z)<50) fxSpark(g.fight.x,1.6,g.fight.z,0xffffff,5); } }
    g.mesh.position.set(g.x,hAt(g.x,g.z),g.z); const u=g.mesh.userData;
    if(u.gl) animState(g.mesh,g.act>.6?"attack":moving?"run":"idle"); else if(u.legL){ const sw=moving?Math.sin(g.walk)*.7:0; u.legL.rotation.x=sw; u.legR.rotation.x=-sw; u.armL.rotation.x=-sw; u.armR.rotation.x=g.act>.6?-2.2:sw; }
    const nearMe=Math.hypot(g.x-P.x,g.z-P.z)<55; if(g.dz) DREAM.tick(g.dz,dt,g.x,hAt(g.x,g.z),g.z,nearMe);
    if(nearMe){ const p=g.p, pr=g.pr; placeLabel(g.lbl,g.x,4.6,g.z,`${p.tt&&typeof titleHtml==="function"?titleHtml(p.tt):""}💤 ${p.k===0?"🌱":""}${p.n} <b>${REALMS[p.r].n} · ${REALMS[p.r].ranks[p.k]} Lv.${pr?pr.lv:p.l}</b><span class="away">쉬는 중 · 혼자 수련 ${fmtDur((Date.now()-p.t)/60000)}째</span>`); } else g.lbl.style.display="none"; } }
function showRoster(){ const me=`<div class="row"><div class="ic" style="color:${REALMS[G.realm].c1}">${REALMS[G.realm].icon}</div><div class="t"><div>${G.name} (나) <i class="st on">접속 중</i></div><span>${REALMS[G.realm].n} · ${REALMS[G.realm].ranks[G.rank]} Lv.${G.lv} · ${(regionAt(P.x,P.z)||{n:"황야"}).n}</span></div></div>`;
  const live=Object.values(PEERS).map(o=>{ const rg=regionAt(o.x,o.z); return {s:1e15+o.lv,h:`<div class="row"><div class="ic" style="color:${REALMS[o.realm].c1}">${REALMS[o.realm].icon}</div><div class="t"><div>${o.rank===0?"🌱":""}${o.name}${o.ms?" 🧭"+o.ms:""} ${(()=>{ const p=ROSTER[o.id]; return p&&p.oq&&typeof kday==="function"&&p.oq[0]===kday()&&p.oq[1]>=3?"🧠 ":""; })()}<i class="st on">접속 중</i></div><span>${REALMS[o.realm].n} · ${REALMS[o.realm].ranks[o.rank]} Lv.${o.lv} · ${rg?rg.n:"황야"}</span></div></div>`}; });
  const away=Object.values(ROSTER).filter(p=>isAway(p)&&Date.now()-p.t<30*86400000).map(p=>{ const pr=projected(p); const hrs=(Date.now()-p.t)/60000; return {s:pr.lv*1e6-hrs,h:`<div class="row"><div class="ic" style="color:${REALMS[p.r].c1}">${REALMS[p.r].icon}</div><div class="t"><div>${p.k===0?"🌱":""}${p.n} ${p.tt&&typeof titleHtml==="function"?titleHtml(p.tt):""}${p.oq&&typeof kday==="function"&&p.oq[0]===kday()&&p.oq[1]>=3?"🧠 ":""}<i class="st">💤 쉬는 중</i></div><span>${REALMS[p.r].n} · ${REALMS[p.r].ranks[p.k]} Lv.${pr.lv}${pr.lv>p.l?` <b style="color:#3fd27a">(+${pr.lv-p.l})</b>`:""} · ${pr.rg.n} · ${fmtDur(hrs)} 전 접속${pr.capped?" · 승급 기다리는 중":""}</span></div></div>`}; });
  const rows=live.concat(away).sort((a,b)=>b.s-a.s).map(x=>x.h).join("");
  card(`<h2>모험가 명부</h2><p>접속 중 ${Object.keys(PEERS).length+1}명 · 쉬는 중 ${away.length}명 · 중계 서버 ${net.up}/4</p>${me}${rows}<p style="font-size:12px">쉬는 친구도 자기 세계 사냥터에서 혼자 수련하며 자라고 있어요(최대 ${IDLE_MAX_H}시간). 사냥터에 가면 💤 표시로 보여요.</p><button class="buy alt" id="toChat" style="align-self:center">대화하기</button>`); $("toChat").onclick=showSay; }
</script>
<script>
/* ================= v14: 재미 3종 (IDEAS G11/2-1·2·3) =================
   1) 🐣 신수 알과 짝꿍 신수: 괴물을 잡으면 가끔 알 → 실제 시간 20분 뒤 부화(게임을 꺼 둬도 자람).
      신수는 따라다니며 같이 싸우고, 금화 보너스. 쉬는 동안 수련한 만큼 신수도 자람. 친구 화면에도 보임(pt).
   2) 🤝 합체 기술: 같은 세계 친구 둘이 8걸음 안에서 3초 안에 기술을 하나씩 쓰면 합체 기술(세계마다 6가지) + 도감.
   3) 🌋 주간 거대 보스: 매주 월요일 0시(한국 시간)에 세계의 중심에 거대 보스. 체력 하나를 모두 함께 깎음
      (각자 준 데미지를 중계 서버에 보관 → 다 더함). 쉬는 동안 수련도 데미지로 보탬. 쓰러뜨리면 모두 신화 상자, 1등은 용사. */

/* ---------- 1. 신수 ---------- */
const PETS=[
 {n:"아기 그리핀",kind:"griffin",c:0xffd95e,c2:0xfff3c4,egg:"황금빛 알"},
 {n:"아기 슬레이프니르",kind:"horse8",c:0xb8c6d8,c2:0x5a6a86,egg:"서리 무늬 알"},
 {n:"아기 가루다",kind:"bird",c:0xff9a3d,c2:0xffd24a,egg:"불꽃 무늬 알"},
 {n:"아기 페가수스",kind:"pegasus",c:0xffffff,c2:0x9fd4ff,egg:"구름 무늬 알"} ];
const EGG_MS=20*60000, PET_MAX=20;
function petNeed(lv){ return 12*lv; }
function petData(){ G.pets=G.pets||{}; if(G.pet==null) G.pet=-1; return G.pets; }
function petBonus(){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; return p?p.lv*2:0; }   // 금화 +%
function petArr(){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; return p?[G.pet,p.lv]:null; }
function petGain(n){ const p=G.pet>=0&&G.pets&&!expPetAway(G.pet)&&G.pets[G.pet]; if(!p||p.lv>=PET_MAX) return 0; p.xp=(p.xp||0)+n; let up=0; while(p.lv<PET_MAX&&p.xp>=petNeed(p.lv)){ p.xp-=petNeed(p.lv); p.lv++; up++; } if(p.lv>=PET_MAX) p.xp=0; if(up&&PETMESH.me){ rebuildMyPet(); } return up; }
function petOnKill(m){ petData(); const b=petBonus(); if(b>0){ const extra=Math.max(1,Math.round(m.gold*b/100)); G.gold+=extra; }
  const up=petGain(m.boss?6:1); if(up){ const p=G.pets[G.pet]; toast(`${PETS[G.pet].n} Lv.${p.lv}!`,`금화 보너스 +${p.lv*2}%`,2); jingle([784,988,1175]); }
  if(!G.egg&&!m.war&&!m.titan){ const first=!G.eggEver; const ch=first?1:m.boss?.3:.02; if(Math.random()<ch){ const rg=REGIONS[m.rg]; const r=rg&&rg.realm>=0?rg.realm:rint(0,3); G.egg={r,t0:Date.now()}; G.eggEver=1;
      toast(`🥚 ${PETS[r].egg}을(를) 주웠어요!`,"20분 뒤에 깨어나요 · 게임을 꺼 둬도 자라요",3.2); jingle([659,880,1046,1318]); fxRing(m.x,m.z,PETS[r].c,6,.8); } } }
function eggLeft(){ return G.egg?Math.max(0,G.egg.t0+EGG_MS-Date.now()):0; }
let eggCheckT=0;
function tickEgg(dt){ eggCheckT-=dt; if(eggCheckT>0) return; eggCheckT=2; if(!G.egg||eggLeft()>0||layerOpen||P.dead) return; hatchEgg(); }
function hatchEgg(){ petData(); const r=G.egg.r; G.egg=null; const had=G.pets[r]; let msg;
  if(had){ had.lv=Math.min(PET_MAX,had.lv+2); had.xp=0; msg=`이미 있는 ${PETS[r].n}의 형제 알이었어요! ${PETS[r].n} 레벨 +2 (Lv.${had.lv})`; }
  else { G.pets[r]={lv:1,xp:0,t:Date.now()}; msg=`새 친구 <b style="color:var(--gold)">${PETS[r].n}</b>! 이제 나를 따라다니며 같이 싸워요.`; }
  if(!had||G.pet<0) G.pet=r; saveGame(); rebuildMyPet(); try{ net.hello(); net.pushProfile(1); }catch(e){}
  card(`<h2>🐣 알이 깨어났어요!</h2><canvas id="petPrev" width="260" height="200" style="width:200px;height:154px;align-self:center"></canvas><p>${msg}</p><p style="font-size:13px">신수는 괴물을 같이 공격하고, 금화를 더 주워 줘요(레벨×2%). 내가 쉬는 동안 수련하면 신수도 같이 자라요.</p><button class="buy" id="petOk" style="align-self:center">좋아요!</button>`);
  $("petOk").onclick=closeLayer; drawPetPreview($("petPrev"),r); jingle([523,659,784,1046,1318,1568]); fxRing(P.x,P.z,PETS[r].c,10,1); fxSpark(P.x,2,P.z,PETS[r].c,50); buzz([40,30,40]); }
function petIdle(r){ petData(); const n=Math.floor(r.kills||0); if(!n) return null; const p=G.pet>=0&&!expPetAway(G.pet)&&G.pets[G.pet]; if(!p) return null; const lv0=p.lv; petGain(n); return {n:PETS[G.pet].n,lv0,lv:p.lv}; }

// 신수 모델(코드로 만든 귀여운 아기 동물)
function makePet(r,lv){ const D=PETS[r]; const g=new THREE.Group(); const body=new THREE.Group(); g.add(body);
  const m=mat({color:D.c,roughness:.55}), m2=mat({color:D.c2,roughness:.55}), eye=mat({color:0x111111,roughness:.25}), wh=mat({color:0xffffff,emissive:0xffffff,emissiveIntensity:.8}), gold=mat({color:0xffc83a,metalness:.4,roughness:.35});
  const b=sph(.55,m,0,0,0); b.scale.set(1,.9,1.15); body.add(b);
  const h=sph(.46,m,0,.62,.55); body.add(h);
  [-1,1].forEach(s=>{ body.add(sph(.12,eye,s*.19,.7,.94)); body.add(sph(.04,wh,s*.19+.04,.75,1.03)); body.add(sph(.07,mat({color:0xff9aa8,roughness:.8}),s*.3,.55,.9)); });
  const wings=[];
  if(D.kind==="griffin"||D.kind==="bird"){ const bk=new THREE.Mesh(GEO.cone,mat({color:0xffa53a,roughness:.5})); bk.scale.set(.2,.32,.2); bk.rotation.x=Math.PI/2; bk.position.set(0,.55,1.05); body.add(bk); }
  else { body.add(sph(.24,m2,0,.5,.95)); }
  if(D.kind!=="bird"){ [-1,1].forEach(s=>{ const e=new THREE.Mesh(GEO.cone,m); e.scale.set(.16,.32,.16); e.position.set(s*.25,1.05,.45); e.rotation.z=-s*.3; body.add(e); }); }
  if(D.kind==="bird"){ for(let k=0;k<3;k++){ const c=new THREE.Mesh(GEO.cone,m2); c.scale.set(.1,.36,.1); c.position.set(0,1.02+k*.02,.42-k*.14); c.rotation.x=-.4-k*.25; body.add(c); } }
  if(D.kind==="horse8"||D.kind==="pegasus"){ for(let k=0;k<4;k++) body.add(sph(.12,m2,0,.9-k*.12,.3-k*.2)); }
  if(D.kind!=="horse8"){ [-1,1].forEach(s=>{ const w=new THREE.Group(); w.position.set(s*.45,.25,-.05); for(let f=0;f<3;f++){ const fe=sph(.17,m2,s*(.22+f*.22),.12+f*.1,0); fe.scale.set(1,.5+f*.25,.4); fe.rotation.z=s*(.5+f*.25); w.add(fe); } w.userData.s=s; body.add(w); wings.push(w); }); }
  const legN=D.kind==="horse8"?8:D.kind==="bird"?2:4; for(let k=0;k<legN;k++){ const row=D.kind==="horse8"?Math.floor(k/2):k%2===0?0:1; const side=k%2===0?-1:1; const z=legN===2?0:legN===8?(.35-Math.floor(k/2)*.23):(Math.floor(k/2)?-.3:.3); body.add(cyl(.08,.07,.4,D.kind==="bird"?mat({color:0xffa53a}):m2,side*(legN===8?.22+(row%2)*.05:.25),-.48,z,8)); }
  const tail=sph(.16,m2,0,.15,-.68); tail.scale.set(1,1,1.6); body.add(tail);
  if(lv>=10){ const c=new THREE.Mesh(new THREE.TorusGeometry(.2,.05,6,16),gold); c.rotation.x=Math.PI/2; c.position.set(0,1.18,.55); body.add(c); }
  g.userData={body,wings,fly:D.kind!=="horse8",t:Math.random()*6};
  const sc=.7+Math.min(lv||1,PET_MAX)*.02; g.scale.setScalar(sc); return g; }
function drawPetPreview(cv,r){ try{ const rr=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true}); rr.setSize(cv.width,cv.height,false); const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x553366,1.1)); const dl=new THREE.DirectionalLight(0xffffff,1); dl.position.set(2,4,5); sc.add(dl); const pet=makePet(r,1); pet.scale.setScalar(1.3); sc.add(pet); const cam=new THREE.PerspectiveCamera(40,cv.width/cv.height,.1,50); cam.position.set(0,1.2,4.4); cam.lookAt(0,.4,0); let t=0; const loop=()=>{ if(!document.body.contains(cv)){ rr.dispose(); return; } t+=.03; pet.rotation.y=Math.sin(t)*.7; pet.position.y=Math.abs(Math.sin(t*3))*.2; pet.userData.wings.forEach(w=>w.rotation.z=w.userData.s*Math.sin(t*12)*.5); rr.render(sc,cam); requestAnimationFrame(loop); }; loop(); }catch(e){} }
const PETMESH={me:null,others:{}};
function rebuildMyPet(){ if(PETMESH.me){ scene.remove(PETMESH.me.mesh); PETMESH.me=null; } const a=petArr(); if(!a||!started) return; const mesh=makePet(a[0],a[1]); scene.add(mesh); PETMESH.me={mesh,x:P.x-1.5,z:P.z-1.5,key:a.join(","),atk:1}; }
function followPet(o,ox,oz,orot,dt){ const bx=ox-Math.sin(orot)*1.6+Math.cos(orot)*1.3, bz=oz-Math.cos(orot)*1.6-Math.sin(orot)*1.3; const dx=bx-o.x, dz=bz-o.z, L=Math.hypot(dx,dz);
  if(L>30){ o.x=bx; o.z=bz; } else if(L>.3){ const sp=Math.min(L*3,16); o.x+=dx/L*sp*dt; o.z+=dz/L*sp*dt; }
  const u=o.mesh.userData; u.t+=dt*(L>.5?14:5); const tx=o.tx!=null?o.tx:bx+Math.sin(orot)*3, tz=o.tz!=null?o.tz:bz+Math.cos(orot)*3; o.mesh.rotation.y=Math.atan2(tx-o.x,tz-o.z);
  const fly=u.fly?1.6+Math.sin(u.t*.4)*.25:Math.abs(Math.sin(u.t*.7))*.25; o.mesh.position.set(o.x,hAt(o.x,o.z)+fly,o.z); u.wings.forEach(w=>w.rotation.z=w.userData.s*Math.sin(u.t*2.2)*.6); u.body.rotation.z=Math.sin(u.t*.35)*.08; }
function tickPets(dt){ if(!started) return; tickEgg(dt);
  const a=petArr(); if(a&&(!PETMESH.me||PETMESH.me.key!==a.join(","))) rebuildMyPet(); if(!a&&PETMESH.me) rebuildMyPet();
  const me=PETMESH.me; if(me){ me.mesh.visible=!P.dead; me.tx=me.tz=null;
    me.atk-=dt; const tgt=mobs.find(m=>m.hp>0&&(m.state==="chase"||m.titan)&&Math.hypot(m.x-me.x,m.z-me.z)<(m.titan?14:8));
    if(tgt){ me.tx=tgt.x; me.tz=tgt.z; if(me.atk<=0&&!P.dead){ me.atk=1.4; const p=G.pets[G.pet]; const dmg=stat().atk*(.15+.012*p.lv); fxLine(me.x,me.z,Math.atan2(tgt.x-me.x,tgt.z-me.z),Math.min(8,Math.hypot(tgt.x-me.x,tgt.z-me.z)),PETS[G.pet].c); damageMob(tgt,dmg,false); } }
    followPet(me,P.x,P.z,P.rot,dt); }
  // 친구·쉬는 친구의 신수
  const want={};
  for(const id in PEERS){ const o=PEERS[id]; if(o.pt&&!o.dead) want["p"+id]={pt:o.pt,x:o.x,z:o.z,rot:o.mesh?o.mesh.rotation.y:0}; }
  for(const id in GHOSTS){ const g=GHOSTS[id]; if(g.p&&g.p.pt) want["g"+id]={pt:g.p.pt,x:g.x,z:g.z,rot:g.mesh.rotation.y}; }
  for(const k in PETMESH.others){ const o=PETMESH.others[k]; const w=want[k]; if(!w||o.key!==w.pt.join(",")){ scene.remove(o.mesh); delete PETMESH.others[k]; } }

function titanGo(){ if(mobs.some(m=>!m.titan&&m.state==="chase"&&Math.hypot(m.x-P.x,m.z-P.z)<16)){ toast("전투 중에는 안 돼요"); return; } P.x=TITAN_POS.x+rnd(-3,3); P.z=TITAN_POS.z+30; P.invul=2; closeLayer(); toast("거대 보스 앞에 왔어요!","빨간 고리가 보이면 멀리 피해요",2.6); }
function showTitan(){ titanRoll(); const D=titanDef(TB.w); const left=titanLeft(), pct=Math.round(left/TITAN_HP*100); const end=titanWeekStart(TB.w+1); const hrs=Math.max(0,(end-Date.now())/3600000);
  const rank=titanRank().map((x,k)=>`<div class="row"><div class="ic" style="color:${REALMS[x.r]?REALMS[x.r].c1:"#fff"}">${k===0&&x.d>0?"🏅":k+1}</div><div class="t"><div>${x.n}${x.me?" (나)":""}</div><span>${fmt(Math.round(x.d))} 데미지</span></div></div>`).join("");

   <div class="bar" style="height:14px;border:2px solid #ffcf4a;border-radius:8px;overflow:hidden;background:#000"><i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#b01030,#ff3d4a)"></i></div>
   <p style="font-size:13px">세계의 중심에 사는 아주 큰 보스예요. 체력은 <b>모든 친구가 함께</b> 깎아요. 게임을 꺼 둔 동안 수련한 것도 데미지로 보태져요.<br>쓰러뜨리면 모두에게 신화 상자(금화·경험치·장비·물약), 가장 많이 때린 사람은 <b>🏅 용사</b>(보상 2배).</p>
   <h3>데미지 순위</h3>${rank}${done?"":`<button class="go" id="tGo" style="align-self:center;font-size:18px;padding:10px 22px">보스에게 가기</button>`}`);
  if($("tGo")) $("tGo").onclick=titanGo; }
