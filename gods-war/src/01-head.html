<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신들의 전쟁">
<title>신들의 전쟁</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">
<style>
/* 전체 화면 3D 세계. 왼쪽 엄지: 조이스틱, 오른쪽 엄지: 공격/기술/물약. 위: 상태, 아래: 메뉴. 테마 색은 내 세계(--c1 주색, --c2 보조)로 바뀜. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --paper:#fff9ec; --gold:#ffcf4a; --red:#ff5a5f; --green:#3fd27a; --blue:#4aa3ff;
  --c1:#ffcf4a; --c2:#fff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --title:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1a1030;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1} .lbl{will-change:transform}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 2px 0 #120a24;-webkit-font-smoothing:antialiased}
.lbl b{font-weight:400;display:block;font-size:12px;opacity:.9}
.lbl .hp{display:block;width:64px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.lbl .hp i{display:block;height:100%;background:#ff5a5f;border-radius:4px}
.lbl.ally{color:#9dffb8} .lbl.foe{color:#ff8d8d} .lbl.boss{font-size:19px;color:#ffcf4a}
.lbl.dmg{z-index:2} .lbl.dmg em{display:block;font-style:normal;font-weight:900;font-size:25px;color:#fff;letter-spacing:-.5px;text-shadow:0 0 1px #000,2px 2px 0 #1b1430,-2px 2px 0 #1b1430,2px -2px 0 #1b1430,-2px -2px 0 #1b1430,0 3px 0 #1b1430,0 4px 8px rgba(0,0,0,.6);transform-origin:50% 80%;animation:dmgPop .95s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em{font-size:33px;color:#ffe066;text-shadow:0 0 1px #000,2px 2px 0 #7a2a00,-2px 2px 0 #7a2a00,2px -2px 0 #7a2a00,-2px -2px 0 #7a2a00,0 3px 0 #7a2a00,0 0 16px rgba(255,150,40,.95);animation:dmgCrit 1.05s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em.c::before{content:"치명타!";display:block;font-size:13px;color:#fff6c8;letter-spacing:1px;margin-bottom:-2px}
.lbl.dmg.me em{color:#ff5b5b;font-size:23px;text-shadow:0 0 1px #000,2px 2px 0 #3a0010,-2px 2px 0 #3a0010,2px -2px 0 #3a0010,-2px -2px 0 #3a0010,0 3px 0 #3a0010}
.lbl.dmg.gain em{font-size:18px;color:#ffe27a;animation:dmgGain 1.1s ease-out forwards}
@keyframes dmgPop{0%{transform:translate(0,10px) scale(.3);opacity:0}12%{transform:translate(calc(var(--dx)*.15),-8px) scale(1.45);opacity:1}30%{transform:translate(calc(var(--dx)*.35),-16px) scale(1)}72%{opacity:1}100%{transform:translate(var(--dx),-66px) scale(.8);opacity:0}}
@keyframes dmgCrit{0%{transform:translate(0,10px) scale(.2) rotate(-8deg);opacity:0}12%{transform:translate(0,-10px) scale(1.7) rotate(4deg);opacity:1}22%{transform:translate(-3px,-14px) scale(1.15) rotate(-3deg)}30%{transform:translate(3px,-16px) scale(1.25) rotate(0)}75%{opacity:1}100%{transform:translate(var(--dx),-74px) scale(.9);opacity:0}}
@keyframes dmgGain{0%{transform:translate(0,6px) scale(.6);opacity:0}15%{transform:translate(0,-6px) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(0,-56px) scale(.95);opacity:0}}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px}
.tl{top:max(8px,env(safe-area-inset-top));left:10px;flex-direction:column;align-items:flex-start}
.tr{top:max(8px,env(safe-area-inset-top));right:10px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(20,14,40,.72);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.75}
#status{display:flex;flex-direction:column;gap:4px;background:rgba(20,14,40,.72);border:2px solid var(--c1);border-radius:16px;padding:8px 12px;min-width:196px;backdrop-filter:blur(6px)}
#status .nm{font-size:17px;color:var(--c1);line-height:1.1} #status .nm small{color:#fff;opacity:.85;font-size:13px;margin-left:6px}
.bar{height:11px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff3d4a,#ff8a5c)} .bar.xp i{background:linear-gradient(90deg,#4aa3ff,#9be7ff)} .bar.xp{height:7px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000}
.gold{color:var(--gold)}
#titanPill{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 262px);z-index:5;font-size:13px;cursor:pointer;pointer-events:auto;border:1px solid rgba(255,140,80,.6);color:#ffd9b0;font-family:inherit} #netPill{font-size:12px;gap:6px} #netPill .dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;box-shadow:0 0 4px #000} #netPill .dot.on{background:#3fd27a;box-shadow:0 0 6px #3fd27a}
#region{font-size:14px;color:#fff;letter-spacing:.5px}
#region b{font-weight:400;color:var(--c1)}

#minimap{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);width:164px;height:164px;z-index:5;border-radius:50%;border:0;background:#0e0a1e;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#guide{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 70px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:auto;background:rgba(20,14,40,.7);border:2px solid var(--gold);border-radius:16px;padding:4px 12px;color:#fff;font-size:13px;white-space:nowrap} #gArrow{font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 10px rgba(255,207,74,.8);transition:transform .15s}
.idlegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0} .idlegrid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px} .idlegrid b{font-size:20px;color:var(--gold)} .idlegrid span{font-size:12px;opacity:.8}
.row .st{font-style:normal;font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:4px;vertical-align:1px} .row .st.on{background:#1f9a52;color:#fff}
.lbl .away{display:block;font-size:10px;opacity:.85;color:#bfe9ff}
/* v19: 칭호 · 원정 · 미궁 */
.lbl .ttl{display:block;font-size:12px;font-weight:900;letter-spacing:.2px;margin-bottom:1px;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 0 6px rgba(0,0,0,.6)}
.row .t span.ttl{display:inline;font-size:12px;font-weight:900;margin-right:4px;color:inherit} .row .t span.rar{display:inline-block}
.row .tbar{display:block;height:6px;margin-top:4px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden} .row .tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff9a3d);border-radius:4px}
.diary{background:#fff8e6;color:#3a2a14;border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 2px #e8d4a6;background-image:repeating-linear-gradient(#fff8e6 0 25px,#ecdcb8 25px 26px)} .diary p{margin:4px 0;font-size:14px;line-height:1.35;color:#3a2a14}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .exgrid.three{grid-template-columns:1fr 1fr 1fr} .exgrid .buy{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px} .exgrid .buy small{font-size:10px;opacity:.85}
.exd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;cursor:pointer} .exd em{font-style:normal;font-size:26px} .exd b{font-weight:400;font-size:14px} .exd i{font-style:normal;font-size:11px;opacity:.7} .exd.on{border-color:var(--gold,#ffcf4a);background:rgba(255,207,74,.16)}
.gearpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px var(--rc);animation:gearPop 1.6s ease-out forwards} .gearpop small{display:block;font-size:13px;font-weight:700;opacity:.9} @keyframes gearPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#zoomBtns{position:fixed;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 218px);z-index:5;display:flex;gap:6px} #zoomBtns button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(20,14,40,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
#quest{position:fixed;left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 96px);z-index:5;pointer-events:auto;max-width:200px;display:flex;flex-direction:column;gap:4px}
.q{background:rgba(20,14,40,.66);border-left:4px solid var(--c1);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25;color:#fff}
.q.done{border-color:var(--green);color:#9dffb8} .q small{opacity:.75}

.bl{left:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:row;pointer-events:auto}
.br{right:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.mbtn{border:0;cursor:pointer;color:#fff;font-size:15px;border-radius:14px;padding:9px 12px;min-width:60px;background:rgba(20,14,40,.75);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.mbtn:active{transform:translateY(2px)}
.acts{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 60px);z-index:5;display:grid;grid-template-columns:64px 64px 84px;grid-template-rows:64px 84px;gap:8px;align-items:end;justify-items:end;pointer-events:auto}
.act{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.5);color:#fff;font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.act.atk{background:radial-gradient(circle at 35% 30%,#ff9a7a,#d82f3c 70%);grid-column:3;grid-row:2;width:84px;height:84px;font-size:17px}
.act.thr{position:absolute;left:-64px;bottom:8px;background:radial-gradient(circle at 35% 30%,#ffe2a8,#e08a1e 70%);color:#2a1606;font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.act.lock{filter:grayscale(1) brightness(.6)} .act.lock small{font-size:9px}
.act.skl{background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 70%);color:#1b1430;text-shadow:0 1px 0 rgba(255,255,255,.4);font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1}
.act.pot{background:radial-gradient(circle at 35% 30%,#9dffb8,#1f9f58 70%);grid-column:2;grid-row:2}
.act.jmp{background:radial-gradient(circle at 35% 30%,#bcd6ff,#3a5bd6 70%);grid-column:1;grid-row:2}
.act.skl{grid-row:1}
.act .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);pointer-events:none}
.act small{font-size:11px;opacity:.9}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(20,14,40,.28);border:3px solid rgba(255,255,255,.55);z-index:4;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.25),inset 0 0 18px rgba(255,255,255,.08);transition:opacity .2s}
#joy.rest{left:calc(max(10px,env(safe-area-inset-left)) + 78px)!important;top:auto!important;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 52px);margin:0 0 0 -62px;opacity:.8}
#joy .ar{position:absolute;color:rgba(255,255,255,.85);font-size:15px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none} #joy .ar.u{left:50%;top:6px;transform:translateX(-50%)} #joy .ar.d{left:50%;bottom:6px;transform:translateX(-50%)} #joy .ar.l{left:7px;top:50%;transform:translateY(-50%)} #joy .ar.r{right:7px;top:50%;transform:translateY(-50%)}
body:has(#title) #joy{display:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.95),rgba(205,195,235,.8));box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.12)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(5,0,20,.45) 100%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 50%,rgba(255,20,30,.55) 100%);opacity:0;transition:opacity .25s}
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;font-size:clamp(22px,6.5vw,34px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.4);font-family:var(--title);letter-spacing:1px}
#toast small{display:block;font-size:.55em;color:var(--c1);margin-top:4px;font-family:var(--font);letter-spacing:0}
#chat{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none;width:min(80vw,360px)}
.msg{background:rgba(20,14,40,.75);border-radius:12px;padding:4px 10px;font-size:13px;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeout 6s forwards} .msg b{font-weight:400;color:var(--gold)}
@keyframes fadeout{80%{opacity:1}to{opacity:0}}
#warbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 122px);transform:translateX(-50%);z-index:6;width:min(78vw,330px);background:linear-gradient(135deg,rgba(90,10,20,.85),rgba(20,8,30,.85));border:2px solid #ff5a5f;border-radius:14px;padding:6px 10px;text-align:center;box-shadow:0 0 18px rgba(255,60,80,.45);animation:warp 1.6s ease-in-out infinite}
@keyframes warp{50%{box-shadow:0 0 28px rgba(255,60,80,.75)}}
#warbar .wt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #warbar .wt b{font-weight:400}
#warbar .wb{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0;background:#000} #warbar .wb i{display:block;height:100%} #warbar .wb span{position:absolute;inset:0;font-size:11px;line-height:14px;text-shadow:0 1px 0 #000}
#warbar .wm{font-size:12px;color:var(--gold)} #warbar button{margin-top:4px;border:0;border-radius:10px;padding:5px 14px;background:var(--gold);color:#1b1430;font-family:var(--font);font-size:14px;cursor:pointer}
#bossbar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 180px);transform:translateX(-50%);z-index:5;width:min(70vw,300px);pointer-events:none;text-align:center}
#bossbar .nm{font-size:16px;color:#ffcf4a;text-shadow:0 2px 0 #000} #bossbar .bar{height:12px;border:2px solid #ffcf4a} #bossbar .bar i{background:linear-gradient(90deg,#b01030,#ff3d4a)}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(8,4,20,.7);backdrop-filter:blur(4px)}
.card{width:100%;max-width:420px;max-height:88%;overflow:auto;background:linear-gradient(180deg,#2a1f4d,#17102f);border:2px solid var(--c1);border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.5,.5,1);color:#fff}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:24px;text-align:center;font-family:var(--title);color:var(--c1);letter-spacing:1px}
.card h3{margin:6px 0 0;font-weight:400;font-size:16px;color:var(--c1)}
.card p{margin:0;color:#d8d2ea;line-height:1.5;text-align:center;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px}
.row .t{flex:1;min-width:0} .row .t div{font-size:16px} .row .t span{font-size:12px;color:#b9b1d4;display:block;line-height:1.3}
.row .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.3)}
.buy{border:0;cursor:pointer;background:var(--green);color:#1b1430;border-radius:11px;padding:8px 12px;font-size:15px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.buy[disabled]{background:#5a5570;color:#bbb;cursor:default} .buy.sell{background:var(--red);color:#fff} .buy.alt{background:var(--blue);color:#fff}
.close{align-self:center;border:0;background:none;color:#fff;font-size:17px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap} .tab{border:2px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer} .tab.on{background:var(--c1);color:#1b1430;border-color:var(--c1)}
.rar{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-size:11px;margin-right:4px;vertical-align:middle}
.go:disabled,.buy:disabled{filter:grayscale(.8) brightness(.7);cursor:default} .go{border:0;cursor:pointer;font-size:24px;color:#1b1430;background:var(--c1);padding:13px 38px;border-radius:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 0 rgba(0,0,0,.5);font-family:var(--title);letter-spacing:1px;align-self:center}
.go:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.5)}
.go[disabled]{background:#5a5570;color:#bbb}
.inp{font:inherit;font-size:20px;text-align:center;width:220px;padding:8px 12px;border-radius:14px;border:3px solid var(--c1);background:rgba(255,255,255,.95);color:var(--ink);outline:none;align-self:center}

#title{background:radial-gradient(ellipse at 50% 20%,rgba(120,90,255,.35),rgba(8,4,20,.85) 60%);align-items:flex-start;padding-top:max(26px,env(safe-area-inset-top));overflow:auto}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:440px}
.logo{font-family:var(--title);font-size:min(16vw,70px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(255,207,74,.6),0 5px 0 #4a2a00;letter-spacing:2px;margin-top:8px}
