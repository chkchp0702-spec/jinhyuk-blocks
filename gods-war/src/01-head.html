<style>
/* 전체 화면 3D 세계. 왼쪽 엄지: 조이스틱, 오른쪽 엄지: 공격/기술/물약. 위: 상태, 아래: 메뉴. 테마 색은 내 세계(--c1 주색, --c2 보조)로 바뀜. */
:root{
  color-scheme:dark;
  --ink:#1b1430; --paper:#fff9ec; --gold:#ffcf4a; --red:#ff5a5f; --green:#3fd27a; --blue:#4aa3ff;
  --c1:#ffcf4a; --c2:#fff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --title:"Black Han Sans","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1a1030;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1} .lbl{will-change:transform}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 2px 0 #120a24;-webkit-font-smoothing:antialiased}
.lbl b{font-weight:400;display:block;font-size:12px;opacity:.9}
.lbl .hp{display:block;width:64px;height:6px;margin:3px auto 0;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden}
.lbl .hp i{display:block;height:100%;background:#ff5a5f;border-radius:4px}
.lbl.ally{color:#9dffb8} .lbl.foe{color:#ff8d8d} .lbl.boss{font-size:19px;color:#ffcf4a}
.lbl.dmg{z-index:2} .lbl.dmg em{display:block;font-style:normal;font-weight:900;font-size:25px;color:#fff;letter-spacing:-.5px;text-shadow:0 0 1px #000,2px 2px 0 #1b1430,-2px 2px 0 #1b1430,2px -2px 0 #1b1430,-2px -2px 0 #1b1430,0 3px 0 #1b1430,0 4px 8px rgba(0,0,0,.6);transform-origin:50% 80%;animation:dmgPop .95s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em{font-size:33px;color:#ffe066;text-shadow:0 0 1px #000,2px 2px 0 #7a2a00,-2px 2px 0 #7a2a00,2px -2px 0 #7a2a00,-2px -2px 0 #7a2a00,0 3px 0 #7a2a00,0 0 16px rgba(255,150,40,.95);animation:dmgCrit 1.05s cubic-bezier(.2,.8,.3,1) forwards}
.lbl.dmg.crit em.c::before{content:"치명타!";display:block;font-size:13px;color:#fff6c8;letter-spacing:1px;margin-bottom:-2px}
.lbl.dmg.me em{color:#ff5b5b;font-size:23px;text-shadow:0 0 1px #000,2px 2px 0 #3a0010,-2px 2px 0 #3a0010,2px -2px 0 #3a0010,-2px -2px 0 #3a0010,0 3px 0 #3a0010}
.lbl.dmg.heal em{font-size:24px;color:#6dff8e;text-shadow:0 0 1px #000,2px 2px 0 #0b4a22,-2px 2px 0 #0b4a22,2px -2px 0 #0b4a22,-2px -2px 0 #0b4a22,0 3px 0 #0b4a22,0 0 12px rgba(80,255,140,.8);animation:dmgGain 1.3s ease-out forwards}
.lbl.dmg.gain em{font-size:18px;color:#ffe27a;animation:dmgGain 1.1s ease-out forwards}
@keyframes dmgPop{0%{transform:translate(0,calc(10px + var(--sy,0px))) scale(.3);opacity:0}12%{transform:translate(calc(var(--dx)*.15),calc(-8px + var(--sy,0px))) scale(1.45);opacity:1}30%{transform:translate(calc(var(--dx)*.35),calc(-16px + var(--sy,0px))) scale(1)}72%{opacity:1}100%{transform:translate(var(--dx),calc(-66px + var(--sy,0px))) scale(.8);opacity:0}}
@keyframes dmgCrit{0%{transform:translate(0,calc(10px + var(--sy,0px))) scale(.2) rotate(-8deg);opacity:0}12%{transform:translate(0,calc(-10px + var(--sy,0px))) scale(1.7) rotate(4deg);opacity:1}22%{transform:translate(-3px,calc(-14px + var(--sy,0px))) scale(1.15) rotate(-3deg)}30%{transform:translate(3px,calc(-16px + var(--sy,0px))) scale(1.25) rotate(0)}75%{opacity:1}100%{transform:translate(var(--dx),calc(-74px + var(--sy,0px))) scale(.9);opacity:0}}
@keyframes dmgGain{0%{transform:translate(0,6px) scale(.6);opacity:0}15%{transform:translate(0,-6px) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(0,-56px) scale(.95);opacity:0}}
/* v54: 치명타 별빛 터짐 · 연타 합계 */
.lbl.dmg.crit em{position:relative;isolation:isolate;font-size:36px;background:none}
.lbl.dmg.crit em .burst{position:absolute;left:50%;top:58%;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:-1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,250,210,.95) 0 12%,rgba(255,190,60,.7) 22%,rgba(255,120,20,0) 58%),repeating-conic-gradient(from 0deg,rgba(255,226,120,.9) 0 7deg,rgba(255,226,120,0) 7deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:dmgBurst .55s ease-out forwards}
.lbl.dmg.crit em.c::before{font-size:14px;color:#fff;text-shadow:0 0 1px #000,1px 1px 0 #b53a00,-1px 1px 0 #b53a00,1px -1px 0 #b53a00,-1px -1px 0 #b53a00,0 0 8px rgba(255,120,0,.9)}
@keyframes dmgBurst{0%{transform:scale(.2) rotate(0);opacity:1}40%{opacity:1}100%{transform:scale(1.35) rotate(40deg);opacity:0}}
.lbl.dmg.combo{z-index:3;text-align:center;pointer-events:none;margin:34px 0 0 92px}
.lbl.dmg.combo b{display:block;font-weight:900;font-size:15px;font-style:italic;color:#fff;letter-spacing:.5px;padding:1px 9px;border-radius:9px;background:linear-gradient(180deg,#ff9a3c,#d2361c);border:1.5px solid #ffe08a;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 0 #5a1000}
.lbl.dmg.combo i{display:block;font-style:normal;font-weight:900;font-size:19px;color:#ffe066;margin-top:1px;text-shadow:0 0 1px #000,2px 2px 0 #4a1a00,-2px 2px 0 #4a1a00,2px -2px 0 #4a1a00,-2px -2px 0 #4a1a00}
.lbl.dmg.combo.pop b,.lbl.dmg.combo.pop i{animation:comboPop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes comboPop{0%{transform:scale(1.45)}100%{transform:scale(1)}}


.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:6px}
.tl{top:max(8px,env(safe-area-inset-top));left:10px;flex-direction:column;align-items:flex-start}
.tr{top:max(8px,env(safe-area-inset-top));right:10px;flex-direction:column;align-items:flex-end}
.pill{display:flex;align-items:center;gap:8px;background:rgba(20,14,40,.72);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;opacity:.75}
#status{display:flex;flex-direction:column;gap:4px;background:rgba(20,14,40,.72);border:2px solid var(--c1);border-radius:16px;padding:8px 12px;min-width:196px;backdrop-filter:blur(6px)}
#status .nm{font-size:17px;color:var(--c1);line-height:1.1} #status .nm small{color:#fff;opacity:.85;font-size:13px;margin-left:6px}
.bar{height:11px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#ff3d4a,#ff8a5c)} .bar.xp i{background:linear-gradient(90deg,#4aa3ff,#9be7ff)} .bar.xp{height:7px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 1px 0 #000}
.gold{color:var(--gold)}
/* v65 금화가 금화 칸으로 날아감 */ .coinfly{position:fixed;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;z-index:30;pointer-events:none;background:radial-gradient(circle at 34% 30%,#fffbe0 0 14%,#ffe27a 30%,#ffbf26 62%,#b87508 100%);border:1.5px solid #7a4a00;box-shadow:0 0 6px 2px rgba(255,214,90,.75),inset 0 -2px 0 rgba(120,70,0,.45);will-change:transform} .coinfly::after{content:"";position:absolute;left:4px;top:3px;width:6px;height:8px;border:1.5px solid rgba(150,90,0,.55);border-radius:50%} .cpop{animation:cpop .32s ease-out} @keyframes cpop{0%{transform:scale(1);filter:none}35%{transform:scale(1.28);filter:drop-shadow(0 0 6px #ffd24a) brightness(1.4)}100%{transform:scale(1);filter:none}} .gold.cpop{display:inline-block;transform-origin:30% 50%}
/* v70 주운 물건이 가방으로 쏙 */ .pkfly{position:fixed;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.95) 0 12%,var(--pkc) 46%,#1c1236 100%);box-shadow:0 0 12px 3px var(--pkc),inset 0 -3px 0 rgba(0,0,0,.35);border:2px solid #ffe7a0;will-change:transform;text-shadow:0 1px 2px rgba(0,0,0,.6)} .pkbump{animation:pkbump .42s cubic-bezier(.3,1.8,.5,1)} @keyframes pkbump{0%{transform:scale(1)}30%{transform:scale(1.25) translateY(-4px);box-shadow:0 0 16px 4px var(--pkc),inset 0 0 10px var(--pkc);border-color:var(--pkc)}100%{transform:scale(1)}} .pkplus{position:fixed;z-index:31;pointer-events:none;font-weight:900;font-size:15px;text-shadow:0 0 4px #000,0 1px 0 #000;animation:pkplus .9s ease-out forwards} @keyframes pkplus{0%{transform:translateY(4px) scale(.6);opacity:0}25%{transform:translateY(-6px) scale(1.2);opacity:1}100%{transform:translateY(-22px) scale(1);opacity:0}}
#titanPill{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 262px);z-index:5;font-size:13px;cursor:pointer;pointer-events:auto;border:1px solid rgba(255,140,80,.6);color:#ffd9b0;font-family:inherit} #netPill{font-size:12px;gap:6px} #netPill .dot{width:9px;height:9px;border-radius:50%;background:#777;display:inline-block;box-shadow:0 0 4px #000} #netPill .dot.on{background:#3fd27a;box-shadow:0 0 6px #3fd27a}
#region{font-size:14px;color:#fff;letter-spacing:.5px}
#region b{font-weight:400;color:var(--c1)}

#minimap{position:fixed;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);width:164px;height:164px;z-index:5;border-radius:50%;border:0;background:#0e0a1e;pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#guide{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 70px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:auto;background:rgba(20,14,40,.7);border:2px solid var(--gold);border-radius:16px;padding:4px 12px;color:#fff;font-size:13px;white-space:nowrap} #gArrow{font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 10px rgba(255,207,74,.8);transition:transform .15s}
.idlegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0} .idlegrid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px} .idlegrid b{font-size:20px;color:var(--gold)} .idlegrid span{font-size:12px;opacity:.8}
.row .st{font-style:normal;font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:4px;vertical-align:1px} .row .st.on{background:#1f9a52;color:#fff}
.lbl .away{display:block;font-size:10px;opacity:.85;color:#bfe9ff}
/* v19: 칭호 · 원정 · 미궁 */
.lbl .ttl{display:block;font-size:12px;font-weight:900;letter-spacing:.2px;margin-bottom:1px;text-shadow:-1px -1px 0 #120a24,1px -1px 0 #120a24,-1px 1px 0 #120a24,1px 1px 0 #120a24,0 0 6px rgba(0,0,0,.6)}
.row .t span.ttl{display:inline;font-size:12px;font-weight:900;margin-right:4px;color:inherit} .row .t span.rar{display:inline-block}
.row .tbar{display:block;height:6px;margin-top:4px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden} .row .tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff9a3d);border-radius:4px}
.diary{background:#fff8e6;color:#3a2a14;border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 2px #e8d4a6;background-image:repeating-linear-gradient(#fff8e6 0 25px,#ecdcb8 25px 26px)} .diary p{margin:4px 0;font-size:14px;line-height:1.35;color:#3a2a14}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .exgrid.three{grid-template-columns:1fr 1fr 1fr} .exgrid .buy{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px} .exgrid .buy small{font-size:10px;opacity:.85}
.exd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;cursor:pointer} .exd em{font-style:normal;font-size:26px} .exd b{font-weight:400;font-size:14px} .exd i{font-style:normal;font-size:11px;opacity:.7} .exd.on{border-color:var(--gold,#ffcf4a);background:rgba(255,207,74,.16)}
.gearpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px var(--rc);animation:gearPop 1.6s ease-out forwards} .gearpop small{display:block;font-size:13px;font-weight:700;opacity:.9} @keyframes gearPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#zoomBtns{position:fixed;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 218px);z-index:5;display:flex;gap:6px} #zoomBtns button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(20,14,40,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
#quest{position:fixed;left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 96px);z-index:5;pointer-events:auto;max-width:200px;display:flex;flex-direction:column;gap:4px}
.q{background:rgba(20,14,40,.66);border-left:4px solid var(--c1);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25;color:#fff}
.q.done{border-color:var(--green);color:#9dffb8} .q small{opacity:.75}

.bl{left:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:row;pointer-events:auto}
.br{right:10px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.mbtn{border:0;cursor:pointer;color:#fff;font-size:15px;border-radius:14px;padding:9px 12px;min-width:60px;background:rgba(20,14,40,.75);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.mbtn:active{transform:translateY(2px)}
.acts{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 60px);z-index:5;display:grid;grid-template-columns:64px 64px 84px;grid-template-rows:60px 60px 84px;gap:7px;align-items:end;justify-items:end;pointer-events:auto}
.act{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.5);color:#fff;font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}

.act.thr{position:absolute;left:-64px;bottom:8px;background:radial-gradient(circle at 35% 30%,#ffe2a8,#e08a1e 70%);color:#2a1606;font-size:11px;padding:0 3px;white-space:normal;word-break:keep-all;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.4)}

@keyframes hdir{0%{opacity:1}25%{opacity:.85}100%{opacity:0}}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(120,0,0,0) 48%,rgba(150,0,10,.55) 82%,rgba(90,0,0,.85) 100%);transition:opacity .4s}

.act.skl .cdr{position:absolute;inset:-8px;border-radius:50%;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s;background:conic-gradient(rgba(14,8,2,.92) 0 calc(var(--p,0%) - .5%),#fff calc(var(--p,0%) - .5%) calc(var(--p,0%) + 2%),#ffe27a calc(var(--p,0%) + 2%),#ffb52e 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5.5px));filter:saturate(2.4) brightness(1.3) drop-shadow(0 0 3px rgba(255,200,80,.9))}
