<title>무한게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D stage per phase; hub and casino are card overlays; HUD pills top, action buttons bottom-right. Single bright toy look. */
:root{
  color-scheme: light;
  --ink:#1e2747;
  --cream:#fff8e6;
  --coin:#ffcc33;
  --green:#2fbf71;
  --red:#ff4d5e;
  --blue:#3a8dff;
  --purple:#9b5cff;
  --orange:#ff8a3d;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1e2747;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,input{font:inherit;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;font-size:15px;color:#fff;line-height:1.15;
  text-shadow:0 2px 0 rgba(0,0,0,.5),1px 1px 0 rgba(0,0,0,.5),-1px -1px 0 rgba(0,0,0,.4)}
.lbl b{font-weight:400;display:block;font-size:12px}
.lbl.alert{font-size:30px;color:#ffe14d}
.hpbar{display:block;width:54px;height:7px;margin:3px auto 0;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.hpbar i{display:block;height:100%;background:#4cff8a}

.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:8px}
.tl{top:max(10px,env(safe-area-inset-top));left:12px;flex-direction:column;align-items:flex-start}
.tr{top:max(10px,env(safe-area-inset-top));right:12px;flex-direction:column;align-items:flex-end}
.tc{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);flex-direction:column;align-items:center}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,248,230,.95);border-radius:16px;padding:5px 12px 5px 8px;box-shadow:0 4px 0 rgba(20,28,60,.35);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:13px;color:#5b6a8c}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffcc33 55%,#d99a12);display:grid;place-items:center;font-size:14px;color:#a86a00;flex:none}
.bigbar{width:min(60vw,260px);height:16px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#4cff8a,#2fbf71)}
.br{right:12px;bottom:max(14px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-end;pointer-events:auto}
.bl{left:12px;bottom:max(14px,env(safe-area-inset-bottom));flex-direction:column;align-items:flex-start;pointer-events:auto}
.btn{border:0;cursor:pointer;color:#fff;font-size:17px;border-radius:16px;padding:11px 15px;min-width:72px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 rgba(20,28,60,.4)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 rgba(20,28,60,.4)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn[disabled]{filter:grayscale(.8);opacity:.7}
.b-blue{background:var(--blue)} .b-green{background:var(--green)} .b-purple{background:var(--purple)} .b-orange{background:var(--orange)} .b-red{background:var(--red)}
#fire{width:96px;height:96px;border-radius:50%;font-size:22px;background:radial-gradient(circle at 40% 35%,#ff7a85,#ff2d3f);border:4px solid rgba(255,255,255,.7);touch-action:none}
#fire.on{transform:scale(.94);filter:brightness(1.2)}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85)}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;font-size:clamp(22px,6.5vw,34px);color:#fff;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 14px rgba(0,0,0,.3);transition:opacity .3s}
#toast small{display:block;font-size:.58em;color:#fff3a6;margin-top:4px}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 80px 20px rgba(255,0,40,.0);transition:box-shadow .15s}

.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(14,20,44,.6)}
.card{width:100%;max-width:420px;max-height:92%;overflow:auto;background:var(--cream);border-radius:26px;padding:18px 16px;box-shadow:0 8px 0 rgba(14,20,44,.4);display:flex;flex-direction:column;gap:11px;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.75);opacity:0}}
.card h2{margin:0;font-weight:400;font-size:26px;text-align:center}
.card h3{margin:2px 0 0;font-weight:400;font-size:18px;color:#4d5b7c}
.card p{margin:0;color:#4d5b7c;line-height:1.5;text-align:center;font-size:15px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 rgba(30,39,71,.12)}
.row .t{flex:1;min-width:0}
.row .t div{font-size:18px}
.row .t span{font-size:13px;color:#6b7896}
.buy{border:0;cursor:pointer;background:var(--green);color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.buy[disabled]{background:#b9c1d1;cursor:default}
.close{align-self:center;border:0;background:none;color:var(--ink);font-size:18px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.go{border:0;cursor:pointer;font-size:24px;color:#fff;background:var(--green);padding:13px 30px;border-radius:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 #1f8a4f;align-self:center}
.go:active{transform:translateY(4px)}
.go[disabled]{filter:grayscale(1);opacity:.6}
.star{color:#ffb300}

/* 허브 */
#hub{background:radial-gradient(circle at 50% 0%,#5b6bff 0%,#2a2f7a 55%,#1a1d4a 100%)}
.logo{font-size:min(15vw,64px);color:#fff;text-align:center;line-height:1;text-shadow:0 5px 0 #ff4d5e,0 10px 20px rgba(0,0,0,.35)}
.logo span{display:block;font-size:.32em;color:#ffe066;margin-top:8px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{border-radius:16px;padding:10px;background:#fff;box-shadow:0 2px 0 rgba(30,39,71,.12);display:flex;flex-direction:column;gap:2px;position:relative}
.step b{font-weight:400;font-size:13px;color:#6b7896}
.step div{font-size:18px}
.step.now{background:#fff1b8;box-shadow:0 0 0 3px #ffb300}
.step.done{opacity:.55}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stats .pill{font-size:16px;box-shadow:0 2px 0 rgba(20,28,60,.2)}

/* 카지노 */
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game{border:0;cursor:pointer;border-radius:18px;padding:14px 10px;color:#fff;font-size:19px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 4px 0 rgba(20,28,60,.3);display:flex;flex-direction:column;gap:3px;align-items:center}
.game span{font-size:12px;opacity:.9}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{border:0;cursor:pointer;border-radius:999px;padding:7px 12px;font-size:15px;background:#e6e9f2;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.betline{text-align:center;font-size:20px}
.rps{display:flex;gap:10px;justify-content:center}
.rps button{border:0;cursor:pointer;width:84px;height:84px;border-radius:22px;background:#fff;font-size:20px;box-shadow:0 4px 0 rgba(30,39,71,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rps svg{width:40px;height:40px}
.vs{display:flex;justify-content:space-around;align-items:center;font-size:20px;min-height:90px}
.vs div{display:flex;flex-direction:column;align-items:center;gap:4px}
.big{font-size:30px;text-align:center}
.win{color:#1f9d55} .lose{color:#e23a4a}
.words{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:14px;padding:8px}
.words div{font-size:17px}
.words .me{text-align:right;color:#2a64d8}
.words .cpu{text-align:left;color:#b0441a}
.wordin{display:flex;gap:6px}
.wordin input{flex:1;min-width:0;font-size:20px;padding:8px 12px;border-radius:12px;border:3px solid #cfd6e6;outline:none}
.wordin input:focus{border-color:var(--blue)}
.timer{height:8px;border-radius:4px;background:#e6e9f2;overflow:hidden}
.timer i{display:block;height:100%;background:var(--orange)}
.circle{position:relative;width:260px;height:240px;margin:0 auto}
.seat{position:absolute;width:76px;text-align:center;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.face{width:54px;height:54px;border-radius:14px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);display:grid;place-items:center;color:#fff;font-size:22px}
.seat.out .face{filter:grayscale(1);opacity:.5}
.potato{position:absolute;width:40px;height:30px;border-radius:50% 45% 50% 45%;background:radial-gradient(circle at 35% 35%,#e8b56a,#a8692a);box-shadow:0 0 0 3px #ff6a2a,0 0 18px 6px rgba(255,90,30,.7);transition:left .25s,top .25s;animation:shake .15s infinite}
@keyframes shake{50%{transform:rotate(8deg) scale(1.08)}}
.capsule{width:120px;height:120px;margin:0 auto;border-radius:50%;background:linear-gradient(180deg,#ff6b8a 50%,#fff 50%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 6px 0 rgba(0,0,0,.15)}
.capsule.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce){ *{animation-duration:.01s!important;animation-iteration-count:1!important} }
</style>

<canvas id="view"></canvas>
<div id="labels"></div>
<div id="hurt"></div>

<div class="hud tl" id="hudL">
  <div class="pill"><span class="coin">$</span><span id="money">0</span></div>
  <div class="pill" id="spdPill"><small>속도</small><span id="speed">6</span></div>
</div>
<div class="hud tc" id="hudC"></div>
<div class="hud tr" id="hudR"></div>
<div class="hud br" id="hudBR"></div>
<div class="hud bl" id="hudBL"></div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="toast"></div>
<div id="layers"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const VER="v1";
/* ===================== 데이터 ===================== */
const WEAPONS={
  pistol:{n:"권총",dmg:10,rate:3,range:20,spread:.03,pellets:1,color:"#ffcc33",tier:0},
  smg:{n:"기관단총",dmg:5,rate:9,range:18,spread:.09,pellets:1,color:"#5ad1ff",tier:0},
  shotgun:{n:"산탄총",dmg:7,rate:1.3,range:12,spread:.28,pellets:6,color:"#ff8a3d",tier:1},
  rifle:{n:"돌격소총",dmg:12,rate:5,range:24,spread:.04,pellets:1,color:"#7bd88f",tier:1},
  sniper:{n:"저격총",dmg:55,rate:.9,range:40,spread:0,pellets:1,color:"#b0c4ff",tier:2},
  laser:{n:"레이저총",dmg:15,rate:7,range:26,spread:.02,pellets:1,color:"#ff5af0",tier:2},
  rocket:{n:"로켓포",dmg:70,rate:.6,range:28,spread:0,pellets:1,splash:3.5,color:"#ff4d5e",tier:3},
  rainbow:{n:"무지개 레이저",dmg:30,rate:10,range:30,spread:.02,pellets:1,color:"rainbow",legend:true},
  thunder:{n:"번개 캐논",dmg:120,rate:1.5,range:32,spread:0,pellets:1,splash:4,color:"#7df9ff",legend:true},
  golden:{n:"황금 미니건",dmg:14,rate:20,range:26,spread:.06,pellets:1,color:"#ffd700",legend:true},
  blackhole:{n:"블랙홀 건",dmg:200,rate:1,range:30,spread:0,pellets:1,splash:6,color:"#8a3dff",legend:true},
};
const TIER_W=[["pistol","smg"],["shotgun","rifle"],["sniper","laser"],["rocket","rifle","laser"]];
const LEGENDS=["rainbow","thunder","golden","blackhole"];
const STEPS=[{n:"총 훔치기",d:"무기고에서 총을 훔쳐요"},{n:"라이벌 대결",d:"훔친 총으로 싸워요"},{n:"돈 불리기",d:"골라서 하기 (건너뛰기 가능)"},{n:"원숭이 탈출",d:"끝까지 가면 전설 무기!"}];
const BOT_NAMES=["번개맨","초코","탱크","루루","킹콩","별이","바람","대장"];
const BOT_COLORS=["#ff5a5f","#3a8dff","#2fbf71","#b061ff","#ff8a3d","#16c1b0","#ffcc33","#8a8fa8"];

/* ===================== 유틸 ===================== */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(n){ n=Math.floor(n); if(n<10000) return n.toLocaleString(); if(n<1e8) return (n/1e4).toFixed(n<1e5?1:0).replace(/\.0$/,"")+"만"; if(n<1e12) return (n/1e8).toFixed(n<1e9?1:0).replace(/\.0$/,"")+"억"; return (n/1e12).toFixed(1).replace(/\.0$/,"")+"조"; }
function load(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ===================== 저장 ===================== */
function freshSave(){ return {money:0,speedStat:0,tread:1,speedBuys:0,items:[{w:"pistol",star:0}],equip:0,cycle:0,phase:0,checkpoint:0,name:"진혁이",kills:0}; }
let G; try{ G=Object.assign(freshSave(),JSON.parse(load("inf-save","null"))||{}); }catch(e){ G=freshSave(); }
function saveGame(){ save("inf-save",JSON.stringify(G)); }
const speedVal=()=>6+G.speedStat*.1;

/* ---------- 무기·합체 ---------- */
function wPower(it){ return Math.pow(2,it.star); }
function wDps(it){ const w=WEAPONS[it.w]; return w.dmg*w.pellets*w.rate*wPower(it)*(w.splash?1.5:1); }
function addItem(w){
  G.items.push({w,star:0}); let merged=null;
  for (let again=true; again;){
    again=false; const groups={};
    G.items.forEach((it,i)=>{ const k=it.w+"|"+it.star; (groups[k]=groups[k]||[]).push(i); });
    for (const k in groups){ if (groups[k].length>=3){ const [w2,st]=k.split("|"); const rm=groups[k].slice(0,3); G.items=G.items.filter((_,i)=>!rm.includes(i)); G.items.push({w:w2,star:+st+1}); merged={w:w2,star:+st+1}; again=true; break; } }
  }
  autoEquip(); saveGame(); return merged;
}
function autoEquip(){ let best=0; G.items.forEach((it,i)=>{ if (wDps(it)>wDps(G.items[best])) best=i; }); G.equip=best; }
function curW(){ return G.items[clamp(G.equip,0,G.items.length-1)]; }
function wName(it){ return WEAPONS[it.w].n+(it.star?` <span class="star">${"★".repeat(Math.min(it.star,5))}${it.star>5?it.star:""}</span>`:""); }

/* ===================== 3D 기본 ===================== */
const canvas=$("view");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,1,.5,400);
let hemi,sun;
function addLights(sky,fogFar){
  scene.background=new THREE.Color(sky); scene.fog=new THREE.Fog(sky,50,fogFar||110);
  hemi=new THREE.HemisphereLight("#ffffff","#6f7f8f",.62); scene.add(hemi);
  sun=new THREE.DirectionalLight("#fff4dc",.6); sun.position.set(-20,45,18); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
  const c=sun.shadow.camera; c.left=-34;c.right=34;c.top=34;c.bottom=-34;c.near=1;c.far=140; sun.shadow.bias=-.0015; sun.shadow.normalBias=.06;
  scene.add(sun); scene.add(sun.target);
}
const MATS={};
function mat(c,em){ const k=c+(em||""); if(!MATS[k]){ MATS[k]=new THREE.MeshLambertMaterial({color:c}); if(em) MATS[k].emissive=new THREE.Color(em); } return MATS[k]; }
const GEO={box:new THREE.BoxGeometry(1,1,1),sph:new THREE.SphereGeometry(1,14,10),cyl:new THREE.CylinderGeometry(1,1,1,16),cone:new THREE.ConeGeometry(1,1,10)};
function box(w,h,d,c,x,y,z,p){ const m=new THREE.Mesh(GEO.box,typeof c==="string"?mat(c):c); m.scale.set(w,h,d); m.position.set(x||0,y||0,z||0); m.castShadow=m.receiveShadow=true; (p||scene).add(m); return m; }
function mesh(g,c,sx,sy,sz,x,y,z,p){ const m=new THREE.Mesh(g,typeof c==="string"?mat(c):c); m.scale.set(sx,sy,sz); m.position.set(x||0,y||0,z||0); m.castShadow=m.receiveShadow=true; (p||scene).add(m); return m; }
function textSprite(text,color,size){ const c=document.createElement("canvas"); c.width=512; c.height=128; const x=c.getContext("2d"); x.font="72px Jua, 'Noto Sans KR', sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.lineWidth=14; x.strokeStyle="rgba(0,0,0,.5)"; x.strokeText(text,256,66); x.fillStyle=color||"#fff"; x.fillText(text,256,66); const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false})); s.scale.set(size*4,size,1); scene.add(s); return s; }
function ground(w,d,c,x,z){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c)); m.rotation.x=-Math.PI/2; m.position.set(x||0,0,z||0); m.receiveShadow=true; scene.add(m); return m; }

/* ---------- 캐릭터 ---------- */
function gunModel(w,scale){
  const g=new THREE.Group(); const W=WEAPONS[w]; const col=W.color==="rainbow"?"#ff5af0":W.color;
  const len=w==="sniper"?1.5:w==="rocket"?1.3:w==="shotgun"?1.1:w==="pistol"?.55:.9;
  box(.18,.2,len,"#2b2f3a",0,0,-len/2,g); box(.2,.08,len*.6,col,0,.12,-len*.4,g);
  box(.14,.3,.16,"#2b2f3a",0,-.18,-.08,g);
  if (w==="rocket") mesh(GEO.cyl,col,.16,.5,.16,0,0,-len,g).rotation.x=Math.PI/2;
  if (W.legend){ const glow=mesh(GEO.sph,mat(col,col),.12,.12,.12,0,0,-len-.05,g); glow.castShadow=false; }
  if (scale) g.scale.setScalar(scale);
  return g;
}
function makeChar(o){
  const g=new THREE.Group(), body=new THREE.Group(); g.add(body);
  const legL=box(.42,.8,.42,o.pants||"#2d4a8a",-.22,.4,0,body), legR=box(.42,.8,.42,o.pants||"#2d4a8a",.22,.4,0,body);
  box(.9,.9,.5,o.shirt||"#ff6b4a",0,1.25,0,body);
  const armL=box(.3,.82,.32,o.skin||"#ffd3a8",-.62,1.25,0,body);
  const armR=new THREE.Group(); armR.position.set(.62,1.62,0); body.add(armR); box(.3,.82,.32,o.skin||"#ffd3a8",0,-.37,0,armR);
  box(.72,.72,.72,o.skin||"#ffd3a8",0,2.07,0,body); box(.76,.24,.76,o.hair||"#4a2c1d",0,2.45,0,body); box(.76,.4,.14,o.hair||"#4a2c1d",0,2.25,.33,body);
  box(.1,.14,.05,"#1d1d24",-.17,2.1,-.37,body); box(.1,.14,.05,"#1d1d24",.17,2.1,-.37,body); box(.28,.06,.05,"#c0392b",0,1.9,-.37,body);
  g.userData={body,legL,legR,armL,armR,gun:null};
  return g;
}

    W.bots.push({name:BOT_NAMES[i],ch,w,x:corners[i][0],z:corners[i][1],hp:botHP,maxhp:botHP,money,cool:rnd(.5,1.5),dead:0,walk:0,tx:0,tz:0,think:0,lastHit:99,lbl:makeLabel()});
  }
  const ch=makeChar({}); setGun(ch,curW().w); scene.add(ch); P.ch=ch; P.x=0; P.z=28; P.px=0; P.pz=28;
  const nameL=makeLabel();
  $("hudC").innerHTML=`<div class="pill" id="rTime">2:00</div><div class="bigbar"><i id="myHp" style="width:100%"></i></div>`;
  $("hudR").innerHTML=`<div class="pill"><small>쓰러뜨림</small><span id="rKills">0</span></div><div class="pill"><small>주운 돈</small><span id="rEarn">0</span></div>`;
  const fb=hudBtn("hudBR","발사","",()=>{},"fire"); fb.className="btn"; fb.id="fire";
  const fon=e=>{ e.preventDefault(); fireHeld=true; fb.classList.add("on"); initAudio(); }, foff=()=>{ fireHeld=false; fb.classList.remove("on"); };
  fb.addEventListener("pointerdown",fon); fb.addEventListener("pointerup",foff); fb.addEventListener("pointercancel",foff); fb.addEventListener("pointerleave",foff);
  hudBtn("hudBL","가방","b-purple",()=>showBag(null));
  toast("2단계 · 라이벌 대결!","쓰러뜨리면 그 사람 돈이 떨어져요",2.6);

  const bulletGeo=new THREE.SphereGeometry(.16,8,6);
  function los(ax,az,bx,bz){ const L=Math.hypot(bx-ax,bz-az), n=Math.ceil(L/.8); for(let k=1;k<n;k++){ const x=ax+(bx-ax)*k/n, z=az+(bz-az)*k/n; for(const w of walls) if(x>w.x0&&x<w.x1&&z>w.z0&&z<w.z1) return false; } return true; }
  function shoot(owner,x,z,ang,wkey,power){
    const Wd=WEAPONS[wkey]; const col=Wd.color==="rainbow"?new THREE.Color().setHSL(Math.random(),.9,.6):new THREE.Color(Wd.color);
    for (let k=0;k<Wd.pellets;k++){ const a=ang+rnd(-Wd.spread,Wd.spread)*(owner==="p"?1:2.2); const m=new THREE.Mesh(bulletGeo,new THREE.MeshBasicMaterial({color:col})); m.position.set(x,1.4,z); if(Wd.splash) m.scale.setScalar(1.8); scene.add(m);
      const sp=wkey==="sniper"?70:42; W.bullets.push({x,z,vx:Math.sin(a)*sp,vz:Math.cos(a)*sp,life:Wd.range/sp,dmg:Wd.dmg*power,owner,m,splash:Wd.splash||0}); }
    if (owner==="p") tone(Wd.splash?120:520+Math.random()*80,.05,"square",0,.06);
  }
  function hitChar(target,dmg,from){
    if (target==="p"){ if (W.dead>0) return; W.hp-=dmg; W.lastHit=0; hurtFlash(); if (W.hp<=0){ W.dead=3; W.hp=0; P.ch.visible=false; toast("쓰러졌어요!","3초 뒤 다시 일어나요 (돈은 그대로)"); buzz([80,40,80]); } return; }
    const b=target; if (b.dead>0) return; b.hp-=dmg; b.lastHit=0;
    if (b.hp<=0){ b.dead=5; b.ch.visible=false; if (from==="p"){ W.kills++; G.kills++; }
      const cm=new THREE.Group(); for(let k=0;k<6;k++) mesh(GEO.cyl,mat("#ffcc33","#aa7700"),.4,.12,.4,rnd(-.5,.5),.1+k*.13,rnd(-.5,.5),cm); cm.position.set(b.x,0,b.z); scene.add(cm);
      W.coins.push({x:b.x,z:b.z,value:b.money,m:cm,lbl:makeLabel()}); tone(330,.2,"triangle"); if(from==="p") toast(`${b.name} 쓰러뜨림!`,`$${fmt(b.money)}이 떨어졌어요. 주워요!`); }
  }
  W.update=dt=>{
    W.time-=dt; if (W.time<=0) return endRival(W);
    const t=Math.max(0,Math.ceil(W.time)); $("rTime").textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
    const ch=P.ch;
    // 플레이어
    let moving=false, ix=0, iz=0;
    if (W.dead>0){ W.dead-=dt; if (W.dead<=0){ W.hp=W.maxhp; P.x=0;P.z=28; ch.visible=true; } }
    else { const r=movePlayer(dt,Math.min(speedVal(),14),walls,[-A+.6,A-.6,-A+.6,A-.6]); moving=r.moving; ix=r.ix; iz=r.iz; }
    W.lastHit+=dt; if (W.lastHit>3 && W.dead<=0) W.hp=Math.min(W.maxhp,W.hp+W.maxhp*.08*dt);
    // 조준: 가장 가까운 보이는 적
    const it=curW(), Wd=WEAPONS[it.w]; let tgt=null, td=1e9;
    W.bots.forEach(b=>{ if(b.dead>0) return; const d=Math.hypot(b.x-P.x,b.z-P.z); if(d<Wd.range+2&&d<td&&los(P.x,P.z,b.x,b.z)){ td=d; tgt=b; } });
    W.cool-=dt;
    const aiming=fireHeld && W.dead<=0;
    if (aiming && tgt) faceTo(ch,tgt.x-P.x,tgt.z-P.z,dt,20); else if (moving) faceTo(ch,ix,iz,dt);
    if (aiming && W.cool<=0){ W.cool=1/Wd.rate; const ang=tgt?Math.atan2(tgt.x-P.x,tgt.z-P.z):ch.rotation.y+Math.PI; shoot("p",P.x,P.z,ang,it.w,wPower(it)); }
    ch.position.set(P.x,0,P.z); animChar(ch,moving,P.walk,aiming);
    // 봇
    W.bots.forEach((b,i)=>{
      if (b.dead>0){ b.dead-=dt; if (b.dead<=0){ const c=pick(corners); b.x=c[0]; b.z=c[1]; b.hp=b.maxhp; b.ch.visible=true; } placeLabel(b.lbl,0,0,0,""); return; }
      b.lastHit+=dt; if (b.lastHit>3) b.hp=Math.min(b.maxhp,b.hp+b.maxhp*.08*dt);
      // 목표: 플레이어 또는 다른 봇
      let foe=null, fd=1e9; const cands=[{x:P.x,z:P.z,p:true,alive:W.dead<=0}].concat(W.bots.filter(o=>o!==b&&o.dead<=0).map(o=>({x:o.x,z:o.z,o,alive:true})));
      cands.forEach(c=>{ if(!c.alive) return; const d=Math.hypot(c.x-b.x,c.z-b.z)*(c.p?.75:1); if(d<fd){fd=d;foe=c;} });
      b.think-=dt;
      if (b.think<=0){ b.think=rnd(.6,1.4); if (foe){ const a=Math.atan2(b.x-foe.x,b.z-foe.z)+rnd(-1,1), r=rnd(8,15); b.tx=clamp(foe.x+Math.sin(a)*r,-A+2,A-2); b.tz=clamp(foe.z+Math.cos(a)*r,-A+2,A-2); } }
      const dx=b.tx-b.x, dz=b.tz-b.z, L=Math.hypot(dx,dz), bs=6+G.cycle*.5; let bm=false;
      if (L>.5){ b.x+=dx/L*bs*dt; b.z+=dz/L*bs*dt; bm=true; b.walk+=dt*7; }
      walls.forEach(w=>pushOut(b,w,.55));
      b.cool-=dt; const bw=WEAPONS[b.w]; let aim=false;
      if (foe && Math.hypot(foe.x-b.x,foe.z-b.z)<bw.range && los(b.x,b.z,foe.x,foe.z)){ aim=true; faceTo(b.ch,foe.x-b.x,foe.z-b.z,dt,10);
        if (b.cool<=0){ b.cool=1/bw.rate*1.6; shoot(i,b.x,b.z,Math.atan2(foe.x-b.x,foe.z-b.z),b.w,.5*(1+G.cycle*.25)); } }
      else if (bm) faceTo(b.ch,dx,dz,dt);
      b.ch.position.set(b.x,0,b.z); animChar(b.ch,bm,b.walk,aim);
      placeLabel(b.lbl,b.x,3.1,b.z,`${b.name} <span style="color:#ffe14d">$${fmt(b.money)}</span><span class="hpbar"><i style="width:${Math.max(0,b.hp/b.maxhp*100)}%"></i></span>`);
    });
    // 총알
    for (let k=W.bullets.length-1;k>=0;k--){ const bl=W.bullets[k]; bl.x+=bl.vx*dt; bl.z+=bl.vz*dt; bl.life-=dt; bl.m.position.set(bl.x,1.4,bl.z);
      let hit=bl.life<=0; for(const w of walls) if(bl.x>w.x0&&bl.x<w.x1&&bl.z>w.z0&&bl.z<w.z1){ hit=true; break; }
      let victim=null;
      if (!hit){ if (bl.owner!=="p" && W.dead<=0 && Math.hypot(bl.x-P.x,bl.z-P.z)<.8) victim="p";
        else W.bots.forEach((b,i)=>{ if(!victim&&i!==bl.owner&&b.dead<=0&&Math.hypot(bl.x-b.x,bl.z-b.z)<.8) victim=b; }); }
      if (victim||hit){
        if (bl.splash){ boom(bl.x,bl.z,bl.splash); if (bl.owner!=="p" && W.dead<=0 && Math.hypot(bl.x-P.x,bl.z-P.z)<bl.splash) hitChar("p",bl.dmg*.6,bl.owner); W.bots.forEach((b,i)=>{ if(i!==bl.owner&&b.dead<=0&&Math.hypot(bl.x-b.x,bl.z-b.z)<bl.splash) hitChar(b,bl.dmg,bl.owner==="p"?"p":i); }); }
        else if (victim) hitChar(victim,bl.dmg,bl.owner==="p"?"p":bl.owner);
        scene.remove(bl.m); bl.m.material.dispose(); W.bullets.splice(k,1); }
    }
    // 돈 줍기
    for (let k=W.coins.length-1;k>=0;k--){ const c=W.coins[k]; c.m.rotation.y+=dt*2;
      if (W.dead<=0 && near(c.x,c.z,1.6)){ G.money+=c.value; W.earned+=c.value; scene.remove(c.m); c.lbl.remove(); W.coins.splice(k,1); jingle([784,1046]); buzz(15); toast(`+$${fmt(c.value)}`,"돈을 주웠어요!",1.2); continue; }
      placeLabel(c.lbl,c.x,1.4,c.z,`<span style="color:#ffe14d">$${fmt(c.value)}</span>`); }
    $("myHp").style.width=(W.hp/W.maxhp*100)+"%"; $("rKills").textContent=W.kills; $("rEarn").textContent="$"+fmt(W.earned);
    placeLabel(nameL,P.x,3.2,P.z,W.dead>0?"":esc(G.name));
    updateBooms(dt);
    followCam(dt,26,17,3);
  };
  return W;
}
const booms=[];
function boom(x,z,r){ const m=new THREE.Mesh(GEO.sph,new THREE.MeshBasicMaterial({color:"#ffb347",transparent:true,opacity:.8})); m.position.set(x,1,z); m.scale.setScalar(.5); scene.add(m); booms.push({m,r,t:0}); tone(90,.3,"sawtooth",0,.12); }
function updateBooms(dt){ for (let k=booms.length-1;k>=0;k--){ const b=booms[k]; b.t+=dt*3; b.m.scale.setScalar(.5+b.r*b.t); b.m.material.opacity=Math.max(0,.8-b.t); if(b.t>=1){ scene.remove(b.m); booms.splice(k,1); } } }
function endRival(W){
  world=null; fireHeld=false;
  layers.innerHTML=`<div class="layer"><div class="card"><h2>대결 끝!</h2><p>쓰러뜨린 사람 ${W.kills}명</p><div class="big win">+$${fmt(W.earned)}</div><p>지금 가진 돈 $${fmt(G.money)}</p><button class="go" id="rNext" type="button">다음: 돈 불리기</button></div></div>`;
  jingle([523,659,784,1046]); saveGame();
  $("rNext").onclick=()=>finishPhase(2);
}

let bet=0, betPct=.25;
function betUI(){ const pcts=[[.1,"10%"],[.25,"25%"],[.5,"50%"],[1,"전부"]]; bet=Math.floor(G.money*betPct);
  return `<div class="betline">걸 돈 <b>$${fmt(bet)}</b> <small style="font-size:14px;color:#6b7896">/ 가진 돈 $${fmt(G.money)}</small></div><div class="chips">${pcts.map(([p,l])=>`<button class="chip${p===betPct?" on":""}" data-p="${p}" type="button">${l}</button>`).join("")}</div>`; }
function bindBet(re){ layers.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ betPct=+c.dataset.p; re(); }); }
function showCasino(){
  addLights("#3a1f5a"); camera.position.set(0,4,9); camera.lookAt(0,1.5,0);
  layers.innerHTML=`<div class="layer"><div class="card"><h2>3단계 · 돈 불리기</h2><p>가진 돈 <b>$${fmt(G.money)}</b><br>하고 싶은 게임만 골라서 해요. 안 해도 괜찮아요!</p>
    <div class="games">
      <button class="game" style="background:#ff8a3d" id="g1" type="button">끝말잇기<span>이기면 2배</span></button>
      <button class="game" style="background:#3a8dff" id="g2" type="button">가위바위보<span>이기면 2배</span></button>
      <button class="game" style="background:#b061ff" id="g3" type="button">가챠<span>$${fmt(gachaCost())} 한 번</span></button>
      <button class="game" style="background:#ff4d5e" id="g4" type="button">뜨거운 감자<span>살아남으면 2배</span></button>
    </div>
    <button class="go" id="cNext" type="button">다음: 원숭이 탈출 →</button></div></div>`;
  $("g1").onclick=()=>{ WG=null; showWord(); }; $("g2").onclick=showRPS; $("g3").onclick=showGacha; $("g4").onclick=showPotato;
  $("cNext").onclick=()=>finishPhase(3);
}
function gachaCost(){ return Math.round(100*Math.pow(2.2,G.cycle)); }
function settle(win,mult){ if (win===true){ G.money+=Math.floor(bet*(mult-1)); jingle([523,659,784,1046]); } else if (win===false){ G.money-=bet; tone(200,.4,"sawtooth"); } saveGame(); }
/* 가위바위보 */
const RPS_SVG={0:'<svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="13" fill="#ffd3a8" stroke="#1e2747" stroke-width="2.5"/><path d="M10 18h20" stroke="#1e2747" stroke-width="2.5"/></svg>',
  1:'<svg viewBox="0 0 40 40"><rect x="9" y="8" width="22" height="28" rx="6" fill="#ffd3a8" stroke="#1e2747" stroke-width="2.5"/><path d="M14 8v12M20 6v14M26 8v12" stroke="#1e2747" stroke-width="2.5"/></svg>',
  2:'<svg viewBox="0 0 40 40"><path d="M14 36V18L8 6M26 36V18l6-12" stroke="#1e2747" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="28" r="9" fill="#ffd3a8" stroke="#1e2747" stroke-width="2.5"/></svg>'};
const RPS_N=["바위","보","가위"];
function showRPS(){
  layers.innerHTML=`<div class="layer"><div class="card"><h2>가위바위보</h2>${betUI()}<div class="vs" id="rpsVs"><div>나<br>?</div><div>VS</div><div>컴퓨터<br>?</div></div>
    <div class="rps">${[2,0,1].map(k=>`<button type="button" data-k="${k}">${RPS_SVG[k]}${RPS_N[k]}</button>`).join("")}</div>
    <button class="close" id="back" type="button">돌아가기</button></div></div>`;
  bindBet(showRPS); $("back").onclick=showCasino;
  layers.querySelectorAll(".rps button").forEach(b=>b.onclick=()=>{
    if (bet<1){ toast("걸 돈이 없어요!"); return; }
    const me=+b.dataset.k, cpu=Math.floor(Math.random()*3); const r=(me-cpu+3)%3; // 0 무, 1 승 (보>바위 등), 2 패

    setTimeout(()=>{ const vs=$("rpsVs").innerHTML; showRPS(); $("rpsVs").innerHTML=vs; },900);
  });

/* 가챠 */
function showGacha(){
  const cost=gachaCost();
  layers.innerHTML=`<div class="layer"><div class="card"><h2>가챠</h2><p>한 번에 $${fmt(cost)} · 가진 돈 $${fmt(G.money)}</p><div class="capsule" id="cap"></div><div class="big" id="gRes" style="min-height:40px"></div>
    <p style="font-size:13px">돈 0.5배 40% · 2배 25% · 5배 12% · 20배 2% · 무기 15% · 로켓포 6%</p>
    <button class="go" id="gGo" type="button" ${G.money<cost?"disabled":""}>뽑기!</button><button class="close" id="back" type="button">돌아가기</button></div></div>`;
  $("back").onclick=showCasino;
  $("gGo").onclick=()=>{
    if (G.money<cost) return; G.money-=cost; $("gGo").disabled=true; $("cap").classList.add("spin"); tone(440,.1,"square");
    setTimeout(()=>{ $("cap").classList.remove("spin"); let r=Math.random()*100, msg="";
      if ((r-=40)<0){ const v=Math.floor(cost*.5); G.money+=v; msg=`$${fmt(v)}`; }
      else if ((r-=25)<0){ const v=cost*2; G.money+=v; msg=`<span class="win">$${fmt(v)}!</span>`; }
      else if ((r-=12)<0){ const v=cost*5; G.money+=v; msg=`<span class="win">$${fmt(v)}!!</span>`; }
      else if ((r-=2)<0){ const v=cost*20; G.money+=v; msg=`<span class="win">대박 $${fmt(v)}!!!</span>`; jingle([523,659,784,1046,1318,1568]); }
      else if ((r-=15)<0){ const w=pick(TIER_W[Math.min(3,G.cycle+Math.floor(Math.random()*2))]); const m=addItem(w); msg=`<span style="color:#9b5cff">${WEAPONS[w].n}!</span>${m?"<br>합체!":""}`; }
      else { const m=addItem("rocket"); msg=`<span style="color:#ff4d5e">로켓포!</span>${m?"<br>합체!":""}`; }
      saveGame(); jingle([523,784]); $("gRes").innerHTML=msg; const g=$("gGo"); g.disabled=G.money<cost; },900);
  };

    if (!W.running && P.z<0){ W.running=true; const cz=-G.checkpoint*SL; P.z=Math.min(P.z,cz-1); W.mz=cz+16; toast("원숭이가 쫓아와요!","끝까지 달려요!"); tone(200,.4,"sawtooth"); }
    if (W.running){
      W.stage=clamp(Math.floor(-P.z/SL),0,NS-1);
      if (W.stage>G.checkpoint){ G.checkpoint=W.stage; saveGame(); toast(`체크포인트! ${W.stage+1}스테이지`,"잡혀도 여기서 다시 시작해요"); jingle([523,784]); }
      W.mz-=monkeySpeed()*dt; if (W.mz>P.z+40) W.mz=P.z+40;
      mk.position.set(clamp(P.x*.6,-6,6),0,W.mz); mk.rotation.y=0; mb.position.y=Math.abs(Math.sin(performance.now()/110))*.4; aL.rotation.x=Math.sin(performance.now()/110); aR.rotation.x=-Math.sin(performance.now()/110);
      const gapM=W.mz-P.z;
      placeLabel(W.mkLbl,mk.position.x,7.5,W.mz,gapM<10?"!!":"");
      if (gapM<1.8){ toast("원숭이에게 잡혔다!",`체크포인트 ${G.checkpoint+1}스테이지부터 다시! 더 빨라져서 와요`,2.6); tone(150,.5,"sawtooth"); buzz([100,60,100]); resetToLobby(); }
      $("mStage").textContent=`${W.stage+1}/5 스테이지 · 원숭이와 ${Math.max(0,gapM).toFixed(0)}m`;
      $("mProg").style.width=clamp(-P.z/(-endZ)*100,0,100)+"%";
      if (P.z<=endZ+.5){ return monkeyWin(); }
    } else { mk.position.set(0,0,30); $("mStage").textContent=`출발 전 · 원숭이 속도 ${(6.5+G.checkpoint*2.2+G.cycle*1.6).toFixed(1)}`; }
    obs.forEach(o=>{ o.g.position.x+=o.dir*o.sp*dt; if (Math.abs(o.g.position.x)>6.5){ o.dir*=-1; o.g.position.x=clamp(o.g.position.x,-6.5,6.5); } o.g.rotation.x+=o.dir*dt*3;
      if (W.running && Math.abs(o.g.position.x-P.x)<1.1 && Math.abs(o.g.position.z-P.z)<1.0){ P.z+=4; W.slow=.6; tone(180,.15,"square"); buzz(30); } });
    peels.forEach(p=>{ if (W.running && Math.abs(p.x-P.x)<.8 && Math.abs(p.z-P.z)<.8 && W.slow<=0){ W.slow=1.2; toast("바나나 껍질! 미끄덩",null,1); tone(300,.2,"triangle"); } });
    placeLabel(W.nameL,P.x,3.2,P.z,esc(G.name));
    followCam(dt,22,15,6);
  };
  function monkeyWin(){
    world=null; const lg=LEGENDS[G.cycle%LEGENDS.length]; const merged=addItem(lg); G.cycle++; G.checkpoint=0; G.phase=0; saveGame();
    jingle([523,659,784,1046,1318,1568]); buzz([60,40,60,40,120]);
    layers.innerHTML=`<div class="layer"><div class="card"><h2>원숭이 탈출 성공!</h2><p>전설 무기를 얻었어요</p><div class="big" style="color:#ff8a00">${WEAPONS[lg].n}</div>${merged?`<p>합체! ${WEAPONS[merged.w].n} ${"★".repeat(merged.star)}</p>`:""}
      <p>이제 ${G.cycle+1}바퀴째! 처음부터 다시 시작해요.<br>적과 경비가 더 강해지고, 돈도 더 많이 떨어져요.</p><button class="go" id="mNext" type="button">처음으로</button></div></div>`;
    $("mNext").onclick=()=>setMode("hub");
  }
  return W;
}
function showSpeedShop(){
  const sc=spdCost(), tc=treadCost();
  layers.innerHTML=`<div class="layer" id="bg"><div class="card"><h2>스피드 상점</h2><p>가진 돈 $${fmt(G.money)} · 지금 속도 ${speedVal().toFixed(1)}</p>
    <div class="row"><div class="t"><div>스피드 +3</div><span>바로 3만큼 빨라져요</span></div><button class="buy" id="bSp" ${G.money<sc?"disabled":""} type="button">$${fmt(sc)}</button></div>
    <div class="row"><div class="t"><div>러닝머신 Lv.${G.tread} → ${G.tread+1}</div><span>올라가 있으면 오르는 속도 +${(.03*G.tread).toFixed(2)} → +${(.03*(G.tread+1)).toFixed(2)}/초</span></div><button class="buy" id="bTr" ${G.money<tc?"disabled":""} type="button">$${fmt(tc)}</button></div>
    <button class="close" id="cls" type="button">닫기</button></div></div>`;
  $("cls").onclick=closeLayer; $("bg").onclick=e=>{ if(e.target.id==="bg") closeLayer(); };
  $("bSp").onclick=()=>{ if(G.money>=sc){ G.money-=sc; G.speedStat+=30; G.speedBuys++; jingle([523,659,784]); saveGame(); showSpeedShop(); } };
  $("bTr").onclick=()=>{ if(G.money>=tc){ G.money-=tc; G.tread++; jingle([523,659,784]); saveGame(); showSpeedShop(); } };
}

/* ===================== 루프 ===================== */
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<innerHeight?62:55; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();
let last=performance.now(), saveT=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if (world&&world.update&&!layers.innerHTML) world.update(dt);
  else if (world&&world.update&&layers.querySelector("#bg,.layer")&&mode!=="hub"&&mode!=="casino"){ /* 일시정지 */ }
  if ((mode==="hub"||mode==="casino") && P.ch){ P.ch.rotation.y=t/1600; P.ch.userData.body.position.y=Math.abs(Math.sin(t/300))*.08; }
  $("money").textContent=fmt(G.money); $("speed").textContent=speedVal()<1000?speedVal().toFixed(1):fmt(speedVal());
  if (toastT>0){ toastT-=dt; if(toastT<=0) $("toast").style.opacity=0; }
  if (hurtT>0){ hurtT-=dt; $("hurt").style.boxShadow=`inset 0 0 80px 20px rgba(255,0,40,${Math.max(0,hurtT*2)})`; }
  saveT-=dt; if (saveT<=0){ saveT=4; saveGame(); }
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); });
setMode("hub"); requestAnimationFrame(frame);
window.__inf={G:()=>G,P,setMode,world:()=>world,addItem,step:dt=>world&&world.update&&world.update(dt)};
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
